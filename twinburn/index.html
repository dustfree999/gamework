      .then(function (r) { return r.ok ? r.json() : null; })

var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutElastic(t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  var c4 = TAU / 3;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }

/* Deterministic 32-bit PRNG — solo layouts are reproducible from a seed. */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fmt(tpl, vars) {
  var out = String(tpl);
  if (vars) {
    for (var k in vars) {
      if (Object.prototype.hasOwnProperty.call(vars, k)) out = out.split('{' + k + '}').join(String(vars[k]));
    }
  }
  return out;
}

/* ── storage: bridge.storage when present, local fallback otherwise ─────── */
var STORE = (function () {
  var prefix = cfgGet('storage.prefix', 'twinburn_');
  var keys = cfgGet('storage.keys', {});
  var maxBytes = cfgGet('storage.maxValueBytes', 262144);
  var bridge = window.bridge;

  function fullKey(name) { return prefix + (keys[name] || name); }

  function bridgeGet(k) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.getItem === 'function') return bridge.storage.getItem(k);
      if (bridge && bridge.storage && typeof bridge.storage.get === 'function') return bridge.storage.get(k);
    } catch (e) { /* fall through */ }
    return undefined;
  }
  function bridgeSet(k, v) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.setItem === 'function') { bridge.storage.setItem(k, v); return true; }
      if (bridge && bridge.storage && typeof bridge.storage.set === 'function') { bridge.storage.set(k, v); return true; }
    } catch (e) { /* fall through */ }
    return false;
  }

  function get(name, dflt) {
    var k = fullKey(name);
    var raw = bridgeGet(k);
    if (raw === undefined || raw === null || raw === '') {
      try { raw = window.localStorage.getItem(k); } catch (e) { raw = null; }
    }
    if (raw === undefined || raw === null || raw === '') return dflt;
    try { return JSON.parse(raw); } catch (e) { return typeof raw === 'string' ? raw : dflt; }
  }

  function set(name, value) {
    var k = fullKey(name);
    var raw;
    try { raw = JSON.stringify(value); } catch (e) { return false; }
    /* Platform quota: one key must stay under 256KB. Oversized writes are dropped
       rather than risking the whole store. */
    if (raw.length > maxBytes) return false;
    if (bridgeSet(k, raw)) return true;
    try { window.localStorage.setItem(k, raw); return true; } catch (e) { return false; }
  }

  return { get: get, set: set, key: fullKey };
})();

/* ── viewport / safe area / stage layout ────────────────────────────────── */
function readSafeArea() {
  var out = { top: 0, right: 0, bottom: 0, left: 0, known: false };
  try {
    var b = window.bridge;
    if (b && b.viewport && typeof b.viewport.getSafeArea === 'function') {
      var sa = b.viewport.getSafeArea();
      if (isObj(sa)) {
        out.top = Number(sa.top) || 0;
        out.right = Number(sa.right) || 0;
        out.bottom = Number(sa.bottom) || 0;
        out.left = Number(sa.left) || 0;
        /* Some hosts report a full rect instead of insets. */
        if (sa.height && sa.y !== undefined && !sa.top && !sa.bottom) {
          out.top = Number(sa.y) || 0;
          out.bottom = Math.max(0, (Number(window.innerHeight) || 0) - (Number(sa.y) + Number(sa.height)));
        }
        out.known = true;
      }
    }
  } catch (e) { /* host without the bridge: treat as no insets */ }
  return out;
}

/* Probing CSS env() insets needs a real element; done once at boot. */
function cssEnvInsets() {
  var out = { top: 0, right: 0, bottom: 0, left: 0 };
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +
      'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
      'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
    document.body.appendChild(probe);
    var cs = window.getComputedStyle(probe);
    out.top = parseFloat(cs.paddingTop) || 0;
    out.right = parseFloat(cs.paddingRight) || 0;
    out.bottom = parseFloat(cs.paddingBottom) || 0;
    out.left = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(probe);
  } catch (e) { /* keep zeros */ }
  return out;
}

var LAY = {
  DW: cfgGet('viewport.designWidth', 402),
  DH: cfgGet('viewport.designHeight', 619),
  scale: 1, stageX: 0, stageY: 0, stageW: 402, stageH: 619,
  contentTop: 0, contentBottom: 0, contentLeft: 0, contentRight: 0,
  corner: cfgGet('viewport.cornerClearPx', 26),
  safe: { top: 0, right: 0, bottom: 0, left: 0 }
};

function relayout() {
  var vw = Math.max(1, window.innerWidth || 1);
  var vh = Math.max(1, window.innerHeight || 1);
  var scale = Math.min(vw / LAY.DW, vh / LAY.DH);
  LAY.scale = scale;
  LAY.stageW = LAY.DW * scale;
  LAY.stageH = LAY.DH * scale;
  LAY.stageX = (vw - LAY.stageW) / 2;
  LAY.stageY = (vh - LAY.stageH) / 2;

  var hostSa = readSafeArea();
  var cssSa = hostSa.known ? { top: 0, right: 0, bottom: 0, left: 0 } : cssEnvInsets();
  LAY.safe = {
    top: hostSa.top || cssSa.top,
    right: Math.max(hostSa.right || 0, cssSa.right),
    bottom: Math.max(hostSa.bottom || 0, cssSa.bottom),
    left: Math.max(hostSa.left || 0, cssSa.left)
  };

  /* Insets are viewport-relative; only the part that eats into the stage counts. */
  function inside(px, origin, span) { return clamp((px - origin) / scale, 0, span); }
  var gTop = LAY.DH * cfgGet('viewport.guardTopPct', 0.05);
  var gBottom = LAY.DH * cfgGet('viewport.guardBottomPct', 0.05);
  var sTop = inside(LAY.safe.top, LAY.stageY, LAY.DH);
  var sBottom = inside(LAY.safe.bottom, LAY.stageY, LAY.DH);
  var sLeft = inside(LAY.safe.left, LAY.stageX, LAY.DW);
  var sRight = inside(LAY.safe.right, LAY.stageX, LAY.DW);

  /* Corner clearance: rounded display corners must never host a tap target, so the
     side margin is the larger of the base gutter, the safe inset and half the corner radius. */
  var base = 16;
  LAY.contentTop = gTop + sTop;
  LAY.contentBottom = LAY.DH - gBottom - sBottom;
  LAY.contentLeft = Math.max(base + sLeft, LAY.corner * 0.5);
  LAY.contentRight = LAY.DW - Math.max(base + sRight, LAY.corner * 0.5);

  var canvas = document.getElementById('stage');
  var dpr = effectivePixelRatio();
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  CTX = canvas.getContext('2d');
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  VIEW = { vw: vw, vh: vh, dpr: dpr };
}

/* ── render quality ─────────────────────────────────────────────────────── */
/* The platform cannot guarantee a single GPU/engine build, so the game renders at
   the screen's native density for crispness and steps that down only if a device
   cannot hold the frame budget. The policy below is pure and unit-testable. */
var QUALITY = {
  cap: cfgGet('viewport.maxPixelRatio', 3),
  step: 0,
  samples: [],
  frames: 0
};

function effectivePixelRatio() {
  return Math.min(window.devicePixelRatio || 1, QUALITY.cap);
}

function medianOf(samples) {
  if (!samples.length) return 0;
  var s = samples.slice().sort(function (a, b) { return a - b; });
  return s[Math.floor(s.length / 2)];
}

/** True when a sustained median frame time has blown the budget. */
function shouldDowngrade(samples) {
  var c = cfgGet('viewport.adaptiveQuality', {});
  if (c.enabled === false) return false;
  if (samples.length < (c.minFrames || 90)) return false;
  return medianOf(samples) > (c.slowFrameMs || 22);
}

/** Drop one quality step (never below the last configured cap). */
function applyQualityStep() {
  var steps = cfgGet('viewport.adaptiveQuality.steps', [2, 1.5]);
  if (QUALITY.step >= steps.length) return false;
  QUALITY.cap = steps[QUALITY.step];
  QUALITY.step += 1;
  QUALITY.samples = [];
  QUALITY.frames = 0;
  relayout();
  resetDeco();
  return true;
}

function sampleFrame(ms) {
  var c = cfgGet('viewport.adaptiveQuality', {});
  var max = c.sampleFrames || 60;
  QUALITY.samples.push(ms);
  if (QUALITY.samples.length > max) QUALITY.samples.shift();
  QUALITY.frames += 1;
  if (QUALITY.frames % (c.checkEvery || 30) === 0 && shouldDowngrade(QUALITY.samples)) {
    applyQualityStep();
  }
}

function sx(x) { return LAY.stageX + x * LAY.scale; }
function sy(y) { return LAY.stageY + y * LAY.scale; }
/* CSS px -> design units (input). */
function ux(px) { return (px - LAY.stageX) / LAY.scale; }
function uy(py) { return (py - LAY.stageY) / LAY.scale; }

  if (!FOLLOW_SYSTEM) return FALLBACK_LANG;
  var tag = '';
  try { tag = String((window.navigator && (window.navigator.language || window.navigator.userLanguage)) || ''); } catch (e) { tag = ''; }
  if (/^zh\b/i.test(tag)) return LANGS.indexOf('zh') >= 0 ? 'zh' : FALLBACK_LANG;

  return FALLBACK_LANG;
}

function getLang() {
  if (_lang && LANGS.indexOf(_lang) >= 0) return _lang;
  var saved = STORE.get('lang', '');
  if (typeof saved === 'string' && LANGS.indexOf(saved) >= 0) return saved;
  return detectLang();
}

function setLang(lang) {
  if (LANGS.indexOf(lang) < 0) return false;
  _lang = lang;
  STORE.set('lang', lang);
  try {
    var title = tr('game.title');
    if (document && document.title !== undefined) document.title = title;
  } catch (e) { /* no document: ignore */ }
  return true;
}

/* Lookup never throws: a missing key echoes itself so a gap cannot blank the UI. */
function tr(key, vars) {
  var entry = DICT[key];
  var lang = getLang();
  var text;
  if (!entry) text = key;
  else text = entry[lang] || entry[FALLBACK_LANG] || entry.zh || key;
  return vars ? fmt(text, vars) : text;
}

/* Level and theme names live in game_config.json (operational content belongs with
   the other tunables), so they are resolved through the same locale rules. */
function pickLocale(obj, dflt) {
  if (obj === null || obj === undefined) return dflt;
  if (typeof obj === 'string') return obj;
  var lang = getLang();
  return obj[lang] || obj[FALLBACK_LANG] || obj.en || obj.zh || dflt;
}


/* ===== 03-assets.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §3  ASSETS — window.lib.getAsset(assetId) pipeline with local fallbacks
   ═══════════════════════════════════════════════════════════════════════════ */

/* Mirrors asset_map.json (ids are the contract; the map file is the auditable copy).
   Binary payload shipped: the store icon, the store cover and one grain texture.
   Everything else the game shows is generated procedurally, so it has no url. */
var ASSET_IDS = {
  icon: { url: 'icon.png', type: 'image' },
  poster: { url: 'cover/poster.jpg', type: 'image' },
  grain: { url: 'assets/grain.png', type: 'image' },
  ship_set: { url: null, type: 'image' },
  rock_set: { url: null, type: 'image' },
  well_skin: { url: null, type: 'image' },
  fx_thrust: { url: null, type: 'animation' },
  fx_crash: { url: null, type: 'animation' },
  sfx_thrust: { url: null, type: 'audio' },
  sfx_dock: { url: null, type: 'audio' },
  sfx_crash: { url: null, type: 'audio' }
};

var ASSETS = {
  images: {},          /* id -> HTMLImageElement (only when actually usable) */
  resolved: {},        /* id -> 'host' | 'local' | 'procedural' | 'missing' */
  requested: [],       /* every id the game asked for */
  calls: [],           /* ids handed to window.lib.getAsset (empty without the host API) */
  host: !!(window.lib && typeof window.lib.getAsset === 'function'),
  ready: null
};

/* The host API is deliberately unspecified beyond its name, so accept whatever
   shape it returns: a promise, a URL string, a descriptor or a live element. */
function hostGetAsset(id) {
  ASSETS.calls.push(id);
  try {
    if (!window.lib || typeof window.lib.getAsset !== 'function') return null;
    return window.lib.getAsset(id);
  } catch (e) {
    return null;
  }
}

function loadImageUrl(url) {
  return new Promise(function (resolve) {
    if (!url) { resolve(null); return; }
    var img = new Image();
    /* Only remote (cross-origin) sources need the anonymous flag; setting it on a
       relative url can break a plain file:// load, so it is conditional. */
    if (/^https?:/i.test(url)) img.crossOrigin = 'anonymous';
    img.onload = function () { resolve(img); };
    img.onerror = function () { resolve(null); };
    img.src = url;
  });
}

function imageFromValue(value) {
  return new Promise(function (resolve) {
    if (!value) { resolve(null); return; }
    if (typeof value === 'string') { loadImageUrl(value).then(resolve); return; }
    if (typeof value.then === 'function') {
      value.then(function (v) { imageFromValue(v).then(resolve); }, function () { resolve(null); });
      return;
    }
    if (typeof Image !== 'undefined' && value instanceof Image) { resolve(value); return; }
    if (value.image && typeof value.image === 'object') { imageFromValue(value.image).then(resolve); return; }
    if (typeof value.src === 'string') { loadImageUrl(value.src).then(resolve); return; }
    if (typeof value.url === 'string') { loadImageUrl(value.url).then(resolve); return; }
    if (typeof value.path === 'string') { loadImageUrl(value.path).then(resolve); return; }
    resolve(null);
  });
}

function requestAsset(id) {
  var spec = ASSET_IDS[id] || {};
  ASSETS.requested.push(id);
  var viaHost = null;
  if (ASSETS.host) {
    var raw = hostGetAsset(id);
    if (raw !== null && raw !== undefined) {
      viaHost = imageFromValue(raw).then(function (img) { return img ? { img: img, from: 'host' } : null; });
    }
  }
  var chain = viaHost || Promise.resolve(null);
  return chain.then(function (hit) {
    if (hit) return hit;
    return loadImageUrl(spec.url).then(function (img) { return img ? { img: img, from: 'local' } : null; });
  }).then(function (hit) {
    if (hit) {
      ASSETS.images[id] = hit.img;
      ASSETS.resolved[id] = hit.from;
    } else {
      ASSETS.resolved[id] = spec.url ? 'missing' : 'procedural';
    }
    return ASSETS.images[id] || null;
  });
}

/* Every declared asset is requested through the platform API at boot, so the
   documented call happens for the whole manifest - not just the files we ship. */
function loadAssets() {
  var ids = [];
  for (var k in ASSET_IDS) { if (Object.prototype.hasOwnProperty.call(ASSET_IDS, k)) ids.push(k); }
  ASSETS.ready = Promise.all(ids.map(requestAsset));
  return ASSETS.ready;
}

function assetImage(id) { return ASSETS.images[id] || null; }


/* ===== 04-theme.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §4  THEME — the palettes are data, not code
   ═══════════════════════════════════════════════════════════════════════════ */

var THEMES = cfgGet('themes', []);
var DEFAULT_THEME = cfgGet('defaultTheme', 'deepfield');
var _themeId = null;

function themeIds() {
  var out = [];
  for (var i = 0; i < THEMES.length; i += 1) out.push(THEMES[i].id);
  return out;
}

function getThemeId() {
  if (_themeId) return _themeId;
  var saved = STORE.get('theme', '');
  if (typeof saved === 'string' && themeIds().indexOf(saved) >= 0) return saved;
  return DEFAULT_THEME;
}

function setThemeId(id) {
  if (themeIds().indexOf(id) < 0) return false;
  _themeId = id;
  STORE.set('theme', id);
  return true;
}

function T() {
  var id = getThemeId();
  for (var i = 0; i < THEMES.length; i += 1) { if (THEMES[i].id === id) return THEMES[i]; }
  return THEMES[0];
}

/* Ship palettes come from the active theme, but the SHAPE cue stays fixed: ship 0
   always flies the ring-marked hull, ship 1 the chevron hull, so the two are
   tellable apart without relying on colour. */
function shipColor(i) {
  var t = T();
  var set = (i % 2 === 0) ? t.shipA : t.shipB;
  return set[0];
}
function shipDark(i) {
  var t = T();
  var set = (i % 2 === 0) ? t.shipA : t.shipB;
  return set[1];
}
function shipLight(i) {
  var t = T();
  var set = (i % 2 === 0) ? t.shipA : t.shipB;
  return set[2];
}
function shipLabel(i) { return tr(i % 2 === 0 ? 'ship.a' : 'ship.b'); }
function gateShape(i) { return (i % 2 === 0) ? 'ring' : 'tri'; }

function themeName(theme) {
  if (!theme) return '';
  return pickLocale(theme.name, theme.id);
}

function levelName(def) { return def ? pickLocale(def.name, def.id) : ''; }
function levelTeach(def) { return def ? pickLocale(def.teach, '') : ''; }


/* ===== 05-audio.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §5  AUDIO — every sound is synthesised with Web Audio, so no wav/ogg ships.
        The engine note is one long-lived voice whose gain follows the actual
        thrust level, which is what makes the tank feel like it is draining.
   ═══════════════════════════════════════════════════════════════════════════ */

var SFX = (function () {
  var ctx = null;
  var master = null;
  var enabled = cfgGet('audio.enabled', true);
  var volume = cfgGet('audio.masterVolume', 0.42);
  var engine = null;          /* { osc, osc2, filter, gain } */
  var engineLevel = 0;

  function ac() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
      }
      /* WebViews may start the context suspended until the first interaction. */
      if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) { /* retried on next gesture */ } }
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tone(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.12;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = opts.type || 'triangle';
      osc.frequency.setValueAtTime(opts.freq, t0);
      if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.gain || 0.3), t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      var node = osc;
      if (opts.q) {
        var bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = opts.band || opts.freq;
        bp.Q.value = opts.q;
        osc.connect(bp);
        node = bp;
      }
      node.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is never allowed to break gameplay */ }
  }

  function noise(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.08;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource();
      src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = opts.filter || 'highpass';
      f.frequency.value = opts.freq || 900;
      var g = c.createGain();
      g.gain.value = opts.gain || 0.12;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0);
    } catch (e) { /* ignore */ }
  }

  /* ── engine: a two-oscillator drone held open for the whole session ─────── */
  function ensureEngine() {
    var c = ac();
    if (!c) return null;
    if (engine) return engine;
    try {
      var osc = c.createOscillator();
      var osc2 = c.createOscillator();
      var filter = c.createBiquadFilter();
      var gain = c.createGain();
      osc.type = 'sawtooth';
      osc.frequency.value = 74;
      osc2.type = 'square';
      osc2.frequency.value = 37;
      filter.type = 'lowpass';
      filter.frequency.value = 620;
      filter.Q.value = 1.4;
      gain.gain.value = 0.0001;
      osc.connect(filter);
      osc2.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      osc.start();
      osc2.start();
      engine = { osc: osc, osc2: osc2, filter: filter, gain: gain };
    } catch (e) { engine = null; }
    return engine;
  }

  /** level 0..1 — how hard the thrusters are firing across both ships. */
  function setEngine(level) {
    if (!enabled) { engineLevel = 0; return; }
    engineLevel = Math.max(0, Math.min(1, level));
    var c = ac();
    if (!c) return;
    var e = ensureEngine();
    if (!e) return;
    try {
      var target = engineLevel <= 0.001 ? 0.0001 : (cfgGet('audio.thrustVolume', 0.17) * engineLevel + 0.0015);
      var now = c.currentTime;
      e.gain.gain.cancelScheduledValues(now);
      e.gain.gain.setTargetAtTime(target, now, 0.05);
      e.filter.frequency.setTargetAtTime(430 + 320 * engineLevel, now, 0.08);
      e.osc.frequency.setTargetAtTime(66 + 26 * engineLevel, now, 0.08);
    } catch (err) { /* ignore */ }
  }

  return {
    /* one voice per ship leaving the pad */
    launch: function (index) {
      tone({ type: 'triangle', freq: 320 + (index || 0) * 60, to: 620, dur: 0.16, gain: 0.20 });
      noise({ dur: 0.12, freq: 900, gain: 0.09 });
    },
    wall: function (strength) {
      var g = 0.06 + Math.min(0.16, (strength || 0) / 1400);
      tone({ type: 'sine', freq: 150, to: 92, dur: 0.10, gain: g });
      noise({ dur: 0.05, freq: 1800, gain: g * 0.7 });
    },
    dock: function (precise) {
      var notes = precise ? [523, 659, 784, 1046, 1318] : [523, 659, 784];
      for (var i = 0; i < notes.length; i += 1) {
        tone({ type: 'triangle', freq: notes[i], dur: 0.22, gain: 0.20, delay: i * 0.08 });
      }
      if (precise) tone({ type: 'sine', freq: 2093, dur: 0.3, gain: 0.10, delay: 0.34 });
    },
    cell: function () {
      tone({ type: 'sine', freq: 880, to: 1320, dur: 0.10, gain: 0.16 });
    },
    crash: function () {
      tone({ type: 'sine', freq: 90, to: 45, dur: 0.35, gain: 0.30 });
      noise({ dur: 0.25, freq: 400, gain: 0.22 });
    },
    fuelOut: function () {
      tone({ type: 'square', freq: 220, to: 110, dur: 0.40, gain: 0.16 });
      tone({ type: 'sine', freq: 165, to: 82, dur: 0.50, gain: 0.14, delay: 0.10 });
    },
    lowFuel: function () {
      tone({ type: 'sine', freq: 62, dur: 0.12, gain: 0.16 });
      tone({ type: 'sine', freq: 62, dur: 0.12, gain: 0.11, delay: 0.22 });
    },
    win: function () {
      var notes = [523, 659, 784, 1046];
      for (var i = 0; i < notes.length; i += 1) {
        tone({ type: 'triangle', freq: notes[i], dur: 0.26, gain: 0.22, delay: i * 0.10 });
      }
    },
    click: function () { tone({ type: 'triangle', freq: 520, dur: 0.05, gain: 0.14 }); },
    /* Called from the first pointer event so the context can start. */
    unlock: function () { ac(); setEngine(engineLevel); },
    setEnabled: function (v) {
      enabled = !!v;
      if (!enabled) setEngine(0);
    },
    isEnabled: function () { return enabled; },
    /* The scene drives the engine drone directly: level 0..1 across both ships. */
    setEngine: setEngine,
    engineLevel: function () { return engineLevel; }
  };
})();


/* ===== 06-physics.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §6  PHYSICS — motion, gravity wells, collisions and the win/lose rules.
        Everything here is a PURE function of (world, input, dt): no DOM, no
        audio, no Math.random in any judged path. The scene layer turns the
        returned event list into particles and sound, and the test harness
        replays the same functions to soak the rules.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── arena geometry ─────────────────────────────────────────────────────── */
/* Levels store normalised (0..1) coordinates, so the same level definition
   works on a notched phone and on a desktop window without leaving the safe
   area. This maps them into the live play field. */
function arenaRect() {
  var top = LAY.contentTop + cfgGet('arena.hudHeight', 46) + cfgGet('arena.levelInsetTop', 6);
  var bottom = LAY.contentBottom - cfgGet('arena.hintHeight', 26) - cfgGet('arena.levelInsetBottom', 6);
  var left = LAY.contentLeft;
  var right = LAY.contentRight;
  return {
    x: left, y: top, w: right - left, h: bottom - top,
    cx: (left + right) / 2, cy: (top + bottom) / 2
  };
}

function normToArena(rect, n) {
  if (!n) return { x: rect.cx, y: rect.cy };
  return { x: rect.x + Number(n[0]) * rect.w, y: rect.y + Number(n[1]) * rect.h };
}

function levelDef(index) {
  var levels = cfgGet('levels', []);
  for (var i = 0; i < levels.length; i += 1) {
    if (Number(levels[i].index) === Number(index)) return levels[i];
  }
  return levels[0] || null;
}

function levelCount() { return (cfgGet('levels', []) || []).length; }

/* Deterministic rock silhouettes: one PNRG stream per rock, so a level always
   looks and collides the same way on every device and every replay. */
function rockVerts(seed, id) {
  var rnd = mulberry32((seed + (id + 1) * 7919) >>> 0);
  var n = 9 + Math.floor(rnd() * 3);
  var out = [];
  for (var i = 0; i < n; i += 1) out.push(0.86 + rnd() * 0.20);
  return out;
}

/* ── world construction ─────────────────────────────────────────────────── */
/* A fresh world is built from the level definition plus a seed. Nothing is
   carried over from a previous attempt: this is the single reset point the
   platform spec asks for ("restart must fully reinitialise the level"). */
function buildWorld(index, seed, rect) {
  var def = levelDef(index);
  var r = rect || arenaRect();
  var phys = cfgGet('physics', {});
  var shipR = phys.shipRadius || 7;
  var dockR = phys.dockRadius || 23;
  var ships = [];
  var gates = [];
  var rocks = [];
  var wells = [];
  var cells = [];
  var i;

  for (i = 0; i < def.ships.length; i += 1) {
    var sp = normToArena(r, def.ships[i].n);
    var gt = normToArena(r, def.ships[i].gate);
    ships.push({
      id: i, x: sp.x, y: sp.y, vx: 0, vy: 0, r: shipR,
      alive: true, docked: false, precise: false, ramp: 0, thrustOn: false, trail: []
    });
    gates.push({
      id: i, x: gt.x, y: gt.y, r: dockR, shipId: i,
      shape: i === 0 ? 'ring' : 'tri', t: 0, flash: 0
    });
  }

  var rockDefs = def.rocks || [];
  for (i = 0; i < rockDefs.length; i += 1) {
    var o = normToArena(r, rockDefs[i].n);
    var rock = {
      id: i, r: Number(rockDefs[i].r) || 16,
      verts: rockVerts(seed, i), rot: 0, hitR: (Number(rockDefs[i].r) || 16) * 0.95,
      ax: o.x, ay: o.y, bx: o.x, by: o.y, len: 0, speed: 0, off: 0, x: o.x, y: o.y
    };
    if (rockDefs[i].path) {
      var b = normToArena(r, rockDefs[i].path.to);
      var dx = b.x - o.x, dy = b.y - o.y;
      rock.bx = b.x; rock.by = b.y;
      rock.len = Math.sqrt(dx * dx + dy * dy);
      rock.speed = Number(rockDefs[i].path.speed) || 30;
      /* Rock phase is seeded so patrols are never in lockstep with each other. */
      rock.off = mulberry32((seed + (i + 1) * 104729) >>> 0)() * rock.len * 2;
    }
    var spinRange = (phys.rockSpinMax || 0.9) - (phys.rockSpinMin || 0.25);
    rock.spin = ((phys.rockSpinMin || 0.25) + mulberry32((seed + (i + 1) * 15485863) >>> 0)() * spinRange) *
      (mulberry32((seed + (i + 1) * 32452843) >>> 0)() < 0.5 ? -1 : 1);
    if (!rockDefs[i].path) rock.spin *= 0.25;   /* static rocks barely turn */
    rocks.push(rock);
  }

  var wellDefs = def.wells || [];
  for (i = 0; i < wellDefs.length; i += 1) {
    var w = normToArena(r, wellDefs[i].n);
    wells.push({ id: i, x: w.x, y: w.y, r: Number(wellDefs[i].r) || 80, pull: Number(wellDefs[i].pull) || 40 });
  }

  var cellDefs = def.cells || [];
  for (i = 0; i < cellDefs.length; i += 1) {
    var c = normToArena(r, cellDefs[i]);
    cells.push({ id: i, x: c.x, y: c.y, r: 11, taken: false, t: 0 });
  }

  var fuelMax = Number(def.fuel) || 80;
  return {
    level: Number(def.index) || index,
    def: def, rect: r, seed: seed >>> 0,
    ships: ships, gates: gates, rocks: rocks, wells: wells, cells: cells,
    fuel: fuelMax, fuelMax: fuelMax, t: 0,
    status: 'playing', reason: '',
    softDocks: 0, cellsTaken: 0, crashes: 0, wallHits: 0,
    events: [], particles: []
  };
}

/* ── input assignment ───────────────────────────────────────────────────── */
/* Two thumbs, two ships. Each live pointer drives the nearest alive ship, but
   an established pairing is sticky: a ship only changes hands when another
   pointer is clearly closer (hysteresis), which stops the assignment from
   flickering mid-flight while the player's fingers drift. */
function pointerDist2(ship, p) {
  var dx = ship.x - p.x, dy = ship.y - p.y;
  return dx * dx + dy * dy;
}

function shipIsClaimable(ship) { return !!(ship.alive && !ship.docked); }

function findPointer(pointers, id) {
  for (var i = 0; i < pointers.length; i += 1) {
    if (pointers[i].id === id) return pointers[i];
  }
  return null;
}

function assignPointers(ships, pointers, prev, hysteresis) {
  var n = ships.length;
  var assign = [];
  var dists = [];
  var i, j;

  for (i = 0; i < n; i += 1) { assign.push(null); dists.push(Infinity); }

  /* 1. sticky pass — keep last frame's pairing while the pointer is still the
        sensible owner of that ship. */
  if (prev && prev.shipPointer) {
    for (i = 0; i < n; i += 1) {
      var pid = prev.shipPointer[i];
      if (pid === null || pid === undefined) continue;
      if (!shipIsClaimable(ships[i])) continue;
      var p = findPointer(pointers, pid);
      if (!p) continue;
      var d = Math.sqrt(pointerDist2(ships[i], p));
      var was = (prev.dist && isFinite(prev.dist[i])) ? prev.dist[i] : 0;
      if (assigned(assign, pid)) continue;
      if (d <= was + hysteresis) { assign[i] = pid; dists[i] = d; }
    }
  }

  /* 2. greedy pass — repeatedly take the globally closest free pointer/ship
        pair so the result never depends on array order. */
  var guard = 0;
  while (guard < n * pointers.length + n) {
    guard += 1;
    var bestShip = -1, bestPtr = null, bestD = Infinity;
    for (i = 0; i < n; i += 1) {
      if (assign[i] !== null || !shipIsClaimable(ships[i])) continue;
      for (j = 0; j < pointers.length; j += 1) {
        if (assigned(assign, pointers[j].id)) continue;
        var dd = pointerDist2(ships[i], pointers[j]);
        if (dd < bestD) { bestD = dd; bestShip = i; bestPtr = pointers[j].id; }
      }
    }
    if (bestShip < 0) break;
    assign[bestShip] = bestPtr;
    dists[bestShip] = Math.sqrt(bestD);
  }

  var aims = [];
  for (i = 0; i < n; i += 1) {
    var pt = assign[i] === null ? null : findPointer(pointers, assign[i]);
    aims.push(pt ? { x: pt.x, y: pt.y } : null);
  }
  return { aims: aims, shipPointer: assign, dist: dists };
}

function assigned(assign, pid) {
  for (var i = 0; i < assign.length; i += 1) { if (assign[i] === pid) return true; }
  return false;
}

/* ── one simulation step ────────────────────────────────────────────────── */
/* `aims[i]` is the arena-space point ship i is being pulled toward, or null.
   Returns nothing; mutates world and appends to world.events. */
function stepWorld(world, aims, dt) {
  if (!(dt > 0)) return world;
  if (dt > 0.05) dt = 0.05;              /* a stalled frame must not tunnel a ship */
  var phys = cfgGet('physics', {});
  var thrust = phys.thrust || 232;
  var maxSpeed = phys.maxSpeed || 196;
  var drag = phys.dragPerSec || 0.055;
  var burn = phys.burnPerSec || 2.6;
  var idle = phys.burnIdlePerSec || 0.08;
  var rampSec = phys.thrustRampSec || 0.16;
  var deadZone = phys.deadZonePx || 24;
  var rest = phys.wallRestitution || 0.52;
  var r = world.rect;
  var i, k;

  world.t += dt;
  world.events.length = 0;

  /* rocks patrol first so collisions are tested against where they are now */
  for (i = 0; i < world.rocks.length; i += 1) {
    var rock = world.rocks[i];
    rock.rot += rock.spin * dt;
    if (rock.len > 0.001) {
      var span = rock.len * 2;
      var prog = (world.t * rock.speed + rock.off) % span;
      if (prog < 0) prog += span;
      var d = prog <= rock.len ? prog : span - prog;
      var u = d / rock.len;
      rock.x = rock.ax + (rock.bx - rock.ax) * u;
      rock.y = rock.ay + (rock.by - rock.ay) * u;
    }
  }
  for (i = 0; i < world.cells.length; i += 1) world.cells[i].t += dt;
  for (i = 0; i < world.gates.length; i += 1) {
    world.gates[i].t += dt;
    if (world.gates[i].flash > 0) world.gates[i].flash -= dt;
  }

  /* idle leak keeps the fuel bar moving even when the player does nothing */
  world.fuel -= idle * dt;

  for (i = 0; i < world.ships.length; i += 1) {
    var s = world.ships[i];
    if (!s.alive || s.docked) continue;
    var aim = aims ? aims[i] : null;
    var pushing = false;

    if (aim && world.fuel > 0) {
      var dx = aim.x - s.x, dy = aim.y - s.y;
      var len = Math.sqrt(dx * dx + dy * dy);
      if (len > deadZone) {
        s.ramp = Math.min(1, s.ramp + dt / rampSec);
        var kf = thrust * s.ramp / len;
        s.vx += dx * kf * dt;
        s.vy += dy * kf * dt;
        world.fuel -= burn * s.ramp * dt;
        pushing = true;
      }
    }
    if (!pushing) s.ramp = Math.max(0, s.ramp - dt / rampSec * 1.6);
    s.thrustOn = pushing;

    /* gravity wells: strongest at the core, gone at the rim */
    for (k = 0; k < world.wells.length; k += 1) {
      var w = world.wells[k];
      var wx = w.x - s.x, wy = w.y - s.y;
      var wd = Math.sqrt(wx * wx + wy * wy);
      if (wd < w.r && wd > 0.5) {
        var pullF = w.pull * (1 - wd / w.r) * dt / wd;
        s.vx += wx * pullF;
        s.vy += wy * pullF;
      }
    }

    var damp = Math.max(0, 1 - drag * dt);
    s.vx *= damp;
    s.vy *= damp;

    var speed = Math.sqrt(s.vx * s.vx + s.vy * s.vy);
    if (speed > maxSpeed) {
      s.vx = s.vx / speed * maxSpeed;
      s.vy = s.vy / speed * maxSpeed;
      speed = maxSpeed;
    }

    s.x += s.vx * dt;
    s.y += s.vy * dt;

    /* walls: bounce, and report the hit so the scene can shake the screen */
    var hitWall = false, wallX = s.x, wallY = s.y, wallSpeed = speed;
    if (s.x - s.r < r.x) { s.x = r.x + s.r; s.vx = Math.abs(s.vx) * rest; hitWall = true; }
    else if (s.x + s.r > r.x + r.w) { s.x = r.x + r.w - s.r; s.vx = -Math.abs(s.vx) * rest; hitWall = true; }
    if (s.y - s.r < r.y) { s.y = r.y + s.r; s.vy = Math.abs(s.vy) * rest; hitWall = true; }
    else if (s.y + s.r > r.y + r.h) { s.y = r.y + r.h - s.r; s.vy = -Math.abs(s.vy) * rest; hitWall = true; }
    if (hitWall) {
      world.wallHits += 1;
      world.events.push({ type: 'wall', x: wallX, y: wallY, speed: wallSpeed, ship: i });
    }

    /* motion trail, capped so a long flight cannot grow without bound */
    var trailMax = cfgGet('anim.trailMax', 22);
    s.trail.unshift({ x: s.x, y: s.y });
    if (s.trail.length > trailMax) s.trail.pop();
  }

  /* ── collisions ── */
  for (i = 0; i < world.ships.length; i += 1) {
    var sh = world.ships[i];
    if (!sh.alive || sh.docked) continue;

    for (k = 0; k < world.rocks.length; k += 1) {
      var rk = world.rocks[k];
      var rr = rk.hitR + sh.r;
      var rdx = sh.x - rk.x, rdy = sh.y - rk.y;
      if (rdx * rdx + rdy * rdy <= rr * rr) {
        sh.alive = false;
        world.crashes += 1;
        world.events.push({ type: 'crash', x: sh.x, y: sh.y, ship: i, rock: k });
        break;
      }
    }
    if (!sh.alive) continue;

    var gate = world.gates[i];
    var gd = Math.sqrt(pointerDist2(sh, gate));
    if (gd <= gate.r) {
      /* Read the approach speed BEFORE killing it: a gentle arrival earns the
         precision bonus, and the bonus is what makes braking worth its fuel. */
      var dockSpeed = Math.sqrt(sh.vx * sh.vx + sh.vy * sh.vy);
      sh.precise = dockSpeed <= (phys.dockSoftSpeed || 46);
      if (sh.precise) world.softDocks += 1;
      sh.docked = true;
      sh.vx = 0; sh.vy = 0; sh.thrustOn = false; sh.ramp = 0;
      gate.flash = cfgGet('anim.dockFlashSec', 0.32);
      world.events.push({ type: 'dock', x: sh.x, y: sh.y, ship: i, precise: sh.precise, speed: dockSpeed });
    }

    for (k = 0; k < world.cells.length; k += 1) {
      var cell = world.cells[k];
      if (cell.taken) continue;
      var cd = sh.r + cell.r;
      var cdx = sh.x - cell.x, cdy = sh.y - cell.y;
      if (cdx * cdx + cdy * cdy <= cd * cd) {
        cell.taken = true;
        world.cellsTaken += 1;
        world.fuel += cfgGet('scoring.fuelCellAmount', 18);
        if (world.fuel > world.fuelMax) world.fuel = world.fuelMax;
        world.events.push({ type: 'cell', x: cell.x, y: cell.y, ship: i });
      }
    }
  }

  if (world.fuel < 0) world.fuel = 0;

  /* ── outcome ── */
  if (world.status === 'playing') {
    var crashed = false, allDocked = true;
    for (i = 0; i < world.ships.length; i += 1) {
      if (!world.ships[i].alive) crashed = true;
      if (!world.ships[i].docked) allDocked = false;
    }
    if (crashed) {
      world.status = 'fail';
      world.reason = 'crash';
      world.events.push({ type: 'fail', reason: 'crash' });
    } else if (allDocked) {
      world.status = 'clear';
      world.reason = 'docked';
      world.events.push({ type: 'clear' });
    } else if (world.fuel <= 0) {
      world.status = 'fail';
      world.reason = 'fuel';
      world.events.push({ type: 'fail', reason: 'fuel' });
    }
  }
  return world;
}

/* ── results ────────────────────────────────────────────────────────────── */
function levelScore(world) {
  var base = world.status === 'clear' ? cfgGet('scoring.levelBase', 400) : 0;
  var ratio = world.fuelMax > 0 ? world.fuel / world.fuelMax : 0;
  var fuelPts = world.status === 'clear' ? Math.floor(ratio * cfgGet('scoring.fuelBonus', 600)) : 0;
  var dockPts = 0;
  for (var i = 0; i < world.ships.length; i += 1) {
    if (world.ships[i].docked && world.ships[i].precise) dockPts += cfgGet('scoring.softDockBonus', 150);
  }
  var cellPts = world.cellsTaken * cfgGet('scoring.cellBonus', 60);
  var stars = 0;
  if (world.status === 'clear') {
    stars = 1;
    if (ratio >= cfgGet('scoring.star2Ratio', 0.3)) stars = 2;
    if (ratio >= cfgGet('scoring.star3Ratio', 0.5)) stars = 3;
  }
  return {
    base: base, fuel: fuelPts, dock: dockPts, cells: cellPts,
    total: base + fuelPts + dockPts + cellPts, stars: stars,
    fuelRatio: ratio, fuelLeft: Math.round(world.fuel)
  };
}

/* Compact signature of the judged state — used by the soak test to prove that
   the same seed and the same input sequence always produce the same run. */
function stateSig(world) {
  var out = [];
  for (var i = 0; i < world.ships.length; i += 1) {
    var s = world.ships[i];
    out.push(s.x.toFixed(3) + ',' + s.y.toFixed(3) + ',' + s.vx.toFixed(3) + ',' + s.vy.toFixed(3) +
      (s.alive ? 'A' : '-') + (s.docked ? 'D' : '-'));
  }
  out.push('f' + world.fuel.toFixed(3));
  out.push('s' + world.status);
  return out.join('|');
}

/* ── level validation ───────────────────────────────────────────────────── */
/* Runs in the browser and in the e2e harness: a level that starts a ship
   inside a rock, or parks a dock outside the field, is a level the player
   cannot win through skill, and must never ship. */
function validateLevels() {
  var problems = [];
  var rect = { x: 0, y: 0, w: 370, h: 485, cx: 185, cy: 242.5 };
  var levels = cfgGet('levels', []);
  if (!levels.length) problems.push('no levels defined');
  for (var i = 0; i < levels.length; i += 1) {
    var def = levels[i];
    var tag = 'level ' + def.index + ' (' + def.id + ')';
    if (!(Number(def.fuel) > 0)) problems.push(tag + ': fuel must be positive');
    if (!def.ships || def.ships.length < 2) problems.push(tag + ': needs two ships');
    var w = buildWorld(def.index, 12345, rect);
    var k, j;
    for (k = 0; k < w.gates.length; k += 1) {
      var g = w.gates[k];
      if (g.x < rect.x || g.x > rect.x + rect.w || g.y < rect.y || g.y > rect.y + rect.h) {
        problems.push(tag + ': gate ' + k + ' outside the arena');
      }
    }
    for (k = 0; k < w.ships.length; k += 1) {
      var s = w.ships[k];
      if (s.x < rect.x + s.r || s.x > rect.x + rect.w - s.r || s.y < rect.y + s.r || s.y > rect.y + rect.h - s.r) {
        problems.push(tag + ': ship ' + k + ' starts outside the arena');
      }
      for (j = 0; j < w.rocks.length; j += 1) {
        var rk = w.rocks[j];
        var need = rk.hitR + s.r + 6;
        var dx = s.x - rk.x, dy = s.y - rk.y;
        if (dx * dx + dy * dy < need * need) {
          problems.push(tag + ': ship ' + k + ' starts overlapping rock ' + j);
        }
      }
      for (j = 0; j < w.gates.length; j += 1) {
        var gg = w.gates[j];
        var gdx = s.x - gg.x, gdy = s.y - gg.y;
        if (gdx * gdx + gdy * gdy < (gg.r + s.r + 4) * (gg.r + s.r + 4)) {
          problems.push(tag + ': ship ' + k + ' starts already docked at gate ' + j);
        }
      }
    }
    for (k = 0; k < w.wells.length; k += 1) {
      if (!(w.wells[k].pull > 0) || !(w.wells[k].r > 0)) problems.push(tag + ': well ' + k + ' has no pull');
    }
  }
  return problems;
}

/* A deliberately naive autopilot: hold toward the ship's own gate, ignore
   rocks entirely. Its job is not to play well but to prove the field is
   traversable — if this cannot reach the dock in the open early levels, the
   level geometry or the thrust budget is wrong. */
function autopilotAims(world) {
  var out = [];
  for (var i = 0; i < world.ships.length; i += 1) {
    var s = world.ships[i];
    if (!s.alive || s.docked) { out.push(null); continue; }
    var gate = world.gates[i];
    out.push({ x: gate.x, y: gate.y });
  }
  return out;
}

function simulate(world, seconds, dt, aimFn) {
  var steps = Math.round(seconds / dt);
  for (var i = 0; i < steps; i += 1) {
    if (world.status !== 'playing') break;
    stepWorld(world, aimFn(world), dt);
  }
  return world;
}


/* ===== 09-draw.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §9  DRAW — canvas primitives and the shared visual vocabulary.
        Everything is drawn live; no bitmap art is required to render a frame.
   ═══════════════════════════════════════════════════════════════════════════ */

var FONT_STACK = '"Arial Rounded MT Bold","Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,' +
  '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

var _grainPattern = null;

function setFont(size, weight) {
  CTX.font = (weight || '700') + ' ' + Math.round(size * 10) / 10 + 'px ' + FONT_STACK;
}

function rgba(hex, a) {
  var h = String(hex).replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function roundRectPath(x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  CTX.beginPath();
  CTX.moveTo(x + rad, y);
  CTX.lineTo(x + w - rad, y);
  CTX.quadraticCurveTo(x + w, y, x + w, y + rad);
  CTX.lineTo(x + w, y + h - rad);
  CTX.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  CTX.lineTo(x + rad, y + h);
  CTX.quadraticCurveTo(x, y + h, x, y + h - rad);
  CTX.lineTo(x, y + rad);
  CTX.quadraticCurveTo(x, y, x + rad, y);
  CTX.closePath();
}

function roundRectOn(g, x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.lineTo(x + w - rad, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rad);
  g.lineTo(x + w, y + h - rad);
  g.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  g.lineTo(x + rad, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rad);
  g.lineTo(x, y + rad);
  g.quadraticCurveTo(x, y, x + rad, y);
  g.closePath();
}

function fillRR(x, y, w, h, r, fill) {
  roundRectPath(x, y, w, h, r);
  CTX.fillStyle = fill;
  CTX.fill();
}

function strokeRR(x, y, w, h, r, color, width) {
  roundRectPath(x, y, w, h, r);
  CTX.strokeStyle = color;
  CTX.lineWidth = width;
  CTX.stroke();
}

function vGrad(x, y, w, h, top, bottom) {
  var g = CTX.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}

function withShadow(color, blur, ox, oy, fn) {
  CTX.save();
  CTX.shadowColor = color;
  CTX.shadowBlur = blur;
  CTX.shadowOffsetX = ox || 0;
  CTX.shadowOffsetY = oy || 0;
  fn();
  CTX.restore();
}

/** Text with optional gradient fill, outline and shadow. Returns the width used. */
function TXT(str, x, y, o) {
  var opts = o || {};
  var size = opts.size || 16;
  var weight = opts.weight || '700';
  var maxW = opts.maxW || 0;
  setFont(size, weight);
  var text = String(str);
  if (maxW > 0) {
    var w = CTX.measureText(text).width;
    while (w > maxW && size > 7) {
      size -= 0.5;
      setFont(size, weight);
      w = CTX.measureText(text).width;
    }
  }
  CTX.save();
  CTX.textAlign = opts.align || 'center';
  CTX.textBaseline = opts.baseline || 'middle';
  if (opts.letterSpacing && 'letterSpacing' in CTX) CTX.letterSpacing = opts.letterSpacing;
  if (opts.alpha !== undefined) CTX.globalAlpha = opts.alpha;
  if (opts.shadow) {
    CTX.shadowColor = opts.shadow.color;
    CTX.shadowBlur = opts.shadow.blur || 0;
    CTX.shadowOffsetX = opts.shadow.ox || 0;
    CTX.shadowOffsetY = opts.shadow.oy || 0;
  }
  if (opts.outline) {
    CTX.lineJoin = 'round';
    CTX.lineCap = 'round';
    CTX.lineWidth = opts.outline.width || 4;
    CTX.strokeStyle = opts.outline.color;
    CTX.strokeText(text, x, y);
    CTX.shadowColor = 'rgba(0,0,0,0)';
  }
  if (opts.grad) {
    /* A gradient fill needs the text's bounding box, so the glyphs are drawn in
       left-aligned mode at a computed origin - re-using the current alignment
       here would centre the run a second time and shift it off the outline. */
    var tw = CTX.measureText(text).width;
    var left = CTX.textAlign === 'center' ? x - tw / 2 : (CTX.textAlign === 'right' ? x - tw : x);
    var g = CTX.createLinearGradient(0, y - size * 0.62, 0, y + size * 0.58);
    g.addColorStop(0, opts.grad[0]);
    g.addColorStop(1, opts.grad[1]);
    CTX.fillStyle = g;
    CTX.textAlign = 'left';
    CTX.fillText(text, left, y);
  } else {
    CTX.fillStyle = opts.color || '#000';
    CTX.fillText(text, x, y);
  }
  var used = CTX.measureText(text).width;
  CTX.restore();
  return used;
}

/** Four-point spark, drawn as two crossed tapered shapes. */
function drawSpark(x, y, size, color, alpha) {
  CTX.save();
  CTX.globalAlpha = alpha === undefined ? 1 : alpha;
  CTX.translate(x, y);
  CTX.fillStyle = color;
  CTX.beginPath();
  CTX.moveTo(0, -size);
  CTX.quadraticCurveTo(size * 0.16, -size * 0.16, size, 0);
  CTX.quadraticCurveTo(size * 0.16, size * 0.16, 0, size);
  CTX.quadraticCurveTo(-size * 0.16, size * 0.16, -size, 0);
  CTX.quadraticCurveTo(-size * 0.16, -size * 0.16, 0, -size);
  CTX.fill();
  CTX.beginPath();
  CTX.arc(0, 0, size * 0.34, 0, TAU);
  CTX.fillStyle = 'rgba(255,255,255,0.95)';
  CTX.fill();
  CTX.restore();
}

/* ── word wrap and paragraphs ───────────────────────────────────────────── */

/* Word wrap that also works for Chinese, which has no spaces: CJK codepoints and
   punctuation become their own tokens while Latin runs stay whole. */
var _tokRe = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]|[^\s\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]+|\s+/g;

function wrapText(text, maxW, size, weight) {
  setFont(size, weight);
  var tokens = String(text).match(_tokRe) || [];
  var lines = [];
  var line = '';
  for (var i = 0; i < tokens.length; i += 1) {
    var tok = tokens[i];
    var candidate = line + tok;
    if (line !== '' && CTX.measureText(candidate).width > maxW) {
      lines.push(line.replace(/\s+$/, ''));
      line = /^\s+$/.test(tok) ? '' : tok;
    } else {
      line = candidate;
    }
  }
  if (line.replace(/\s+$/, '') !== '') lines.push(line.replace(/\s+$/, ''));
  return lines;
}

/** Draw wrapped text; returns the height consumed. */
function paragraph(text, x, y, maxW, o) {
  var opts = o || {};
  var size = opts.size || 13;
  var lh = size * (opts.lineHeight || 1.5);
  var lines = wrapText(text, maxW, size, opts.weight);
  for (var i = 0; i < lines.length; i += 1) {
    TXT(lines[i], x, y + lh * (i + 0.5), {
      size: size, weight: opts.weight, align: opts.align || 'left',
      color: opts.color, baseline: 'middle'
    });
  }
  return lines.length * lh;
}

function paragraphHeight(text, maxW, size, weight, lineHeight) {
  return wrapText(text, maxW, size, weight).length * size * (lineHeight || 1.5);
}

/* ── composite widgets ──────────────────────────────────────────────────── */

function drawCard(x, y, w, h, r, o) {
  var theme = T();
  var opts = o || {};
  var bg = opts.bg || theme.cardBg;
  withShadow('rgba(0,0,0,0.34)', opts.shadowBlur === undefined ? 12 : opts.shadowBlur, 0, 5, function () {
    fillRR(x, y, w, h, r, bg);
  });
  roundRectPath(x + 1, y + 1, w - 2, h * 0.5, r * 0.9);
  CTX.strokeStyle = 'rgba(255,255,255,0.14)';
  CTX.lineWidth = 1.2;
  CTX.stroke();
  strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, r, rgba(theme.edge, 0.9), 1.2);
}

function drawChip(x, y, w, h, label, active, o) {
  var theme = T();
  var opts = o || {};
  if (active) {
    withShadow(rgba(theme.primary, 0.5), 10, 0, 3, function () {
      fillRR(x, y, w, h, h / 2, vGrad(x, y, w, h, theme.btnGrad[0], theme.btnGrad[1]));
    });
    TXT(label, x + w / 2, y + h / 2 + 0.5, {
      size: opts.size || 14, color: theme.btnText, maxW: w - 10, weight: '800'
    });
  } else {
    fillRR(x, y, w, h, h / 2, opts.bg || 'rgba(255,255,255,0.08)');
    strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, h / 2, rgba(theme.edge, 0.8), 1);
    TXT(label, x + w / 2, y + h / 2 + 0.5, { size: opts.size || 14, color: theme.muted, maxW: w - 10 });
  }
}

function drawButton(x, y, w, h, label, pressed, o) {
  var theme = T();
  var opts = o || {};
  var dy = pressed ? 1.5 : 0;
  var top = opts.grad ? opts.grad[0] : theme.btnGrad[0];
  var bot = opts.grad ? opts.grad[1] : theme.btnGrad[1];
  fillRR(x, y + 3.5, w, h, h / 2, 'rgba(0,0,0,0.35)');
  withShadow(rgba(theme.primary, 0.55), 14, 0, 5, function () {
    fillRR(x, y + dy, w, h, h / 2, vGrad(x, y + dy, w, h, top, bot));
  });
  roundRectPath(x + 3, y + dy + 2.5, w - 6, h * 0.42, h * 0.22);
  CTX.strokeStyle = 'rgba(255,255,255,0.34)';
  CTX.lineWidth = 1.4;
  CTX.stroke();
  TXT(label, x + w / 2, y + dy + h / 2 + 0.5, {
    size: opts.size || 20, color: opts.color || theme.btnText, maxW: w - 22,
    letterSpacing: opts.letterSpacing || '0px', weight: '800'
  });
}

/* ── game sprites, painted once into offscreen bitmaps ──────────────────── */
/* A busy level draws two hulls, a dozen rocks and a hundred particles per frame.
   Re-running gradient construction for each of those every frame is the single
   most expensive thing this game could do, so hulls and rocks are stamped into
   small offscreen canvases and blitted from then on. */

var _spriteCache = {};
var _spriteStamp = '';

function spriteStamp() {
  return getThemeId() + ':' + Math.round(LAY.scale * VIEW.dpr * 100);
}

function spriteKey(parts) { return parts.join('|'); }

function spritePad() { return 3; }

/** Draw into a fresh offscreen canvas sized in design units. */
function makeSprite(span, paint) {
  var s = Math.max(0.5, LAY.scale * VIEW.dpr);
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(span * s));
  c.height = Math.max(2, Math.ceil(span * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  paint(g, span / 2, span / 2);
  return { canvas: c, span: span };
}

function cachedSprite(key, span, paint) {
  var stamp = spriteStamp();
  if (stamp !== _spriteStamp) { _spriteCache = {}; _spriteStamp = stamp; }
  var hit = _spriteCache[key];
  if (hit) return hit;
  hit = makeSprite(span, paint);
  _spriteCache[key] = hit;
  return hit;
}

/** Hull: a dart with a concave tail, a cockpit and a per-ship emblem.
 *  The emblem is a SHAPE (ring vs chevron) so the two ships stay tellable
 *  apart without relying on colour alone. */
function paintHull(g, cx, cy, i) {
  var base = shipColor(i), dark = shipDark(i), light = shipLight(i);
  var r = cfgGet('physics.shipRadius', 7);
  g.save();
  g.translate(cx, cy);

  function hullPath(scale) {
    g.beginPath();
    g.moveTo(0, -r * 1.55 * scale);
    g.lineTo(r * 0.98 * scale, r * 1.02 * scale);
    g.lineTo(0, r * 0.44 * scale);
    g.lineTo(-r * 0.98 * scale, r * 1.02 * scale);
    g.closePath();
  }

  var grad = g.createLinearGradient(0, -r * 1.55, 0, r * 1.02);
  grad.addColorStop(0, light);
  grad.addColorStop(0.5, base);
  grad.addColorStop(1, dark);

  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = r * 0.7;
  g.shadowOffsetY = r * 0.3;
  hullPath(1);
  g.fillStyle = grad;
  g.fill();
  g.shadowColor = 'rgba(0,0,0,0)';
  g.shadowBlur = 0;
  g.shadowOffsetY = 0;

  hullPath(1);
  g.strokeStyle = light;
  g.lineWidth = Math.max(0.7, r * 0.13);
  g.lineJoin = 'round';
  g.stroke();

  /* cockpit */
  g.beginPath();
  g.arc(0, -r * 0.34, r * 0.26, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.92)';
  g.fill();

  /* emblem: ring for ship 0, chevron for ship 1 */
  g.strokeStyle = 'rgba(255,255,255,0.88)';
  g.lineWidth = Math.max(1, r * 0.16);
  g.lineCap = 'round';
  if (i % 2 === 0) {
    g.beginPath();
    g.arc(0, r * 0.30, r * 0.24, 0, TAU);
    g.stroke();
  } else {
    g.beginPath();
    g.moveTo(-r * 0.30, r * 0.44);
    g.lineTo(0, r * 0.18);
    g.lineTo(r * 0.30, r * 0.44);
    g.stroke();
  }
  g.restore();
}

function drawShip(x, y, angle, i, o) {
  var opts = o || {};
  var r = cfgGet('physics.shipRadius', 7);
  var span = r * 3.6 + spritePad();
  var spr = cachedSprite(spriteKey(['hull', i, Math.round(r * 10)]), span, function (g, cx, cy) {
    paintHull(g, cx, cy, i);
  });
  CTX.save();
  CTX.globalAlpha = opts.alpha === undefined ? 1 : opts.alpha;
  CTX.translate(x, y);
  CTX.rotate(angle);
  if (opts.scale && opts.scale !== 1) CTX.scale(opts.scale, opts.scale);
  CTX.drawImage(spr.canvas, -spr.span / 2, -spr.span / 2, spr.span, spr.span);
  CTX.restore();
}

/** Exhaust plume: two nested tapers, length driven by the live thrust ramp. */
function drawExhaust(x, y, angle, i, power, alpha) {
  if (power <= 0.02) return;
  var r = cfgGet('physics.shipRadius', 7);
  var len = r * (1.1 + 3.6 * power);
  var wide = r * (0.34 + 0.30 * power);
  CTX.save();
  CTX.globalAlpha = alpha === undefined ? 1 : alpha;
  CTX.globalCompositeOperation = 'lighter';
  CTX.translate(x, y);
  CTX.rotate(angle);
  var g = CTX.createLinearGradient(0, r * 0.6, 0, r * 0.6 + len);
  g.addColorStop(0, rgba(shipLight(i), 0.95));
  g.addColorStop(0.45, rgba(shipColor(i), 0.55));
  g.addColorStop(1, rgba(shipColor(i), 0));
  CTX.beginPath();
  CTX.moveTo(-wide, r * 0.5);
  CTX.lineTo(wide, r * 0.5);
  CTX.lineTo(0, r * 0.5 + len);
  CTX.closePath();
  CTX.fillStyle = g;
  CTX.fill();
  var g2 = CTX.createLinearGradient(0, r * 0.5, 0, r * 0.5 + len * 0.5);
  g2.addColorStop(0, 'rgba(255,255,255,0.9)');
  g2.addColorStop(1, 'rgba(255,255,255,0)');
  CTX.beginPath();
  CTX.moveTo(-wide * 0.42, r * 0.5);
  CTX.lineTo(wide * 0.42, r * 0.5);
  CTX.lineTo(0, r * 0.5 + len * 0.5);
  CTX.closePath();
  CTX.fillStyle = g2;
  CTX.fill();
  CTX.restore();
}

/** Asteroid: a seeded convex-ish polygon with a lighter rim. */
function paintRock(g, cx, cy, r, verts) {
  var theme = T();
  var n = verts.length;
  g.save();
  g.translate(cx, cy);
  g.beginPath();
  for (var i = 0; i < n; i += 1) {
    var a = (i / n) * TAU - Math.PI / 2;
    var rr = r * verts[i];
    var px = Math.cos(a) * rr, py = Math.sin(a) * rr;
    if (i === 0) g.moveTo(px, py); else g.lineTo(px, py);
  }
  g.closePath();
  var grad = g.createLinearGradient(-r, -r, r, r);
  grad.addColorStop(0, theme.rockEdge);
  grad.addColorStop(0.45, theme.rock);
  grad.addColorStop(1, rgba(theme.rock, 0.75));
  g.shadowColor = 'rgba(0,0,0,0.45)';
  g.shadowBlur = r * 0.5;
  g.shadowOffsetY = r * 0.22;
  g.fillStyle = grad;
  g.fill();
  g.shadowColor = 'rgba(0,0,0,0)';
  g.shadowBlur = 0;
  g.shadowOffsetY = 0;
  g.strokeStyle = theme.rockEdge;
  g.lineWidth = Math.max(0.9, r * 0.09);
  g.lineJoin = 'round';
  g.stroke();

  /* two interior facets so a tumbling rock reads as solid, not as a sticker */
  g.strokeStyle = rgba(theme.rockEdge, 0.45);
  g.lineWidth = Math.max(0.6, r * 0.06);
  for (var k = 0; k < 2; k += 1) {
    var a0 = (k * 2.4 + 0.6);
    var a1 = a0 + 1.5;
    g.beginPath();
    g.moveTo(Math.cos(a0) * r * verts[k % n] * 0.72, Math.sin(a0) * r * verts[k % n] * 0.72);
    g.lineTo(Math.cos(a1) * r * verts[(k + 3) % n] * 0.70, Math.sin(a1) * r * verts[(k + 3) % n] * 0.70);
    g.stroke();
  }
  g.restore();
}

function drawRock(rock) {
  var span = rock.r * 2.45 + spritePad();
  var sig = rock.verts.join(',');
  var spr = cachedSprite(spriteKey(['rock', Math.round(rock.r * 10), sig]), span, function (g, cx, cy) {
    paintRock(g, cx, cy, rock.r, rock.verts);
  });
  CTX.save();
  CTX.translate(rock.x, rock.y);
  CTX.rotate(rock.rot);
  CTX.drawImage(spr.canvas, -spr.span / 2, -spr.span / 2, spr.span, spr.span);
  CTX.restore();
}

/** Gravity well: a dark core under breathing concentric rings, plus ripples that
    travel outward so the pull has a visible direction of travel. The core's radial
    gradient is a static sprite (it only ever scales), so a level with two wells does
    not build four gradients per frame. */
function drawWell(w, time) {
  var theme = T();
  var span = w.r * 2.2 + spritePad();
  var spr = cachedSprite(spriteKey(['well', Math.round(w.r * 10)]), span, function (g, cx, cy) {
    var core = g.createRadialGradient(cx, cy, 0, cx, cy, w.r);
    core.addColorStop(0, 'rgba(4,6,16,0.92)');
    core.addColorStop(0.35, rgba(theme.well, 0.22));
    core.addColorStop(1, rgba(theme.well, 0));
    g.beginPath();
    g.arc(cx, cy, w.r, 0, TAU);
    g.fillStyle = core;
    g.fill();
  });
  CTX.save();
  CTX.translate(w.x, w.y);
  CTX.drawImage(spr.canvas, -spr.span / 2, -spr.span / 2, spr.span, spr.span);

  for (var i = 0; i < 3; i += 1) {
    var breath = 0.86 + 0.09 * Math.sin(time * 1.5 - i * 0.9);
    CTX.beginPath();
    CTX.arc(0, 0, w.r * (0.34 + i * 0.22) * breath, 0, TAU);
    CTX.strokeStyle = rgba(theme.well, 0.42 - i * 0.10);
    CTX.lineWidth = 1.4;
    CTX.stroke();
  }

  var ripples = 2;
  for (var k = 0; k < ripples; k += 1) {
    var ph = ((time * 0.45 + k / ripples) % 1);
    var rr = w.r * (0.18 + ph * 0.82);
    CTX.beginPath();
    CTX.arc(0, 0, rr, 0, TAU);
    CTX.strokeStyle = rgba(theme.well, 0.34 * (1 - ph));
    CTX.lineWidth = 2;
    CTX.stroke();
  }
  CTX.restore();
}

/** A dock ring: rotating outer arcs plus a shape emblem matching its ship. */
function drawGate(gate, time) {
  var col = shipColor(gate.shipId);
  var light = shipLight(gate.shipId);
  CTX.save();
  CTX.translate(gate.x, gate.y);
  var flash = gate.flash > 0 ? gate.flash / cfgGet('anim.dockFlashSec', 0.32) : 0;

  CTX.beginPath();
  CTX.arc(0, 0, gate.r, 0, TAU);
  var gg = CTX.createRadialGradient(0, 0, gate.r * 0.2, 0, 0, gate.r);
  gg.addColorStop(0, rgba(col, 0.05 + 0.35 * flash));
  gg.addColorStop(1, rgba(col, 0.22 + 0.4 * flash));
  CTX.fillStyle = gg;
  CTX.fill();

  CTX.beginPath();
  CTX.arc(0, 0, gate.r, 0, TAU);
  CTX.strokeStyle = rgba(light, 0.75);
  CTX.lineWidth = 1.8;
  CTX.stroke();

  /* four rotating arcs, so an idle dock still reads as powered */
  CTX.save();
  CTX.rotate(time * 0.9);
  for (var i = 0; i < 4; i += 1) {
    CTX.beginPath();
    CTX.arc(0, 0, gate.r * 1.22, i * (TAU / 4), i * (TAU / 4) + 0.62);
    CTX.strokeStyle = rgba(col, 0.85);
    CTX.lineWidth = 2.6;
    CTX.lineCap = 'round';
    CTX.stroke();
  }
  CTX.restore();

  CTX.strokeStyle = rgba(light, 0.95);
  CTX.lineWidth = 2;
  if (gate.shape === 'ring') {
    CTX.beginPath();
    CTX.arc(0, 0, gate.r * 0.45, 0, TAU);
    CTX.stroke();
  } else {
    var t = gate.r * 0.5;
    CTX.beginPath();
    CTX.moveTo(0, -t);
    CTX.lineTo(t * 0.92, t * 0.72);
    CTX.lineTo(-t * 0.92, t * 0.72);
    CTX.closePath();
    CTX.stroke();
  }

  if (flash > 0) {
    CTX.beginPath();
    CTX.arc(0, 0, gate.r * (1 + (1 - flash) * 1.9), 0, TAU);
    CTX.strokeStyle = 'rgba(255,255,255,' + (0.7 * flash) + ')';
    CTX.lineWidth = 3;
    CTX.stroke();
  }
  CTX.restore();
}

/** Fuel cell: a slowly spinning green capsule with a glowing core. */
function drawCell(cell, time) {
  var theme = T();
  CTX.save();
  CTX.translate(cell.x, cell.y);
  var pulse = 0.9 + 0.1 * Math.sin(time * 3 + cell.id);
  var gl = CTX.createRadialGradient(0, 0, 1, 0, 0, cell.r * 2.4 * pulse);
  gl.addColorStop(0, rgba(theme.cell, 0.42));
  gl.addColorStop(1, rgba(theme.cell, 0));
  CTX.beginPath();
  CTX.arc(0, 0, cell.r * 2.4 * pulse, 0, TAU);
  CTX.fillStyle = gl;
  CTX.fill();

  CTX.rotate(time * 0.7 + cell.id);
  CTX.beginPath();
  CTX.moveTo(0, -cell.r * 1.15);
  CTX.lineTo(cell.r * 1.05, 0);
  CTX.lineTo(0, cell.r * 1.15);
  CTX.lineTo(-cell.r * 1.05, 0);
  CTX.closePath();
  CTX.fillStyle = theme.cell;
  CTX.fill();
  CTX.strokeStyle = 'rgba(255,255,255,0.85)';
  CTX.lineWidth = 1.4;
  CTX.stroke();
  CTX.beginPath();
  CTX.moveTo(0, -cell.r * 0.5);
  CTX.lineTo(0, cell.r * 0.5);
  CTX.strokeStyle = 'rgba(255,255,255,0.95)';
  CTX.lineWidth = 2;
  CTX.stroke();
  CTX.restore();
}

/* ── particles ──────────────────────────────────────────────────────────── */
/* Particles are decorative only: nothing here feeds a judgement, which is why
   this is the one place a random number is allowed. */

function spawnParticles(world, x, y, count, color, speed, life, size) {
  var cap = cfgGet('anim.particleCap', 240);
  for (var i = 0; i < count; i += 1) {
    if (world.particles.length >= cap) break;
    var a = Math.random() * TAU;
    var sp = speed * (0.35 + Math.random() * 0.9);
    var lf = life * (0.6 + Math.random() * 0.8);
    world.particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: lf, max: lf, color: color, size: size * (0.6 + Math.random() * 0.9), drag: 1.6
    });
  }
}

function stepParticles(world, dt) {
  var list = world.particles;
  for (var i = list.length - 1; i >= 0; i -= 1) {
    var p = list[i];
    p.life -= dt;
    if (p.life <= 0) { list.splice(i, 1); continue; }
    var damp = Math.max(0, 1 - p.drag * dt);
    p.vx *= damp;
    p.vy *= damp;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function drawParticles(world) {
  var list = world.particles;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  for (var i = 0; i < list.length; i += 1) {
    var p = list[i];
    var a = Math.max(0, p.life / p.max);
    CTX.globalAlpha = a;
    CTX.fillStyle = p.color;
    CTX.beginPath();
    CTX.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    CTX.fill();
  }
  CTX.restore();
}

/* ── the game mark: two hulls nose to nose over a shared gauge ──────────── */
function drawMark(cx, cy, size, t) {
  var r = size * 0.09;
  var pulse = t ? 1 + Math.sin(t * 3.1) * 0.06 : 1;
  var gap = size * 0.26;
  CTX.save();
  CTX.translate(cx, cy);
  drawShip(-gap, 4, -Math.PI / 2 - 0.35, 0, { scale: pulse });
  drawShip(gap, 4, Math.PI / 2 + 0.35, 1, { scale: pulse });
  var barW = size * 0.62;
  var barH = size * 0.10;
  fillRR(-barW / 2, size * 0.30, barW, barH, barH / 2, 'rgba(255,255,255,0.16)');
  var fill = barW * (0.44 + 0.06 * Math.sin(t ? t * 1.7 : 0));
  fillRR(-barW / 2, size * 0.30, fill, barH, barH / 2, T().accent);
  drawSpark(0, 0, size * 0.13 * pulse, T().accent, 0.85);
  CTX.restore();
}

/* ── background ─────────────────────────────────────────────────────────── */
var _deco = [];
var _starFar = null;
var _bgCache = null;
var _arenaCache = null;

function resetDeco() {
  _deco = [];
  _starFar = null;
  _bgCache = null;
  _arenaCache = null;
  _spriteCache = {};
  _spriteStamp = '';
  _grainPattern = null;
}

function ensureDeco() {
  if (_deco.length) return;
  var rnd = mulberry32(20260910);
  var i;
  for (i = 0; i < 42; i += 1) {
    _deco.push({
      x: rnd() * LAY.DW, y: rnd() * LAY.DH,
      r: 0.7 + rnd() * 1.5, ph: rnd() * TAU,
      sp: 0.5 + rnd() * 1.6, warm: rnd() < 0.28
    });
  }
  for (i = 0; i < 120; i += 1) {
    _deco.push({
      x: rnd() * LAY.DW, y: rnd() * LAY.DH,
      r: 0.5 + rnd() * 0.9, ph: rnd() * TAU,
      sp: 0.3 + rnd() * 0.9, warm: rnd() < 0.22, far: true
    });
  }
}

/** The far star layer never changes, so it is stamped once into a bitmap. */
function starFarBitmap() {
  if (_starFar && _starFar.stamp === spriteStamp()) return _starFar;
  var s = Math.max(0.5, LAY.scale * VIEW.dpr);
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(LAY.DW * s));
  c.height = Math.max(2, Math.ceil(LAY.DH * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  var theme = T();
  for (var i = 0; i < _deco.length; i += 1) {
    var d = _deco[i];
    if (!d.far) continue;
    g.globalAlpha = 0.30 + (d.warm ? 0.22 : 0);
    g.fillStyle = d.warm ? theme.starB : theme.starA;
    g.beginPath();
    g.arc(d.x, d.y, d.r, 0, TAU);
    g.fill();
  }
  _starFar = { canvas: c, stamp: spriteStamp() };
  return _starFar;
}

/* Everything in the background that never animates — the base gradient, the two
   nebulae, the far star field and the arena's paper grain — is composed once into a
   single viewport-sized bitmap. Rebuilding two full-screen radial gradients and a
   clipped pattern fill on every frame is the most expensive thing this renderer
   could do, and none of it changes between frames. Only the near stars still twinkle. */
/* The baked background holds only soft content (a gradient, two nebulae, small dots,
   noise), so it does not need the screen's full native density: compositing it at
   ~1.5x and letting the blit upscale is visually identical and keeps the bitmap small
   enough for a low-end Android WebView. Anything that must stay crisp — notably the
   arena border — is stroked live instead of being baked in. */
var BG_MAX_SCALE = 1.5;

function backgroundBitmap(arena) {
  var stamp = spriteStamp() + ':' + Math.round(VIEW.vw) + 'x' + Math.round(VIEW.vh) +
    ':' + Math.round((arena ? arena.w : 0)) + 'x' + Math.round((arena ? arena.h : 0));
  if (_bgCache && _bgCache.stamp === stamp) return _bgCache;

  var s = Math.max(0.5, Math.min(BG_MAX_SCALE, LAY.scale * VIEW.dpr));
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(VIEW.vw * s));
  c.height = Math.max(2, Math.ceil(VIEW.vh * s));
  var g = c.getContext('2d');
  /* One transform for the whole bitmap: CSS pixels cover the viewport, so the
     design-space parts below get a nested stage transform. */
  g.setTransform(s, 0, 0, s, 0, 0);
  var theme = T();

  var base = g.createLinearGradient(0, 0, 0, VIEW.vh);
  base.addColorStop(0, theme.bg[0]);
  base.addColorStop(1, theme.bg[1]);
  g.fillStyle = base;
  g.fillRect(0, 0, VIEW.vw, VIEW.vh);

  g.save();
  g.translate(LAY.stageX, LAY.stageY);
  g.scale(LAY.scale, LAY.scale);

  /* two soft nebulae so a large dark field is not perfectly flat */
  var n1 = g.createRadialGradient(LAY.DW * 0.22, LAY.DH * 0.20, 4, LAY.DW * 0.22, LAY.DH * 0.20, LAY.DW * 0.75);
  n1.addColorStop(0, rgba(theme.primary, 0.13));
  n1.addColorStop(1, rgba(theme.primary, 0));
  g.fillStyle = n1;
  g.fillRect(0, 0, LAY.DW, LAY.DH);
  var n2 = g.createRadialGradient(LAY.DW * 0.84, LAY.DH * 0.78, 4, LAY.DW * 0.84, LAY.DH * 0.78, LAY.DW * 0.7);
  n2.addColorStop(0, rgba(theme.well, 0.11));
  n2.addColorStop(1, rgba(theme.well, 0));
  g.fillStyle = n2;
  g.fillRect(0, 0, LAY.DW, LAY.DH);

  g.drawImage(starFarBitmap().canvas, 0, 0, LAY.DW, LAY.DH);

  /* the arena's paper grain and its faint ledge are static too */
  if (arena) {
    var ax = arena.x - 5, ay = arena.y - 5, aw = arena.w + 10, ah = arena.h + 10;
    roundRectOn(g, ax, ay, aw, ah, 14);
    g.fillStyle = 'rgba(255,255,255,0.035)';
    g.fill();
    var gi = assetImage('grain');
    if (gi) {
      try {
        if (!_grainPattern) _grainPattern = g.createPattern(gi, 'repeat');
        if (_grainPattern) {
          g.save();
          roundRectOn(g, ax, ay, aw, ah, 14);
          g.clip();
          g.globalAlpha = 0.07;
          g.fillStyle = _grainPattern;
          g.fillRect(ax, ay, aw, ah);
          g.restore();
        }
      } catch (e) { /* pattern unsupported: skip the texture */ }
    }
  }
  g.restore();

  _bgCache = { canvas: c, stamp: stamp };
  return _bgCache;
}

function drawBackground(t, time) {
  ensureDeco();
  var bg = backgroundBitmap(null);
  CTX.drawImage(bg.canvas, 0, 0, VIEW.vw, VIEW.vh);

  /* only the near stars animate */
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  var theme = T();
  for (var i = 0; i < _deco.length; i += 1) {
    var d = _deco[i];
    if (d.far) continue;
    var tw = 0.45 + 0.55 * (Math.sin(time * d.sp + d.ph) * 0.5 + 0.5);
    var ox = Math.sin(time * 0.11 + d.ph) * 3.2;
    var oy = Math.cos(time * 0.09 + d.ph) * 2.4;
    CTX.globalAlpha = tw;
    CTX.fillStyle = d.warm ? theme.starB : theme.starA;
    CTX.beginPath();
    CTX.arc(d.x + ox, d.y + oy, d.r, 0, TAU);
    CTX.fill();
  }
  CTX.globalAlpha = 1;
  CTX.restore();
}

/** Blit the pre-composed background (with the arena panel and grain baked in). */
function drawGameBackground(t, time, arena) {
  ensureDeco();
  var bg = backgroundBitmap(arena);
  CTX.drawImage(bg.canvas, 0, 0, VIEW.vw, VIEW.vh);
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  var theme = T();
  for (var i = 0; i < _deco.length; i += 1) {
    var d = _deco[i];
    if (d.far) continue;
    var tw = 0.45 + 0.55 * (Math.sin(time * d.sp + d.ph) * 0.5 + 0.5);
    CTX.globalAlpha = tw;
    CTX.fillStyle = d.warm ? theme.starB : theme.starA;
    CTX.beginPath();
    CTX.arc(d.x + Math.sin(time * 0.11 + d.ph) * 3.2, d.y + Math.cos(time * 0.09 + d.ph) * 2.4, d.r, 0, TAU);
    CTX.fill();
  }
  CTX.globalAlpha = 1;
  CTX.restore();
}

/** Paper grain, tiled from assets/grain.png - skipped entirely if unavailable. */
function drawGrain(x, y, w, h, alpha) {
  var img = assetImage('grain');
  if (!img) return;
  if (!_grainPattern) {
    try { _grainPattern = CTX.createPattern(img, 'repeat'); } catch (e) { _grainPattern = null; }
  }
  if (!_grainPattern) return;
  CTX.save();
  CTX.beginPath();
  CTX.rect(x, y, w, h);
  CTX.clip();
  CTX.globalAlpha = alpha === undefined ? 0.08 : alpha;
  CTX.fillStyle = _grainPattern;
  CTX.fillRect(x, y, w, h);
  CTX.restore();
}


/* ===== 10-ui.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §10  UI — immediate-mode hit regions, press feedback, toast, modal
   ═══════════════════════════════════════════════════════════════════════════ */

/* Regions are registered while drawing (design units), then hit-tested on input.
   Later registrations sit on top, so the lookup walks backwards. */
var HITS = [];
var PRESS = { id: null, x: 0, y: 0, t: 0, moved: false };
var TOAST = { text: '', t: 0, life: 0 };

function resetHits() { HITS.length = 0; }

function HIT(id, x, y, w, h) {
  HITS.push({ id: id, x: x, y: y, w: w, h: h });
  return { id: id, x: x, y: y, w: w, h: h };
}

function pickHit(x, y) {
  for (var i = HITS.length - 1; i >= 0; i -= 1) {
    var r = HITS[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
  }
  return null;
}

function isPressed(id) { return PRESS.id === id; }

function toast(text) {
  TOAST.text = text;
  TOAST.t = 0;
  TOAST.life = 1.8;
}

function drawToast(dt) {
  if (TOAST.life <= 0) return;
  TOAST.life -= dt;
  TOAST.t += dt;
  var p = clamp(TOAST.t / 0.22, 0, 1);
  var out = clamp(TOAST.life / 0.4, 0, 1);
  var a = Math.min(p, out);
  var y = LAY.contentBottom - 46 - (1 - easeOutCubic(p)) * 16;
  CTX.save();
  CTX.globalAlpha = a;
  setFont(14, '700');
  var w = Math.min(LAY.contentRight - LAY.contentLeft - 20, CTX.measureText(TOAST.text).width + 34);
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  withShadow('rgba(20,10,0,0.30)', 14, 0, 5, function () {
    fillRR(x, y, w, 34, 17, rgba(T().edge, 0.95));
  });
  TXT(TOAST.text, x + w / 2, y + 17.5, { size: 14, color: '#FFF6E6', maxW: w - 20 });
  CTX.restore();
}

/** Small round icon button (language switch, close, etc). */
function drawRoundButton(id, cx, cy, r, label, o) {
  var theme = T();
  var opts = o || {};
  var pressed = isPressed(id);
  var scale = pressed ? 0.93 : 1;
  CTX.save();
  CTX.translate(cx, cy);
  CTX.scale(scale, scale);
  withShadow('rgba(46,28,14,0.22)', 9, 0, 3, function () {
    CTX.beginPath();
    CTX.arc(0, 0, r, 0, TAU);
    CTX.fillStyle = opts.bg || (theme.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.78)');
    CTX.fill();
  });
  CTX.beginPath();
  CTX.arc(0, 0, r * 0.94, 0, TAU);
  CTX.strokeStyle = 'rgba(255,255,255,0.5)';
  CTX.lineWidth = 1.1;
  CTX.stroke();
  TXT(label, 0, 1, { size: opts.size || r * 0.86, color: opts.color || theme.text, weight: '800' });
  CTX.restore();
  HIT(id, cx - r, cy - r, r * 2, r * 2);
}

/** Screen header: back affordance on the left, centred title. */
function drawHeader(title, backId, time) {
  var cy = LAY.contentTop + 18;
  var theme = T();
  if (backId) {
    var r = 16;
    var cx = LAY.contentLeft + r;
    var pressed = isPressed(backId);
    CTX.save();
    CTX.translate(cx, cy);
    CTX.scale(pressed ? 0.93 : 1, pressed ? 0.93 : 1);
    withShadow('rgba(46,28,14,0.20)', 8, 0, 3, function () {
      CTX.beginPath();
      CTX.arc(0, 0, r, 0, TAU);
      CTX.fillStyle = theme.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.78)';
      CTX.fill();
    });
    CTX.beginPath();
    CTX.moveTo(4, -6); CTX.lineTo(-3, 0); CTX.lineTo(4, 6);
    CTX.strokeStyle = theme.text; CTX.lineWidth = 2.4; CTX.lineCap = 'round'; CTX.lineJoin = 'round';
    CTX.stroke();
    CTX.restore();
    HIT(backId, cx - r, cy - r, r * 2, r * 2);
  }
  TXT(title, (LAY.contentLeft + LAY.contentRight) / 2, cy, {
    size: 19, color: theme.text, maxW: LAY.contentRight - LAY.contentLeft - 80,
    shadow: { color: 'rgba(255,255,255,0.4)', blur: 3, oy: 1 }
  });
  return cy;
}

/** Modal card, centred. Returns the content rect. */
function drawModalCard(w, h, time) {
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  var y = (LAY.contentTop + LAY.contentBottom) / 2 - h / 2;
  CTX.fillStyle = 'rgba(20,12,6,0.42)';
  CTX.fillRect(-LAY.stageX / LAY.scale, -LAY.stageY / LAY.scale,
    VIEW.vw / LAY.scale, VIEW.vh / LAY.scale);
  var pop = time === undefined ? 1 : clamp(time / 0.22, 0, 1);
  CTX.save();
  CTX.translate(x + w / 2, y + h / 2);
  var s = 0.94 + 0.06 * easeOutBack(pop);
  CTX.scale(s, s);
  CTX.translate(-(x + w / 2), -(y + h / 2));
  drawCard(x, y, w, h, 20, { shadowBlur: 22 });
  CTX.restore();
  return { x: x, y: y, w: w, h: h };
}


/* ===== 11-scene-home.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §11  SCENE · HOME — level select, theme, launch, saved progress
   ═══════════════════════════════════════════════════════════════════════════ */

var HOME = {
  time: 0,

  draw: function (dt, time) {
    this.time += dt;
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;

    /* ── top bar: rules / about on the left, language and sound on the right ── */
    /* +4 keeps the round buttons fully inside the top guard band, not straddling it. */
    var barY = LAY.contentTop + 4;
    var barH = 28;
    var bw = 60;
    drawChip(L, barY, bw, barH, tr('home.rules'), isPressed('rules'), { size: 13 });
    HIT('rules', L, barY, bw, barH);
    drawChip(L + bw + 8, barY, bw, barH, tr('home.about'), isPressed('about'), { size: 13 });
    HIT('about', L + bw + 8, barY, bw, barH);

    drawRoundButton('lang', R - 15, barY + barH / 2, 15, tr('home.lang'), { size: 15 });
    drawRoundButton('sound', R - 15 - 38, barY + barH / 2, 15, SFX.isEnabled() ? '\u266A' : '\u2715', { size: 14 });

    /* ── title block ── */
    var markCY = barY + barH + 50;
    drawMark(cx, markCY, 108, this.time);
    TXT(tr('game.title'), cx, markCY + 70, {
      size: 40, grad: theme.titleGrad, maxW: W - 12,
      outline: { color: theme.titleEdge, width: 6 },
      shadow: { color: 'rgba(0,0,0,0.45)', blur: 8, oy: 3 },
      letterSpacing: '2px'
    });
    TXT(tr('game.subtitle'), cx, markCY + 98, {
      size: 13, color: theme.subtitle, maxW: W - 24, letterSpacing: '1.4px'
    });

    /* ── level select ── */
    var y = markCY + 118;
    TXT(tr('home.select'), L + 2, y, { size: 12, align: 'left', color: theme.muted });
    var stats = readStats();
    TXT(tr('home.cleared', { n: stats.cleared, m: levelCount() }), R - 2, y, {
      size: 12, align: 'right', color: theme.muted
    });
    y += 15;

    var cols = 4;
    var rows = 2;
    var gap = 8;
    var cw = (W - gap * (cols - 1)) / cols;
    var ch = 46;
    var total = levelCount();
    for (var i = 1; i <= total; i += 1) {
      var gi = (i - 1) % (cols * rows);
      var col = gi % cols;
      var row = Math.floor(gi / cols);
      this.levelChip(L + col * (cw + gap), y + row * (ch + gap), cw, ch, i, isUnlocked(i, stats), stats);
    }
    y += rows * ch + (rows - 1) * gap;

    /* ── theme ── */
    y += 13;
    TXT(tr('home.theme'), L + 2, y, { size: 12, align: 'left', color: theme.muted });
    y += 15;
    var tIds = themeIds();
    var tw = (W - gap * (tIds.length - 1)) / tIds.length;
    for (var t = 0; t < tIds.length; t += 1) {
      this.themeChip(L + t * (tw + gap), y, tw, 52, tIds[t]);
    }

    /* ── launch: pinned to the bottom so the empty space sits inside the layout
           rather than trailing underneath it ── */
    var playY = LAY.contentBottom - 60 - 32;
    var label = (stats.cleared > 0 && APP.settings.level > 1)
      ? tr('home.continue', { n: APP.settings.level })
      : tr('home.play');
    drawButton(L, playY, W, 60, label, isPressed('play'), { size: 22, letterSpacing: '4px' });
    HIT('play', L, playY, W, 60);

    /* ── saved progress ── */
    var line = stats.runs > 0
      ? tr('home.best', { n: stats.best }) + '   \u00b7   ' + tr('home.stats.runs', { n: stats.runs })
      : tr('home.stats.none');
    TXT(line, cx, Math.min(playY + 60 + 18, LAY.contentBottom - 4), {
      size: 12, color: theme.muted, maxW: W
    });
  },

  /* One level tile: number, name under it, a lock when it is still closed off. */
  levelChip: function (x, y, w, h, index, unlocked, stats) {
    var theme = T();
    var id = 'lvl:' + index;
    var on = Number(APP.settings.level) === index;
    var done = index <= stats.cleared;
    var def = levelDef(index);
    var pressed = isPressed(id);

    CTX.save();
    CTX.translate(x + w / 2, y + h / 2);
    var s = pressed ? 0.96 : 1;
    CTX.scale(s, s);
    CTX.translate(-(x + w / 2), -(y + h / 2));
    if (on) {
      withShadow(rgba(theme.primary, 0.55), 12, 0, 3, function () {
