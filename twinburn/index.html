        fillRR(x, y, w, h, 12, vGrad(x, y, w, h, theme.btnGrad[0], theme.btnGrad[1]));
      });
    } else {
      fillRR(x, y, w, h, 12, unlocked ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.04)');
      strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, 12, rgba(theme.edge, 0.9), 1.1);
    }
    CTX.restore();

    if (!unlocked) {
      /* a padlock glyph, drawn as a body plus a shackle */
      var lx = x + w / 2, ly = y + h / 2 + 1;
      fillRR(lx - 5, ly - 1, 10, 8, 2, rgba(theme.muted, 0.55));
      CTX.beginPath();
      CTX.arc(lx, ly - 2, 3.4, Math.PI, 0);
      CTX.strokeStyle = rgba(theme.muted, 0.55);
      CTX.lineWidth = 1.6;
      CTX.stroke();
      return;
    }

    TXT(String(index), x + 15, y + h / 2, {
      size: 19, color: on ? theme.btnText : theme.text, maxW: 24, weight: '800'
    });
    TXT(def ? levelName(def) : '', x + w - 8, y + h / 2, {
      size: 10, align: 'right', color: on ? theme.btnText : theme.muted, maxW: w - 26
    });
    if (done) {
      var bx = x + w - 7, by = y + 7;
      CTX.beginPath();
      CTX.arc(bx, by, 4.6, 0, TAU);
      CTX.fillStyle = on ? theme.btnText : theme.cell;
      CTX.fill();
      CTX.beginPath();
      CTX.moveTo(bx - 2.2, by);
      CTX.lineTo(bx - 0.6, by + 1.8);
      CTX.lineTo(bx + 2.4, by - 1.8);
      CTX.strokeStyle = on ? theme.btnGrad[1] : '#04140F';
      CTX.lineWidth = 1.6;
      CTX.lineCap = 'round';
      CTX.lineJoin = 'round';
      CTX.stroke();
    }
    HIT(id, x, y, w, h);
  },

  themeChip: function (x, y, w, h, id) {
    var on = getThemeId() === id;
    var theme = null;
    for (var i = 0; i < THEMES.length; i += 1) { if (THEMES[i].id === id) theme = THEMES[i]; }
    if (!theme) return;
    fillRR(x, y, w, h, 12, theme.bg[1]);
    /* the palette itself is the label: two swatches plus the ship pair */
    CTX.save();
    roundRectPath(x, y, w, h, 12);
    CTX.clip();
    for (var k = 0; k < 3; k += 1) {
      CTX.globalAlpha = 0.22;
      CTX.fillStyle = theme.starA;
      CTX.beginPath();
      CTX.arc(x + 12 + k * 26, y + h * 0.5, 1.4, 0, TAU);
      CTX.fill();
    }
    CTX.globalAlpha = 1;
    CTX.restore();
    drawShip(x + 20, y + h / 2, -Math.PI / 2, 0, { scale: 0.85 });
    drawShip(x + 40, y + h / 2, -Math.PI / 2, 1, { scale: 0.85 });
    TXT(themeName(theme), x + w - 10, y + h / 2, {
      size: 11.5, align: 'right', color: theme.text, maxW: w - 56
    });
    strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, 12, on ? theme.primary : rgba(theme.edge, 0.9), on ? 2.4 : 1.1);
    HIT('theme:' + id, x, y, w, h);
  },

  actions: {
    'lang': function () { setLang(getLang() === 'zh' ? 'en' : 'zh'); },
    'sound': function () { SFX.setEnabled(!SFX.isEnabled()); cfgSet('audio.enabled', SFX.isEnabled()); },
    'rules': function () { APP.go('rules'); },
    'about': function () { APP.go('about'); },
    'play': function () { APP.startLevel(APP.settings.level); }
  }
};

/* A level opens once the previous one has been cleared. Level 1 is always open,
   which is what keeps a fresh install playable with zero stored state. */
function isUnlocked(index, stats) {
  var s = stats || readStats();
  return Number(index) <= (Number(s.cleared) || 0) + 1;
}

/* Actions that carry a value, kept out of the flat map above. Every value is
   validated here so a malformed chip id can never corrupt the next run. */
function handleHomePick(id) {
  if (id.indexOf('lvl:') === 0) {
    var n = Number(id.slice(4));
    if (isFinite(n) && n >= 1 && n <= levelCount() && isUnlocked(n)) {
      APP.settings.level = n;
      SFX.click();
    }
    return true;
  }
  if (id.indexOf('theme:') === 0) {
    if (setThemeId(id.slice(6))) { resetDeco(); SFX.click(); }
    return true;
  }
  return false;
}


/* ===== 12-scene-play.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §12  SCENE · PLAY — the arena, the pointers, the tank, the pause modal
   ═══════════════════════════════════════════════════════════════════════════ */

var PLAY = {
  world: null,
  pointers: [],
  assign: { shipPointer: [], dist: [] },
  briefT: 0,
  paused: false,
  shake: 0,
  shakeT: 0,
  heartbeatT: 0,
  over: false,
  lowWarned: false,

  enter: function (opts) {
    PLAY.world = buildWorld(opts.index, opts.seed, arenaRect());
    PLAY.pointers = [];
    PLAY.assign = { shipPointer: [], dist: [] };
    PLAY.briefT = cfgGet('anim.briefSec', 1.25);
    PLAY.paused = false;
    PLAY.shake = 0;
    PLAY.heartbeatT = 0;
    PLAY.over = false;
    PLAY.lowWarned = false;
    SFX.setEngine(0);
    SFX.launch(0);
    SFX.launch(1);
  },

  exit: function () {
    SFX.setEngine(0);
    PLAY.pointers = [];
  },

  setPaused: function (on) {
    if (PLAY.over) return false;
    PLAY.paused = !!on;
    PLAY.pointers = [];
    PLAY.assign = { shipPointer: [], dist: [] };
    if (PLAY.paused) SFX.setEngine(0);
    return PLAY.paused;
  },

  /* ── simulation ───────────────────────────────────────────────────────── */
  update: function (dt) {
    var w = PLAY.world;
    if (!w) return;

    if (PLAY.shake > 0) PLAY.shake = Math.max(0, PLAY.shake - dt * 42);
    PLAY.shakeT += dt;

    if (PLAY.paused) { SFX.setEngine(0); return; }

    if (PLAY.briefT > 0) {
      PLAY.briefT -= dt;
      SFX.setEngine(0);
      stepParticles(w, dt);
      return;
    }

    if (w.status === 'playing') {
      var res = assignPointers(w.ships, PLAY.pointers, PLAY.assign,
        cfgGet('physics.assignHysteresisPx', 20));
      PLAY.assign = { shipPointer: res.shipPointer, dist: res.dist };
      stepWorld(w, res.aims, dt);
      PLAY.consume(w);

      /* engine note follows the live thrust so the tank is audible, not just visible */
      var level = 0, live = 0;
      for (var i = 0; i < w.ships.length; i += 1) {
        var s = w.ships[i];
        if (!s.alive || s.docked) continue;
        live += 1;
        level += s.ramp;
      }
      SFX.setEngine(live > 0 ? level / live : 0);

      /* low-fuel heartbeat: the last quarter of the tank is announced, not just shown */
      var ratio = w.fuelMax > 0 ? w.fuel / w.fuelMax : 0;
      if (ratio > 0 && ratio <= cfgGet('anim.lowFuelRatio', 0.25)) {
        PLAY.heartbeatT -= dt;
        if (PLAY.heartbeatT <= 0) { PLAY.heartbeatT = 1.2; SFX.lowFuel(); }
      }
    } else {
      SFX.setEngine(0);
      if (!PLAY.over) PLAY.over = true;
    }
    stepParticles(w, dt);
  },

  /* Physics reports what happened; the scene is the only layer allowed to make
     noise or throw sparks, which keeps the rules replayable in a bare harness. */
  consume: function (w) {
    for (var i = 0; i < w.events.length; i += 1) {
      var e = w.events[i];
      if (e.type === 'wall') {
        SFX.wall(e.speed);
        PLAY.shake = Math.min(7, PLAY.shake + e.speed / 42);
        spawnParticles(w, e.x, e.y, 5, shipLight(e.ship), 70, 0.32, 1.8);
      } else if (e.type === 'dock') {
        SFX.dock(e.precise);
        PLAY.shake = Math.min(9, PLAY.shake + (e.precise ? 6 : 4));
        spawnParticles(w, e.x, e.y, e.precise ? 26 : 16, shipLight(e.ship), 130, 0.6, 2.4);
        if (e.precise) spawnParticles(w, e.x, e.y, 10, T().accent, 90, 0.8, 2.8);
      } else if (e.type === 'cell') {
        SFX.cell();
        spawnParticles(w, e.x, e.y, 14, T().cell, 95, 0.5, 2.2);
      } else if (e.type === 'crash') {
        SFX.crash();
        PLAY.shake = 15;
        spawnParticles(w, e.x, e.y, 30, shipColor(e.ship), 190, 0.85, 3.0);
        spawnParticles(w, e.x, e.y, 14, '#FFFFFF', 130, 0.4, 2.2);
        SFX.setEngine(0);
      } else if (e.type === 'fail' && e.reason === 'fuel') {
        SFX.fuelOut();
      } else if (e.type === 'clear') {
        SFX.win();
      }
    }
    w.events.length = 0;
  },

  /* ── drawing ──────────────────────────────────────────────────────────── */
  draw: function (dt, time) {
    var w = PLAY.world;
    if (!w) return;
    var theme = T();
    var rx = w.rect.x, ry = w.rect.y, rw = w.rect.w, rh = w.rect.h;

    /* The field's ledge and grain are baked into the background bitmap, but its border
       must stay crisp at native density — it is the collision boundary, so it is stroked
       live rather than upscaled with the soft layers. */
    strokeRR(rx - 5, ry - 5, rw + 10, rh + 10, 14, rgba(theme.edge, 0.85), 1.4);

    /* Only the moving parts shake: a jolt must never make the player lose track of
       where the walls are. */
    CTX.save();
    if (PLAY.shake > 0.2) {
      CTX.translate(Math.sin(PLAY.shakeT * 61) * PLAY.shake, Math.cos(PLAY.shakeT * 53) * PLAY.shake);
    }

    var i;
    for (i = 0; i < w.wells.length; i += 1) drawWell(w.wells[i], time);

    for (i = 0; i < w.cells.length; i += 1) {
      if (!w.cells[i].taken) drawCell(w.cells[i], time);
    }

    for (i = 0; i < w.gates.length; i += 1) drawGate(w.gates[i], time);

    for (i = 0; i < w.rocks.length; i += 1) drawRock(w.rocks[i]);

    /* tether lines first, so a hull always sits on top of its own beam */
    if (!PLAY.paused && PLAY.briefT <= 0) {
      for (i = 0; i < w.ships.length; i += 1) {
        var sh = w.ships[i];
        if (!sh.alive || sh.docked) continue;
        var aim = PLAY.aimFor(i);
        if (!aim) continue;
        PLAY.drawTether(sh, aim, i, time);
      }
    }

    for (i = 0; i < w.ships.length; i += 1) {
      var s = w.ships[i];
      if (!s.alive) continue;
      PLAY.drawTrail(s, i);
      if (s.docked) {
        drawShip(s.x, s.y, -Math.PI / 2, i, { scale: 0.85 });
      } else {
        var ang = Math.sqrt(s.vx * s.vx + s.vy * s.vy) > 3 ? Math.atan2(s.vy, s.vx) + Math.PI / 2 : -Math.PI / 2;
        drawExhaust(s.x, s.y, ang, i, s.ramp, 1);
        drawShip(s.x, s.y, ang, i, {});
      }
    }

    drawParticles(w);
    CTX.restore();

    PLAY.drawHud(w, time);
    PLAY.drawHint(w, time);
    if (PLAY.briefT > 0) PLAY.drawBrief(w);
    if (PLAY.paused) PLAY.drawPause(w);
  },

  aimFor: function (i) {
    var w = PLAY.world;
    if (!w) return null;
    var pid = PLAY.assign.shipPointer[i];
    if (pid === null || pid === undefined) return null;
    for (var k = 0; k < PLAY.pointers.length; k += 1) {
      if (PLAY.pointers[k].id === pid) return PLAY.pointers[k];
    }
    return null;
  },

  drawTrail: function (s, i) {
    var n = s.trail.length;
    if (n < 2) return;
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.lineCap = 'round';
    for (var k = n - 1; k > 0; k -= 1) {
      var a = s.trail[k], b = s.trail[k - 1];
      var t = 1 - k / n;
      CTX.globalAlpha = t * t * 0.42;
      CTX.strokeStyle = shipColor(i);
      CTX.lineWidth = 0.6 + t * 3.4;
      CTX.beginPath();
      CTX.moveTo(a.x, a.y);
      CTX.lineTo(b.x, b.y);
      CTX.stroke();
    }
    CTX.restore();
  },

  drawTether: function (sh, aim, i, time) {
    var dx = aim.x - sh.x, dy = aim.y - sh.y;
    var len = Math.sqrt(dx * dx + dy * dy);
    if (len < cfgGet('physics.deadZonePx', 24)) return;
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    CTX.beginPath();
    CTX.moveTo(sh.x, sh.y);
    CTX.lineTo(aim.x, aim.y);
    CTX.setLineDash([5, 6]);
    CTX.lineDashOffset = -time * 26;
    CTX.strokeStyle = rgba(shipLight(i), 0.55);
    CTX.lineWidth = 1.6;
    CTX.stroke();
    CTX.setLineDash([]);
    CTX.beginPath();
    CTX.arc(aim.x, aim.y, 9 + 2.4 * Math.sin(time * 6), 0, TAU);
    CTX.strokeStyle = rgba(shipLight(i), 0.75);
    CTX.lineWidth = 1.4;
    CTX.stroke();
    CTX.restore();
  },

  drawHud: function (w, time) {
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var top = LAY.contentTop + 4;
    var ratio = w.fuelMax > 0 ? Math.max(0, w.fuel / w.fuelMax) : 0;
    var low = ratio > 0 && ratio <= cfgGet('anim.lowFuelRatio', 0.25);
    var dead = ratio <= 0;

    /* Row 1: level identity on the left, hull status and the pause control on the
       right. The pips stop short of the button so nothing ever overlaps it. */
    TXT(tr('hud.level', { n: w.level }), L + 1, top + 12, {
      size: 12, align: 'left', color: theme.muted, maxW: 60
    });
    TXT(levelName(w.def), L + 56, top + 12, {
      size: 12.5, align: 'left', color: theme.text, maxW: R - L - 108
    });
    for (var i = 0; i < w.ships.length; i += 1) {
      var px = R - 40 - i * 17;
      var py = top + 12;
      var s = w.ships[i];
      CTX.beginPath();
      CTX.arc(px, py, 6, 0, TAU);
      CTX.fillStyle = s.docked ? shipColor(i) : 'rgba(255,255,255,0.10)';
      CTX.fill();
      CTX.strokeStyle = rgba(shipLight(i), s.docked ? 0.95 : 0.55);
      CTX.lineWidth = 1.3;
      CTX.stroke();
    }
    drawRoundButton('pause', R - 15, top + 12, 14, 'II', { size: 11.5 });

    /* Row 2: the fuel bar — the one linear resource, always full width and always
       in the same place, because comparing two lengths beats comparing two dials. */
    var barX = L;
    var barW = R - L;
    var barY = top + 26;
    var barH = 13;
    var pulse = low ? (0.55 + 0.45 * Math.sin(time * 7)) : 1;
    fillRR(barX, barY, barW, barH, barH / 2, 'rgba(255,255,255,0.10)');
    if (ratio > 0) {
      CTX.save();
      roundRectPath(barX, barY, barW, barH, barH / 2);
      CTX.clip();
      var bw = Math.max(barH, barW * ratio);
      CTX.globalAlpha = pulse;
      fillRR(barX, barY, bw, barH, barH / 2, vGrad(barX, barY, bw, barH, theme.cell, rgba(theme.cell, 0.7)));
      CTX.restore();
    }
    strokeRR(barX + 0.5, barY + 0.5, barW - 1, barH - 1, barH / 2, rgba(theme.edge, 0.95), 1.1);
    TXT(tr('hud.fuel'), barX + 8, barY + barH / 2 + 0.5, {
      size: 9.5, align: 'left', color: 'rgba(255,255,255,0.9)', maxW: 40
    });
    if (low && !dead) {
      TXT(tr('hud.low'), barX + barW / 2, barY + barH / 2 + 0.5, {
        size: 10, color: '#FFFFFF', alpha: pulse, maxW: barW - 120
      });
    }
    TXT(Math.round(ratio * 100) + '%', barX + barW - 8, barY + barH / 2 + 0.5, {
      size: 10.5, align: 'right', color: '#FFFFFF', maxW: 44
    });
  },

  hintText: function (w) {
    if (w.t < 9) return levelTeach(w.def);
    if (w.t < 15) return tr('play.hint.two');
    return tr('play.hint.soft');
  },

  drawHint: function (w, time) {
    /* The brief card already states the rule verbatim, so repeating it underneath
       for the first second just reads as a duplicate line. */
    if (PLAY.briefT > 0) return;
    var y = LAY.contentBottom - cfgGet('arena.hintHeight', 26) / 2;
    TXT(PLAY.hintText(w), (LAY.contentLeft + LAY.contentRight) / 2, y, {
      size: 10.5, color: rgba(T().muted, 0.95), maxW: LAY.contentRight - LAY.contentLeft - 8
    });
  },

  drawBrief: function (w) {
    var theme = T();
    var L = LAY.contentLeft, R = LAY.contentRight;
    var W = R - L;
    var p = clamp(1 - PLAY.briefT / cfgGet('anim.briefSec', 1.25), 0, 1);
    var alpha = Math.min(1, p * 3.2) * Math.min(1, PLAY.briefT / 0.25);
    var h = 168;
    var y = (LAY.contentTop + LAY.contentBottom) / 2 - h / 2;
    CTX.save();
    CTX.globalAlpha = alpha;
    CTX.fillStyle = 'rgba(2,6,14,0.55)';
    CTX.fillRect(-LAY.stageX / LAY.scale, -LAY.stageY / LAY.scale,
      VIEW.vw / LAY.scale, VIEW.vh / LAY.scale);
    var pop = easeOutBack(p);
    CTX.translate((L + R) / 2, y + h / 2);
    CTX.scale(0.92 + 0.08 * pop, 0.92 + 0.08 * pop);
    CTX.translate(-(L + R) / 2, -(y + h / 2));
    drawCard(L, y, W, h, 18, { shadowBlur: 20 });
    TXT(tr('brief.level', { n: w.level }), (L + R) / 2, y + 26, {
      size: 12.5, color: theme.muted, letterSpacing: '2px'
    });
    TXT(levelName(w.def), (L + R) / 2, y + 52, {
      size: 24, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 5 }
    });
    paragraph(levelTeach(w.def), (L + R) / 2, y + 68, W - 44, {
      size: 11.5, color: theme.text, align: 'center', lineHeight: 1.5
    });
    var pulse = 0.6 + 0.4 * Math.sin(PLAY.shakeT * 6);
    TXT(tr('brief.tap'), (L + R) / 2, y + h - 22, {
      size: 12, color: theme.accent, alpha: pulse, maxW: W - 40, letterSpacing: '1.5px'
    });
    CTX.restore();
  },

  drawPause: function (w) {
    var theme = T();
    var L = LAY.contentLeft, R = LAY.contentRight;
    var W = R - L;
    var h = 236;
    var card = drawModalCard(W, h, 0.2);
    var x = card.x, y = card.y;
    TXT(tr('play.paused'), x + W / 2, y + 34, {
      size: 24, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 5 }
    });
    TXT(tr('play.quit.hint'), x + W / 2, y + 60, { size: 11, color: theme.muted, maxW: W - 40 });
    var bw = W - 44;
    drawButton(x + 22, y + 78, bw, 48, tr('play.resume'), isPressed('resume'), { size: 18 });
    HIT('resume', x + 22, y + 78, bw, 48);
    drawChip(x + 22, y + 134, bw, 40, tr('play.restart'), isPressed('restart'), { size: 15 });
    HIT('restart', x + 22, y + 134, bw, 40);
    drawChip(x + 22, y + 180, bw, 40, tr('play.quit'), isPressed('quit'), { size: 15 });
    HIT('quit', x + 22, y + 180, bw, 40);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  inArena: function (x, y) {
    var w = PLAY.world;
    if (!w) return false;
    return x >= w.rect.x && x <= w.rect.x + w.rect.w && y >= w.rect.y && y <= w.rect.y + w.rect.h;
  },

  down: function (x, y, pid) {
    if (PLAY.paused) return;
    if (PLAY.briefT > 0) return;              /* the brief swallows the first tap */
    if (PLAY.over) return;
    if (!PLAY.inArena(x, y)) return;
    var id = pid === undefined ? 'mouse' : pid;
    for (var i = 0; i < PLAY.pointers.length; i += 1) {
      if (PLAY.pointers[i].id === id) { PLAY.pointers[i].x = x; PLAY.pointers[i].y = y; return; }
    }
    PLAY.pointers.push({ id: id, x: x, y: y });
  },

  move: function (x, y, pid) {
    var id = pid === undefined ? 'mouse' : pid;
    for (var i = 0; i < PLAY.pointers.length; i += 1) {
      if (PLAY.pointers[i].id === id) { PLAY.pointers[i].x = x; PLAY.pointers[i].y = y; return; }
    }
  },

  /* Returns true when the tap was consumed (the brief is modal: it swallows the
     first tap whole, so skipping it can never also press whatever is underneath). */
  up: function (x, y, pid) {
    if (PLAY.briefT > 0) { PLAY.briefT = 0; return true; }
    var id = pid === undefined ? 'mouse' : pid;
    for (var i = PLAY.pointers.length - 1; i >= 0; i -= 1) {
      if (PLAY.pointers[i].id === id) PLAY.pointers.splice(i, 1);
    }
    return false;
  },

  actions: {
    'pause': function () { PLAY.setPaused(true); },
    'resume': function () { PLAY.setPaused(false); },
    'restart': function () { APP.restartLevel(); },
    'quit': function () { APP.go('home'); }
  }
};


/* ===== 13-scene-result.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §13  SCENE · RESULT — outcome, rating, breakdown, and the restart entry point
   ═══════════════════════════════════════════════════════════════════════════ */

var RS = {
  data: null,
  t: 0,
  starT: 0,
  best: false,

  enter: function (opts) {
    var w = opts.world;
    var score = levelScore(w);
    var cleared = w.status === 'clear';
    var last = w.level >= levelCount();
    var stats = readStats();

    RS.t = 0;
    RS.starT = 0;
    RS.best = false;

    stats.runs = (stats.runs || 0) + 1;
    if (cleared) {
      if (w.level > stats.cleared) stats.cleared = w.level;
      if (score.total > (stats.bestLevel || 0)) stats.bestLevel = score.total;
      APP.run.score += score.total;
      APP.run.clearedLevels += 1;
    }
    var campaignDone = cleared && last;
    if (campaignDone) {
      if (APP.run.score > (stats.best || 0)) { stats.best = APP.run.score; RS.best = true; }
    }
    writeStats(stats);

    RS.data = {
      level: w.level,
      def: w.def,
      status: w.status,
      reason: w.reason,
      score: score,
      cleared: cleared,
      last: last,
      campaignDone: campaignDone,
      runScore: APP.run.score,
      clearedLevels: APP.run.clearedLevels,
      time: w.t,
      cells: w.cellsTaken,
      precision: w.softDocks,
      ships: w.ships.length,
      stats: stats
    };

    if (campaignDone) SFX.win();
    else if (cleared) SFX.dock(w.softDocks >= w.ships.length);
    else if (w.reason === 'crash') SFX.crash();
    else SFX.fuelOut();
  },

  exit: function () {},

  headline: function () {
    var d = RS.data;
    if (d.campaignDone) return tr('result.campaign');
    if (d.status === 'clear') return tr('result.clear');
    return tr(d.reason === 'fuel' ? 'result.fuelout' : 'result.crash');
  },

  reasonText: function () {
    var d = RS.data;
    if (d.campaignDone) return tr('result.of', { n: d.clearedLevels, m: levelCount() });
    if (d.status === 'clear') return tr('result.reason.docked');
    return tr('result.reason.' + (d.reason === 'fuel' ? 'fuel' : 'crash'));
  },

  draw: function (dt, time) {
    RS.t += dt;
    if (RS.data.cleared) RS.starT += dt;
    var d = RS.data;
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;
    var pop = clamp(RS.t / 0.3, 0, 1);

    /* ── ribbon ── */
    var ribY = LAY.contentTop + 6;
    var ribH = 62;
    CTX.save();
    CTX.translate(cx, ribY + ribH / 2);
    var s = 0.9 + 0.1 * easeOutBack(pop);
    CTX.scale(s, s);
    CTX.translate(-cx, -(ribY + ribH / 2));
    var grad = d.cleared
      ? [theme.btnGrad[0], theme.btnGrad[1]]
      : [rgba(theme.warn, 1), 'rgba(120,26,20,1)'];
    withShadow('rgba(0,0,0,0.42)', 18, 0, 6, function () {
      fillRR(L - 2, ribY, W + 4, ribH, 16, vGrad(L, ribY, W + 4, ribH, grad[0], grad[1]));
    });
    roundRectPath(L + 1, ribY + 1, W - 2, ribH * 0.44, 14);
    CTX.strokeStyle = 'rgba(255,255,255,0.3)';
    CTX.lineWidth = 1.4;
    CTX.stroke();
    TXT(RS.headline(), cx, ribY + ribH / 2 - 5, {
      size: 25, color: '#FFFFFF', maxW: W - 26, letterSpacing: '1.6px',
      shadow: { color: 'rgba(0,0,0,0.35)', blur: 4, oy: 2 }
    });
    TXT(RS.reasonText(), cx, ribY + ribH / 2 + 18, {
      size: 11, color: 'rgba(255,255,255,0.92)', maxW: W - 26
    });
    CTX.restore();

    var y = ribY + ribH + 12;

    /* ── score panel ── */
    var panelH = d.cleared ? 156 : 118;
    drawCard(L, y, W, panelH, 16, { shadowBlur: 10 });

    if (d.cleared) {
      /* three stars, lit in sequence so a 3-star clear lands like a reward */
      var stars = d.score.stars;
      var step = 40;
      for (var i = 0; i < 3; i += 1) {
        var on = i < stars && RS.starT > 0.18 * (i + 1);
        RS.drawStar(cx + (i - 1) * step, y + 28, 15, on, i);
      }
    }

    TXT(tr('result.score'), cx, y + (d.cleared ? 56 : 22), { size: 11.5, color: theme.muted });
    TXT(String(d.score.total), cx, y + (d.cleared ? 84 : 52), {
      size: d.cleared ? 38 : 34, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 4.5 }
    });

    /* breakdown rows */
    var rows = [];
    rows.push([tr('result.stat.fuel'), Math.round(d.score.fuelRatio * 100) + '%  (+' + d.score.fuel + ')']);
    rows.push([tr('result.stat.dock'), d.precision + '/' + d.ships + '  (+' + d.score.dock + ')']);
    rows.push([tr('result.stat.cells'), String(d.cells) + '  (+' + d.score.cells + ')']);
    var rowTop = y + (d.cleared ? 104 : 72);
    for (var k = 0; k < rows.length; k += 1) {
      var ry = rowTop + k * 16;
      TXT(rows[k][0], L + 14, ry, { size: 11.5, align: 'left', color: theme.muted, maxW: W * 0.5 });
      TXT(rows[k][1], R - 14, ry, { size: 12, align: 'right', color: theme.text });
    }
    y += panelH + 10;

    /* ── best / run line ── */
    var line;
    if (d.campaignDone) {
      line = RS.best ? tr('result.newbest') : tr('result.best', { n: d.stats.best });
    } else {
      line = tr('result.total') + ' ' + d.runScore + '   \u00b7   ' + tr('result.runs', { n: d.stats.runs });
    }
    TXT(line, cx, y + 8, {
      size: 12, color: d.campaignDone && RS.best ? theme.accent : theme.muted, maxW: W
    });
    y += 24;

    /* ── actions ── */
    var btnH = 50;
    var chipH = 36;
    var gap = 8;
    var needed = btnH + gap + chipH + gap + chipH;
    var top = Math.min(y, LAY.contentBottom - needed);

    if (d.cleared) {
      if (d.campaignDone) {
        drawButton(L, top, W, btnH, tr('result.restart'), isPressed('restart'), { size: 18, letterSpacing: '1.5px' });
        HIT('restart', L, top, W, btnH);
        drawChip(L, top + btnH + gap, W, chipH, tr('result.home'), isPressed('home'), { size: 14 });
        HIT('home', L, top + btnH + gap, W, chipH);
      } else {
        drawButton(L, top, W, btnH, tr('result.next'), isPressed('next'), { size: 19, letterSpacing: '2px' });
        HIT('next', L, top, W, btnH);
        drawChip(L, top + btnH + gap, W, chipH, tr('result.retry'), isPressed('retry'), { size: 14 });
        HIT('retry', L, top + btnH + gap, W, chipH);
        drawChip(L, top + btnH + gap + chipH + gap, W, chipH, tr('result.home'), isPressed('home'), { size: 14 });
        HIT('home', L, top + btnH + gap + chipH + gap, W, chipH);
      }
    } else {
      drawButton(L, top, W, btnH, tr('result.retry'), isPressed('retry'), { size: 20, letterSpacing: '2px' });
      HIT('retry', L, top, W, btnH);
      drawChip(L, top + btnH + gap, W, chipH, tr('result.home'), isPressed('home'), { size: 14 });
      HIT('home', L, top + btnH + gap, W, chipH);
    }
  },

  /* Five-pointed star; unlit stars sit as outlines so the goal is visible, and an
     earned one punches in with an overshoot rather than just appearing. */
  drawStar: function (cx, cy, r, on, index) {
    var theme = T();
    var rr = r;
    if (on) {
      var grow = clamp((RS.starT - 0.18 * (index + 1)) * 6, 0, 1);
      rr = r * (0.55 + 0.45 * easeOutBack(Math.max(0.001, grow)));
    }
    CTX.save();
    CTX.translate(cx, cy);
    CTX.beginPath();
    for (var i = 0; i < 10; i += 1) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? rr : rr * 0.44;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) CTX.moveTo(px, py); else CTX.lineTo(px, py);
    }
    CTX.closePath();
    if (on) {
      withShadow(rgba(theme.accent, 0.7), 12, 0, 2, function () {
        CTX.fillStyle = theme.accent;
        CTX.fill();
      });
      CTX.strokeStyle = 'rgba(255,255,255,0.85)';
      CTX.lineWidth = 1.4;
      CTX.stroke();
    } else {
      CTX.strokeStyle = rgba(theme.muted, 0.5);
      CTX.lineWidth = 1.4;
      CTX.stroke();
    }
    CTX.restore();
  },

  actions: {
    'retry': function () { APP.restartLevel(); },
    'next': function () { APP.nextLevel(); },
    'restart': function () { APP.startCampaign(); },
    'home': function () { APP.go('home'); }
  }
};


/* ===== 14-scene-legal.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §14  SCENE · RULES / ABOUT + the first-launch agreement
   ═══════════════════════════════════════════════════════════════════════════ */

/* A miniature of the real thing: two hulls tethered to a finger point, a patrolling
   rock, a well and a partly drained tank. Drawn with the same functions the arena
   uses, so the diagram can never drift away from how the game actually looks. */
function drawRulesDiagram(x, y, w, h, time) {
  var theme = T();
  var R = { x: x, y: y, w: w, h: h };
  drawCard(x, y, w, h, 16, { shadowBlur: 8 });
  CTX.save();
  roundRectPath(x, y, w, h, 16);
  CTX.clip();
  drawGrain(x, y, w, h, 0.07);

  var cy = y + h * 0.56;
  /* well, bottom left */
  var well = { x: x + w * 0.20, y: cy + h * 0.20, r: h * 0.34, pull: 40, id: 0 };
  drawWell(well, time);

  /* two gates along the top */
  drawGate({ x: x + w * 0.22, y: y + h * 0.24, r: 13, shipId: 0, shape: 'ring', t: time, flash: 0 }, time);
  drawGate({ x: x + w * 0.78, y: y + h * 0.24, r: 13, shipId: 1, shape: 'tri', t: time, flash: 0 }, time);

  /* a patrolling rock */
  var tt = (Math.sin(time * 0.8) * 0.5 + 0.5);
  var rock = {
    x: x + w * (0.52 + 0.16 * tt), y: cy + h * 0.04, r: 11, rot: time * 0.4,
    verts: [1.0, 0.9, 1.05, 0.92, 1.0, 0.88, 1.02, 0.94, 1.0]
  };
  drawRock(rock);

  /* hull A with its tether to the finger */
  var ax = x + w * 0.30, ay = cy + h * 0.16;
  var tx = x + w * 0.44, ty = y + h * 0.60;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  CTX.beginPath();
  CTX.moveTo(ax, ay);
  CTX.lineTo(tx, ty);
  CTX.setLineDash([5, 6]);
  CTX.lineDashOffset = -time * 26;
  CTX.strokeStyle = rgba(shipLight(0), 0.6);
  CTX.lineWidth = 1.6;
  CTX.stroke();
  CTX.setLineDash([]);
  CTX.beginPath();
  CTX.arc(tx, ty, 8 + 2 * Math.sin(time * 6), 0, TAU);
  CTX.strokeStyle = rgba(shipLight(0), 0.8);
  CTX.lineWidth = 1.4;
  CTX.stroke();
  CTX.restore();
  drawExhaust(ax, ay, 2.2, 0, 0.8, 0.9);
  drawShip(ax, ay, 2.2, 0, {});
  drawShip(x + w * 0.70, cy + h * 0.10, -0.6, 1, {});

  /* the shared tank, right where the HUD puts it */
  var bx = x + 14, by = y + h - 18, bw = w - 28, bh = 11;
  fillRR(bx, by, bw, bh, bh / 2, 'rgba(255,255,255,0.12)');
  fillRR(bx, by, bw * 0.46, bh, bh / 2, theme.cell);
  strokeRR(bx + 0.5, by + 0.5, bw - 1, bh - 1, bh / 2, rgba(theme.edge, 0.95), 1);
  TXT(tr('hud.fuel'), bx + 7, by + bh / 2 + 0.5, {
    size: 8.5, align: 'left', color: 'rgba(255,255,255,0.9)', maxW: 50
  });
  CTX.restore();
}

var RULES = {
  draw: function (dt, time) {
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var y = drawHeader(tr('rules.title'), 'back', time) + 24;

    var dh = 78;
    drawRulesDiagram(L, y, W, dh, time);
    y += dh + 12;

    var sections = [
      [tr('rules.goal.h'), [tr('rules.goal.b')]],
      [tr('rules.hold.h'), [tr('rules.hold.b')]],
      [tr('rules.tank.h'), [tr('rules.tank.b')]],
      [tr('rules.hazard.h'), [tr('rules.hazard.b')]],
      [tr('rules.dock.h'), [tr('rules.dock.b')]]
    ];
    var bodySize = 11.5;
    var headStep = 20;

    var avail = LAY.contentBottom - 62 - y;
    var total = 0;
    var i, pi;
    for (i = 0; i < sections.length; i += 1) {

    }
    total += paragraphHeight(tr('rules.tip'), maxW, 11, '700', 1.45) + 14;
    /* Shrink rather than clip if the copy runs long in either language. */
    var scale = total > avail ? Math.max(0.7, avail / total) : 1;

    /* +18 leaves real breathing room under the last line: the descenders of a
       final glyph otherwise sit right on the card edge. */
    var cardH = total * scale + 18;
    drawCard(L, y, W, cardH, 16, { shadowBlur: 8 });
    var cursor = y + 6;
    for (i = 0; i < sections.length; i += 1) {
      drawSpark(L + 15, cursor + 10, 5, theme.primary, 0.95);
      TXT(sections[i][0], L + 26, cursor + 10, {
        size: 12.5 * scale, align: 'left', color: theme.text, maxW: maxW
      });
      cursor += headStep * scale;
      for (pi = 0; pi < sections[i][1].length; pi += 1) {
        cursor += paragraph(sections[i][1][pi], L + 14, cursor, maxW, {
          size: bodySize * scale, color: theme.muted, lineHeight: 1.45
        });
      }
      cursor += 7 * scale;
    }
    cursor += paragraph(tr('rules.tip'), L + 14, cursor, maxW, {
      size: 11 * scale, weight: '700', color: theme.accent, lineHeight: 1.45
    });
    y += cardH + 10;

    var by = Math.min(y, LAY.contentBottom - 46);
    drawButton(L, by, W, 46, tr('rules.back'), isPressed('back'), { size: 17 });
    HIT('back', L, by, W, 46);
  },
  actions: { 'back': function () { APP.go('home'); } }
};

var ABOUT = {

    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;

    /* app icon + store cover, both loaded through window.lib.getAsset */
    var ih = 66;

    CTX.restore();

    var tx = ix + totalW + 12;

    TXT(tr('game.subtitle'), tx, y + 44, { size: 12, align: 'left', color: theme.muted, maxW: R - tx });
    TXT(tr('about.version', { v: APP_VERSION }), tx, y + 60, {

    });

      [tr('about.original.h'), tr('about.original.b')],

    ];
    var bodySize = 11.5;
    var maxW = W - 30;
    var avail = LAY.contentBottom - 68 - y;
    var total = 0;
    for (var i = 0; i < blocks.length; i += 1) {
      total += 22 + paragraphHeight(blocks[i][1], maxW, bodySize, '500', 1.45) + 8;
    }
    var scale = total > avail ? Math.max(0.7, avail / total) : 1;
    var cardH = total * scale + 22;
    drawCard(L, y, W, cardH, 16, { shadowBlur: 8 });
    var cursor = y + 8;
    for (var b = 0; b < blocks.length; b += 1) {
      drawSpark(L + 15, cursor + 11, 5, theme.primary, 0.95);
      TXT(blocks[b][0], L + 26, cursor + 11, {
        size: 13 * scale, align: 'left', color: theme.text, maxW: maxW
      });
      cursor += 22 * scale;
      cursor += paragraph(blocks[b][1], L + 14, cursor, maxW, {
        size: bodySize * scale, color: theme.muted, lineHeight: 1.45
      });
      cursor += 8 * scale;
    }
    y += cardH + 12;

    var wipeY = Math.min(y, LAY.contentBottom - 46 - 40);
    drawChip(L, wipeY, W, 34, tr('about.wipe'), isPressed('wipe'), { size: 13 });
    HIT('wipe', L, wipeY, W, 34);
    drawButton(L, wipeY + 40, W, 46, tr('about.back'), isPressed('back'), { size: 17 });
    HIT('back', L, wipeY + 40, W, 46);
  },
  actions: {
    'back': function () { APP.go('home'); },
    'wipe': function () {
      STORE.set('stats', null);
      STORE.set('lang', '');
      STORE.set('theme', '');
      _lang = null;
      _themeId = null;
      resetDeco();

};

/* ── first-launch agreement (compliance: modal, explicit consent) ────────── */
function drawAgreement(dt, time) {
  var theme = T();
  var W = Math.min(312, LAY.contentRight - LAY.contentLeft);
  var body = [tr('agree.body1'), tr('agree.body2'), tr('agree.body3'), tr('agree.body4')];
  var maxW = W - 32;
  var size = 11.5;
  var total = 0;
  var i;
  for (i = 0; i < body.length; i += 1) total += paragraphHeight(body[i], maxW, size, '500', 1.5) + 8;
  var H = 74 + total + 62;
  var card = drawModalCard(W, H, APP.agreeT);
  var x = card.x;
  var y = card.y;

  TXT(tr('agree.title'), x + W / 2, y + 28, { size: 19, color: theme.text, maxW: W - 30 });
  var rule = CTX.createLinearGradient(x + 24, 0, x + W - 24, 0);
  rule.addColorStop(0, rgba(theme.primary, 0));
  rule.addColorStop(0.5, rgba(theme.primary, 0.85));
  rule.addColorStop(1, rgba(theme.primary, 0));
  CTX.fillStyle = rule;
  CTX.fillRect(x + 24, y + 44, W - 48, 1.6);

  var cursor = y + 54;
  for (i = 0; i < body.length; i += 1) {
    cursor += paragraph(body[i], x + 16, cursor, maxW, { size: size, color: theme.muted, lineHeight: 1.5 });
    cursor += 8;
  }
  var by = y + H - 54;
  drawButton(x + 20, by, W - 40, 44, tr('agree.ok'), isPressed('agree'), { size: 18, letterSpacing: '3px' });
  HIT('agree', x + 20, by, W - 40, 44);
}


/* ===== 15-app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §15  APP — scenes, input routing, main loop, saved progress, boot
   ═══════════════════════════════════════════════════════════════════════════ */

var APP_VERSION = "1.0.0";

/* ── saved progress (only ever a handful of numbers) ─────────────────────── */
function readStats() {
  var s = STORE.get('stats', null);
  var out = { best: 0, bestLevel: 0, cleared: 0, runs: 0 };
  if (isObj(s)) {
    for (var k in out) {
      if (Object.prototype.hasOwnProperty.call(s, k) && typeof s[k] === 'number' && isFinite(s[k]) && s[k] >= 0) {
        out[k] = Math.floor(s[k]);
      }
    }
  }
  /* A stored cleared count can never exceed the levels that exist: if the level
     list shrinks in a later build, an out-of-range value would unlock nothing
     and strand the player on the home screen. */
  var total = levelCount();
  if (out.cleared > total) out.cleared = total;
  return out;
}
function writeStats(s) { return STORE.set('stats', s); }

/* ── app ────────────────────────────────────────────────────────────────── */
var SCENES = { home: HOME, play: PLAY, result: RS, rules: RULES, about: ABOUT };

var APP = {
  scene: 'home',
  settings: { level: 1 },
  /* The campaign total is a session concept: it accumulates the levels cleared
     since the player last started from level 1, and resets with the campaign. */
  run: { score: 0, clearedLevels: 0 },
  agree: true,
  agreeT: 0,
  time: 0,
  resultDelay: -1,
  ready: false,
  _pendingResult: null,

  init: function () {
    var agreed = STORE.get('agreed', false);
    APP.agree = agreed !== true;
    APP.agreeT = 0;
    APP.scene = 'home';
    APP.applyTitle();
  },

  applyTitle: function () {
    try { document.title = tr('game.title'); } catch (e) { /* no document */ }
  },

  go: function (name, opts) {
    var cur = SCENES[APP.scene];
    if (cur && cur.exit) cur.exit();
    APP.scene = name;
    APP.resultDelay = -1;
    APP._pendingResult = null;
    if (name === 'play' && opts) {
      PLAY.enter(opts);
    } else if (name === 'result' && opts) {
      RS.enter(opts);
    }
  },

  /* Every attempt is built here, so no ship, rock, cell, particle, counter or
     seed can survive from the previous one. This is the single reset point the
     platform spec requires ("restart must fully reinitialise the level"). */
  newRun: function (index) {
    var seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
    resetDeco();
    return { index: Number(index) || 1, seed: seed };
  },

  startLevel: function (index) {
    APP.settings.level = Number(index) || 1;
    APP.go('play', APP.newRun(APP.settings.level));
  },

  restartLevel: function () { APP.startLevel(APP.settings.level); },

  nextLevel: function () {
    var next = Math.min(levelCount(), APP.settings.level + 1);
    APP.startLevel(next);
  },

  startCampaign: function () {
    APP.run.score = 0;
    APP.run.clearedLevels = 0;
    APP.startLevel(1);
  },

  update: function (dt) {
    APP.time += dt;
    if (APP.agree) APP.agreeT += dt;
    var s = SCENES[APP.scene];
    if (s && s.update) s.update(dt);

    /* A level is decided -> show the result card once the explosion has landed.
       The world is read from the play scene, never cached on APP: a restart
       replaces it, and a stale reference would score the wrong run. */
    if (APP.scene === 'play' && PLAY.over) {
      if (APP.resultDelay < 0) {
        APP.resultDelay = cfgGet('anim.resultDelaySec', 0.7);
        APP._pendingResult = { world: PLAY.world };
      } else {
        APP.resultDelay -= dt;
        if (APP.resultDelay <= 0 && APP._pendingResult) {
          var payload = APP._pendingResult;
          APP._pendingResult = null;
          APP.go('result', payload);
        }
      }
    }
  },

  draw: function (dt) {
    var s = SCENES[APP.scene];
    if (s && s.draw) s.draw(dt, APP.time);
    drawToast(dt);
    if (APP.agree) drawAgreement(dt, APP.time);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  down: function (x, y, pid) {
    SFX.unlock();
    PRESS.x = x;
    PRESS.y = y;
    PRESS.moved = false;
    PRESS.id = pickHit(x, y);
    /* The agreement is modal: while it is open nothing else may receive input. */
    if (APP.agree) return;
    var s = SCENES[APP.scene];
    if (s && s.down) s.down(x, y, pid);
  },

  move: function (x, y, pid) {
    if (Math.abs(x - PRESS.x) > 6 || Math.abs(y - PRESS.y) > 6) PRESS.moved = true;
    var s = SCENES[APP.scene];
    if (s && s.move) s.move(x, y, pid);
  },

  up: function (x, y, pid) {
    if (APP.agree) {
      if (pickHit(x, y) === 'agree' && !PRESS.moved) {
        APP.agree = false;
        STORE.set('agreed', true);
      }
      PRESS.id = null;
      PRESS.moved = false;
      return;
    }
    var s = SCENES[APP.scene];
    /* A scene may consume the tap outright (the level brief is modal). If it did,
       the hit regions underneath must not also fire — one tap, one effect. */
    var consumed = false;
    if (s && s.up) consumed = s.up(x, y, pid) === true;
    var id = pickHit(x, y);
    if (!consumed && id && id === PRESS.id && !PRESS.moved && s) {
      if (s.actions && s.actions[id]) s.actions[id]();
      else handleHomePick(id);
    }
    PRESS.id = null;
    PRESS.moved = false;
  },

  /* Called when the page goes to the background: the platform spec asks for an
     automatic pause, and a drifting ship must not be judged while hidden. */
  onHidden: function () {
    if (APP.scene === 'play') PLAY.setPaused(true);
  }
};

/* ── main loop ──────────────────────────────────────────────────────────── */
var _last = 0;

function frame(now) {
  var raw = _last ? now - _last : 1000 / 60;
  var dt = _last ? clamp(raw / 1000, 0, 0.05) : 1 / 60;
  _last = now;
  /* Feed the real elapsed time to the quality policy (dt above is clamped for
     simulation stability, which would hide a slow device from the sampler). */
  if (APP.ready) sampleFrame(raw);

  CTX.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
  /* One background blit per frame. In the arena the pre-composed bitmap also carries
     the play field's panel and grain, so the scene below only draws what moves. */
  drawGameBackground(T(), APP.time,
    (APP.scene === 'play' && PLAY.world) ? PLAY.world.rect : null);

  resetHits();
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  APP.update(dt);
  APP.draw(dt);
  CTX.restore();

  requestAnimationFrame(frame);
}

/* ── boot ───────────────────────────────────────────────────────────────── */
function bindInput() {
  var canvas = document.getElementById('stage');

  function pt(e) {
    var rect = canvas.getBoundingClientRect();
    var src = e;
    if (e.touches && e.touches.length) src = e.touches[0];
    else if (e.changedTouches && e.changedTouches.length) src = e.changedTouches[0];
    return {
      x: ux((src.clientX || 0) - rect.left),
      y: uy((src.clientY || 0) - rect.top)
    };
  }

  /* Pointer identity is what makes two-thumb control work, so it is carried all
     the way down to the arena instead of being flattened to a single position. */
  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var p = pt(e);
      APP.down(p.x, p.y, e.pointerId);
    }, { passive: false });
    canvas.addEventListener('pointermove', function (e) {
      var p = pt(e);
      APP.move(p.x, p.y, e.pointerId);
    }, { passive: true });
    canvas.addEventListener('pointerup', function (e) {
      var p = pt(e);
      APP.up(p.x, p.y, e.pointerId);
    }, { passive: true });
    canvas.addEventListener('pointercancel', function (e) {
      APP.up(-1, -1, e.pointerId);
    }, { passive: true });
  } else {
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.down(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.move(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.up(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      var p = pt(e);
      APP.down(p.x, p.y, 'mouse');
    });
    canvas.addEventListener('mousemove', function (e) {
      var p = pt(e);
      APP.move(p.x, p.y, 'mouse');
    });
    canvas.addEventListener('mouseup', function (e) {
      var p = pt(e);
      APP.up(p.x, p.y, 'mouse');
    });
  }
  /* Block the OS-level long-press menu and double-tap zoom inside the play area. */
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

function boot() {
  refreshConfigFromSidecar();
  relayout();
  APP.init();
  loadAssets();
  bindInput();

  window.addEventListener('resize', function () { relayout(); resetDeco(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { relayout(); resetDeco(); }, 120);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) APP.onHidden();
  });
  window.addEventListener('blur', function () { APP.onHidden(); });

  requestAnimationFrame(frame);
  APP.ready = true;
}

/* Debug / automation handle. Read-only surface used by the test harness. */
window.__TWIN__ = {
  APP: APP, PLAY: PLAY, RS: RS, HOME: HOME,
  config: CONFIG,
  assets: ASSETS,
  layout: LAY,
  quality: QUALITY,
  sfx: SFX,
  hits: HITS,          /* live hit regions, rebuilt every frame (design units) */
  version: APP_VERSION,
  api: {
    buildWorld: buildWorld,
    stepWorld: stepWorld,
    assignPointers: assignPointers,
    autopilotAims: autopilotAims,
    simulate: simulate,
    levelScore: levelScore,
    stateSig: stateSig,
    validateLevels: validateLevels,
    arenaRect: arenaRect,
    levelDef: levelDef,
    levelCount: levelCount,
    isUnlocked: isUnlocked,
    readStats: readStats,
    writeStats: writeStats,
    getLang: getLang,
    setLang: setLang,
    tr: tr,
    dict: DICT,
    langs: LANGS,
    fallbackLang: FALLBACK_LANG,
    pickLocale: pickLocale,
    cfgGet: cfgGet,
    cfgSet: cfgSet,
    themeIds: themeIds,
    getThemeId: getThemeId,
    setThemeId: setThemeId,
    themeName: themeName,
    shipColor: shipColor,
    shipDark: shipDark,
    shipLight: shipLight,
    shipLabel: shipLabel,
    gateShape: gateShape,
    levelName: levelName,
    levelTeach: levelTeach,
    effectivePixelRatio: effectivePixelRatio,
    medianOf: medianOf,
    shouldDowngrade: shouldDowngrade,
    applyQualityStep: applyQualityStep,
    spawnParticles: spawnParticles,
    stepParticles: stepParticles,
    newRun: function (i) { return APP.newRun(i); },
    startLevel: function (i) { APP.startLevel(i); },
    restartLevel: function () { APP.restartLevel(); },
    nextLevel: function () { APP.nextLevel(); },
    startCampaign: function () { APP.startCampaign(); },
    setPaused: function (v) { return PLAY.setPaused(v); }
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
