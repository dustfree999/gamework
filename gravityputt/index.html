var TAU = Math.PI * 2;
function clamp(v, a, b) { return v < a ? a : (v > b ? b : v); }
function lerp(a, b, t) { return a + (b - a) * t; }
function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }
function easeInCubic(t) { return t * t * t; }
function easeInOutCubic(t) { return t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2; }
function easeOutBack(t) {
  var c1 = 1.70158, c3 = c1 + 1;
  return 1 + c3 * Math.pow(t - 1, 3) + c1 * Math.pow(t - 1, 2);
}
function easeOutElastic(t) {
  if (t <= 0) return 0;
  if (t >= 1) return 1;
  var c4 = TAU / 3;
  return Math.pow(2, -10 * t) * Math.sin((t * 10 - 0.75) * c4) + 1;
}
function dist2(ax, ay, bx, by) { var dx = ax - bx, dy = ay - by; return Math.sqrt(dx * dx + dy * dy); }
function degToRad(d) { return d * Math.PI / 180; }

/* Deterministic 32-bit PRNG — deco starfields are reproducible from a seed. */
function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
  };
}

function fmt(tpl, vars) {
  var out = String(tpl);
  if (vars) {
    for (var k in vars) {
      if (Object.prototype.hasOwnProperty.call(vars, k)) out = out.split('{' + k + '}').join(String(vars[k]));
    }
  }
  return out;
}

/* ── storage: bridge.storage when present, local fallback otherwise ─────── */
var STORE = (function () {
  var prefix = cfgGet('storage.prefix', 'gravityputt_');
  var keys = cfgGet('storage.keys', {});
  var maxBytes = cfgGet('storage.maxValueBytes', 262144);
  var bridge = window.bridge;

  function fullKey(name) { return prefix + (keys[name] || name); }

  function bridgeGet(k) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.getItem === 'function') return bridge.storage.getItem(k);
      if (bridge && bridge.storage && typeof bridge.storage.get === 'function') return bridge.storage.get(k);
    } catch (e) { /* fall through */ }
    return undefined;
  }
  function bridgeSet(k, v) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.setItem === 'function') { bridge.storage.setItem(k, v); return true; }
      if (bridge && bridge.storage && typeof bridge.storage.set === 'function') { bridge.storage.set(k, v); return true; }
    } catch (e) { /* fall through */ }
    return false;
  }

  function get(name, dflt) {
    var k = fullKey(name);
    var raw = bridgeGet(k);
    if (raw === undefined || raw === null || raw === '') {
      try { raw = window.localStorage.getItem(k); } catch (e) { raw = null; }
    }
    if (raw === undefined || raw === null || raw === '') return dflt;
    try { return JSON.parse(raw); } catch (e) { return typeof raw === 'string' ? raw : dflt; }
  }

  function set(name, value) {
    var k = fullKey(name);
    var raw;
    try { raw = JSON.stringify(value); } catch (e) { return false; }
    /* Platform quota: one key must stay under 256KB. Oversized writes are dropped
       rather than risking the whole store. */
    if (raw.length > maxBytes) return false;
    if (bridgeSet(k, raw)) return true;
    try { window.localStorage.setItem(k, raw); return true; } catch (e) { return false; }
  }

  return { get: get, set: set, key: fullKey };
})();

/* ── viewport / safe area / stage layout ────────────────────────────────── */
function readSafeArea() {
  var out = { top: 0, right: 0, bottom: 0, left: 0, known: false };
  try {
    var b = window.bridge;
    if (b && b.viewport && typeof b.viewport.getSafeArea === 'function') {
      var sa = b.viewport.getSafeArea();
      if (isObj(sa)) {
        out.top = Number(sa.top) || 0;
        out.right = Number(sa.right) || 0;
        out.bottom = Number(sa.bottom) || 0;
        out.left = Number(sa.left) || 0;
        /* Some hosts report a full rect instead of insets. */
        if (sa.height && sa.y !== undefined && !sa.top && !sa.bottom) {
          out.top = Number(sa.y) || 0;
          out.bottom = Math.max(0, (Number(window.innerHeight) || 0) - (Number(sa.y) + Number(sa.height)));
        }
        out.known = true;
      }
    }
  } catch (e) { /* host without the bridge: treat as no insets */ }
  return out;
}

/* Probing CSS env() insets needs a real element; done once at boot. */
function cssEnvInsets() {
  var out = { top: 0, right: 0, bottom: 0, left: 0 };
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +
      'padding-top:env(safe-area-inset-top);padding-right:env(safe-area-inset-right);' +
      'padding-bottom:env(safe-area-inset-bottom);padding-left:env(safe-area-inset-left);';
    document.body.appendChild(probe);
    var cs = window.getComputedStyle(probe);
    out.top = parseFloat(cs.paddingTop) || 0;
    out.right = parseFloat(cs.paddingRight) || 0;
    out.bottom = parseFloat(cs.paddingBottom) || 0;
    out.left = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(probe);
  } catch (e) { /* keep zeros */ }
  return out;
}

var LAY = {
  DW: cfgGet('viewport.designWidth', 402),
  DH: cfgGet('viewport.designHeight', 619),
  scale: 1, stageX: 0, stageY: 0, stageW: 402, stageH: 619,
  contentTop: 0, contentBottom: 0, contentLeft: 0, contentRight: 0,
  corner: cfgGet('viewport.cornerClearPx', 26),
  safe: { top: 0, right: 0, bottom: 0, left: 0 }
};

function relayout() {
  var vw = Math.max(1, window.innerWidth || 1);
  var vh = Math.max(1, window.innerHeight || 1);
  var scale = Math.min(vw / LAY.DW, vh / LAY.DH);
  LAY.scale = scale;
  LAY.stageW = LAY.DW * scale;
  LAY.stageH = LAY.DH * scale;
  LAY.stageX = (vw - LAY.stageW) / 2;
  LAY.stageY = (vh - LAY.stageH) / 2;

  var hostSa = readSafeArea();
  var cssSa = hostSa.known ? { top: 0, right: 0, bottom: 0, left: 0 } : cssEnvInsets();
  LAY.safe = {
    top: hostSa.top || cssSa.top,
    right: Math.max(hostSa.right || 0, cssSa.right),
    bottom: Math.max(hostSa.bottom || 0, cssSa.bottom),
    left: Math.max(hostSa.left || 0, cssSa.left)
  };

  /* Insets are viewport-relative; only the part that eats into the stage counts. */
  function inside(px, origin, span) { return clamp((px - origin) / scale, 0, span); }
  var gTop = LAY.DH * cfgGet('viewport.guardTopPct', 0.05);
  var gBottom = LAY.DH * cfgGet('viewport.guardBottomPct', 0.05);
  var sTop = inside(LAY.safe.top, LAY.stageY, LAY.DH);
  var sBottom = inside(LAY.safe.bottom, LAY.stageY, LAY.DH);
  var sLeft = inside(LAY.safe.left, LAY.stageX, LAY.DW);
  var sRight = inside(LAY.safe.right, LAY.stageX, LAY.DW);

  /* Corner clearance: rounded display corners must never host a tap target, so the
     side margin is the larger of the base gutter, the safe inset and half the corner radius. */
  var base = 16;
  LAY.contentTop = gTop + sTop;
  LAY.contentBottom = LAY.DH - gBottom - sBottom;
  LAY.contentLeft = Math.max(base + sLeft, LAY.corner * 0.5);
  LAY.contentRight = LAY.DW - Math.max(base + sRight, LAY.corner * 0.5);

  var canvas = document.getElementById('stage');
  var dpr = effectivePixelRatio();
  canvas.width = Math.round(vw * dpr);
  canvas.height = Math.round(vh * dpr);
  canvas.style.width = vw + 'px';
  canvas.style.height = vh + 'px';
  CTX = canvas.getContext('2d');
  CTX.setTransform(dpr, 0, 0, dpr, 0, 0);
  VIEW = { vw: vw, vh: vh, dpr: dpr };
}

/* ── render quality ─────────────────────────────────────────────────────── */
/* The platform cannot guarantee a single GPU/engine build, so the game renders at
   the screen's native density for crispness and steps that down only if a device
   cannot hold the frame budget. The policy below is pure and unit-testable. */
var QUALITY = {
  cap: cfgGet('viewport.maxPixelRatio', 3),
  step: 0,
  samples: [],
  frames: 0
};

function effectivePixelRatio() {
  return Math.min(window.devicePixelRatio || 1, QUALITY.cap);
}

function medianOf(samples) {
  if (!samples.length) return 0;
  var s = samples.slice().sort(function (a, b) { return a - b; });
  return s[Math.floor(s.length / 2)];
}

/** True when a sustained median frame time has blown the budget. */
function shouldDowngrade(samples) {
  var c = cfgGet('viewport.adaptiveQuality', {});
  if (c.enabled === false) return false;
  if (samples.length < (c.minFrames || 90)) return false;
  return medianOf(samples) > (c.slowFrameMs || 22);
}

/** Drop one quality step (never below the last configured cap). */
function applyQualityStep() {
  var steps = cfgGet('viewport.adaptiveQuality.steps', [2, 1.5]);
  if (QUALITY.step >= steps.length) return false;
  QUALITY.cap = steps[QUALITY.step];
  QUALITY.step += 1;
  QUALITY.samples = [];
  QUALITY.frames = 0;
  relayout();
  resetDeco();
  return true;
}

function sampleFrame(ms) {
  var c = cfgGet('viewport.adaptiveQuality', {});
  var max = c.sampleFrames || 60;
  QUALITY.samples.push(ms);
  if (QUALITY.samples.length > max) QUALITY.samples.shift();
  QUALITY.frames += 1;
  if (QUALITY.frames % (c.checkEvery || 30) === 0 && shouldDowngrade(QUALITY.samples)) {
    applyQualityStep();
  }
}

function sx(x) { return LAY.stageX + x * LAY.scale; }

/* CSS px -> design units (input). */
function ux(px) { return (px - LAY.stageX) / LAY.scale; }
function uy(py) { return (py - LAY.stageY) / LAY.scale; }

}

function setLang(lang) {
  if (LANGS.indexOf(lang) < 0) return false;
  _lang = lang;
  STORE.set('lang', lang);
  try {
    var title = tr('game.title');
    if (document && document.title !== undefined) document.title = title;
  } catch (e) { /* no document: ignore */ }
  return true;
}

/* Lookup never throws: a missing key echoes itself so a gap cannot blank the UI. */
function tr(key, vars) {
  var entry = DICT[key];
  var lang = getLang();
  var text;
  if (!entry) text = key;
  else text = entry[lang] || entry[FALLBACK_LANG] || entry.zh || key;
  return vars ? fmt(text, vars) : text;
}

/* Level names and tutorial lines live in game_config.json (operational content
   belongs with the other tunables), resolved through the same locale rules. */
function pickLocale(obj, dflt) {
  if (obj === null || obj === undefined) return dflt;
  if (typeof obj === 'string') return obj;
  var lang = getLang();
  return obj[lang] || obj[FALLBACK_LANG] || obj.en || obj.zh || dflt;
}


/* ===== 03-assets.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §3  ASSETS — window.lib.getAsset(assetId) pipeline with local fallbacks
   ═══════════════════════════════════════════════════════════════════════════ */

/* Mirrors asset_map.json (ids are the contract; the map file is the auditable copy).
   Binary payload shipped: the store icon, the store cover and one grain texture.
   Everything else the game shows is generated procedurally, so it has no url. */
var ASSET_IDS = {
  icon: { url: 'icon.png', type: 'image' },
  poster: { url: 'cover/poster.jpg', type: 'image' },
  grain: { url: 'assets/grain.png', type: 'image' },
  planet_set: { url: null, type: 'image' },
  hole_skin: { url: null, type: 'image' },
  fx_warp: { url: null, type: 'animation' },
  sfx_launch: { url: null, type: 'audio' },
  sfx_hole: { url: null, type: 'audio' },
  sfx_swallow: { url: null, type: 'audio' }
};

var ASSETS = {
  images: {},          /* id -> HTMLImageElement (only when actually usable) */
  resolved: {},        /* id -> 'host' | 'local' | 'procedural' | 'missing' */
  requested: [],       /* every id the game asked for */
  calls: [],           /* ids handed to window.lib.getAsset (empty without the host API) */
  host: !!(window.lib && typeof window.lib.getAsset === 'function'),
  ready: null
};

/* The host API is deliberately unspecified beyond its name, so accept whatever
   shape it returns: a promise, a URL string, a descriptor or a live element. */
function hostGetAsset(id) {
  ASSETS.calls.push(id);
  try {
    if (!window.lib || typeof window.lib.getAsset !== 'function') return null;
    return window.lib.getAsset(id);
  } catch (e) {
    return null;
  }
}

function loadImageUrl(url) {
  return new Promise(function (resolve) {
    if (!url) { resolve(null); return; }
    var img = new Image();
    /* Only remote (cross-origin) sources need the anonymous flag; setting it on a
       relative url can break a plain file:// load, so it is conditional. */
    if (/^https?:/i.test(url)) img.crossOrigin = 'anonymous';
    img.onload = function () { resolve(img); };
    img.onerror = function () { resolve(null); };
    img.src = url;
  });
}

function imageFromValue(value) {
  return new Promise(function (resolve) {
    if (!value) { resolve(null); return; }
    if (typeof value === 'string') { loadImageUrl(value).then(resolve); return; }
    if (typeof value.then === 'function') {
      value.then(function (v) { imageFromValue(v).then(resolve); }, function () { resolve(null); });
      return;
    }
    if (typeof Image !== 'undefined' && value instanceof Image) { resolve(value); return; }
    if (value.image && typeof value.image === 'object') { imageFromValue(value.image).then(resolve); return; }
    if (typeof value.src === 'string') { loadImageUrl(value.src).then(resolve); return; }
    if (typeof value.url === 'string') { loadImageUrl(value.url).then(resolve); return; }
    if (typeof value.path === 'string') { loadImageUrl(value.path).then(resolve); return; }
    resolve(null);
  });
}

function requestAsset(id) {
  var spec = ASSET_IDS[id] || {};
  ASSETS.requested.push(id);
  var viaHost = null;
  if (ASSETS.host) {
    var raw = hostGetAsset(id);
    if (raw !== null && raw !== undefined) {
      viaHost = imageFromValue(raw).then(function (img) { return img ? { img: img, from: 'host' } : null; });
    }
  }
  var chain = viaHost || Promise.resolve(null);
  return chain.then(function (hit) {
    if (hit) return hit;
    return loadImageUrl(spec.url).then(function (img) { return img ? { img: img, from: 'local' } : null; });
  }).then(function (hit) {
    if (hit) {
      ASSETS.images[id] = hit.img;
      ASSETS.resolved[id] = hit.from;
    } else {
      ASSETS.resolved[id] = spec.url ? 'missing' : 'procedural';
    }
    return ASSETS.images[id] || null;
  });
}

/* Every declared asset is requested through the platform API at boot, so the
   documented call happens for the whole manifest - not just the files we ship. */
function loadAssets() {
  var ids = [];
  for (var k in ASSET_IDS) { if (Object.prototype.hasOwnProperty.call(ASSET_IDS, k)) ids.push(k); }
  ASSETS.ready = Promise.all(ids.map(requestAsset));
  return ASSETS.ready;
}

function assetImage(id) { return ASSETS.images[id] || null; }


/* ===== 04-physics.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §4  PHYSICS — gravity, trajectories, hazards and the cup. Everything here
        is a PURE function of (world, dt): no DOM, no audio, no Math.random in
        any judged path. The predictor replays the SAME stepCourse() the live
        ball flies, so the preview can never drift away from the real shot.
   ═══════════════════════════════════════════════════════════════════════════ */

/* ── course geometry ─────────────────────────────────────────────────────── */
/* Levels store normalised (0..1) coordinates, so the same hole works on a
   notched phone and on a desktop window without leaving the safe area. */
function courseRect() {
  var top = LAY.contentTop + cfgGet('course.hudHeight', 44) + cfgGet('course.levelInsetTop', 6);
  var bottom = LAY.contentBottom - cfgGet('course.hintHeight', 26) - cfgGet('course.levelInsetBottom', 6);
  var left = LAY.contentLeft;
  var right = LAY.contentRight;
  return {
    x: left, y: top, w: right - left, h: bottom - top,
    cx: (left + right) / 2, cy: (top + bottom) / 2
  };
}

function normToCourse(rect, n) {
  if (!n) return { x: rect.cx, y: rect.cy };
  return { x: rect.x + Number(n[0]) * rect.w, y: rect.y + Number(n[1]) * rect.h };
}

function levelDef(index) {
  var levels = cfgGet('levels', []);
  for (var i = 0; i < levels.length; i += 1) {
    if (Number(levels[i].index) === Number(index)) return levels[i];
  }
  return levels[0] || null;
}

function levelCount() { return (cfgGet('levels', []) || []).length; }

/* Body-kind defaults: a level may override r and m per body. */
function bodyKind(kind) {
  var kinds = cfgGet('bodies', {});
  return isObj(kinds[kind]) ? kinds[kind] : {};
}

function bodySolid(kind) {
  /* repulsors shove but never collide; wormholes teleport rather than block */
  return kind === 'rock' || kind === 'ice' || kind === 'giant';
}

function bodyAttracts(kind) {
  /* repulsors push away instead; everything else pulls */
  return kind !== 'repulsor';
}

function orbitPos(orbit, t) {
  var ang = orbit.phase * TAU + TAU * t / orbit.period;
  return { x: orbit.cx + Math.cos(ang) * orbit.rx, y: orbit.cy + Math.sin(ang) * orbit.ry };
}

/* ── world construction ─────────────────────────────────────────────────── */
function buildWorld(index, rect) {
  var def = levelDef(index);
  var r = rect || courseRect();
  var phys = cfgGet('physics', {});
  var ballR = phys.ballRadius || 7;
  var bh = bodyKind('blackhole');
  var worm = bodyKind('wormhole');

  var ball = normToCourse(r, def.ball);
  var hole = normToCourse(r, def.hole);
  var bodies = [];
  var worms = [];
  var i;

  var planetDefs = def.planets || [];
  for (i = 0; i < planetDefs.length; i += 1) {
    var pd = planetDefs[i];
    var kind = String(pd.kind || 'rock');
    var kdef = bodyKind(kind);
    var orbit = null;
    var p = normToCourse(r, pd.n);
    if (isObj(pd.orbit)) {
      var oc = normToCourse(r, [pd.orbit.cx, pd.orbit.cy]);
      orbit = {
        cx: oc.x, cy: oc.y,
        rx: Number(pd.orbit.radius) * r.w,
        ry: Number(pd.orbit.radius) * r.h,
        period: Number(pd.orbit.period) || 6,
        phase: Number(pd.orbit.phase) || 0
      };
      p = orbitPos(orbit, 0);
    }
    bodies.push({
      id: i, kind: kind,
      x: p.x, y: p.y, r: Number(pd.r) || kdef.r || 24,
      m: Number(pd.m) || kdef.m || 1500,
      horizon: (kind === 'blackhole') ? (Number(pd.horizon) || kdef.horizon || 16) : 0,
      orbit: orbit, spin: 0, grazed: false
    });
  }

  var wormDefs = def.gates || [];
  for (i = 0; i < wormDefs.length; i += 1) {
    var wd = wormDefs[i];
    var a = normToCourse(r, wd.a);
    var b = normToCourse(r, wd.b);
    var pair = { id: i, r: worm.r || 18, ax: a.x, ay: a.y, bx: b.x, by: b.y, aAng: 0, bAng: 0 };
    /* Exit velocity direction: the pair's transit axis, so a warp chain is
       predictable and the predictor stays honest. */
    var dx = b.x - a.x, dy = b.y - a.y;
    var len = Math.sqrt(dx * dx + dy * dy) || 1;
    pair.dirx = dx / len;
    pair.diry = dy / len;
    worms.push(pair);
  }

  return {
    level: Number(def.index) || index,
    def: def, rect: r, seed: 0,
    ball: { x: ball.x, y: ball.y, vx: 0, vy: 0, r: ballR, armed: true, lipOut: false, trail: [] },
    hole: { x: hole.x, y: hole.y, r: phys.holeRadius || 20 },
    bodies: bodies, worms: worms,
    t: 0, strokes: 0,
    lastLie: { x: ball.x, y: ball.y },
    settleT: -1,
    status: 'aim', reason: '',
    events: [], particles: []
  };
}

/* ── launch mapping ─────────────────────────────────────────────────────── */
/* Drag distance maps to launch speed; past the fine-tune threshold the extra
   distance keeps adding speed but at a fraction of the rate, so the end of
   the pull is precise rather than twitchy. Returns 0..1 power. */
function launchPower(dragPx) {
  var phys = cfgGet('physics', {});
  var dragMax = phys.launchDragMaxPx || 180;
  var gain = phys.launchFineGain || 0.35;
  var d = Math.max(0, Number(dragPx) || 0);
  var base = clamp(d / dragMax, 0, 1);
  if (d <= dragMax) return base;
  return clamp(1 + gain * (d - dragMax) / dragMax, 0, 1 + gain);
}

function launchSpeed(power) {
  var phys = cfgGet('physics', {});
  var max = phys.launchSpeedMax || 900;
  var min = (phys.launchMinPower || 0.08) * max;
  var p = clamp(power, 0, 1);
  return min + (max - min) * p;
}

/* ── one simulation step ────────────────────────────────────────────────── */
/* Steps the ball and the orbiting bodies by dt (the physics sub-step). At
   subStepHz the fastest ball covers maxSpeed/hz ≈ 7.5px per step, below the
   smallest solid radius, so no extra sub-stepping is needed to avoid
   tunnelling. Mutates world and appends to world.events. */
function stepCourse(world, dt) {
  if (!(dt > 0)) return world;
  if (dt > 0.05) dt = 0.05;
  var phys = cfgGet('physics', {});
  var G = phys.gravityG || 3200;
  var soft = phys.softening || 60;
  var drag = phys.dragPerSec || 0.7;
  var maxSpeed = phys.maxSpeed || 900;
  var r = world.rect;
  var ball = world.ball;
  var i;

  world.t += dt;
  world.events.length = 0;

  /* orbiting bodies and worm rings move first, so every check below is
     against where everything is now */
  for (i = 0; i < world.bodies.length; i += 1) {
    var b = world.bodies[i];
    if (!b.orbit) continue;
    var p = orbitPos(b.orbit, world.t);
    b.x = p.x; b.y = p.y;
    b.spin += dt * (cfgGet('bodies.orbitSpeedRadPerSec', 1.05) || 1.05);
  }
  for (i = 0; i < world.worms.length; i += 1) {
    world.worms[i].aAng += dt * 1.6;
    world.worms[i].bAng += dt * 1.6;
  }

  if (world.status === 'clear' || world.status === 'fail') return world;

  if (world.status === 'aim' || world.status === 'settle') {
    /* the field stays alive while the player reads it; the ball waits */
    return world;
  }

  /* ── status === 'flying' ── */
  /* gravity: a = G*m / (d² + soft²), toward attracting bodies, away from repulsors */
  for (i = 0; i < world.bodies.length; i += 1) {
    var body = world.bodies[i];
    var dx = body.x - ball.x, dy = body.y - ball.y;
    var d2 = dx * dx + dy * dy;
    var d = Math.sqrt(d2);
    if (d < 0.5) continue;
    var acc = G * body.m / (d2 + soft * soft);
    var sign = bodyAttracts(body.kind) ? 1 : -1;
    ball.vx += (dx / d) * acc * sign * dt;
    ball.vy += (dy / d) * acc * sign * dt;
  }

  /* Exponential drag: retaining exp(-drag*dt) per step makes the decay rate
     independent of the physics sub-step frequency. A naive (1 - drag*dt)
     multiplier at 120 Hz would decay ~55x harder than the configured rate. */
  var damp = Math.exp(-drag * dt);
  ball.vx *= damp;
  ball.vy *= damp;
  var speed = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
  if (speed > maxSpeed) {
    ball.vx = ball.vx / speed * maxSpeed;
    ball.vy = ball.vy / speed * maxSpeed;
  }

  ball.x += ball.vx * dt;
  ball.y += ball.vy * dt;

  /* ── hazards, solids, the cup ── */
  judgeBall(world, phys);
  if (world.status !== 'flying') return world;

  /* ── out of bounds: the ball left the course ── */
  var oob = phys.outOfBoundsPx || 14;
  if (ball.x < r.x - oob || ball.x > r.x + r.w + oob ||
      ball.y < r.y - oob || ball.y > r.y + r.h + oob) {
    penalise(world, 'oob');
    return world;
  }

  /* ── motion trail ── */
  var trailMax = cfgGet('anim.trailMax', 14);
  ball.trail.unshift({ x: ball.x, y: ball.y });
  if (ball.trail.length > trailMax) ball.trail.pop();

  /* ── flight clock guard: nothing may orbit forever ── */
  world.settleT += dt;
  if (world.settleT > (phys.maxFlightSec || 8)) {
    freezeBall(world, phys, true);
  }
  return world;
}

/* Solid bounce, black-hole swallow, cup capture / lip-out, stop check. */
function judgeBall(world, phys) {
  var ball = world.ball;
  var holeCap = phys.holeCaptureSpeed || 260;
  var deflect = degToRad(phys.holeDeflectDeg || 12);
  var rest = phys.planetRestitution || 0.55;
  var stopSpeed = phys.stopSpeed || 40;
  var i;

  /* wormholes first: a teleport moves the ball before anything else can judge it */
  for (i = 0; i < world.worms.length; i += 1) {
    var w = world.worms[i];
    if (ball.armed && dist2(ball.x, ball.y, w.ax, w.ay) < w.r) {
      var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      ball.x = w.bx; ball.y = w.by;
      ball.vx = sp * w.dirx;
      ball.vy = sp * w.diry;
      ball.armed = false;
      world.events.push({ type: 'warp', x: w.ax, y: w.ay, exitX: w.bx, exitY: w.by });
      return;
    }
    if (ball.armed && dist2(ball.x, ball.y, w.bx, w.by) < w.r) {
      var sp2 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      ball.x = w.ax; ball.y = w.ay;
      ball.vx = -sp2 * w.dirx;
      ball.vy = -sp2 * w.diry;
      ball.armed = false;
      world.events.push({ type: 'warp', x: w.bx, y: w.by, exitX: w.ax, exitY: w.ay });
      return;
    }
    if (!ball.armed &&
        dist2(ball.x, ball.y, w.ax, w.ay) > w.r * 1.6 &&
        dist2(ball.x, ball.y, w.bx, w.by) > w.r * 1.6) {
      ball.armed = true;
    }
  }

  /* solids bounce, horizons swallow */
  for (i = 0; i < world.bodies.length; i += 1) {
    var body = world.bodies[i];
    var dx = ball.x - body.x, dy = ball.y - body.y;
    var d = Math.sqrt(dx * dx + dy * dy);
    if (body.kind === 'blackhole' && d < body.horizon + ball.r) {
      world.events.push({ type: 'swallow', x: ball.x, y: ball.y, body: body.id });
      ball.x = body.x; ball.y = body.y;
      penalise(world, 'void');
      return;
    }
    var solidR = bodySolid(body.kind) ? body.r + ball.r : 0;
    if (solidR > 0 && d < solidR && d > 0.5) {
      var nx = dx / d, ny = dy / d;
      ball.x = body.x + nx * solidR;
      ball.y = body.y + ny * solidR;
      var vn = ball.vx * nx + ball.vy * ny;
      if (vn < 0) {
        ball.vx -= (1 + rest) * vn * nx;
        ball.vy -= (1 + rest) * vn * ny;
      }
      world.events.push({ type: 'bounce', x: ball.x, y: ball.y, body: body.id,
        speed: Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) });
    }
  }

  /* the cup: capture when slow enough, lip out when too fast */
  var hd = dist2(ball.x, ball.y, world.hole.x, world.hole.y);
  if (hd < world.hole.r) {
    var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
    if (sp < holeCap) {
      captureBall(world);
      return;
    }
    if (!ball.lipOut) {
      ball.lipOut = true;
      var side = ((ball.x - world.hole.x) * ball.vy - (ball.y - world.hole.y) * ball.vx) >= 0 ? 1 : -1;
      var ang = Math.atan2(ball.vy, ball.vx) + side * deflect;
      ball.vx = Math.cos(ang) * sp;
      ball.vy = Math.sin(ang) * sp;
      world.events.push({ type: 'lipout', x: world.hole.x, y: world.hole.y, speed: sp });
    }
  } else if (ball.lipOut && hd > world.hole.r * 1.6) {
    ball.lipOut = false;
  }

  /* flyby sparks when a close pass grazes a body */
  for (i = 0; i < world.bodies.length; i += 1) {
    var bd = world.bodies[i];
    var nearR = bd.kind === 'blackhole' ? cfgGet('bodies.blackhole.well', 90) : (bd.r + 50);
    var bdD = dist2(ball.x, ball.y, bd.x, bd.y);
    if (bdD < nearR && !bd.grazed) {
      bd.grazed = true;
      world.events.push({ type: 'nearmiss', x: ball.x, y: ball.y, body: bd.id });
    } else if (bd.grazed && bdD > nearR + 24) {
      bd.grazed = false;
    }
  }

  /* stop check: the ball dies where it lies */
  if (Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy) < stopSpeed) {
    freezeBall(world, phys, false);
  }
}

function freezeBall(world, phys, forced) {
  var ball = world.ball;
  ball.vx = 0; ball.vy = 0;
  /* a dead ball must never overlap a solid or sit inside a horizon */
  for (var i = 0; i < world.bodies.length; i += 1) {
    var body = world.bodies[i];
    var dx = ball.x - body.x, dy = ball.y - body.y;
    var d = Math.sqrt(dx * dx + dy * dy) || 1;
    var need = bodySolid(body.kind) ? body.r + ball.r + 1
      : (body.kind === 'blackhole' ? body.horizon + ball.r + 1 : 0);
    if (need > 0 && d < need) {
      ball.x = body.x + dx / d * need;
      ball.y = body.y + dy / d * need;
    }
  }
  world.lastLie = { x: ball.x, y: ball.y };
  if (world.strokes >= world.def.maxStrokes) {
    world.status = 'fail';
    world.reason = 'limit';
    world.events.push({ type: 'fail', reason: 'limit' });
  } else {
    world.status = 'aim';
    world.events.push({ type: 'settle', x: ball.x, y: ball.y, forced: !!forced });
  }
}

function captureBall(world) {
  world.ball.vx = 0; world.ball.vy = 0;
  world.ball.trail.length = 0;
  world.status = 'clear';
  world.reason = 'hole';
  world.events.push({ type: 'capture', x: world.hole.x, y: world.hole.y, strokes: world.strokes });
}

/* A penalty costs a stroke and returns the ball to the lie it was played
   from — the stroke ledger stays the only score. */
function penalise(world, reason) {
  world.ball.vx = 0; world.ball.vy = 0;
  world.ball.trail.length = 0;
  world.strokes += 1;
  world.ball.x = world.lastLie.x;
  world.ball.y = world.lastLie.y;
  world.ball.armed = true;
  world.ball.lipOut = false;
  if (world.strokes >= world.def.maxStrokes) {
    world.status = 'fail';
    world.reason = reason;
    world.events.push({ type: 'fail', reason: reason });
  } else {
    world.status = 'aim';
    world.reason = '';
    world.events.push({ type: 'penalty', reason: reason, strokes: world.strokes });
  }
}

/* ── launching a shot ───────────────────────────────────────────────────── */
function launchShot(world, vx, vy) {
  var ball = world.ball;
  world.strokes += 1;
  world.lastLie = { x: ball.x, y: ball.y };
  ball.vx = vx; ball.vy = vy;
  ball.trail.length = 0;
  ball.armed = true;
  ball.lipOut = false;
  world.settleT = 0;
  world.status = 'flying';
  world.events.push({ type: 'launch', x: ball.x, y: ball.y, vx: vx, vy: vy });
  return world;
}

/* ── the predictor ──────────────────────────────────────────────────────── */
/* Replays the shot through a cloned world with the SAME stepCourse, cut short
   when the path enters a body's influence circle: the free part of the flight
   is shown as dots, the rest stays the player's read of the field. */
function predictorPath(world, vx, vy) {
  var pc = cfgGet('predictor', {});
  var maxSec = pc.maxSec || 2.2;
  var spacing = pc.dotSpacingPx || 26;
  var cutoff = cfgGet('bodies.predictorCutoffPx', 70);
  var hz = cfgGet('physics.subStepHz', 120);
  var dt = 1 / hz;

  var clone = {
    level: world.level, def: world.def, rect: world.rect, seed: 0,
    ball: { x: world.ball.x, y: world.ball.y, vx: vx, vy: vy, r: world.ball.r, armed: true, lipOut: false, trail: [] },
    hole: { x: world.hole.x, y: world.hole.y, r: world.hole.r },
    bodies: world.bodies.map(function (b) {
      return { id: b.id, kind: b.kind, x: b.x, y: b.y, r: b.r, m: b.m,
               horizon: b.horizon, orbit: b.orbit, spin: b.spin, grazed: false };
    }),
    worms: world.worms.map(function (w) {
      return { id: w.id, r: w.r, ax: w.ax, ay: w.ay, bx: w.bx, by: w.by,
               dirx: w.dirx, diry: w.diry, aAng: w.aAng, bAng: w.bAng };
    }),
    t: world.t, strokes: world.strokes,
    lastLie: { x: world.lastLie.x, y: world.lastLie.y },
    settleT: 0, status: 'flying', reason: '', events: [], particles: []
  };

  var points = [];
  var acc = 0;
  var last = { x: clone.ball.x, y: clone.ball.y };
  var steps = Math.round(maxSec * hz);
  var end = '';
  for (var s = 0; s < steps; s += 1) {
    stepCourse(clone, dt);
    for (var e = 0; e < clone.events.length; e += 1) {
      var ev = clone.events[e].type;
      if (ev === 'capture' || ev === 'settle') { end = end || ev; }
      else if (ev === 'warp' || ev === 'bounce' || ev === 'lipout') { end = end || ev; }
      else if (ev === 'swallow' || ev === 'penalty' || ev === 'fail') { end = end || 'hazard'; }
    }
    var bx = clone.ball.x, by = clone.ball.y;
    var seg = Math.sqrt((bx - last.x) * (bx - last.x) + (by - last.y) * (by - last.y));
    acc += seg;
    if (acc >= spacing) {
      acc = 0;
      points.push({ x: bx, y: by });
    }
    last.x = bx; last.y = by;
    if (end) break;
    /* influence cutoff: a fading question is more honest than a wrong line */
    var cut = false;
    for (var i = 0; i < clone.bodies.length; i += 1) {
      var b = clone.bodies[i];
      if (dist2(bx, by, b.x, b.y) < cutoff) { cut = true; break; }
    }
    for (i = 0; i < clone.worms.length; i += 1) {
      if (dist2(bx, by, clone.worms[i].ax, clone.worms[i].ay) < cutoff ||
          dist2(bx, by, clone.worms[i].bx, clone.worms[i].by) < cutoff) { cut = true; break; }
    }
    if (cut) { end = 'cut'; break; }
  }
  if (!end && clone.status !== 'flying') end = clone.status;
  if (clone.status === 'flying' && !end) points.push({ x: clone.ball.x, y: clone.ball.y, q: true });
  return { points: points, end: end, status: clone.status };
}

/* ── results ────────────────────────────────────────────────────────────── */
/* Stars for a cleared hole: 3 at par or better, 2 at par+1, 1 otherwise. */
function starsFor(def, strokes) {
  if (strokes <= def.par) return 3;
  if (strokes <= def.par + 1) return 2;
  return 1;
}

/* Compact signature of the judged state — proves same-seed replays agree. */
function stateSig(world) {
  var b = world.ball;
  return world.t.toFixed(3) + '|' + b.x.toFixed(3) + ',' + b.y.toFixed(3) + ',' +
    b.vx.toFixed(3) + ',' + b.vy.toFixed(3) + '|' + world.strokes + '|' +
    world.status + '|' + world.reason;
}

/* ── level validation ───────────────────────────────────────────────────── */
/* Runs in the browser and in the e2e harness: a hole that starts inside a
   planet, a cup buried in a body, or a cup reachable by a weightless straight
   shot would be a hole the player cannot win through skill. */
function validateLevels() {
  var problems = [];
  var rect = { x: 0, y: 0, w: 370, h: 490, cx: 185, cy: 245 };
  var levels = cfgGet('levels', []);
  if (!levels.length) problems.push('no holes defined');
  for (var i = 0; i < levels.length; i += 1) {
    var def = levels[i];
    var tag = 'hole ' + def.index + ' (' + def.id + ')';
    if (!(def.par > 0)) problems.push(tag + ': par must be positive');
    if (!(def.maxStrokes >= def.par)) problems.push(tag + ': stroke limit must be at least par');
    var w = buildWorld(def.index, rect);
    var ball = w.ball, hole = w.hole;
    var m = 10;
    if (ball.x < rect.x + m || ball.x > rect.x + rect.w - m || ball.y < rect.y + m || ball.y > rect.y + rect.h - m) {
      problems.push(tag + ': ball starts outside the course');
    }
    if (hole.x < rect.x + m || hole.x > rect.x + rect.w - m || hole.y < rect.y + m || hole.y > rect.y + rect.h - m) {
      problems.push(tag + ': cup outside the course');
    }
    var k;
    for (k = 0; k < w.bodies.length; k += 1) {
      var b = w.bodies[k];
      var need = bodySolid(b.kind) ? b.r + ball.r + 6
        : (b.kind === 'blackhole' ? b.horizon + ball.r + 6 : 0);
      if (need > 0) {
        if (dist2(ball.x, ball.y, b.x, b.y) < need) {
          problems.push(tag + ': ball starts inside body ' + k + ' (' + b.kind + ')');
        }
        if (dist2(hole.x, hole.y, b.x, b.y) < need + 14) {
          problems.push(tag + ': cup too close to body ' + k + ' (' + b.kind + ')');
        }
      }
    }
    for (k = 0; k < w.worms.length; k += 1) {
      var worm = w.worms[k];
      var rings = [{ x: worm.ax, y: worm.ay }, { x: worm.bx, y: worm.by }];
      for (var ri = 0; ri < rings.length; ri += 1) {
        var ring = rings[ri];
        if (dist2(ball.x, ball.y, ring.x, ring.y) < worm.r + ball.r + 6) {
          problems.push(tag + ': ball starts inside worm ring ' + ri);
        }
        if (dist2(hole.x, hole.y, ring.x, ring.y) < worm.r + hole.r) {
          problems.push(tag + ': cup overlaps worm ring ' + ri);
        }
        for (var bi = 0; bi < w.bodies.length; bi += 1) {
          var body = w.bodies[bi];
          var bodyR = bodySolid(body.kind) ? body.r + worm.r
            : (body.kind === 'blackhole' ? body.horizon + worm.r : 0);
          if (bodyR > 0 && dist2(ring.x, ring.y, body.x, body.y) < bodyR) {
            problems.push(tag + ': worm ring ' + ri + ' overlaps body ' + bi);
          }
        }
      }
    }
    /* orbit rings must never smash the cup or sweep the tee */
    for (k = 0; k < w.bodies.length; k += 1) {
      var ob = w.bodies[k];
      if (!ob.orbit) continue;
      var need2 = ob.r + Math.max(ball.r, hole.r) + 10;
      for (var s = 0; s <= 64; s += 1) {
        var sp = orbitPos(ob.orbit, s / 64 * ob.orbit.period);
        if (dist2(sp.x, sp.y, hole.x, hole.y) < need2) {
          problems.push(tag + ': orbit ' + k + ' smashes through the cup');
          break;
        }
        if (dist2(sp.x, sp.y, ball.x, ball.y) < need2) {
          problems.push(tag + ': orbit ' + k + ' sweeps the tee');
          break;
        }
      }
    }
    /* gravity necessity: a weightless straight max-power shot must not sink */
    if (!weightlessStraightBlocked(w)) {
      problems.push(tag + ': a weightless straight shot can sink - the field is not necessary');
    }
  }
  return problems;
}

/* Simulates a dead-straight full-power shot at the cup with every mass set to
   zero (no attraction at all): solids still block. Returns true when the
   route is blocked or the ball misses; false means the straight shot sinks,
   which would make the gravity field decorative on that hole. */
function weightlessStraightBlocked(w) {
  var phys = cfgGet('physics', {});
  var max = phys.launchSpeedMax || 900;
  var hz = phys.subStepHz || 120;
  var dt = 1 / hz;
  var dirx = w.hole.x - w.ball.x, diry = w.hole.y - w.ball.y;
  var len = Math.sqrt(dirx * dirx + diry * diry) || 1;
  var ball = {
    x: w.ball.x, y: w.ball.y,
    vx: dirx / len * max, vy: diry / len * max,
    r: w.ball.r, armed: true, lipOut: false
  };
  var drag = phys.dragPerSec || 0.7;
  var oob = phys.outOfBoundsPx || 14;
  var r = w.rect;
  var guard = 0;
  while (guard < 8 * hz) {
    guard += 1;
    var damp = Math.exp(-drag * dt);
    ball.vx *= damp;
    ball.vy *= damp;
    ball.x += ball.vx * dt;
    ball.y += ball.vy * dt;
    var hd = dist2(ball.x, ball.y, w.hole.x, w.hole.y);
    if (hd < w.hole.r) {
      var sp = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
      if (sp < (phys.holeCaptureSpeed || 260)) return false;   /* the straight shot sank */
      if (!ball.lipOut) ball.lipOut = true;
    }
    var i;
    for (i = 0; i < w.worms.length; i += 1) {
      var wm = w.worms[i];
      if (ball.armed && dist2(ball.x, ball.y, wm.ax, wm.ay) < wm.r) {
        var s2 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        ball.x = wm.bx; ball.y = wm.by;
        ball.vx = s2 * wm.dirx; ball.vy = s2 * wm.diry;
        ball.armed = false;
      } else if (ball.armed && dist2(ball.x, ball.y, wm.bx, wm.by) < wm.r) {
        var s3 = Math.sqrt(ball.vx * ball.vx + ball.vy * ball.vy);
        ball.x = wm.ax; ball.y = wm.ay;
        ball.vx = -s3 * wm.dirx; ball.vy = -s3 * wm.diry;
        ball.armed = false;
      }
    }
    for (i = 0; i < w.bodies.length; i += 1) {
      var body = w.bodies[i];
      var dx = ball.x - body.x, dy = ball.y - body.y;
      var d = Math.sqrt(dx * dx + dy * dy) || 1;
      if (body.kind === 'blackhole' && d < body.horizon + ball.r) return true;
      var solidR = bodySolid(body.kind) ? body.r + ball.r : 0;
      if (solidR > 0 && d < solidR) return true;
    }
    if (ball.x < r.x - oob || ball.x > r.x + r.w + oob ||
        ball.y < r.y - oob || ball.y > r.y + r.h + oob) return true;
  }
  return true;
}

/* A deliberately naive autopilot: fires dead at the cup from the current lie
   at a fixed power. Its job is not to play well but to prove the rules run
   and terminate; the harness also steers it into hazards on purpose. */
function autopilotVelocity(world) {
  var max = cfgGet('physics.launchSpeedMax', 900) * 0.82;
  var dx = world.hole.x - world.ball.x, dy = world.hole.y - world.ball.y;
  var len = Math.sqrt(dx * dx + dy * dy) || 1;
  return { vx: dx / len * max, vy: dy / len * max };
}

/* Drives a world forward with a velocity provider until it stops flying. */
function simulate(world, seconds, dt, velFn) {
  var hz = cfgGet('physics.subStepHz', 120);
  var sub = 1 / hz;
  var steps = Math.round(seconds / sub);
  for (var i = 0; i < steps; i += 1) {
    if (world.status === 'clear' || world.status === 'fail') break;
    if (world.status === 'aim') {
      var v = velFn(world);
      if (v) launchShot(world, v.vx, v.vy);
    }
    stepCourse(world, sub);
  }
  return world;
}


/* ===== 05-theme.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §5  THEME — one palette, chapters tint the field
   ═══════════════════════════════════════════════════════════════════════════ */

var THEME = cfgGet('theme', {});

/* Chapters shift the field's mood slightly: cold blue -> magenta -> violet.
   The tint is an overlay wash, never a recolor of gameplay elements. */
function chapterTint(def) {
  var tints = THEME.tint || ['#5CA8FF', '#FF4FD8', '#B98CFF'];
  var ch = def && def.chapter ? Number(def.chapter) : 1;
  return tints[clamp(ch, 1, tints.length) - 1];
}

function levelName(def) { return def ? pickLocale(def.name, def.id) : ''; }
function levelTeach(def) { return def ? pickLocale(def.teach, '') : ''; }


/* ===== 06-audio.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §6  AUDIO — every sound is synthesised with Web Audio, so no wav/ogg ships.
        A quiet ambient pad plays on the course; the juice table lives in the
        scene layer, which calls these one-shot voices.
   ═══════════════════════════════════════════════════════════════════════════ */

var SFX = (function () {
  var ctx = null;
  var master = null;
  var pad = null;
  var enabled = cfgGet('audio.enabled', true);
  var volume = cfgGet('audio.masterVolume', 0.4);

  function ac() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
      }
      /* WebViews may start the context suspended until the first interaction. */
      if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) { /* retried on next gesture */ } }
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tone(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.12;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = opts.type || 'triangle';
      osc.frequency.setValueAtTime(opts.freq, t0);
      if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.gain || 0.3), t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      var node = osc;
      if (opts.q) {
        var bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = opts.band || opts.freq;
        bp.Q.value = opts.q;
        osc.connect(bp);
        node = bp;
      }
      node.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is never allowed to break gameplay */ }
  }

  function noise(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.08;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource();
      src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = opts.filter || 'highpass';
      f.frequency.value = opts.freq || 900;
      var g = c.createGain();
      g.gain.value = opts.gain || 0.12;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0);
    } catch (e) { /* ignore */ }
  }

  /* Ambient pad: two detuned sines under a soft low-passed noise bed. */
  function ensurePad() {
    var c = ac();
    if (!c) return null;
    if (pad) return pad;
    try {
      var o1 = c.createOscillator();
      var o2 = c.createOscillator();
      var filter = c.createBiquadFilter();
      var gain = c.createGain();
      o1.type = 'sine';
      o1.frequency.value = 110;
      o2.type = 'sine';
      o2.frequency.value = 110.7;
      filter.type = 'lowpass';
      filter.frequency.value = 320;
      gain.gain.value = 0.0001;
      o1.connect(filter); o2.connect(filter);
      filter.connect(gain);
      gain.connect(master);
      o1.start(); o2.start();
      pad = { gain: gain };
    } catch (e) { pad = null; }
    return pad;
  }

  function setPad(on) {
    if (!enabled || !on) {
      if (pad) {
        try { pad.gain.gain.setTargetAtTime(0.0001, ctx.currentTime, 0.2); } catch (e) { /* ignore */ }
      }
      return;
    }
    var p = ensurePad();
    if (!p) return;
    try { p.gain.gain.setTargetAtTime(cfgGet('audio.padVolume', 0.045), ctx.currentTime, 0.4); } catch (e) { /* ignore */ }
  }

  return {
    launch: function (power) {
      var p = clamp(power, 0, 1);
      tone({ type: 'triangle', freq: 180 + 140 * p, to: 320 + 260 * p, dur: 0.12, gain: 0.18 });
      noise({ dur: 0.22, freq: 900, gain: 0.10 + 0.06 * p });
    },
    charge: function (level) {
      /* drag feedback: a rising filtered hum, throttled by the caller */
      tone({ type: 'sine', freq: 300 + 500 * level, dur: 0.05, gain: 0.05, q: 6, band: 500 + 600 * level });
    },
    bounce: function (speed) {
      var g = 0.05 + Math.min(0.14, (speed || 0) / 2200);
      tone({ type: 'sine', freq: 170, to: 95, dur: 0.09, gain: g });
      noise({ dur: 0.04, freq: 1400, gain: g * 0.6 });
    },
    nearmiss: function () {
      tone({ type: 'sine', freq: 320, to: 520, to2: 320, dur: 0.28, gain: 0.07 });
      tone({ type: 'sine', freq: 500, to: 320, dur: 0.26, gain: 0.05, delay: 0.14 });
    },
    lipout: function () {
      tone({ type: 'sine', freq: 130, dur: 0.08, gain: 0.14 });
      tone({ type: 'sine', freq: 130, dur: 0.08, gain: 0.12, delay: 0.09 });
    },
    capture: function (stars) {
      var notes = stars >= 3 ? [523, 659, 784, 1046, 1318] : (stars === 2 ? [523, 659, 784, 1046] : [523, 659, 784]);
      for (var i = 0; i < notes.length; i += 1) {
        tone({ type: 'triangle', freq: notes[i], dur: 0.20, gain: 0.18, delay: i * 0.075 });
      }
      if (stars >= 3) tone({ type: 'sine', freq: 2093, dur: 0.3, gain: 0.08, delay: 0.34 });
    },
    settle: function () {
      tone({ type: 'sine', freq: 95, dur: 0.08, gain: 0.10 });
    },
    swallow: function () {
      tone({ type: 'sawtooth', freq: 220, to: 60, dur: 0.7, gain: 0.16 });
      noise({ filter: 'lowpass', freq: 400, dur: 0.5, gain: 0.10 });
    },
    oob: function () {
      tone({ type: 'sine', freq: 75, dur: 0.16, gain: 0.14 });
      noise({ dur: 0.10, freq: 500, gain: 0.07 });
    },
    warp: function () {
      tone({ type: 'sine', freq: 620, to: 180, dur: 0.18, gain: 0.10 });
      tone({ type: 'sine', freq: 180, to: 620, dur: 0.16, gain: 0.10, delay: 0.12 });
    },
    fail: function () {
      tone({ type: 'square', freq: 220, to: 110, dur: 0.35, gain: 0.12 });
      tone({ type: 'sine', freq: 165, to: 82, dur: 0.45, gain: 0.10, delay: 0.10 });
    },
    win: function () {
      var notes = [523, 659, 784, 1046];
      for (var i = 0; i < notes.length; i += 1) {
        tone({ type: 'triangle', freq: notes[i], dur: 0.24, gain: 0.18, delay: i * 0.09 });
      }
    },
    click: function () { tone({ type: 'triangle', freq: 520, dur: 0.05, gain: 0.12 }); },
    unlock: function () { ac(); },
    setPad: setPad,
    setEnabled: function (v) {
      enabled = !!v;
      if (!enabled) setPad(false);
    },
    isEnabled: function () { return enabled; }
  };
})();


/* ===== 07-draw.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §7  DRAW — canvas primitives and the shared visual vocabulary.
        Everything is drawn live; no bitmap art is required to render a frame.
   ═══════════════════════════════════════════════════════════════════════════ */

var FONT_STACK = '"Segoe UI",system-ui,-apple-system,"PingFang SC","Hiragino Sans GB",' +
  '"Microsoft YaHei",sans-serif';

var _grainPattern = null;

function setFont(size, weight) {
  CTX.font = (weight || '700') + ' ' + Math.round(size * 10) / 10 + 'px ' + FONT_STACK;
}

function rgba(hex, a) {
  var h = String(hex).replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function roundRectPath(x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  CTX.beginPath();
  CTX.moveTo(x + rad, y);
  CTX.lineTo(x + w - rad, y);
  CTX.quadraticCurveTo(x + w, y, x + w, y + rad);
  CTX.lineTo(x + w, y + h - rad);
  CTX.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  CTX.lineTo(x + rad, y + h);
  CTX.quadraticCurveTo(x, y + h, x, y + h - rad);
  CTX.lineTo(x, y + rad);
  CTX.quadraticCurveTo(x, y, x + rad, y);
  CTX.closePath();
}

function roundRectOn(g, x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.lineTo(x + w - rad, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rad);
  g.lineTo(x + w, y + h - rad);
  g.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  g.lineTo(x + rad, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rad);
  g.lineTo(x, y + rad);
  g.quadraticCurveTo(x, y, x + rad, y);
  g.closePath();
}

function fillRR(x, y, w, h, r, fill) {
  roundRectPath(x, y, w, h, r);
  CTX.fillStyle = fill;
  CTX.fill();
}

function strokeRR(x, y, w, h, r, color, width) {
  roundRectPath(x, y, w, h, r);
  CTX.strokeStyle = color;
  CTX.lineWidth = width;
  CTX.stroke();
}

function vGrad(x, y, w, h, top, bottom) {
  var g = CTX.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}

function withShadow(color, blur, ox, oy, fn) {
  CTX.save();
  CTX.shadowColor = color;
  CTX.shadowBlur = blur;
  CTX.shadowOffsetX = ox || 0;
  CTX.shadowOffsetY = oy || 0;
  fn();
  CTX.restore();
}

/** Text with optional gradient fill, outline and shadow. Returns the width used. */
function TXT(str, x, y, o) {
  var opts = o || {};
  var size = opts.size || 16;
  var weight = opts.weight || '700';
  var maxW = opts.maxW || 0;
  setFont(size, weight);
  var text = String(str);
  if (maxW > 0) {
    var w = CTX.measureText(text).width;
    while (w > maxW && size > 7) {
      size -= 0.5;
      setFont(size, weight);
      w = CTX.measureText(text).width;
    }
  }
  CTX.save();
  CTX.textAlign = opts.align || 'center';
  CTX.textBaseline = opts.baseline || 'middle';
  if (opts.letterSpacing && 'letterSpacing' in CTX) CTX.letterSpacing = opts.letterSpacing;
  if (opts.alpha !== undefined) CTX.globalAlpha = opts.alpha;
  if (opts.shadow) {
    CTX.shadowColor = opts.shadow.color;
    CTX.shadowBlur = opts.shadow.blur || 0;
    CTX.shadowOffsetX = opts.shadow.ox || 0;
    CTX.shadowOffsetY = opts.shadow.oy || 0;
  }
  if (opts.outline) {
    CTX.lineJoin = 'round';
    CTX.lineCap = 'round';
    CTX.lineWidth = opts.outline.width || 4;
    CTX.strokeStyle = opts.outline.color;
    CTX.strokeText(text, x, y);
    CTX.shadowColor = 'rgba(0,0,0,0)';
  }
  if (opts.grad) {
    /* A gradient fill needs the text's bounding box, so the glyphs are drawn in
       left-aligned mode at a computed origin - re-using the current alignment
       here would centre the run a second time and shift it off the outline. */
    var tw = CTX.measureText(text).width;
    var left = CTX.textAlign === 'center' ? x - tw / 2 : (CTX.textAlign === 'right' ? x - tw : x);
    var g = CTX.createLinearGradient(0, y - size * 0.62, 0, y + size * 0.58);
    g.addColorStop(0, opts.grad[0]);
    g.addColorStop(1, opts.grad[1]);
    CTX.fillStyle = g;
    CTX.textAlign = 'left';
    CTX.fillText(text, left, y);
  } else {
    CTX.fillStyle = opts.color || '#000';
    CTX.fillText(text, x, y);
  }
  var used = CTX.measureText(text).width;
  CTX.restore();
  return used;
}

/** Four-point spark. */
function drawSpark(x, y, size, color, alpha) {
  CTX.save();
  CTX.globalAlpha = alpha === undefined ? 1 : alpha;
  CTX.translate(x, y);
  CTX.fillStyle = color;
  CTX.beginPath();
  CTX.moveTo(0, -size);
  CTX.quadraticCurveTo(size * 0.16, -size * 0.16, size, 0);
  CTX.quadraticCurveTo(size * 0.16, size * 0.16, 0, size);
  CTX.quadraticCurveTo(-size * 0.16, size * 0.16, -size, 0);
  CTX.quadraticCurveTo(-size * 0.16, -size * 0.16, 0, -size);
  CTX.fill();
  CTX.beginPath();
  CTX.arc(0, 0, size * 0.34, 0, TAU);
  CTX.fillStyle = 'rgba(255,255,255,0.95)';
  CTX.fill();
  CTX.restore();
}

/* ── word wrap and paragraphs ───────────────────────────────────────────── */

/* Word wrap that also works for Chinese, which has no spaces: CJK codepoints and
   punctuation become their own tokens while Latin runs stay whole. */
var _tokRe = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]|[^\s\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]+|\s+/g;

function wrapText(text, maxW, size, weight) {
  setFont(size, weight);
  var tokens = String(text).match(_tokRe) || [];
  var lines = [];
  var line = '';
  for (var i = 0; i < tokens.length; i += 1) {
    var tok = tokens[i];
    var candidate = line + tok;
    if (line !== '' && CTX.measureText(candidate).width > maxW) {
      lines.push(line.replace(/\s+$/, ''));
      line = /^\s+$/.test(tok) ? '' : tok;
    } else {
      line = candidate;
    }
  }
  if (line.replace(/\s+$/, '') !== '') lines.push(line.replace(/\s+$/, ''));
  return lines;
}

/** Draw wrapped text; returns the height consumed. */
function paragraph(text, x, y, maxW, o) {
  var opts = o || {};
  var size = opts.size || 13;
  var lh = size * (opts.lineHeight || 1.5);
  var lines = wrapText(text, maxW, size, opts.weight);
  for (var i = 0; i < lines.length; i += 1) {
    TXT(lines[i], x, y + lh * (i + 0.5), {
      size: size, weight: opts.weight, align: opts.align || 'left',
      color: opts.color, baseline: 'middle'
    });
  }
  return lines.length * lh;
}

function paragraphHeight(text, maxW, size, weight, lineHeight) {
  return wrapText(text, maxW, size, weight).length * size * (lineHeight || 1.5);
}

/* ── composite widgets ──────────────────────────────────────────────────── */

function drawCard(x, y, w, h, r, o) {
  var theme = THEME;
  var opts = o || {};
  var bg = opts.bg || theme.cardBg;
  withShadow('rgba(0,0,0,0.34)', opts.shadowBlur === undefined ? 12 : opts.shadowBlur, 0, 5, function () {
    fillRR(x, y, w, h, r, bg);
  });
  roundRectPath(x + 1, y + 1, w - 2, h * 0.5, r * 0.9);
  CTX.strokeStyle = 'rgba(255,255,255,0.14)';
  CTX.lineWidth = 1.2;
  CTX.stroke();
  strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, r, rgba(theme.edge, 0.9), 1.2);
}

function drawChip(x, y, w, h, label, active, o) {
  var theme = THEME;
  var opts = o || {};
  if (active) {
    withShadow(rgba(theme.primary, 0.5), 10, 0, 3, function () {
      fillRR(x, y, w, h, h / 2, vGrad(x, y, w, h, theme.btnGrad[0], theme.btnGrad[1]));
    });
    TXT(label, x + w / 2, y + h / 2 + 0.5, {
      size: opts.size || 14, color: theme.btnText, maxW: w - 10, weight: '800'
    });
  } else {
    fillRR(x, y, w, h, h / 2, opts.bg || 'rgba(255,255,255,0.08)');
    strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, h / 2, rgba(theme.edge, 0.8), 1);
    TXT(label, x + w / 2, y + h / 2 + 0.5, { size: opts.size || 14, color: theme.muted, maxW: w - 10 });
  }
}

function drawButton(x, y, w, h, label, pressed, o) {
  var theme = THEME;
  var opts = o || {};
  var dy = pressed ? 1.5 : 0;
  var top = opts.grad ? opts.grad[0] : theme.btnGrad[0];
  var bot = opts.grad ? opts.grad[1] : theme.btnGrad[1];
  fillRR(x, y + 3.5, w, h, h / 2, 'rgba(0,0,0,0.35)');
  withShadow(rgba(theme.primary, 0.55), 14, 0, 5, function () {
    fillRR(x, y + dy, w, h, h / 2, vGrad(x, y + dy, w, h, top, bot));
  });
  roundRectPath(x + 3, y + dy + 2.5, w - 6, h * 0.42, h * 0.22);
  CTX.strokeStyle = 'rgba(255,255,255,0.34)';
  CTX.lineWidth = 1.4;
  CTX.stroke();
  TXT(label, x + w / 2, y + dy + h / 2 + 0.5, {
    size: opts.size || 20, color: opts.color || theme.btnText, maxW: w - 22,
    letterSpacing: opts.letterSpacing || '0px', weight: '800'
  });
}

/* ── game sprites, painted once into offscreen bitmaps ──────────────────── */
/* A hole draws up to six bodies plus particles per frame. Re-running gradient
   construction for each of those every frame is the single most expensive thing
   this game could do, so bodies are stamped into small offscreen canvases and
   blitted from then on. */

var _spriteCache = {};
var _spriteStamp = '';

function spriteStamp() {
  return Math.round(LAY.scale * VIEW.dpr * 100);
}

function spriteKey(parts) { return parts.join('|'); }

function spritePad() { return 4; }

function makeSprite(span, paint) {
  var s = Math.max(0.5, LAY.scale * VIEW.dpr);
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(span * s));
  c.height = Math.max(2, Math.ceil(span * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  paint(g, span / 2, span / 2);
  return { canvas: c, span: span };
}

function cachedSprite(key, span, paint) {
  var stamp = spriteStamp();
  if (stamp !== _spriteStamp) { _spriteCache = {}; _spriteStamp = stamp; }
  var hit = _spriteCache[key];
  if (hit) return hit;
  hit = makeSprite(span, paint);
  _spriteCache[key] = hit;
  return hit;
}

/* ── planets ────────────────────────────────────────────────────────────── */
function planetTint(kind) {
  var theme = THEME;
  if (kind === 'ice') return theme.iceTint;
  if (kind === 'giant') return theme.giantTint;
  return theme.rockTint;
}

/** A planet portrait: shaded sphere, terminator shadow, per-kind surface marks. */
function paintPlanet(g, cx, cy, r, kind, id) {
  var tint = planetTint(kind);
  g.save();
  g.translate(cx, cy);
  var base = g.createRadialGradient(-r * 0.35, -r * 0.35, r * 0.1, 0, 0, r);
  base.addColorStop(0, tint[0]);
  base.addColorStop(0.72, tint[1]);
  base.addColorStop(1, rgba(tint[1], 0.55));
  g.beginPath();
  g.arc(0, 0, r, 0, TAU);
  g.fillStyle = base;
  g.fill();
  g.strokeStyle = rgba(tint[0], 0.85);
  g.lineWidth = Math.max(1, r * 0.06);
  g.stroke();

  /* terminator: a dark crescent keeps the sphere reading as lit from one side */
  g.save();
  roundRectOn(g, 0, 0, 0, 0, 0); /* no-op keeps save/restore balanced */
  g.restore();

  /* seeded surface detail */
  var rnd = mulberry32((id + 1) * 2654435761 >>> 0);
  if (kind === 'rock') {
    g.fillStyle = rgba(tint[1], 0.65);
    var craters = 5 + Math.floor(rnd() * 3);
    for (var c = 0; c < craters; c += 1) {
      var ca = rnd() * TAU, cd = rnd() * r * 0.68, cr = r * (0.08 + rnd() * 0.12);
      g.beginPath();
      g.arc(Math.cos(ca) * cd, Math.sin(ca) * cd, cr, 0, TAU);
      g.fill();
    }
  } else if (kind === 'ice') {
    g.strokeStyle = 'rgba(255,255,255,0.75)';
    g.lineWidth = Math.max(1.2, r * 0.07);
    g.beginPath();
    g.arc(0, 0, r * 0.78, -Math.PI * 0.85, -Math.PI * 0.35);
    g.stroke();
    g.beginPath();
    g.arc(0, 0, r * 0.55, -Math.PI * 0.8, -Math.PI * 0.55);
    g.stroke();
  } else if (kind === 'giant') {
    g.save();
    g.beginPath();
    g.arc(0, 0, r, 0, TAU);
    g.clip();
    for (var band = 0; band < 4; band += 1) {
      g.fillStyle = band % 2 ? rgba(tint[0], 0.5) : rgba('#FFFFFF', 0.16);
      var by = -r + (band + 0.5) * (2 * r / 4);
      g.fillRect(-r, by - r * 0.09, 2 * r, r * 0.18);
    }
    g.restore();
  }
  g.restore();
}

function drawPlanet(b, time) {
  var span = b.r * 2.3 + spritePad();
  var spr = cachedSprite(spriteKey(['planet', b.kind, Math.round(b.r * 10), b.id]), span, function (g, cx, cy) {
    paintPlanet(g, cx, cy, b.r, b.kind, b.id);
  });
  CTX.save();
  CTX.translate(b.x, b.y);
  if (b.kind === 'giant') CTX.rotate(b.spin * 0.35);
  CTX.drawImage(spr.canvas, -spr.span / 2, -spr.span / 2, spr.span, spr.span);
  CTX.restore();
}

/** Black hole: dark core, magenta accretion ring, rotating dashed rim. */
function drawBlackHole(b, time, showInfluence) {
  var theme = THEME;
  CTX.save();
  CTX.translate(b.x, b.y);

  var infl = cfgGet('bodies.blackhole.well', 90);
  if (showInfluence) {
    CTX.save();
    CTX.globalAlpha = 0.4 + 0.2 * Math.sin(time * 2.4);
    CTX.beginPath();
    CTX.arc(0, 0, infl, 0, TAU);
    CTX.setLineDash([4, 7]);
    CTX.strokeStyle = rgba(theme.bhRing, 0.55);
    CTX.lineWidth = 1.2;
    CTX.stroke();
    CTX.setLineDash([]);
    CTX.restore();
  }

  var glow = CTX.createRadialGradient(0, 0, b.horizon * 0.4, 0, 0, b.horizon * 2.4);
  glow.addColorStop(0, 'rgba(6,2,14,0.98)');
  glow.addColorStop(0.55, rgba(theme.bhCore, 0.9));
  glow.addColorStop(1, rgba(theme.bhCore, 0));
  CTX.beginPath();
  CTX.arc(0, 0, b.horizon * 2.4, 0, TAU);
  CTX.fillStyle = glow;
  CTX.fill();

  CTX.save();
  CTX.rotate(time * 1.4);
  CTX.setLineDash([6, 5]);
  CTX.beginPath();
  CTX.arc(0, 0, b.horizon * 1.55, 0, TAU);
  CTX.strokeStyle = theme.bhRing;
  CTX.lineWidth = 2;
  CTX.stroke();
  CTX.setLineDash([]);
  CTX.restore();

  CTX.beginPath();
  CTX.arc(0, 0, b.horizon, 0, TAU);
  CTX.fillStyle = '#04010A';
  CTX.fill();
  CTX.beginPath();
  CTX.arc(0, 0, b.horizon, 0, TAU);
  CTX.strokeStyle = rgba(theme.bhRing, 0.9);
  CTX.lineWidth = 1.4;
  CTX.stroke();
  CTX.restore();
}

/** Repulsor: violet pulsing concentric rings. */
function drawRepulsor(b, time) {
  var theme = THEME;
  CTX.save();
  CTX.translate(b.x, b.y);
  var core = CTX.createRadialGradient(0, 0, 0, 0, 0, b.r);
  core.addColorStop(0, 'rgba(40,20,80,0.95)');
  core.addColorStop(1, rgba(theme.repulsor, 0.15));
  CTX.beginPath();
  CTX.arc(0, 0, b.r, 0, TAU);
  CTX.fillStyle = core;
  CTX.fill();
  for (var i = 0; i < 3; i += 1) {
    var ph = ((time * 0.5 + i / 3) % 1);
    var rr = b.r * (0.3 + ph * 0.95);
    CTX.beginPath();
    CTX.arc(0, 0, rr, 0, TAU);
    CTX.strokeStyle = rgba(theme.repulsor, 0.42 * (1 - ph));
    CTX.lineWidth = 1.8;
    CTX.stroke();
  }
  CTX.beginPath();
  CTX.arc(0, 0, b.r * 0.4, 0, TAU);
  CTX.fillStyle = rgba(theme.repulsor, 0.85);
  CTX.fill();
  CTX.restore();
}

/* ── wormhole pair ──────────────────────────────────────────────────────── */
function drawWormRing(x, y, r, color, ang, time) {
  CTX.save();
  CTX.translate(x, y);
  var glow = CTX.createRadialGradient(0, 0, r * 0.2, 0, 0, r * 1.5);
  glow.addColorStop(0, rgba(color, 0.30));
  glow.addColorStop(1, rgba(color, 0));
  CTX.beginPath();
  CTX.arc(0, 0, r * 1.5, 0, TAU);
  CTX.fillStyle = glow;
  CTX.fill();
  CTX.save();
  CTX.rotate(ang);
  for (var i = 0; i < 3; i += 1) {
    CTX.beginPath();
    CTX.arc(0, 0, r * (0.4 + i * 0.26), i * 1.1, i * 1.1 + 2.2);
    CTX.strokeStyle = rgba(color, 0.85 - i * 0.22);
    CTX.lineWidth = 2.2 - i * 0.4;
    CTX.stroke();
  }
  CTX.restore();
  CTX.beginPath();
  CTX.arc(0, 0, r * 0.22, 0, TAU);
  CTX.fillStyle = 'rgba(255,255,255,0.9)';
  CTX.fill();
  CTX.restore();
}

function drawWorms(worms, time) {
  var theme = THEME;
  for (var i = 0; i < worms.length; i += 1) {
    var w = worms[i];
    drawWormRing(w.ax, w.ay, w.r, theme.wormA, w.aAng, time);
    drawWormRing(w.bx, w.by, w.r, theme.wormB, w.bAng, time);
    /* faint transit axis so the pair reads as connected */
    CTX.save();
    CTX.setLineDash([3, 9]);
    CTX.strokeStyle = rgba(theme.wormA, 0.16);
    CTX.lineWidth = 1;
    CTX.beginPath();
    CTX.moveTo(w.ax, w.ay);
    CTX.lineTo(w.bx, w.by);
    CTX.stroke();
    CTX.setLineDash([]);
    CTX.restore();
  }
}

/* ── the cup ────────────────────────────────────────────────────────────── */
function drawCup(hole, time) {
  var theme = THEME;
  var pulse = 0.9 + 0.1 * Math.sin(time * 2.6);
  CTX.save();
  CTX.translate(hole.x, hole.y);
  var glow = CTX.createRadialGradient(0, 0, hole.r * 0.3, 0, 0, hole.r * 2.2);
  glow.addColorStop(0, rgba(theme.hole, 0.35));
  glow.addColorStop(1, rgba(theme.hole, 0));
  CTX.beginPath();
  CTX.arc(0, 0, hole.r * 2.2, 0, TAU);
  CTX.fillStyle = glow;
  CTX.fill();

  CTX.beginPath();
  CTX.arc(0, 0, hole.r * 0.86, 0, TAU);
  CTX.fillStyle = 'rgba(8,10,24,0.85)';
  CTX.fill();
  /* interior star swirl */
  CTX.save();
  CTX.beginPath();
  CTX.arc(0, 0, hole.r * 0.86, 0, TAU);
  CTX.clip();
  CTX.rotate(time * 0.9);
  for (var i = 0; i < 5; i += 1) {
    var a = i * TAU / 5;
    CTX.beginPath();
    CTX.arc(Math.cos(a) * hole.r * 0.4, Math.sin(a) * hole.r * 0.4, 1.3, 0, TAU);
    CTX.fillStyle = 'rgba(255,255,255,0.5)';
    CTX.fill();
  }
  CTX.restore();

  CTX.beginPath();
  CTX.arc(0, 0, hole.r, 0, TAU);
  CTX.strokeStyle = rgba(theme.hole, 0.95);
  CTX.lineWidth = 2.4;
  CTX.stroke();
  CTX.beginPath();
  CTX.arc(0, 0, hole.r * pulse, 0, TAU);
  CTX.strokeStyle = 'rgba(255,255,255,0.65)';
  CTX.lineWidth = 1.2;
  CTX.stroke();
  CTX.restore();
}

/* ── the ball ───────────────────────────────────────────────────────────── */
function drawBall(x, y, r, alpha) {
  var theme = THEME;
  CTX.save();
  CTX.globalAlpha = alpha === undefined ? 1 : alpha;
  var grad = CTX.createRadialGradient(x - r * 0.3, y - r * 0.3, r * 0.2, x, y, r);
  grad.addColorStop(0, '#FFFFFF');
  grad.addColorStop(0.7, theme.ball);
  grad.addColorStop(1, theme.ballEdge);
  CTX.beginPath();
  CTX.arc(x, y, r, 0, TAU);
  CTX.fillStyle = grad;
  CTX.fill();
  CTX.strokeStyle = rgba(theme.ballEdge, 0.9);
  CTX.lineWidth = 1.2;
  CTX.stroke();
  /* dimple hint: two small arcs */
  CTX.strokeStyle = 'rgba(120,150,220,0.5)';
  CTX.lineWidth = 0.8;
  CTX.beginPath();
  CTX.arc(x, y, r * 0.55, 0.5, 2.1);
  CTX.stroke();
  CTX.restore();
}

function drawTrail(ball, color) {
  var n = ball.trail.length;
  if (n < 2) return;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  CTX.lineCap = 'round';
  for (var k = n - 1; k > 0; k -= 1) {
    var a = ball.trail[k], b2 = ball.trail[k - 1];
    var t = 1 - k / n;
    CTX.globalAlpha = t * t * 0.5;
    CTX.strokeStyle = color;
    CTX.lineWidth = 0.6 + t * 2.8;
    CTX.beginPath();
    CTX.moveTo(a.x, a.y);
    CTX.lineTo(b2.x, b2.y);
    CTX.stroke();
  }
  CTX.restore();
}

/** Aim slingshot band + power ring, drawn from the ball to the drag point. */
function drawAim(ball, dragX, dragY, power, path, time) {
  var theme = THEME;
  var col = power > 0.66 ? theme.warn : (power > 0.33 ? theme.accent : theme.primary);
  CTX.save();

  /* the pull band: from the ball back to the drag point */
  CTX.globalCompositeOperation = 'lighter';
  CTX.beginPath();
  CTX.moveTo(ball.x, ball.y);
  CTX.lineTo(dragX, dragY);
  CTX.setLineDash([4, 5]);
  CTX.strokeStyle = rgba(col, 0.55);
  CTX.lineWidth = 1.6;
  CTX.stroke();
  CTX.setLineDash([]);
  CTX.beginPath();
  CTX.arc(dragX, dragY, 7 + 2 * Math.sin(time * 6), 0, TAU);
  CTX.strokeStyle = rgba(col, 0.8);
  CTX.lineWidth = 1.4;
  CTX.stroke();
  CTX.globalCompositeOperation = 'source-over';

  /* power ring around the ball */
  CTX.beginPath();
  CTX.arc(ball.x, ball.y, ball.r + 9, -Math.PI / 2, -Math.PI / 2 + TAU * clamp(power, 0, 1));
  CTX.strokeStyle = col;
  CTX.lineWidth = 3;
  CTX.lineCap = 'round';
  CTX.stroke();

  /* the dotted preview, cut short by the influence rule */
  if (path && path.points && path.points.length) {
    CTX.save();
    CTX.globalCompositeOperation = 'lighter';
    for (var i = 0; i < path.points.length; i += 1) {
      var p = path.points[i];
      var fade = 1 - i / path.points.length;
      if (p.q) {
        /* the "unknown" tail: a fading question mark point */
        CTX.globalAlpha = 0.5;
        CTX.beginPath();
        CTX.arc(p.x, p.y, 3, 0, TAU);
        CTX.strokeStyle = 'rgba(255,255,255,0.6)';
        CTX.lineWidth = 1.2;
        CTX.stroke();
        TXT('?', p.x, p.y - 8, { size: 11, color: 'rgba(255,255,255,0.55)', weight: '800' });
      } else {
        CTX.globalAlpha = 0.25 + 0.6 * fade;
        CTX.beginPath();
        CTX.arc(p.x, p.y, 2.1, 0, TAU);
        CTX.fillStyle = theme.text;
        CTX.fill();
      }
    }
    CTX.restore();
  }
  CTX.restore();
}

/* ── particles ──────────────────────────────────────────────────────────── */
/* Particles are decorative only: nothing here feeds a judgement, which is why
   this is the one place a random number is allowed. */

function spawnParticles(world, x, y, count, color, speed, life, size) {
  var cap = cfgGet('anim.particleCap', 220);
  for (var i = 0; i < count; i += 1) {
    if (world.particles.length >= cap) break;
    var a = Math.random() * TAU;
    var sp = speed * (0.35 + Math.random() * 0.9);
    var lf = life * (0.6 + Math.random() * 0.8);
    world.particles.push({
      x: x, y: y, vx: Math.cos(a) * sp, vy: Math.sin(a) * sp,
      life: lf, max: lf, color: color, size: size * (0.6 + Math.random() * 0.9), drag: 1.6
    });
  }
}

function stepParticles(world, dt) {
  var list = world.particles;
  for (var i = list.length - 1; i >= 0; i -= 1) {
    var p = list[i];
    p.life -= dt;
    if (p.life <= 0) { list.splice(i, 1); continue; }
    var damp = Math.max(0, 1 - p.drag * dt);
    p.vx *= damp;
    p.vy *= damp;
    p.x += p.vx * dt;
    p.y += p.vy * dt;
  }
}

function drawParticles(world) {
  var list = world.particles;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  for (var i = 0; i < list.length; i += 1) {
    var p = list[i];
    var a = Math.max(0, p.life / p.max);
    CTX.globalAlpha = a;
    CTX.fillStyle = p.color;
    CTX.beginPath();
    CTX.arc(p.x, p.y, p.size * (0.4 + a * 0.6), 0, TAU);
    CTX.fill();
  }
  CTX.restore();
}

/* ── the game mark: ball arcing around a planet into the cup ───────────── */
function drawMark(cx, cy, size, t) {
  var theme = THEME;
  var pulse = t ? 1 + Math.sin(t * 3.1) * 0.05 : 1;
  var r = size * 0.09;
  CTX.save();
  CTX.translate(cx, cy);
  CTX.scale(pulse, pulse);
  /* planet */
  var pr = size * 0.17;
  var pg = CTX.createRadialGradient(-size * 0.03, -size * 0.02, pr * 0.2, 0, 0, pr);
  pg.addColorStop(0, theme.giantTint[0]);
  pg.addColorStop(1, theme.giantTint[1]);
  CTX.beginPath();
  CTX.arc(0, -size * 0.02, pr, 0, TAU);
  CTX.fillStyle = pg;
  CTX.fill();
  /* dotted trajectory: a curve from bottom-left, around the planet, to the cup */
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  CTX.setLineDash([2.5, 4]);
  CTX.lineCap = 'round';
  CTX.beginPath();
  CTX.moveTo(-size * 0.30, size * 0.30);
  CTX.quadraticCurveTo(-size * 0.02, size * 0.02, size * 0.30, -size * 0.24);
  CTX.strokeStyle = theme.ballEdge;
  CTX.lineWidth = size * 0.022;
  CTX.stroke();
  CTX.setLineDash([]);
  CTX.restore();
  /* cup */
  CTX.beginPath();
  CTX.arc(size * 0.30, -size * 0.24, size * 0.075, 0, TAU);
  CTX.strokeStyle = theme.hole;
  CTX.lineWidth = size * 0.028;
  CTX.stroke();
  /* ball */
  drawBall(-size * 0.30, size * 0.30, r, 1);
  CTX.restore();
}

/* ── background ─────────────────────────────────────────────────────────── */
var _deco = [];
var _starFar = null;
var _bgCache = null;

function resetDeco() {
  _deco = [];
  _starFar = null;
  _bgCache = null;
  _spriteCache = {};
  _spriteStamp = '';
  _grainPattern = null;
}

function ensureDeco() {
  if (_deco.length) return;
  var rnd = mulberry32(20260911);
  var i;
  for (i = 0; i < 40; i += 1) {
    _deco.push({
      x: rnd() * LAY.DW, y: rnd() * LAY.DH,
      r: 0.7 + rnd() * 1.5, ph: rnd() * TAU,
      sp: 0.5 + rnd() * 1.6, warm: rnd() < 0.28
    });
  }
  for (i = 0; i < 120; i += 1) {
    _deco.push({
      x: rnd() * LAY.DW, y: rnd() * LAY.DH,
      r: 0.5 + rnd() * 0.9, ph: rnd() * TAU,
      sp: 0.3 + rnd() * 0.9, warm: rnd() < 0.22, far: true
    });
  }
}

/* The far star layer never changes, so it is stamped once into a bitmap. */
function starFarBitmap() {
  if (_starFar && _starFar.stamp === spriteStamp()) return _starFar;
  var s = Math.max(0.5, LAY.scale * VIEW.dpr);
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(LAY.DW * s));
  c.height = Math.max(2, Math.ceil(LAY.DH * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  var theme = THEME;
  for (var i = 0; i < _deco.length; i += 1) {
    var d = _deco[i];
    if (!d.far) continue;
    g.globalAlpha = 0.30 + (d.warm ? 0.22 : 0);
    g.fillStyle = d.warm ? theme.starB : theme.starA;
    g.beginPath();
    g.arc(d.x, d.y, d.r, 0, TAU);
    g.fill();
  }
  _starFar = { canvas: c, stamp: spriteStamp() };
  return _starFar;
}

/* Everything static — base gradient, nebulae, far stars, the course panel and
   its grain — is composed once into a single viewport-sized bitmap. Only the
   near stars still twinkle, and the course border is stroked live so it stays
   crisp at native density. */
var BG_MAX_SCALE = 1.5;

function backgroundBitmap(arena) {
  var stamp = spriteStamp() + ':' + Math.round(VIEW.vw) + 'x' + Math.round(VIEW.vh) +
    ':' + Math.round(arena ? arena.w : 0) + 'x' + Math.round(arena ? arena.h : 0);
  if (_bgCache && _bgCache.stamp === stamp) return _bgCache;

  var s = Math.max(0.5, Math.min(BG_MAX_SCALE, LAY.scale * VIEW.dpr));
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(VIEW.vw * s));
  c.height = Math.max(2, Math.ceil(VIEW.vh * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);
  var theme = THEME;

  var base = g.createLinearGradient(0, 0, 0, VIEW.vh);
  base.addColorStop(0, theme.bg[0]);
  base.addColorStop(1, theme.bg[1]);
  g.fillStyle = base;
  g.fillRect(0, 0, VIEW.vw, VIEW.vh);

  g.save();
  g.translate(LAY.stageX, LAY.stageY);
  g.scale(LAY.scale, LAY.scale);

  /* two soft nebulae so a large dark field is not perfectly flat */
  var n1 = g.createRadialGradient(LAY.DW * 0.22, LAY.DH * 0.20, 4, LAY.DW * 0.22, LAY.DH * 0.20, LAY.DW * 0.75);
  n1.addColorStop(0, rgba(theme.primary, 0.13));
  n1.addColorStop(1, rgba(theme.primary, 0));
  g.fillStyle = n1;
  g.fillRect(0, 0, LAY.DW, LAY.DH);
  var n2 = g.createRadialGradient(LAY.DW * 0.84, LAY.DH * 0.78, 4, LAY.DW * 0.84, LAY.DH * 0.78, LAY.DW * 0.7);
  n2.addColorStop(0, rgba(theme.tint[2], 0.11));
  n2.addColorStop(1, rgba(theme.tint[2], 0));
  g.fillStyle = n2;
  g.fillRect(0, 0, LAY.DW, LAY.DH);

  g.drawImage(starFarBitmap().canvas, 0, 0, LAY.DW, LAY.DH);

  if (arena) {
    var ax = arena.x - 5, ay = arena.y - 5, aw = arena.w + 10, ah = arena.h + 10;
    roundRectOn(g, ax, ay, aw, ah, 14);
    g.fillStyle = 'rgba(255,255,255,0.035)';
    g.fill();
    var gi = assetImage('grain');
    if (gi) {
      try {
        if (!_grainPattern) _grainPattern = g.createPattern(gi, 'repeat');
        if (_grainPattern) {
          g.save();
          roundRectOn(g, ax, ay, aw, ah, 14);
          g.clip();
          g.globalAlpha = 0.07;
          g.fillStyle = _grainPattern;
          g.fillRect(ax, ay, aw, ah);
          g.restore();
        }
      } catch (e) { /* pattern unsupported: skip the texture */ }
    }
  }
  g.restore();

  _bgCache = { canvas: c, stamp: stamp };
  return _bgCache;
}

/** Blit the pre-composed background (with the course panel baked in). */
function drawGameBackground(t, time, arena) {
  ensureDeco();
  var bg = backgroundBitmap(arena);
  CTX.drawImage(bg.canvas, 0, 0, VIEW.vw, VIEW.vh);
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  var theme = THEME;
  for (var i = 0; i < _deco.length; i += 1) {
    var d = _deco[i];
    if (d.far) continue;
    var tw = 0.45 + 0.55 * (Math.sin(time * d.sp + d.ph) * 0.5 + 0.5);
    CTX.globalAlpha = tw;
    CTX.fillStyle = d.warm ? theme.starB : theme.starA;
    CTX.beginPath();
    CTX.arc(d.x + Math.sin(time * 0.11 + d.ph) * 3.2, d.y + Math.cos(time * 0.09 + d.ph) * 2.4, d.r, 0, TAU);
    CTX.fill();
  }
  CTX.globalAlpha = 1;
  CTX.restore();
}

/** Paper grain, tiled from assets/grain.png - skipped entirely if unavailable. */
function drawGrain(x, y, w, h, alpha) {
  var img = assetImage('grain');
  if (!img) return;
  if (!_grainPattern) {
    try { _grainPattern = CTX.createPattern(img, 'repeat'); } catch (e) { _grainPattern = null; }
  }
  if (!_grainPattern) return;
  CTX.save();
  CTX.beginPath();
  CTX.rect(x, y, w, h);
  CTX.clip();
  CTX.globalAlpha = alpha === undefined ? 0.08 : alpha;
  CTX.fillStyle = _grainPattern;
  CTX.fillRect(x, y, w, h);
  CTX.restore();
}


/* ===== 08-ui.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §8  UI — immediate-mode hit regions, press feedback, toast, modal
   ═══════════════════════════════════════════════════════════════════════════ */

/* Regions are registered while drawing (design units), then hit-tested on input.
   Later registrations sit on top, so the lookup walks backwards. */
var HITS = [];
var PRESS = { id: null, x: 0, y: 0, t: 0, moved: false };
var TOAST = { text: '', t: 0, life: 0 };

function resetHits() { HITS.length = 0; }

function HIT(id, x, y, w, h) {
  HITS.push({ id: id, x: x, y: y, w: w, h: h });
  return { id: id, x: x, y: y, w: w, h: h };
}

function pickHit(x, y) {
  for (var i = HITS.length - 1; i >= 0; i -= 1) {
    var r = HITS[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
  }
  return null;
}

function isPressed(id) { return PRESS.id === id; }

function toast(text) {
  TOAST.text = text;
  TOAST.t = 0;
  TOAST.life = 1.8;
}

function drawToast(dt) {
  if (TOAST.life <= 0) return;
  TOAST.life -= dt;
  TOAST.t += dt;
  var p = clamp(TOAST.t / 0.22, 0, 1);
  var out = clamp(TOAST.life / 0.4, 0, 1);
  var a = Math.min(p, out);
  var y = LAY.contentBottom - 46 - (1 - easeOutCubic(p)) * 16;
  CTX.save();
  CTX.globalAlpha = a;
  setFont(14, '700');
  var w = Math.min(LAY.contentRight - LAY.contentLeft - 20, CTX.measureText(TOAST.text).width + 34);
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  withShadow('rgba(4,8,20,0.30)', 14, 0, 5, function () {
    fillRR(x, y, w, 34, 17, rgba(THEME.edge, 0.95));
  });
  TXT(TOAST.text, x + w / 2, y + 17.5, { size: 14, color: '#F0F5FF', maxW: w - 20 });
  CTX.restore();
}

/** Small round icon button (language switch, pause, etc). */
function drawRoundButton(id, cx, cy, r, label, o) {
  var theme = THEME;
  var opts = o || {};
  var pressed = isPressed(id);
  var scale = pressed ? 0.93 : 1;
  CTX.save();
  CTX.translate(cx, cy);
  CTX.scale(scale, scale);
  withShadow('rgba(4,8,20,0.22)', 9, 0, 3, function () {
    CTX.beginPath();
    CTX.arc(0, 0, r, 0, TAU);
    CTX.fillStyle = opts.bg || 'rgba(255,255,255,0.14)';
    CTX.fill();
  });
  CTX.beginPath();
  CTX.arc(0, 0, r * 0.94, 0, TAU);
  CTX.strokeStyle = 'rgba(255,255,255,0.5)';
  CTX.lineWidth = 1.1;
  CTX.stroke();
  TXT(label, 0, 1, { size: opts.size || r * 0.86, color: opts.color || theme.text, weight: '800' });
  CTX.restore();
  HIT(id, cx - r, cy - r, r * 2, r * 2);
}

/** Screen header: back affordance on the left, centred title. */
function drawHeader(title, backId, time) {
  var cy = LAY.contentTop + 18;
  var theme = THEME;
  if (backId) {
    var r = 16;
    var cx = LAY.contentLeft + r;
    var pressed = isPressed(backId);
    CTX.save();
    CTX.translate(cx, cy);
    CTX.scale(pressed ? 0.93 : 1, pressed ? 0.93 : 1);
    withShadow('rgba(4,8,20,0.20)', 8, 0, 3, function () {
      CTX.beginPath();
      CTX.arc(0, 0, r, 0, TAU);
      CTX.fillStyle = 'rgba(255,255,255,0.14)';
      CTX.fill();
    });
    CTX.beginPath();
    CTX.moveTo(4, -6); CTX.lineTo(-3, 0); CTX.lineTo(4, 6);
    CTX.strokeStyle = theme.text; CTX.lineWidth = 2.4; CTX.lineCap = 'round'; CTX.lineJoin = 'round';
    CTX.stroke();
    CTX.restore();
    HIT(backId, cx - r, cy - r, r * 2, r * 2);
  }
  TXT(title, (LAY.contentLeft + LAY.contentRight) / 2, cy, {
    size: 19, color: theme.text, maxW: LAY.contentRight - LAY.contentLeft - 80,
