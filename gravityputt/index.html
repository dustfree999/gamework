    shadow: { color: 'rgba(255,255,255,0.4)', blur: 3, oy: 1 }
  });
  return cy;
}

/** Modal card, centred. Returns the content rect. */
function drawModalCard(w, h, time) {
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  var y = (LAY.contentTop + LAY.contentBottom) / 2 - h / 2;
  CTX.fillStyle = 'rgba(3,6,16,0.42)';
  CTX.fillRect(-LAY.stageX / LAY.scale, -LAY.stageY / LAY.scale,
    VIEW.vw / LAY.scale, VIEW.vh / LAY.scale);
  var pop = time === undefined ? 1 : clamp(time / 0.22, 0, 1);
  CTX.save();
  CTX.translate(x + w / 2, y + h / 2);
  var s = 0.94 + 0.06 * easeOutBack(pop);
  CTX.scale(s, s);
  CTX.translate(-(x + w / 2), -(y + h / 2));
  drawCard(x, y, w, h, 20, { shadowBlur: 22 });
  CTX.restore();
  return { x: x, y: y, w: w, h: h };
}


/* ===== 09-scene-play.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §9  SCENE · PLAY — the course, the slingshot aim, the flight, the HUD
   ═══════════════════════════════════════════════════════════════════════════ */

var PLAY = {
  world: null,
  briefT: 0,
  paused: false,
  shake: 0,
  shakeT: 0,
  over: false,
  /* aim state: null when not dragging */
  drag: null,            /* { id, startX, startY, curX, curY } */
  predictor: null,       /* cached path while dragging */
  chargeT: 0,
  aimBlockT: 0,          /* input guard right after a launch */
  captureT: -1,          /* spiral-in animation clock while clearing */

  enter: function (opts) {
    PLAY.world = buildWorld(opts.index, courseRect());
    PLAY.briefT = cfgGet('anim.briefSec', 1.25);
    PLAY.paused = false;
    PLAY.shake = 0;
    PLAY.shakeT = 0;
    PLAY.over = false;
    PLAY.drag = null;
    PLAY.predictor = null;
    PLAY.chargeT = 0;
    PLAY.aimBlockT = 0;
    PLAY.captureT = -1;
    SFX.setPad(true);
  },

  exit: function () {
    SFX.setPad(false);
    PLAY.drag = null;
    PLAY.predictor = null;
  },

  setPaused: function (on) {
    if (PLAY.over) return false;
    PLAY.paused = !!on;
    PLAY.drag = null;
    PLAY.predictor = null;
    if (PLAY.paused) SFX.setPad(false);
    else SFX.setPad(true);
    return PLAY.paused;
  },

  /* ── simulation ───────────────────────────────────────────────────────── */
  update: function (dt) {
    var w = PLAY.world;
    if (!w) return;

    if (PLAY.shake > 0) PLAY.shake = Math.max(0, PLAY.shake - dt * 42);
    PLAY.shakeT += dt;
    if (PLAY.aimBlockT > 0) PLAY.aimBlockT -= dt;

    if (PLAY.paused) return;

    if (PLAY.briefT > 0) {
      PLAY.briefT -= dt;
      stepParticles(w, dt);
      return;
    }

    stepCourse(w, dt);
    PLAY.consume(w);

    /* capture spiral: hold the scene a beat before the result card */
    if (w.status === 'clear' && PLAY.captureT >= 0) {
      PLAY.captureT += dt;
      if (PLAY.captureT > cfgGet('anim.settleDelaySec', 0.55)) {
        PLAY.captureT = -1;
        PLAY.over = true;
      }
    } else if ((w.status === 'clear' || w.status === 'fail') && PLAY.captureT < 0 && !PLAY.over) {
      /* the fail path lands immediately; the clear path just set captureT in consume */
      if (w.status === 'fail') PLAY.over = true;
    }
    stepParticles(w, dt);
  },

  /* Physics reports what happened; the scene is the only layer allowed to make
     noise or throw sparks, which keeps the rules replayable in a bare harness. */
  consume: function (w) {
    for (var i = 0; i < w.events.length; i += 1) {
      var e = w.events[i];
      if (e.type === 'launch') {
        SFX.launch(clamp(Math.sqrt(e.vx * e.vx + e.vy * e.vy) / cfgGet('physics.launchSpeedMax', 900), 0, 1));
      } else if (e.type === 'bounce') {
        SFX.bounce(e.speed);
        PLAY.shake = Math.min(6, PLAY.shake + e.speed / 900);
        spawnParticles(w, e.x, e.y, 7, planetTint(w.bodies[e.body] ? w.bodies[e.body].kind : 'rock')[0], 90, 0.4, 2.0);
      } else if (e.type === 'nearmiss') {
        SFX.nearmiss();
        spawnParticles(w, e.x, e.y, 6, THEME.accent, 60, 0.35, 1.6);
      } else if (e.type === 'lipout') {
        SFX.lipout();
        PLAY.shake = Math.min(6, PLAY.shake + 3);
        spawnParticles(w, e.x, e.y, 12, THEME.hole, 110, 0.5, 2.2);
      } else if (e.type === 'warp') {
        SFX.warp();
        spawnParticles(w, e.x, e.y, 12, THEME.wormA, 90, 0.4, 2.0);
        spawnParticles(w, e.exitX, e.exitY, 12, THEME.wormB, 90, 0.4, 2.0);
      } else if (e.type === 'capture') {
        SFX.capture(starsFor(w.def, w.strokes));
        PLAY.shake = Math.min(7, PLAY.shake + 4);
        spawnParticles(w, e.x, e.y, 24, THEME.hole, 120, 0.7, 2.4);
        PLAY.captureT = 0;
      } else if (e.type === 'swallow') {
        SFX.swallow();
        PLAY.shake = 12;
        PLAY.shakeT = 0;
        spawnParticles(w, e.x, e.y, 22, THEME.bhRing, 150, 0.7, 2.6);
      } else if (e.type === 'penalty' && e.reason === 'oob') {
        SFX.oob();
        spawnParticles(w, w.rect.x + w.rect.w / 2, w.rect.y - 20, 10, THEME.warn, 70, 0.4, 2.0);
        toast(tr(e.strokes + 0 ? 'result.reason.oob' : 'result.reason.oob'));
      } else if (e.type === 'settle') {
        SFX.settle();
      } else if (e.type === 'fail') {
        SFX.fail();
      }
    }
    w.events.length = 0;
  },

  /* ── drawing ──────────────────────────────────────────────────────────── */
  draw: function (dt, time) {
    var w = PLAY.world;
    if (!w) return;
    var theme = THEME;
    var r = w.rect;

    strokeRR(r.x - 5, r.y - 5, r.w + 10, r.h + 10, 14, rgba(theme.edge, 0.85), 1.4);
    /* chapter tint wash over the field */
    CTX.save();
    roundRectPath(r.x - 5, r.y - 5, r.w + 10, r.h + 10, 14);
    CTX.clip();
    CTX.globalAlpha = cfgGet('theme.chapterTintAlpha', 0.05) + 0.03;
    CTX.fillStyle = chapterTint(w.def);
    CTX.fillRect(r.x - 5, r.y - 5, r.w + 10, r.h + 10);
    CTX.restore();

    CTX.save();
    if (PLAY.shake > 0.2) {
      CTX.translate(Math.sin(PLAY.shakeT * 61) * PLAY.shake, Math.cos(PLAY.shakeT * 53) * PLAY.shake);
    }

    var i;
    PLAY.drawCourse(r, w, time);

    /* wormhole rings under everything */
    drawWorms(w.worms, time);

    /* bodies, farthest kind first */
    for (i = 0; i < w.bodies.length; i += 1) {
      var b = w.bodies[i];
      if (b.kind === 'blackhole') drawBlackHole(b, time, PLAY.drag !== null);
      else if (b.kind === 'repulsor') drawRepulsor(b, time);
      else drawPlanet(b, time);
      /* orbit path hint for moving bodies */
      if (b.orbit) {
        CTX.save();
        CTX.setLineDash([2, 8]);
        CTX.strokeStyle = rgba(theme.muted, 0.20);
        CTX.lineWidth = 1;
        CTX.beginPath();
        CTX.ellipse(b.orbit.cx, b.orbit.cy, b.orbit.rx, b.orbit.ry, 0, 0, TAU);
        CTX.stroke();
        CTX.setLineDash([]);
        CTX.restore();
      }
    }

    drawCup(w.hole, time);

    /* the settled ball's lie marker */
    if (w.status === 'aim') {
      CTX.save();
      CTX.globalAlpha = 0.5;
      CTX.beginPath();
      CTX.arc(w.ball.x, w.ball.y, w.ball.r + 5, 0, TAU);
      CTX.strokeStyle = 'rgba(255,255,255,0.35)';
      CTX.lineWidth = 1;
      CTX.stroke();
      CTX.restore();
    }

    drawTrail(w.ball, theme.ballEdge);
    var ballAlpha = 1;
    if (w.status === 'clear' && PLAY.captureT >= 0) {
      /* spiral into the cup as the settle animation */
      var p = clamp(PLAY.captureT / Math.max(0.05, cfgGet('anim.settleDelaySec', 0.55)), 0, 1);
      ballAlpha = 1 - easeInCubic(p);
      var ang = p * TAU * 2;
      var rad = w.ball.r + (w.hole.r - w.ball.r) * (1 - p) * 0.2;
      drawBall(w.hole.x + Math.cos(ang) * rad * 0, w.hole.y + Math.sin(ang) * rad * 0, w.ball.r * (1 - p * 0.5), ballAlpha);
    } else if (w.status !== 'fail' || w.reason !== 'void') {
      drawBall(w.ball.x, w.ball.y, w.ball.r, ballAlpha);
    }

    drawParticles(w);

    /* aim overlay on top of everything */
    if (PLAY.drag && w.status === 'aim' && PLAY.briefT <= 0) {
      drawAim(w.ball, PLAY.drag.curX, PLAY.drag.curY, PLAY.aimPower(), PLAY.predictor, time);
    }
    CTX.restore();

    PLAY.drawHud(w, time);
    PLAY.drawHint(w, time);
    if (PLAY.briefT > 0) PLAY.drawBrief(w);
    if (PLAY.paused) PLAY.drawPause(w);
  },

  drawCourse: function () { /* border + wash already handled; kept as a hook */ },

  /* ── aiming ───────────────────────────────────────────────────────────── */
  aimDragPx: function () {
    if (!PLAY.drag) return 0;
    var dx = PLAY.drag.curX - PLAY.drag.startX, dy = PLAY.drag.curY - PLAY.drag.startY;
    return Math.sqrt(dx * dx + dy * dy);
  },
  aimPower: function () {
    return launchPower(PLAY.aimDragPx());
  },
  aimVelocity: function () {
    if (!PLAY.drag) return { vx: 0, vy: 0 };
    var dx = PLAY.drag.startX - PLAY.drag.curX, dy = PLAY.drag.startY - PLAY.drag.curY;
    var len = Math.sqrt(dx * dx + dy * dy);
    var speed = launchSpeed(PLAY.aimPower());
    if (len < 0.5) return { vx: 0, vy: 0 };
    return { vx: dx / len * speed, vy: dy / len * speed };
  },

  /* ── HUD ──────────────────────────────────────────────────────────────── */
  drawHud: function (w, time) {
    var theme = THEME;
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var top = LAY.contentTop + 4;

    TXT(tr('hud.hole', { n: w.level }), L + 1, top + 11, {
      size: 12, align: 'left', color: theme.muted, maxW: 56
    });
    TXT(levelName(w.def), L + 52, top + 11, {
      size: 12.5, align: 'left', color: theme.text, maxW: R - L - 150
    });

    var parX = R - 88;
    TXT(tr('hud.par'), parX, top + 6, { size: 9.5, align: 'left', color: theme.muted, maxW: 30 });
    TXT(String(w.def.par), parX + 22, top + 6, { size: 13, align: 'left', color: theme.accent, weight: '800' });
    TXT(tr('hud.strokes'), parX, top + 20, { size: 9.5, align: 'left', color: theme.muted, maxW: 30 });
    var strokeCol = w.strokes > w.def.par ? theme.warn : theme.text;
    TXT(String(w.strokes), parX + 22, top + 20, { size: 13, align: 'left', color: strokeCol, weight: '800' });

    drawRoundButton('pause', R - 15, top + 11, 14, 'II', { size: 11.5 });
  },

  hintText: function (w) {
    if (w.strokes === 0 && w.t < 14) return tr('play.hint.aim');
    if (w.status === 'aim' && w.strokes > 0 && w.strokes >= w.def.maxStrokes - 1) return tr('play.hint.loan');
    return tr('play.hint.cancel');
  },

  drawHint: function (w, time) {
    if (PLAY.briefT > 0) return;
    var y = LAY.contentBottom - cfgGet('course.hintHeight', 26) / 2;
    TXT(PLAY.hintText(w), (LAY.contentLeft + LAY.contentRight) / 2, y, {
      size: 10.5, color: rgba(THEME.muted, 0.95), maxW: LAY.contentRight - LAY.contentLeft - 8
    });
  },

  drawBrief: function (w) {
    var theme = THEME;
    var L = LAY.contentLeft, R = LAY.contentRight;
    var W = R - L;
    var p = clamp(1 - PLAY.briefT / cfgGet('anim.briefSec', 1.25), 0, 1);
    var alpha = Math.min(1, p * 3.2) * Math.min(1, PLAY.briefT / 0.25);
    var h = 158;
    var y = (LAY.contentTop + LAY.contentBottom) / 2 - h / 2;
    CTX.save();
    CTX.globalAlpha = alpha;
    CTX.fillStyle = 'rgba(2,4,12,0.55)';
    CTX.fillRect(-LAY.stageX / LAY.scale, -LAY.stageY / LAY.scale,
      VIEW.vw / LAY.scale, VIEW.vh / LAY.scale);
    var pop = easeOutBack(p);
    CTX.translate((L + R) / 2, y + h / 2);
    CTX.scale(0.92 + 0.08 * pop, 0.92 + 0.08 * pop);
    CTX.translate(-(L + R) / 2, -(y + h / 2));
    drawCard(L, y, W, h, 18, { shadowBlur: 20 });
    TXT(tr('brief.hole', { n: w.level }), (L + R) / 2, y + 24, {
      size: 12.5, color: theme.muted, letterSpacing: '2px'
    });
    TXT(levelName(w.def), (L + R) / 2, y + 50, {
      size: 24, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 5 }
    });
    TXT(tr('brief.par', { n: w.def.par, m: w.def.maxStrokes }), (L + R) / 2, y + 72, {
      size: 12, color: theme.accent, maxW: W - 40
    });
    paragraph(levelTeach(w.def), (L + R) / 2, y + 86, W - 44, {
      size: 11.5, color: theme.text, align: 'center', lineHeight: 1.5
    });
    var pulse = 0.6 + 0.4 * Math.sin(PLAY.shakeT * 6);
    TXT(tr('brief.go'), (L + R) / 2, y + h - 20, {
      size: 12, color: theme.accent, alpha: pulse, maxW: W - 40, letterSpacing: '1.5px'
    });
    CTX.restore();
  },

  drawPause: function (w) {
    var theme = THEME;
    var L = LAY.contentLeft, R = LAY.contentRight;
    var W = R - L;
    var h = 236;
    var card = drawModalCard(W, h, 0.2);
    var x = card.x, y = card.y;
    TXT(tr('play.paused'), x + W / 2, y + 34, {
      size: 24, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 5 }
    });
    TXT(tr('play.quit.hint'), x + W / 2, y + 60, { size: 11, color: theme.muted, maxW: W - 40 });
    var bw = W - 44;
    drawButton(x + 22, y + 78, bw, 48, tr('play.resume'), isPressed('resume'), { size: 18 });
    HIT('resume', x + 22, y + 78, bw, 48);
    drawChip(x + 22, y + 134, bw, 40, tr('play.restart'), isPressed('restart'), { size: 15 });
    HIT('restart', x + 22, y + 134, bw, 40);
    drawChip(x + 22, y + 180, bw, 40, tr('play.quit'), isPressed('quit'), { size: 15 });
    HIT('quit', x + 22, y + 180, bw, 40);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  inCourse: function (x, y) {
    var w = PLAY.world;
    if (!w) return false;
    /* the whole field is the grab surface, so aiming never needs a pixel-perfect
       first touch on the ball itself */
    return x >= w.rect.x - 20 && x <= w.rect.x + w.rect.w + 20 &&
           y >= w.rect.y - 20 && y <= w.rect.y + w.rect.h + 20;
  },

  down: function (x, y, pid) {
    if (PLAY.paused) return;
    if (PLAY.briefT > 0) return;              /* the brief swallows the first tap */
    if (PLAY.over) return;
    if (PLAY.world.status !== 'aim') return;
    if (PLAY.aimBlockT > 0) return;
    if (!PLAY.inCourse(x, y)) return;
    var id = pid === undefined ? 'mouse' : pid;
    if (PLAY.drag) return;                    /* one finger aims; a second is ignored */
    PLAY.drag = { id: id, startX: x, startY: y, curX: x, curY: y };
    PLAY.predictor = null;
    PLAY.chargeT = 0;
  },

  move: function (x, y, pid) {
    if (!PLAY.drag) return;
    var id = pid === undefined ? 'mouse' : pid;
    if (PLAY.drag.id !== id) return;
    PLAY.drag.curX = x;
    PLAY.drag.curY = y;
    var v = PLAY.aimVelocity();
    PLAY.predictor = predictorPath(PLAY.world, v.vx, v.vy);
    /* charge hum throttle */
    PLAY.chargeT -= 1;
    if (PLAY.chargeT <= 0) {
      PLAY.chargeT = 4;
      SFX.charge(PLAY.aimPower());
    }
  },

  /* Returns true when the tap was consumed (the brief is modal). */
  up: function (x, y, pid) {
    if (PLAY.briefT > 0) { PLAY.briefT = 0; return true; }
    if (!PLAY.drag) return false;
    var id = pid === undefined ? 'mouse' : pid;
    if (PLAY.drag.id !== id) return false;
    var drag = PLAY.drag;
    PLAY.drag = null;
    PLAY.aimBlockT = cfgGet('anim.aimBlocksInputSec', 0.35);
    var power = launchPower(Math.sqrt(
      (drag.curX - drag.startX) * (drag.curX - drag.startX) +
      (drag.curY - drag.startY) * (drag.curY - drag.startY)));
    if (power < cfgGet('physics.launchMinPower', 0.08)) {
      PLAY.predictor = null;
      return false;                            /* a dropped drag cancels the shot */
    }
    var v = PLAY.aimVelocityAt(drag);
    launchShot(PLAY.world, v.vx, v.vy);
    PLAY.predictor = null;
    return false;
  },

  aimVelocityAt: function (drag) {
    var dx = drag.startX - drag.curX, dy = drag.startY - drag.curY;
    var len = Math.sqrt(dx * dx + dy * dy);
    var speed = launchSpeed(launchPower(Math.sqrt(
      (drag.curX - drag.startX) * (drag.curX - drag.startX) +
      (drag.curY - drag.startY) * (drag.curY - drag.startY))));
    if (len < 0.5) return { vx: 0, vy: 0 };
    return { vx: dx / len * speed, vy: dy / len * speed };
  },

  actions: {
    'pause': function () { PLAY.setPaused(true); },
    'resume': function () { PLAY.setPaused(false); },
    'restart': function () { APP.restartHole(); },
    'quit': function () { APP.go('home'); }
  }
};


/* ===== 10-scene-home.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §10  SCENE · HOME — hole select by chapter, stars, tee off, saved progress
   ═══════════════════════════════════════════════════════════════════════════ */

var HOME = {
  time: 0,

  draw: function (dt, time) {
    this.time += dt;
    var theme = THEME;
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;

    /* ── top bar: rules / about on the left, language and sound on the right ── */

    var barH = 28;
    var bw = 60;
    drawChip(L, barY, bw, barH, tr('home.rules'), isPressed('rules'), { size: 13 });
    HIT('rules', L, barY, bw, barH);
    drawChip(L + bw + 8, barY, bw, barH, tr('home.about'), isPressed('about'), { size: 13 });
    HIT('about', L + bw + 8, barY, bw, barH);

    drawRoundButton('lang', R - 15, barY + barH / 2, 15, tr('home.lang'), { size: 15 });
    drawRoundButton('sound', R - 15 - 38, barY + barH / 2, 15, SFX.isEnabled() ? '\u266A' : '\u2715', { size: 14 });

    /* ── title block ── */
    var markCY = barY + barH + 52;
    drawMark(cx, markCY, 100, this.time);
    TXT(tr('game.title'), cx, markCY + 64, {
      size: 38, grad: theme.titleGrad, maxW: W - 12,
      outline: { color: theme.titleEdge, width: 6 },
      shadow: { color: 'rgba(0,0,0,0.45)', blur: 8, oy: 3 },
      letterSpacing: '2px'
    });
    TXT(tr('game.subtitle'), cx, markCY + 90, {
      size: 13, color: theme.subtitle, maxW: W - 24, letterSpacing: '1.4px'
    });

    /* ── hole select, grouped by chapter ── */
    var y = markCY + 112;
    var stats = readStats();
    TXT(tr('home.stars', { n: totalStars(stats), m: levelCount() * 3 }), L + 2, y, {
      size: 12, align: 'left', color: theme.muted
    });
    TXT(tr('home.holes'), R - 2, y, { size: 12, align: 'right', color: theme.muted });
    y += 16;

    var cols = 4;
    var gap = 8;
    var cw = (W - gap * (cols - 1)) / cols;
    var ch = 52;
    var total = levelCount();
    for (var i = 1; i <= total; i += 1) {
      var def = levelDef(i);
      var gi = i - 1;
      var col = gi % cols;
      var row = Math.floor(gi / cols);
      /* a chapter heading sits above its first hole */
      if (col === 0) {
        y = this.chapterRow(L, R, y, def.chapter, stats);
      }
      this.levelChip(L + col * (cw + gap), y, cw, ch, i, isUnlocked(i, stats), stats);
      if (col === cols - 1 || i === total) y += ch + 10;
    }

    /* ── tee off: pinned to the bottom ── */
    var playY = LAY.contentBottom - 60 - 30;
    var label = (APP.settings.level > 1)
      ? tr('home.continue', { n: APP.settings.level })
      : tr('home.play');
    drawButton(L, playY, W, 58, label, isPressed('play'), { size: 21, letterSpacing: '3px' });
    HIT('play', L, playY, W, 58);

    var best = bestStrokesLine(stats);
    TXT(best || tr('home.stats.none'), cx, Math.min(playY + 58 + 16, LAY.contentBottom - 4), {
      size: 12, color: theme.muted, maxW: W
    });
  },

  /* Chapter heading with its star gate; returns the y for the hole row. */
  chapterRow: function (L, R, y, chapter, stats) {
    var theme = THEME;
    var chDef = chapterFor(chapter);
    var unlocked = chapterUnlocked(chapter, stats);
    var label = pickLocale(chDef.name, 'Chapter ' + chapter);
    if (!unlocked) {
      label += '  ·  ' + tr('home.locked.stars', { n: chapterGate(chapter) });
    }
    var tint = (THEME.tint || ['#5CA8FF', '#FF4FD8', '#B98CFF'])[clamp(chapter, 1, 3) - 1];
    CTX.save();
    CTX.globalAlpha = unlocked ? 0.9 : 0.45;
    fillRR(L, y, R - L, 18, 9, rgba(tint, 0.14));
    TXT(label, (L + R) / 2, y + 9, { size: 10.5, color: unlocked ? theme.text : theme.muted, maxW: R - L - 16 });
    CTX.restore();
    return y + 24;
  },

  /* One hole tile: number, par, stars earned, a lock when still closed. */
  levelChip: function (x, y, w, h, index, unlocked, stats) {
    var theme = THEME;
    var id = 'lvl:' + index;
    var on = Number(APP.settings.level) === index;
    var def = levelDef(index);
    var pressed = isPressed(id);

    CTX.save();
    CTX.translate(x + w / 2, y + h / 2);
    var s = pressed ? 0.96 : 1;
    CTX.scale(s, s);
    CTX.translate(-(x + w / 2), -(y + h / 2));
    if (on) {
      withShadow(rgba(theme.primary, 0.55), 12, 0, 3, function () {
        fillRR(x, y, w, h, 12, vGrad(x, y, w, h, theme.btnGrad[0], theme.btnGrad[1]));
      });
    } else {
      fillRR(x, y, w, h, 12, unlocked ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.04)');
      strokeRR(x + 0.5, y + 0.5, w - 1, h - 1, 12, rgba(theme.edge, 0.9), 1.1);
    }
    CTX.restore();

    if (!unlocked) {
      /* a padlock glyph: body plus shackle */
      var lx = x + w / 2, ly = y + h / 2 + 1;
      fillRR(lx - 5, ly - 1, 10, 8, 2, rgba(theme.muted, 0.55));
      CTX.beginPath();
      CTX.arc(lx, ly - 2, 3.4, Math.PI, 0);
      CTX.strokeStyle = rgba(theme.muted, 0.55);
      CTX.lineWidth = 1.6;
      CTX.stroke();
      return;
    }

    TXT(String(index), x + 13, y + h / 2 - 5, {
      size: 18, color: on ? theme.btnText : theme.text, maxW: 24, weight: '800'
    });
    TXT('P' + def.par, x + 13, y + h / 2 + 11, {
      size: 9, color: on ? rgba(theme.btnText, 0.8) : theme.muted, maxW: 24
    });
    /* star row earned on this hole */
    var got = stats.stars && stats.stars[index] ? stats.stars[index] : 0;
    for (var st = 0; st < 3; st += 1) {
      var sxp = x + w - 9 - (2 - st) * 11;
      var syp = y + h / 2 + 1;
      drawMiniStar(sxp, syp, 4.2, st < got, on);
    }
    HIT(id, x, y, w, h);
  },

  actions: {
    'lang': function () { setLang(getLang() === 'zh' ? 'en' : 'zh'); },
    'sound': function () { SFX.setEnabled(!SFX.isEnabled()); cfgSet('audio.enabled', SFX.isEnabled()); },
    'rules': function () { APP.go('rules'); },
    'about': function () { APP.go('about'); },
    'play': function () { APP.teeOff(APP.settings.level); }
  }
};

/* A hole opens once the previous one is cleared; chapters additionally gate on
   total stars, so level 5 needs chapter2Stars and level 9 needs chapter3Stars. */
function chapterFor(n) {
  var list = cfgGet('chapters', [
    { n: 1, name: { zh: '第一章 · 引力学徒', en: 'Chapter One - Gravity Apprentice' } },
    { n: 2, name: { zh: '第二章 · 危险发球区', en: 'Chapter Two - The Dangerous Tee' } },
    { n: 3, name: { zh: '第三章 · 传送回路', en: 'Chapter Three - The Warp Circuit' } }
  ]);
  for (var i = 0; i < list.length; i += 1) { if (Number(list[i].n) === Number(n)) return list[i]; }
  return list[0];
}

function chapterGate(n) {
  return Number(cfgGet('unlocks.chapter' + n + 'Stars', 0)) || 0;
}

function chapterUnlocked(n, stats) {
  if (Number(n) <= 1) return true;
  return totalStars(stats) >= chapterGate(n);
}

function totalStars(stats) {
  var s = (stats && stats.stars) || {};
  var sum = 0;
  for (var k in s) { if (Object.prototype.hasOwnProperty.call(s, k)) sum += Number(s[k]) || 0; }
  return sum;
}

function bestStrokesLine(stats) {
  var s = (stats && stats.best) || {};
  var bestHole = 0, bestVal = 999;
  for (var k in s) {
    if (Object.prototype.hasOwnProperty.call(s, k) && Number(s[k]) > 0 && Number(s[k]) < bestVal) {
      bestVal = Number(s[k]);
      bestHole = Number(k);
    }
  }
  if (!bestHole) return '';
  return tr('home.best.hole', { n: bestVal }) + '  (' + tr('home.hole.n', { n: bestHole }) + ')';
}

function isUnlocked(index, stats) {
  var s = stats || readStats();
  var n = Number(index);
  if (n <= 1) return true;
  var def = levelDef(n);
  if (!chapterUnlocked(def.chapter, s)) return false;
  var stars = (s.stars && s.stars[n - 1]) || (s.cleared >= n - 1 ? 1 : 0);
  return !!stars || s.cleared >= n - 1;
}

/* Chip picks that carry a value, validated so a malformed id cannot corrupt
   the next round. */
function handleHomePick(id) {
  if (id.indexOf('lvl:') === 0) {
    var n = Number(id.slice(4));
    if (isFinite(n) && n >= 1 && n <= levelCount() && isUnlocked(n)) {
      APP.settings.level = n;
      SFX.click();
    }
    return true;
  }
  return false;
}


/* ===== 11-scene-result.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §11  SCENE · RESULT — strokes, stars, and the restart entry point
   ═══════════════════════════════════════════════════════════════════════════ */

var RS = {
  data: null,
  t: 0,
  starT: 0,
  newBest: false,

  enter: function (opts) {
    var w = opts.world;
    var cleared = w.status === 'clear';
    var def = w.def;
    var stats = readStats();

    RS.t = 0;
    RS.starT = 0;
    RS.newBest = false;
    stats.rounds = (stats.rounds || 0) + 1;

    var stars = 0;
    if (cleared) {
      stars = starsFor(def, w.strokes);
      stats.cleared = Math.max(stats.cleared || 0, w.level);
      stats.stars = stats.stars || {};
      stats.best = stats.best || {};
      if (!stats.best[w.level] || w.strokes < stats.best[w.level]) {
        if (stats.best[w.level]) RS.newBest = true;
        stats.best[w.level] = w.strokes;
      }
      if (stars > (stats.stars[w.level] || 0)) stats.stars[w.level] = stars;
    }
    writeStats(stats);

    var chapterDone = cleared && lastHoleOfChapter(w.level);

    RS.data = {
      level: w.level,
      def: def,
      status: w.status,
      reason: w.reason,
      strokes: w.strokes,
      stars: stars,
      cleared: cleared,
      chapterDone: chapterDone,
      nextIndex: nextHoleIndex(w.level),
      nextLocked: nextHoleLocked(w.level, stats),
      starsNeeded: RS.starsMissing(w.level, stats),
      stats: stats
    };

    if (chapterDone) SFX.win();
    else if (cleared) SFX.capture(stars);
  },

  exit: function () {},

  starsMissing: function (level, stats) {
    var next = levelDef(nextHoleIndex(level));
    if (!next) return 0;
    var gate = chapterGate(next.chapter);
    var have = totalStars(stats);
    return Math.max(0, gate - have);
  },

  headline: function () {
    var d = RS.data;
    if (!d.cleared) {
      if (d.reason === 'void') return tr('result.void');
      if (d.reason === 'oob') return tr('result.oob');
      if (d.reason === 'limit') return tr('result.limit');
      return tr('result.limit');
    }
    if (d.strokes === 1) return tr('result.ace');
    if (d.strokes < d.def.par) return tr('result.underpar');
    if (d.strokes === d.def.par) return tr('result.par');
    return tr('result.bogey');
  },

  reasonText: function () {
    var d = RS.data;
    if (!d.cleared) {
      if (d.reason === 'void') return tr('result.reason.void');
      if (d.reason === 'oob') return tr('result.reason.oob');
      return tr('result.reason.limit');
    }
    return tr('result.par.line', { n: d.def.par });
  },

  draw: function (dt, time) {
    RS.t += dt;
    if (RS.data.cleared) RS.starT += dt;
    var d = RS.data;
    var theme = THEME;
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;
    var pop = clamp(RS.t / 0.3, 0, 1);

    /* ── ribbon ── */
    var ribY = LAY.contentTop + 6;
    var ribH = 62;
    CTX.save();
    CTX.translate(cx, ribY + ribH / 2);
    var s = 0.9 + 0.1 * easeOutBack(pop);
    CTX.scale(s, s);
    CTX.translate(-cx, -(ribY + ribH / 2));
    var grad = d.cleared
      ? [theme.btnGrad[0], theme.btnGrad[1]]
      : [rgba(theme.warn, 1), 'rgba(110,24,18,1)'];
    withShadow('rgba(0,0,0,0.42)', 18, 0, 6, function () {
      fillRR(L - 2, ribY, W + 4, ribH, 16, vGrad(L, ribY, W + 4, ribH, grad[0], grad[1]));
    });
    roundRectPath(L + 1, ribY + 1, W - 2, ribH * 0.44, 14);
    CTX.strokeStyle = 'rgba(255,255,255,0.3)';
    CTX.lineWidth = 1.4;
    CTX.stroke();
    TXT(RS.headline(), cx, ribY + ribH / 2 - 5, {
      size: 24, color: '#FFFFFF', maxW: W - 26, letterSpacing: '1.4px',
      shadow: { color: 'rgba(0,0,0,0.35)', blur: 4, oy: 2 }
    });
    TXT(RS.reasonText(), cx, ribY + ribH / 2 + 18, {
      size: 11, color: 'rgba(255,255,255,0.92)', maxW: W - 26
    });
    CTX.restore();

    var y = ribY + ribH + 12;

    /* ── strokes panel ── */
    var panelH = d.cleared ? 150 : 122;
    drawCard(L, y, W, panelH, 16, { shadowBlur: 10 });

    if (d.cleared) {
      var step = 40;
      for (var i = 0; i < 3; i += 1) {
        var on = i < d.stars && RS.starT > 0.18 * (i + 1);
        RS.drawStar(cx + (i - 1) * step, y + 26, 15, on, i);
      }
    }

    TXT(tr('result.strokes'), cx, y + (d.cleared ? 54 : 22), { size: 11.5, color: theme.muted });
    TXT(String(d.strokes), cx, y + (d.cleared ? 82 : 50), {
      size: d.cleared ? 38 : 34, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 4.5 }
    });

    var rowTop = y + (d.cleared ? 104 : 74);
    var rows = [
      [tr('result.par.line', { n: d.def.par }), 'P' + d.def.par],
      [tr('result.best', { n: d.strokes }), (d.stats.best && d.stats.best[d.level]) ? String(d.stats.best[d.level]) : '-']
    ];
    for (var k = 0; k < rows.length; k += 1) {
      var ry = rowTop + k * 16;

  /* Five-pointed star; unlit stars sit as outlines so the goal is visible. */
  drawStar: function (cx, cy, r, on, index) {
    var theme = THEME;
    var rr = r;
    if (on) {
      var grow = clamp((RS.starT - 0.18 * (index + 1)) * 6, 0, 1);
      rr = r * (0.55 + 0.45 * easeOutBack(Math.max(0.001, grow)));
    }
    CTX.save();
    CTX.translate(cx, cy);
    CTX.beginPath();
    for (var i = 0; i < 10; i += 1) {
      var ang = -Math.PI / 2 + i * Math.PI / 5;
      var rad = (i % 2 === 0) ? rr : rr * 0.44;
      var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
      if (i === 0) CTX.moveTo(px, py); else CTX.lineTo(px, py);
    }
    CTX.closePath();
    if (on) {
      withShadow(rgba(theme.accent, 0.7), 12, 0, 2, function () {
        CTX.fillStyle = theme.accent;
        CTX.fill();
      });
      CTX.strokeStyle = 'rgba(255,255,255,0.85)';
      CTX.lineWidth = 1.4;
      CTX.stroke();
    } else {
      CTX.strokeStyle = rgba(theme.muted, 0.5);
      CTX.lineWidth = 1.4;
      CTX.stroke();
    }
    CTX.restore();
  },

  actions: {
    'retry': function () { APP.restartHole(); },
    'next': function () { APP.teeOff(RS.data.nextIndex); },
    'home': function () { APP.go('home'); }
  }
};

/* Small filled star used on the hole tiles. */
function drawMiniStar(cx, cy, r, on, onSelected) {
  CTX.save();
  CTX.translate(cx, cy);
  CTX.beginPath();
  for (var i = 0; i < 10; i += 1) {
    var ang = -Math.PI / 2 + i * Math.PI / 5;
    var rad = (i % 2 === 0) ? r : r * 0.44;
    var px = Math.cos(ang) * rad, py = Math.sin(ang) * rad;
    if (i === 0) CTX.moveTo(px, py); else CTX.lineTo(px, py);
  }
  CTX.closePath();
  if (on) {
    CTX.fillStyle = onSelected ? THEME.btnText : THEME.accent;
    CTX.fill();
  } else {
    CTX.strokeStyle = onSelected ? rgba(THEME.btnText, 0.5) : rgba(THEME.muted, 0.5);
    CTX.lineWidth = 1;
    CTX.stroke();
  }
  CTX.restore();
}

function lastHoleOfChapter(level) {
  var def = levelDef(level);
  var next = levelDef(nextHoleIndex(level));
  return !!def && !!next && next.chapter !== def.chapter;
}

function nextHoleIndex(level) {
  return level < levelCount() ? level + 1 : 0;
}

function nextHoleLocked(level, stats) {
  var next = nextHoleIndex(level);
  if (!next) return false;
  return !isUnlocked(next, stats);
}

/* ===== 13-app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §13  APP — scenes, input routing, main loop, saved progress, boot
   ═══════════════════════════════════════════════════════════════════════════ */

var APP_VERSION = "1.0.0";

/* ── saved progress (only ever a handful of numbers) ─────────────────────── */
function readStats() {
  var s = STORE.get('stats', null);
  var out = { cleared: 0, rounds: 0, stars: {}, best: {} };
  if (isObj(s)) {
    if (typeof s.cleared === 'number' && isFinite(s.cleared) && s.cleared >= 0) out.cleared = Math.floor(s.cleared);
    if (typeof s.rounds === 'number' && isFinite(s.rounds) && s.rounds >= 0) out.rounds = Math.floor(s.rounds);
    /* stars per hole and best strokes per hole: clamp to what exists now, so a
       hole list that shrinks in a later build can never strand the player. */
    var total = levelCount();
    if (isObj(s.stars)) {
      for (var k in s.stars) {
        if (!Object.prototype.hasOwnProperty.call(s.stars, k)) continue;
        var n = Number(k);
        var v = Math.floor(Number(s.stars[k]) || 0);
        if (n >= 1 && n <= total && v >= 0 && v <= 3) out.stars[n] = v;
      }
    }
    if (isObj(s.best)) {
      for (var b in s.best) {
        if (!Object.prototype.hasOwnProperty.call(s.best, b)) continue;
        var bn = Number(b);
        var bv = Math.floor(Number(s.best[b]) || 0);
        if (bn >= 1 && bn <= total && bv > 0) out.best[bn] = bv;
      }
    }
    if (out.cleared > total) out.cleared = total;
  }
  return out;
}
function writeStats(s) { return STORE.set('stats', s); }

/* ── app ────────────────────────────────────────────────────────────────── */
var SCENES = { home: HOME, play: PLAY, result: RS, rules: RULES, about: ABOUT };

var APP = {
  scene: 'home',
  settings: { level: 1 },
  agree: true,
  agreeT: 0,
  time: 0,
  resultDelay: -1,
  ready: false,
  _pendingResult: null,

  init: function () {
    var agreed = STORE.get('agreed', false);
    APP.agree = agreed !== true;
    APP.agreeT = 0;
    APP.scene = 'home';
    /* resume at the frontier hole, not at hole 1, when progress exists */
    var stats = readStats();
    APP.settings.level = Math.min(levelCount(), (stats.cleared || 0) + 1);
    APP.applyTitle();
  },

  applyTitle: function () {
    try { document.title = tr('game.title'); } catch (e) { /* no document */ }
  },

  go: function (name, opts) {
    var cur = SCENES[APP.scene];
    if (cur && cur.exit) cur.exit();
    APP.scene = name;
    APP.resultDelay = -1;
    APP._pendingResult = null;
    if (name === 'play' && opts) {
      PLAY.enter(opts);
    } else if (name === 'result' && opts) {
      RS.enter(opts);
    }
  },

  /* Every attempt is built here, so no ball, body, particle, stroke count or
     orbit phase can survive from the previous one. This is the single reset
     point the platform spec requires ("restart must fully reinitialise"). */
  newRound: function (index) {
    resetDeco();
    return { index: Number(index) || 1 };
  },

  teeOff: function (index) {
    APP.settings.level = Number(index) || 1;
    APP.go('play', APP.newRound(APP.settings.level));
  },

  restartHole: function () { APP.teeOff(APP.settings.level); },

  nextHole: function () {
    var next = Math.min(levelCount(), APP.settings.level + 1);
    APP.teeOff(next);
  },

  update: function (dt) {
    APP.time += dt;
    if (APP.agree) APP.agreeT += dt;
    var s = SCENES[APP.scene];
    if (s && s.update) s.update(dt);

    /* A hole is decided -> show the result card once the capture spiral has
       landed. The world is read from the play scene, never cached on APP: a
       restart replaces it, and a stale reference would score the wrong round. */
    if (APP.scene === 'play' && PLAY.over) {
      if (APP.resultDelay < 0) {
        APP.resultDelay = cfgGet('anim.resultDelaySec', 0.75);
        APP._pendingResult = { world: PLAY.world };
      } else {
        APP.resultDelay -= dt;
        if (APP.resultDelay <= 0 && APP._pendingResult) {
          var payload = APP._pendingResult;
          APP._pendingResult = null;
          APP.go('result', payload);
        }
      }
    }
  },

  draw: function (dt) {
    var s = SCENES[APP.scene];
    if (s && s.draw) s.draw(dt, APP.time);
    drawToast(dt);
    if (APP.agree) drawAgreement(dt, APP.time);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  down: function (x, y, pid) {
    SFX.unlock();
    PRESS.x = x;
    PRESS.y = y;
    PRESS.moved = false;
    PRESS.id = pickHit(x, y);
    /* The agreement is modal: while it is open nothing else may receive input. */
    if (APP.agree) return;
    var s = SCENES[APP.scene];
    if (s && s.down) s.down(x, y, pid);
  },

  move: function (x, y, pid) {
    if (Math.abs(x - PRESS.x) > 6 || Math.abs(y - PRESS.y) > 6) PRESS.moved = true;
    var s = SCENES[APP.scene];
    if (s && s.move) s.move(x, y, pid);
  },

  up: function (x, y, pid) {
    if (APP.agree) {
      if (pickHit(x, y) === 'agree' && !PRESS.moved) {
        APP.agree = false;
        STORE.set('agreed', true);
      }
      PRESS.id = null;
      PRESS.moved = false;
      return;
    }
    var s = SCENES[APP.scene];
    /* A scene may consume the tap outright (the level brief is modal). If it did,
       the hit regions underneath must not also fire — one tap, one effect. */
    var consumed = false;
    if (s && s.up) consumed = s.up(x, y, pid) === true;
    var id = pickHit(x, y);
    if (!consumed && id && id === PRESS.id && !PRESS.moved && s) {
      if (s.actions && s.actions[id]) s.actions[id]();
      else handleHomePick(id);
    }
    PRESS.id = null;
    PRESS.moved = false;
  },

  /* Called when the page goes to the background: the platform spec asks for an
     automatic pause, and a flying ball must not be judged while hidden. */
  onHidden: function () {
    if (APP.scene === 'play') PLAY.setPaused(true);
  }
};

/* ── main loop ──────────────────────────────────────────────────────────── */
var _last = 0;

function frame(now) {
  var raw = _last ? now - _last : 1000 / 60;
  var dt = _last ? clamp(raw / 1000, 0, 0.05) : 1 / 60;
  _last = now;
  /* Feed the real elapsed time to the quality policy (dt above is clamped for
     simulation stability, which would hide a slow device from the sampler). */
  if (APP.ready) sampleFrame(raw);

  CTX.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
  /* One background blit per frame. On the course the pre-composed bitmap also
     carries the field panel and grain, so the scene below only draws what moves. */
  drawGameBackground(THEME, APP.time,
    (APP.scene === 'play' && PLAY.world) ? PLAY.world.rect : null);

  resetHits();
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  APP.update(dt);
  APP.draw(dt);
  CTX.restore();

  requestAnimationFrame(frame);
}

/* ── boot ───────────────────────────────────────────────────────────────── */
function bindInput() {
  var canvas = document.getElementById('stage');

  function pt(e) {
    var rect = canvas.getBoundingClientRect();
    var src = e;
    if (e.touches && e.touches.length) src = e.touches[0];
    else if (e.changedTouches && e.changedTouches.length) src = e.changedTouches[0];
    return {
      x: ux((src.clientX || 0) - rect.left),
      y: uy((src.clientY || 0) - rect.top)
    };
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) {
      e.preventDefault();
      var p = pt(e);
      APP.down(p.x, p.y, e.pointerId);
    }, { passive: false });
    canvas.addEventListener('pointermove', function (e) {
      var p = pt(e);
      APP.move(p.x, p.y, e.pointerId);
    }, { passive: true });
    canvas.addEventListener('pointerup', function (e) {
      var p = pt(e);
      APP.up(p.x, p.y, e.pointerId);
    }, { passive: true });
    canvas.addEventListener('pointercancel', function (e) {
      APP.up(-1, -1, e.pointerId);
    }, { passive: true });
  } else {
    canvas.addEventListener('touchstart', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.down(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('touchmove', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.move(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      var rect = canvas.getBoundingClientRect();
      for (var i = 0; i < e.changedTouches.length; i += 1) {
        var t = e.changedTouches[i];
        APP.up(ux(t.clientX - rect.left), uy(t.clientY - rect.top), t.identifier);
      }
    }, { passive: false });
    canvas.addEventListener('mousedown', function (e) {
      var p = pt(e);
      APP.down(p.x, p.y, 'mouse');
    });
    canvas.addEventListener('mousemove', function (e) {
      var p = pt(e);
      APP.move(p.x, p.y, 'mouse');
    });
    canvas.addEventListener('mouseup', function (e) {
      var p = pt(e);
      APP.up(p.x, p.y, 'mouse');
    });
  }
  /* Block the OS-level long-press menu and double-tap zoom inside the play area. */
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

function boot() {
  refreshConfigFromSidecar();
  relayout();
  APP.init();
  loadAssets();
  bindInput();

  window.addEventListener('resize', function () { relayout(); resetDeco(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { relayout(); resetDeco(); }, 120);
  });
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) APP.onHidden();
  });
  window.addEventListener('blur', function () { APP.onHidden(); });

  requestAnimationFrame(frame);
  APP.ready = true;
}

/* Debug / automation handle. Read-only surface used by the test harness. */
window.__GRAV__ = {
  APP: APP, PLAY: PLAY, RS: RS, HOME: HOME,

    teeOff: function (i) { APP.teeOff(i); },

    nextHole: function () { APP.nextHole(); },
    setPaused: function (v) { return PLAY.setPaused(v); }
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}
