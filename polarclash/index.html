    /* ── title block ── */
    var markCY = barY + barH + 44;
    drawMark(cx, markCY, 74, this.time);
    TXT(tr('game.title'), cx, markCY + 50, {
      size: 37, grad: theme.titleGrad, maxW: W - 24,
      outline: { color: theme.titleEdge, width: 6 },
      shadow: { color: 'rgba(60,30,10,0.28)', blur: 6, oy: 3 },
      letterSpacing: '2px'
    });
    TXT(tr('game.subtitle'), cx, markCY + 78, {
      size: 12.5, color: theme.muted, maxW: W - 40, letterSpacing: '2px'
    });

    /* ── mode cards ── */
    var cardY = markCY + 84;
    var cardH = 88;
    var gap = 10;
    var cardW = (W - gap) / 2;
    var mode = APP.settings.mode;
    this.modeCard(L, cardY, cardW, cardH, 'ai', mode === 'ai');
    this.modeCard(L + cardW + gap, cardY, cardW, cardH, 'solo', mode === 'solo');

    /* ── settings block (or the solo note in its place) ── */
    var y = cardY + cardH + 16;
    if (mode === 'ai') {
      y = this.segment('players', 'home.players', y, [
        { id: '2', label: tr('home.players.n', { n: 2 }), on: APP.settings.players === 2 },
        { id: '3', label: tr('home.players.n', { n: 3 }), on: APP.settings.players === 3 },
        { id: '4', label: tr('home.players.n', { n: 4 }), on: APP.settings.players === 4 }
      ]);
      y = this.segment('diff', 'home.difficulty', y + 6, [
        { id: 'easy', label: tr('home.diff.easy'), on: APP.settings.difficulty === 'easy' },
        { id: 'normal', label: tr('home.diff.normal'), on: APP.settings.difficulty === 'normal' },
        { id: 'hard', label: tr('home.diff.hard'), on: APP.settings.difficulty === 'hard' }
      ]);
    } else {
      y = this.soloNote(y, W);
    }

    /* ── theme picker ── */
    y += 6;
    TXT(tr('home.theme'), L + 2, y + 6, { size: 12, align: 'left', color: theme.muted });
    y += 16;
    var tIds = themeIds();
    var tw = (W - 2 * 8) / tIds.length;
    for (var i = 0; i < tIds.length; i += 1) {
      this.themeChip(L + i * (tw + 8), y, tw, 50, tIds[i]);
    }
    y += 50;

    /* ── play ── */
    var playY = Math.min(y + 18, LAY.contentBottom - 58 - 26);
    drawButton(L, playY, W, 58, tr('home.play'), isPressed('play'), { size: 23, letterSpacing: '4px' });
    HIT('play', L, playY, W, 58);

    /* ── saved progress ── */
    var stats = readStats();
    var line;
    if (APP.settings.mode === 'solo') {
      line = tr('home.stats.solo', { s: stats.soloBest });
    } else {
      line = tr('home.stats.duel', { w: stats.duelWins, g: stats.duelGames }) + '  ·  ' +
        tr('home.stats.best', { s: stats.bestStreak });
    }
    TXT(line, cx, Math.min(playY + 58 + 18, LAY.contentBottom - 6), {
      size: 12, color: theme.muted, maxW: W
    });
  },

  modeCard: function (x, y, w, h, kind, on) {
    var theme = T();
    var id = 'mode:' + kind;
    var pressed = isPressed(id);
    var s = pressed ? 0.985 : 1;
    CTX.save();
    CTX.translate(x + w / 2, y + h / 2);
    CTX.scale(s, s);
    CTX.translate(-(x + w / 2), -(y + h / 2));
    withShadow(on ? 'rgba(46,28,14,0.26)' : 'rgba(46,28,14,0.14)', on ? 14 : 8, 0, 4, function () {
      fillRR(x, y, w, h, 18, theme.cardBg);
    });
    if (on) {
      strokeRR(x + 1, y + 1, w - 2, h - 2, 17, theme.accent, 2.6);
      CTX.beginPath();
      CTX.arc(x + w - 15, y + 15, 9, 0, TAU);
      CTX.fillStyle = theme.accent;
      CTX.fill();
      CTX.beginPath();
      CTX.moveTo(x + w - 19, y + 15);
      CTX.lineTo(x + w - 16, y + 18);
      CTX.lineTo(x + w - 11, y + 11.5);
      CTX.strokeStyle = '#FFFFFF';
      CTX.lineWidth = 2.2;
      CTX.lineCap = 'round';
      CTX.lineJoin = 'round';
      CTX.stroke();
    } else {
      strokeRR(x + 1, y + 1, w - 2, h - 2, 17, theme.dark ? 'rgba(255,255,255,0.16)' : 'rgba(120,90,50,0.16)', 1.6);
    }
    CTX.restore();

    var icx = x + 30;
    var icy = y + 32;
    if (kind === 'ai') {
      drawBead(icx, icy, 13, 0, { shadow: false });
      drawBead(icx + 20, icy + 9, 8, 1, { shadow: false, notch: false });
      drawBead(icx + 8, icy + 17, 7, 2, { shadow: false, notch: false });
    } else {
      drawBead(icx + 4, icy, 11, 3, { shadow: false });
      drawBead(icx + 20, icy - 6, 7, -1, { shadow: false, notch: false });
      drawBead(icx + 21, icy + 12, 7, -1, { shadow: false, notch: false });
    }
    TXT(tr(kind === 'ai' ? 'home.mode.ai' : 'home.mode.solo'), x + 14, y + 60, {
      size: 16, align: 'left', color: theme.text, maxW: w - 24
    });
    TXT(tr(kind === 'ai' ? 'home.mode.ai.sub' : 'home.mode.solo.sub'), x + 14, y + 76, {
      size: 10.5, align: 'left', color: theme.muted, maxW: w - 24
    });
    HIT(id, x, y, w, h);
  },

  /* Label + chip row. Returns the y after the row. */
  segment: function (group, labelKey, y, items) {
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    TXT(tr(labelKey), L + 2, y + 6, { size: 12, align: 'left', color: theme.muted });
    var top = y + 16;
    var h = 32;
    var gap = 8;
    var w = (R - L - gap * (items.length - 1)) / items.length;
    for (var i = 0; i < items.length; i += 1) {
      var x = L + i * (w + gap);
      var id = group + ':' + items[i].id;
      drawChip(x, top, w, h, items[i].label, items[i].on, {});
      HIT(id, x, top, w, h);
    }
    return top + h;
  },

  soloNote: function (y, W) {
    var theme = T();
    var h = 76;
    drawCard(LAY.contentLeft, y, W, h, 16, { shadowBlur: 6 });
    drawBead(LAY.contentLeft + 28, y + h / 2, 14, 3, {});
    var s = readStats();
    TXT(tr('home.stats.solo', { s: s.soloBest }), LAY.contentLeft + 54, y + 26, {
      size: 15, align: 'left', color: theme.text, maxW: W - 70
    });
    TXT(tr('board.hint.solo'), LAY.contentLeft + 54, y + 48, {
      size: 11, align: 'left', color: theme.muted, maxW: W - 70
    });
    return y + h;
  },

  themeChip: function (x, y, w, h, id) {
    var on = getThemeId() === id;
    var theme = null;
    for (var i = 0; i < THEMES.length; i += 1) { if (THEMES[i].id === id) theme = THEMES[i]; }
    if (!theme) return;
    withShadow('rgba(46,28,14,0.16)', on ? 12 : 6, 0, 3, function () {
      fillRR(x, y, w, h, 14, theme.boardBg);
    });
    /* 4x3 mini board so the palette itself is the label */
    var cols = 4;
    var rows = 3;
    var pad = 6;
    var cw = (w - pad * 2) / cols;
    var ch = (h - pad * 2 - 14) / rows;
    for (var c = 0; c < cols; c += 1) {
      for (var r = 0; r < rows; r += 1) {
        CTX.fillStyle = theme.cellTints[(c + r) % theme.cellTints.length];
        CTX.fillRect(x + pad + c * cw, y + pad + r * ch, cw, ch);
      }
    }
    drawBead(x + w * 0.32, y + pad + ch * 1.2, 5, 0, { shadow: false });
    drawBead(x + w * 0.66, y + pad + ch * 0.7, 5, 1, { shadow: false });
    TXT(themeName(theme), x + w / 2, y + h - 8, {
      size: 10, color: theme.text, maxW: w - 8,
      shadow: { color: rgba(theme.boardBg, 0.9), blur: 3, oy: 0 }
    });
    strokeRR(x + 1, y + 1, w - 2, h - 2, 13, on ? theme.accent : 'rgba(0,0,0,0.10)', on ? 2.6 : 1.2);
    HIT('theme:' + id, x, y, w, h);
  },

  actions: {
    'lang': function () { setLang(getLang() === 'zh' ? 'en' : 'zh'); },
    'sound': function () { SFX.setEnabled(!SFX.isEnabled()); cfgSet('audio.enabled', SFX.isEnabled()); },
    'rules': function () { APP.go('rules'); },
    'about': function () { APP.go('about'); },
    'play': function () { APP.startGame(); }
  }
};

function themeName(theme) {
  var n = theme.name;
  if (typeof n === 'string') return n;
  return n[getLang()] || n[FALLBACK_LANG] || n.en || theme.id;
}

/* Actions that carry a value, kept out of the flat map above. Every value is
   validated here so a malformed chip id can never corrupt the next game's setup. */
var DIFFICULTIES = ['easy', 'normal', 'hard'];

function handleHomePick(id) {
  if (id.indexOf('mode:') === 0) {
    var m = id.slice(5);
    if (m === 'ai' || m === 'solo') APP.settings.mode = m;
    return true;
  }
  if (id.indexOf('players:') === 0) {
    var p = Number(id.slice(8));
    if (isFinite(p) && p >= 2 && p <= cfgGet('rules.maxPlayers', 4)) APP.settings.players = p;
    return true;
  }
  if (id.indexOf('diff:') === 0) {
    var d = id.slice(5);
    if (DIFFICULTIES.indexOf(d) >= 0) APP.settings.difficulty = d;
    return true;
  }
  if (id.indexOf('theme:') === 0) {
    if (setThemeId(id.slice(6))) resetDeco();
    return true;
  }
  return false;
}


/* ===== 12-scene-board.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §12  SCENE · BOARD — table, live drop preview, snap resolve, AI turns
   ═══════════════════════════════════════════════════════════════════════════ */

var BS = {
  game: null,
  settings: null,
  render: { board: [], hands: [], score: 0 },
  geo: null,
  drag: null,
  reclaim: null,
  appear: {},
  ai: null,
  banner: null,
  settle: {},
  shake: 0,
  time: 0,
  over: false,
  menuOpen: false,
  band: [],

  enter: function (opts) {
    BS.game = opts.game;
    BS.settings = opts.settings;
    BS.render = {
      board: opts.game.board.slice(),
      hands: opts.game.hands.slice(),
      score: opts.game.score || 0
    };
    BS.drag = null;
    BS.reclaim = null;
    BS.appear = {};
    BS.ai = null;
    BS.banner = null;
    BS.shake = 0;
    BS.time = 0;
    BS.over = false;
    BS.menuOpen = false;
    BS.menuT = 0;
    BS.lastSeat = -1;
    BS.settle = {};
    BS.turnDelay = 0.4;
    /* Compute geometry now rather than lazily on the first draw, so any logic (or
       test) that asks for a cell position before the next frame gets a real answer. */
    BS.layout();
  },

  exit: function () { BS.drag = null; BS.ai = null; BS.reclaim = null; },

  /* ── layout ───────────────────────────────────────────────────────────── */
  layout: function () {
    var L = LAY.contentLeft;
    var W = LAY.contentRight - LAY.contentLeft;
    var solo = BS.game.mode === 'solo';
    var bandY = LAY.contentTop;
    var bandH = 32;
    var statusY = bandY + bandH + 4;
    var statusH = 22;
    var boardTop = statusY + statusH + 4;
    var trayH = solo ? 62 : 74;
    var actH = 30;
    var boardBottom = LAY.contentBottom - actH - 8 - trayH - 8;
    var trayY = boardBottom + 8;
    var actY = trayY + trayH + 8;

    var region = { x: L, y: boardTop, w: W, h: boardBottom - boardTop };
    var pad = 8;
    var cell = Math.min((region.w - pad * 2) / BS.game.cols, (region.h - pad * 2) / BS.game.rows);
    var gw = cell * BS.game.cols;
    var gh = cell * BS.game.rows;
    BS.geo = {
      x: region.x, y: region.y, w: region.w, h: region.h,
      cell: cell,
      ox: region.x + (region.w - gw) / 2,
      oy: region.y + (region.h - gh) / 2,
      gw: gw, gh: gh,
      r: cell * 0.40,
      bandY: bandY, bandH: bandH, statusY: statusY,
      trayY: trayY, trayH: trayH, actY: actY
    };
    BS.band = bandLayout(BS.game, L, W, bandY, bandH);
    return BS.geo;
  },

  cellCenter: function (col, row) {
    var g = BS.geo;
    return { x: g.ox + (col + 0.5) * g.cell, y: g.oy + (row + 0.5) * g.cell };
  },

  cellAt: function (dx, dy) {
    var g = BS.geo;
    var col = Math.round((dx - g.ox) / g.cell - 0.5);
    var row = Math.round((dy - g.oy) / g.cell - 0.5);
    if (col < 0 || row < 0 || col >= BS.game.cols || row >= BS.game.rows) return null;
    var c = BS.cellCenter(col, row);
    /* Generous grab radius: nearest-cell picking keeps small cells usable. */
    if (pdist(c.x, c.y, dx, dy) > g.cell * 0.82) return null;
    return { col: col, row: row, x: c.x, y: c.y };
  },

  /* ── turn scheduling ──────────────────────────────────────────────────── */
  scheduleTurn: function () {
    if (BS.over) return;
    if (BS.game.over) { BS.finish(); return; }
    var seat = BS.game.turn;
    if (seat < 0) { BS.finish(); return; }
    if (isAISeat(BS.game, seat)) {
      BS.ai = {
        t: 0,
        wait: cfgGet('ai.thinkMin', 0.7) + Math.random() * cfgGet('ai.thinkJitter', 0.6),
        seat: seat,
        fly: null
      };
    } else if (BS.lastSeat !== seat) {
      BS.banner = { t: 0, text: tr('board.your-turn') };
    }
    BS.lastSeat = seat;
  },

  /* Short beat between a resolve animation and the next decision. */
  armTurn: function (delay) { BS.turnDelay = delay; },

  finish: function () {
    BS.over = true;
  },

  /* ── committing a move ────────────────────────────────────────────────── */
  commitMove: function (x, y) {
    if (BS.game.over || BS.over) return;
    var prev = BS.game;
    var res = placePiece(prev, x, y);
    if (!res.ok) { SFX.bump(); return; }
    var r = res.result;
    BS.game = res.game;
    BS.banner = null;          /* the turn changed: a stale prompt would mislead */

    if (res.foul) {
      var hit = {};
      for (var i = 0; i < r.hitIds.length; i += 1) hit[r.hitIds[i]] = true;
      var going = [];
      var staying = [];
      var cells = [];
      for (var b = 0; b < prev.board.length; b += 1) {
        if (hit[prev.board[b].id]) going.push(prev.board[b]);
        else staying.push(prev.board[b]);
      }
      /* the new bead never settles: it travels back with the group */
      var ghost = { x: x, y: y, owner: prev.turn, id: -1000 };
      going.push(ghost);
      going.sort(function (a, c) {
        return pdist(a.x, a.y, x, y) - pdist(c.x, c.y, x, y);
      });
      for (var j = 0; j < going.length; j += 1) {
        cells.push(BS.cellCenter(going[j].x, going[j].y));
      }
      BS.render.board = staying.concat(going);
      var chainDelay = cfgGet('anim.snapChainDelayMs', 80) / 1000;
      BS.reclaim = {
        t: 0,
        seat: prev.turn,
        list: going,
        cells: cells,
        gain: r.hitIds.length,
        chainDelay: chainDelay,
        dur: (going.length - 1) * chainDelay + cfgGet('anim.reclaimFlyMs', 340) / 1000,
        hands: BS.render.hands.slice()
      };
      BS.shake = 0.42;
      for (var k = 0; k < going.length; k += 1) SFX.snap(k);
    } else {
      BS.render.board = res.game.board.slice();
      BS.render.hands = res.game.hands.slice();
      for (var p = 0; p < BS.render.board.length; p += 1) {
        if (BS.render.board[p].x === x && BS.render.board[p].y === y) {
          BS.appear[BS.render.board[p].id] = 0;
          BS.settle[BS.render.board[p].id] = 0;
        }
      }
      SFX.drop();
    }
    BS.armTurn(0.32);
    BS.lastMoveAt = { x: x, y: y, foul: !!res.foul };
  },

  reclaimStep: function (dt) {
    var rc = BS.reclaim;
    if (!rc) return;
    rc.t += dt;
    if (rc.t >= rc.dur) {
      BS.render.board = BS.game.board.slice();
      BS.render.hands = BS.game.hands.slice();
      BS.reclaim = null;
      BS.armTurn(0.15);
      return;
    }
    /* hand counter ticks up as the group lands, one bead at a time */
    var landed = 0;
    for (var i = 0; i < rc.list.length; i += 1) {
      if (rc.t >= i * rc.chainDelay + cfgGet('anim.reclaimFlyMs', 340) / 1000) landed += 1;
    }
    var hands = rc.hands.slice();
    hands[rc.seat] += landed;
    BS.render.hands = hands;
  },

  /* ── update ───────────────────────────────────────────────────────────── */
  update: function (dt) {
    BS.time += dt;
    if (BS.shake > 0) BS.shake = Math.max(0, BS.shake - dt * 1.7);
    if (BS.banner) {
      BS.banner.t += dt;
      if (BS.banner.t > cfgGet('anim.turnBannerMs', 820) / 1000) BS.banner = null;
    }
    for (var id in BS.appear) {
      if (Object.prototype.hasOwnProperty.call(BS.appear, id)) {
        BS.appear[id] = Math.min(1, BS.appear[id] + dt / (cfgGet('anim.settleBounceMs', 220) / 1000));
      }
    }
    for (var sid in BS.settle) {
      if (Object.prototype.hasOwnProperty.call(BS.settle, sid)) {
        BS.settle[sid] = Math.min(1, BS.settle[sid] + dt / 0.5);
      }
    }

    if (BS.reclaim) { BS.reclaimStep(dt); return; }
    if (BS.over) return;
    if (BS.menuOpen) BS.menuT += dt;
    if (BS.game.over) { BS.finish(); return; }
    if (BS.turnDelay > 0) {
      BS.turnDelay -= dt;
      if (BS.turnDelay > 0) return;
      BS.turnDelay = 0;
      BS.scheduleTurn();
      return;
    }

    var ai = BS.ai;
    if (!ai) return;
    ai.t += dt;
    if (!ai.fly) {
      if (ai.t < ai.wait) return;
      var cell = chooseMove(BS.game, BS.settings.difficulty);
      if (!cell) { BS.finish(); return; }
      var c = BS.cellCenter(cell.x, cell.y);
      var from = BS.handAnchor(ai.seat);
      ai.fly = { t: 0, dur: cfgGet('ai.tween', 0.4),
        from: from, to: c, cell: cell };
      return;
    }
    ai.fly.t += dt;
    if (ai.fly.t >= ai.fly.dur) {
      var mv = ai.fly.cell;
      BS.ai = null;
      BS.commitMove(mv.x, mv.y);
    }
  },

  handAnchor: function (seat) {
    for (var i = 0; i < BS.band.length; i += 1) {
      if (BS.band[i].seat === seat) return { x: BS.band[i].x + BS.band[i].w / 2, y: BS.band[i].y + BS.band[i].h / 2 };
    }
    return { x: (LAY.contentLeft + LAY.contentRight) / 2, y: LAY.contentTop + 16 };
  },

  /* ── draw ─────────────────────────────────────────────────────────────── */
  draw: function (dt, time) {
    var g = BS.layout();
    var theme = T();
    var solo = BS.game.mode === 'solo';

    CTX.save();
    if (BS.shake > 0) {
      var m = BS.shake * 5;
      CTX.translate(Math.sin(time * 61) * m, Math.cos(time * 47) * m);
    }

    BS.drawBand(time);
    BS.drawStatus();
    BS.drawBoard(time);
    BS.drawTray(time);
    BS.drawActions();
    CTX.restore();

    if (BS.banner) BS.drawBanner();
    if (BS.menuOpen) BS.drawMenu();

    /* floating bead: dragging, or an AI bead in flight */
    if (BS.drag && BS.drag.active) {
      var r = g.r * 1.12;
      drawBead(BS.drag.x, BS.drag.y, r, BS.game.turn, { glow: theme.primary, notch: false });
      CTX.save();
      CTX.globalAlpha = 0.75;
      drawBead(BS.drag.x, BS.drag.y, r * 0.55, BS.game.turn, { shadow: false, notch: true });
      CTX.restore();
    }
    if (BS.ai && BS.ai.fly) {
      var f = BS.ai.fly;
      var t = easeInOutCubic(clamp(f.t / f.dur, 0, 1));
      var px = lerp(f.from.x, f.to.x, t);
      var py = lerp(f.from.y, f.to.y, t);
      drawBead(px, py, g.r, BS.ai.seat, { glow: seatColor(BS.ai.seat), notch: false });
    }
  },

  /* Player band: one chip per seat, current seat lifted. */
  drawBand: function (time) {
    var theme = T();
    var solo = BS.game.mode === 'solo';
    for (var i = 0; i < BS.band.length; i += 1) {
      var c = BS.band[i];
      var seat = c.seat;
      var active = BS.game.turn === seat && !BS.game.over;
      var bg = active ? theme.cardBg : (theme.dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.42)');
      withShadow(active ? 'rgba(46,28,14,0.24)' : 'rgba(46,28,14,0.10)', active ? 10 : 4, 0, active ? 3 : 1, function () {
        fillRR(c.x, c.y - (active ? 2 : 0), c.w, c.h, 12, bg);
      });
      if (active) {
        strokeRR(c.x + 1, c.y - 1, c.w - 2, c.h + 2, 12, theme.accent, 2.2);
      }
      if (solo) {
        TXT(tr('board.score', { n: BS.render.score }), c.x + c.w / 2, c.y + c.h / 2, {
          size: 17, color: theme.text, maxW: c.w - 120
        });
        TXT(tr('result.best', { n: readStats().soloBest }), c.x + 12, c.y + c.h / 2, {
          size: 11, align: 'left', color: theme.muted, maxW: c.w * 0.32
        });
        continue;
      }
      var dotR = c.h * 0.30;
      var dx = c.x + 6 + dotR;
      var dy = c.y + c.h / 2 - (active ? 2 : 0);
      drawBead(dx, dy, dotR, seat, { shadow: false, notch: true, glow: active ? seatColor(seat) : null });
      var label = seat === 0 ? tr('board.you', { name: seatName(seat) }) : (isAISeat(BS.game, seat) ? tr('board.ai', { name: seatName(seat) }) : seatName(seat));
      TXT(label, dx + dotR + 5, dy - 6, { size: 10.5, align: 'left', color: active ? theme.text : theme.muted, maxW: c.w - dotR * 2 - 16 });
      TXT(tr('board.hand', { n: BS.render.hands[seat] }), dx + dotR + 5, dy + 7, {
        size: 12, align: 'left', color: theme.text, maxW: c.w - dotR * 2 - 16
      });
    }
  },

  drawStatus: function () {
    var g = BS.geo;
    var theme = T();
    var solo = BS.game.mode === 'solo';
    var cx = (LAY.contentLeft + LAY.contentRight) / 2;
    var text;
    if (BS.reclaim) text = tr('board.foul', { n: BS.reclaim.gain });
    else if (BS.game.over) text = tr('result.title');
    else if (solo) text = tr('board.hint.solo');
    else if (BS.game.turn < 0) text = '';
    else if (BS.game.turn === 0) text = tr('board.hint.place');
    else if (isAISeat(BS.game, BS.game.turn)) text = tr('board.ai-turn', { name: seatName(BS.game.turn) });
    else text = tr('board.turn', { name: seatName(BS.game.turn) });

    /* Hand counts live in the player band, so the status line carries one message
       in the middle and the single most useful number on the right. */
    var safe = countSafeCells(BS.game);
    var sideW = g.w * 0.30;
    TXT(text, cx, g.statusY + 11, { size: 12.5, color: theme.muted, maxW: g.w - sideW * 2 - 12 });
    /* Safe cells is the number the whole strategy turns on in both modes. Zero is
       the inflection point: in a duel every drop now snaps (a warning), while in a
       solo run it means the board is exhausted (a good thing). */
    TXT(tr('board.safe-cells', { n: safe }), LAY.contentRight - 2, g.statusY + 11, {
      size: 12.5, align: 'right', maxW: sideW,
      color: safe === 0 ? (solo ? theme.primary : theme.warn) : theme.muted,
      weight: safe === 0 ? '800' : '700'
    });
  },

  drawBoard: function (time) {
    var g = BS.geo;
    var theme = T();
    var cell = g.cell;

    /* static surface (panel, checkerboard, grid, grain, light) is a cached bitmap */
    var bm = boardBitmap(BS.game.cols, BS.game.rows, cell);
    CTX.drawImage(bm.canvas, g.ox - bm.pad, g.oy - bm.pad, bm.spanW, bm.spanH);

    /* drop preview: the live magnetic field of the cell under the pointer */
    var target = null;
    if (BS.drag && BS.drag.active && BS.drag.cell) target = BS.drag.cell;
    if (target && !BS.game.over && !BS.reclaim) {
      var hot = isMineCell(BS.game.board, target.col, target.row);
      var fr = snapRadius() * cell;
      drawFieldRing(target.x, target.y, fr, hot, time);
      if (hot) {
        for (var b = 0; b < BS.game.board.length; b += 1) {
          var p = BS.game.board[b];
          if (pdist(p.x, p.y, target.col, target.row) >= snapRadius()) continue;
          var pc = BS.cellCenter(p.x, p.y);
          CTX.save();
          CTX.globalAlpha = 0.55 + 0.45 * Math.sin(time * 8);
          CTX.beginPath();
          CTX.moveTo(target.x, target.y);
          CTX.lineTo(pc.x, pc.y);
          CTX.strokeStyle = rgba(T().warn, 0.9);
          CTX.lineWidth = 1.6;
          CTX.setLineDash([3, 3]);
          CTX.stroke();
          CTX.setLineDash([]);
          CTX.restore();
        }
      }
    }

    /* beads */
    var rc = BS.reclaim;
    for (var k = 0; k < BS.render.board.length; k += 1) {
      var piece = BS.render.board[k];
      var pos = BS.cellCenter(piece.x, piece.y);
      var radius = g.r;
      var alpha = 1;
      var notch = piece.owner < 0;

      if (piece.owner < 0) {
        /* neutral solo obstacle */
        drawBead(pos.x, pos.y, radius * 0.86, -1, { notch: true });
        continue;
      }

      if (rc) {
        var idx = rc.list.indexOf(piece);
        if (idx >= 0) {
          var d = rc.chainDelay;
          var flyMs = cfgGet('anim.reclaimFlyMs', 340) / 1000;
          var local = clamp((rc.t - idx * d) / flyMs, 0, 1);
          if (local <= 0) {
            /* still held: pulse in place as the field grabs it */
            var pulse = 1 + 0.18 * Math.sin(time * 18 + idx);
            drawBead(pos.x, pos.y, radius * pulse, piece.owner, { glow: T().warn });
            continue;
          }
          var anchor = BS.handAnchor(rc.seat);
          var e = easeInCubic(local);
          pos = { x: lerp(pos.x, anchor.x, e), y: lerp(pos.y, anchor.y, e - 0.25 * local * local) };
          radius = g.r * (1 - 0.55 * local);
          alpha = 1 - 0.75 * local * local;
        }
      }

      var ap = BS.appear[piece.id];
      var scale = ap === undefined ? 1 : (0.4 + 0.6 * easeOutBack(ap));
      if (BS.settle[piece.id] !== undefined && BS.appear[piece.id] === 1) {
        var st = BS.settle[piece.id];
        scale = 1 + 0.12 * Math.sin(st * Math.PI) * (1 - st);
      }
      drawBead(pos.x, pos.y, radius * scale, piece.owner, { alpha: alpha, notch: notch });
    }

    /* last-move marker */
    if (BS.game.lastMove && !BS.reclaim && !BS.game.over) {
      var lm = BS.game.lastMove;
      if (lm.type === 'land') {
        var lc = BS.cellCenter(lm.x, lm.y);
        CTX.save();
        CTX.globalAlpha = 0.30 + 0.20 * Math.sin(time * 3);
        CTX.beginPath();
        CTX.arc(lc.x, lc.y, g.r * 1.5, 0, TAU);
        CTX.strokeStyle = seatColor(lm.owner);
        CTX.lineWidth = 2;
        CTX.stroke();
        CTX.restore();
      }
    }
  },

  drawTray: function (time) {
    var g = BS.geo;
    var theme = T();
    var solo = BS.game.mode === 'solo';

    withShadow('rgba(46,28,14,0.14)', 8, 0, 3, function () {
      fillRR(LAY.contentLeft, g.trayY, g.w, g.trayH, 14, theme.dark ? 'rgba(255,255,255,0.08)' : 'rgba(255,255,255,0.44)');
    });

    if (solo) {
      TXT(tr('board.hint.drag'), LAY.contentLeft + g.w / 2, g.trayY + g.trayH / 2, {
        size: 12.5, color: theme.muted, maxW: g.w - 20
      });
      return;
    }

    /* The tray is always the local player's hand: following whoever is on turn
       would read as "these are mine to play" while an AI seat is thinking. */
    var count = BS.render.hands[0];
    var myTurn = BS.game.turn === 0 && !BS.game.over && !BS.reclaim;
    var usable = g.w - 16;
    var shown = Math.max(1, Math.min(count, Math.floor(usable / 15)));
    var r = Math.min(g.trayH * 0.27, usable / shown / 2.4);
    var step = shown > 1 ? (usable - r * 2) / (shown - 1) : 0;
    var dim = myTurn ? 1 : 0.30;
    for (var i = 0; i < shown; i += 1) {
      drawBead(LAY.contentLeft + 8 + r + i * step, g.trayY + g.trayH / 2, r, 0, {
        notch: false, alpha: dim
      });
    }
    if (count <= 0) {
      TXT(tr('board.hand', { n: 0 }), LAY.contentLeft + g.w / 2, g.trayY + g.trayH / 2, {
        size: 13, color: theme.muted
      });
    } else if (!myTurn && !BS.game.over) {
      /* Sit the label on its own pill rather than haloing it: a blurred backdrop
         over dimmed beads reads as smudge at this size. */
      var label = tr('board.wait-turn', { name: seatName(BS.game.turn) });
      setFont(13.5, '700');
      var lw = Math.min(g.w - 20, CTX.measureText(label).width + 28);
      var lh = 27;
      var midY = g.trayY + g.trayH / 2;
      fillRR(LAY.contentLeft + g.w / 2 - lw / 2, midY - lh / 2, lw, lh, lh / 2, theme.cardBg);
      strokeRR(LAY.contentLeft + g.w / 2 - lw / 2, midY - lh / 2, lw, lh, lh / 2, rgba(theme.boardEdge, 0.18), 1);
      TXT(label, LAY.contentLeft + g.w / 2, midY, { size: 13.5, color: theme.text, maxW: lw - 16 });
    }
  },

  drawActions: function () {
    var g = BS.geo;
    var w = 92;
    var gap = 10;
    var total = w * 2 + gap;
    var x0 = (LAY.contentLeft + LAY.contentRight) / 2 - total / 2;
    drawChip(x0, g.actY, w, 30, tr('board.menu'), isPressed('menu'), { size: 13 });
    HIT('menu', x0, g.actY, w, 30);
    drawChip(x0 + w + gap, g.actY, w, 30, tr('board.restart'), isPressed('restart'), { size: 13 });
    HIT('restart', x0 + w + gap, g.actY, w, 30);
  },

  drawBanner: function () {
    var b = BS.banner;
    var p = clamp(b.t / 0.22, 0, 1);
    var out = clamp((cfgGet('anim.turnBannerMs', 820) / 1000 - b.t) / 0.25, 0, 1);
    var a = Math.min(p, out);
    var y = BS.geo.y + 6;
    CTX.save();
    CTX.globalAlpha = a * 0.96;
    CTX.translate(0, (1 - easeOutCubic(p)) * -14);
    var w = Math.min(LAY.contentRight - LAY.contentLeft, 220);
    var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
    withShadow('rgba(20,10,0,0.28)', 14, 0, 5, function () {
      fillRR(x, y, w, 34, 17, rgba(T().boardEdge, 0.90));
    });
    TXT(b.text, x + w / 2, y + 17.5, { size: 15, color: '#FFF6E6', maxW: w - 16 });
    CTX.restore();
  },

  drawMenu: function () {
    var w = 260;
    var h = 190;
    var card = drawModalCard(w, h, BS.menuT);
    var theme = T();
    TXT(tr('board.paused'), card.x + w / 2, card.y + 28, { size: 19, color: theme.text });
    TXT(tr('board.quit.hint'), card.x + w / 2, card.y + 50, { size: 11.5, color: theme.muted });
    var bw = w - 40;
    drawButton(card.x + 20, card.y + 68, bw, 42, tr('board.resume'), isPressed('resume'), { size: 16 });
    HIT('resume', card.x + 20, card.y + 68, bw, 42);
    drawChip(card.x + 20, card.y + 118, bw, 36, tr('board.restart'), isPressed('restart'), { size: 14 });
    HIT('restart', card.x + 20, card.y + 118, bw, 36);
    drawChip(card.x + 20, card.y + 158, bw, 24, tr('board.quit'), isPressed('quit'), { size: 13 });
    HIT('quit', card.x + 20, card.y + 158, bw, 24);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  down: function (x, y) {
    var id = pickHit(x, y);
    if (BS.menuOpen) {
      if (id === 'resume') { BS.menuOpen = false; BS.menuT = 0; return; }
      if (id === 'restart') { BS.menuOpen = false; APP.restartGame(); return; }
      if (id === 'quit') { BS.menuOpen = false; APP.go('home'); return; }
      return;
    }
    if (id === 'menu') { BS.menuOpen = true; BS.menuT = 0; return; }
    if (id === 'restart') { APP.restartGame(); return; }
    if (id) return;

    if (BS.reclaim || BS.over || BS.game.over) return;
    var seat = BS.game.turn;
    if (seat !== 0 || isAISeat(BS.game, seat)) return;
    /* Drag may start on the board or on the hand tray. */
    var inBoard = x >= BS.geo.x && x <= BS.geo.x + BS.geo.w && y >= BS.geo.y && y <= BS.geo.y + BS.geo.h;
    var inTray = y >= BS.geo.trayY && y <= BS.geo.trayY + BS.geo.trayH;
    if (!inBoard && !inTray) return;
    BS.drag = { active: true, x: x, y: y, cell: BS.cellAt(x, y) };
  },

  move: function (x, y) {
    if (!BS.drag || !BS.drag.active) return;
    BS.drag.x = x;
    BS.drag.y = y;
    BS.drag.cell = BS.cellAt(x, y);
  },

  up: function (x, y) {
    if (!BS.drag || !BS.drag.active) return;
    var cell = BS.cellAt(x, y);
    BS.drag = null;
    if (!cell) return;
    if (occupied(BS.game.board, cell.col, cell.row)) { SFX.bump(); return; }
    BS.commitMove(cell.col, cell.row);
  }
};

/* One chip per seat across the band. */
function bandLayout(game, L, W, bandY, bandH) {
  var n = game.playerCount;
  var gap = 6;
  var w = (W - gap * (n - 1)) / n;
  var out = [];
  for (var i = 0; i < n; i += 1) {
    out.push({ seat: i, x: L + i * (w + gap), y: bandY, w: w, h: bandH });
  }
  return out;
}


/* ===== 13-scene-result.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §13  SCENE · RESULT — outcome, standings, stats, and the restart entry point
   ═══════════════════════════════════════════════════════════════════════════ */

var RS = {
  game: null,
  settings: null,
  t: 0,
  best: false,
  bestScore: 0,

  enter: function (opts) {
    RS.game = opts.game;
    RS.settings = opts.settings;
    RS.t = 0;
    RS.best = false;
    var g = RS.game;
    if (g.mode === 'solo') {
      var st = readStats();
      RS.bestScore = st.soloBest;
      var perfect = g.endReason === 'full' || g.endReason === 'nomove';
      if (g.score > st.soloBest) {
        st.soloBest = g.score;
        RS.best = true;
      }
      st.soloGames = (st.soloGames || 0) + 1;
      writeStats(st);
      RS.bestScore = st.soloBest;
      SFX[perfect ? 'win' : 'lose'](perfect);
    } else {
      var s = readStats();
      var won = g.winner === 0;
      s.duelGames += 1;
      if (won) {
        s.duelWins += 1;
        s.streak += 1;
        if (s.streak > s.bestStreak) s.bestStreak = s.streak;
      } else {
        s.streak = 0;
      }
      writeStats(s);
      SFX[won ? 'win' : 'lose'](false);
    }
  },

  exit: function () {},

  headline: function () {
    var g = RS.game;
    if (g.mode === 'solo') {
      if (g.endReason === 'full' || g.endReason === 'nomove') return tr('result.solo-perfect');
      return tr('result.solo-end');
    }
    return g.winner === 0 ? tr('result.win') : tr('result.lose');
  },

  reasonText: function () {
    var g = RS.game;
    if (g.mode === 'solo') return tr('result.reason.' + (g.endReason === 'foul' ? 'foul' : g.endReason));
    if (g.endReason === 'empty') return tr('result.reason.empty');
    if (g.endReason === 'stall') return tr('result.reason.stall');
    if (g.endReason === 'full') return tr('result.reason.full');
    return '';
  },

  draw: function (dt, time) {
    RS.t += dt;
    var g = RS.game;
    var solo = g.mode === 'solo';
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;
    var pop = clamp(RS.t / 0.3, 0, 1);

    /* ── ribbon ── */
    var ribY = LAY.contentTop + 6;
    var ribH = 62;
    CTX.save();
    CTX.translate(cx, ribY + ribH / 2);
    var s = 0.9 + 0.1 * easeOutBack(pop);
    CTX.scale(s, s);
    CTX.translate(-cx, -(ribY + ribH / 2));
    withShadow('rgba(40,22,8,0.32)', 16, 0, 6, function () {
      fillRR(L - 2, ribY, W + 4, ribH, 16, vGrad(L, ribY, W, ribH, theme.bannerGrad[0], theme.bannerGrad[1]));
    });
    roundRectPath(L + 1, ribY + 1, W - 2, ribH * 0.44, 14);
    CTX.strokeStyle = 'rgba(255,255,255,0.34)';
    CTX.lineWidth = 1.4;
    CTX.stroke();
    TXT(RS.headline(), cx, ribY + ribH / 2 - 4, {
      size: 27, color: '#FFFFFF', maxW: W - 28, letterSpacing: '2px',
      shadow: { color: 'rgba(0,0,0,0.28)', blur: 4, oy: 2 }
    });
    TXT(RS.reasonText(), cx, ribY + ribH / 2 + 18, {
      size: 11.5, color: 'rgba(255,255,255,0.92)', maxW: W - 28
    });
    CTX.restore();

    var y = ribY + ribH + 14;

    if (solo) {
      y = RS.drawSoloPanel(y, W, L, cx);
    } else {
      y = RS.drawStandings(y, W, L, cx);
    }

    /* ── stats ── */
    var st = g.stats[0];
    var rows = [];
    if (solo) {
      /* The headline already shows the score, and in solo the score IS the safe-drop
         count — so these rows carry the things the headline does not. */
      rows.push([tr('result.stat.fouls'), String(st.snaps)]);
      rows.push([tr('result.stat.onboard'), String(Math.max(0, g.board.length - g.obstacleCount))]);
      rows.push([tr('result.stat.safeleft'), String(countSafeCells(g))]);
    } else {
      rows.push([tr('result.stat.placed'), String(st.placed)]);
      rows.push([tr('result.stat.fouls'), String(st.snaps)]);
      rows.push([tr('result.stat.lost'), String(st.pulledBack)]);
    }
    var ph = 22 + rows.length * 22 + 8;
    drawCard(L, y, W, ph, 16, { shadowBlur: 8 });
    for (var i = 0; i < rows.length; i += 1) {
      var ry = y + 24 + i * 22;
      TXT(rows[i][0], L + 14, ry, { size: 13, align: 'left', color: theme.muted, maxW: W * 0.6 });
      TXT(rows[i][1], R - 14, ry, { size: 15, align: 'right', color: theme.text });
    }
    y += ph + 12;

    /* ── actions ── */
    var btnH = 50;
    var againY = Math.min(y, LAY.contentBottom - btnH - 34 - 12);
    drawButton(L, againY, W, btnH, tr('result.again'), isPressed('again'), { size: 20, letterSpacing: '2px' });
    HIT('again', L, againY, W, btnH);
    drawChip(L, againY + btnH + 10, W, 30, tr('result.home'), isPressed('home'), { size: 14 });
    HIT('home', L, againY + btnH + 10, W, 30);
  },

  /* Standings list for 2-4 seats. */
  drawStandings: function (y, W, L, cx) {
    var g = RS.game;
    var theme = T();
    var h = 26 + g.playerCount * 34 + 6;
    drawCard(L, y, W, h, 16, { shadowBlur: 8 });
    TXT(tr('result.rank'), L + 14, y + 18, { size: 12, align: 'left', color: theme.muted });
    var ranking = g.ranking && g.ranking.length ? g.ranking : computeRanking(g);
    for (var i = 0; i < ranking.length; i += 1) {
      var seat = ranking[i];
      var rowY = y + 34 + i * 34;
      var rank = playerRank(g, seat);
      var isMe = seat === 0;
      /* Ties share a rank, so "won" is rank 1 — not seat === winner, which would
         mark only the first of two tied leaders. */
      var isWinner = rank === 1;
      if (isMe) fillRR(L + 8, rowY, W - 16, 30, 10, rgba(theme.accent, 0.16));
      else if (isWinner) fillRR(L + 8, rowY, W - 16, 30, 10, rgba(seatColor(seat), 0.10));

      /* seat-coloured spine so the row ties back to the bead colour on the board */
      fillRR(L + 12, rowY + 4, 4, 22, 2, seatColor(seat));

      TXT(String(rank), L + 26, rowY + 15, { size: 14, color: theme.text });
      drawBead(L + 52, rowY + 15, 9, seat, { shadow: false });
      var name = seat === 0
        ? tr('board.you', { name: seatName(seat) })
        : (isAISeat(g, seat) ? tr('board.ai', { name: seatName(seat) }) : seatName(seat));
      TXT(name, L + 68, rowY + 15, { size: 13, align: 'left', color: theme.text, maxW: W - 156 });
      TXT(tr('result.left', { n: g.hands[seat] }), L + W - 14, rowY + 15, {
        size: 13, align: 'right', color: theme.muted
      });
      if (isWinner) drawSpark(L + W - 78, rowY + 15, 8, theme.accent, 0.95);
    }
    return y + h + 12;
  },

  /* Solo: one big score with the personal best underneath. */
  drawSoloPanel: function (y, W, L, cx) {
    var g = RS.game;
    var theme = T();
    var h = 104;
    drawCard(L, y, W, h, 16, { shadowBlur: 8 });
    TXT(tr('result.stat.score'), cx, y + 20, { size: 12, color: theme.muted });
    TXT(String(g.score), cx, y + 54, {
      size: 46, grad: theme.titleGrad, maxW: W - 40,
      outline: { color: theme.titleEdge, width: 5 }
    });
    var bestLine = RS.best ? tr('result.newbest') : tr('result.best', { n: RS.bestScore });
    TXT(bestLine, cx, y + 86, {
      size: 12.5, color: RS.best ? theme.accent : theme.muted, maxW: W - 30
    });
    return y + h + 12;
  },

  actions: {
    'again': function () { APP.restartGame(); },
    'home': function () { APP.go('home'); }
  }
};


/* ===== 14-scene-legal.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §14  SCENE · RULES / ABOUT + the first-launch agreement
   ═══════════════════════════════════════════════════════════════════════════ */

var RULES = {
  draw: function (dt, time) {
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var y = drawHeader(tr('rules.title'), 'back', time) + 26;

    /* Live diagram. Everything is drawn INSIDE the field ring, because that is
       exactly the rule: a bead dropped in the field is what triggers the snap. */
    var dh = 96;
    drawCard(L, y, W, dh, 16, { shadowBlur: 8 });
    var cx = L + W / 2;
    var cy = y + dh / 2;
    var r = 11.5;
    var step = 26;
    var anchorX = cx - step * 0.35;
    var anchorY = cy + 6;
    var ringR = snapRadius() * step;

    CTX.save();
    var gg = CTX.createRadialGradient(anchorX, anchorY, 4, anchorX, anchorY, ringR);
    gg.addColorStop(0, rgba(theme.warn, 0.04));
    gg.addColorStop(1, rgba(theme.warn, 0.30));
    CTX.beginPath();
    CTX.arc(anchorX, anchorY, ringR, 0, TAU);
    CTX.fillStyle = gg;
    CTX.fill();
    CTX.beginPath();
    CTX.arc(anchorX, anchorY, ringR, 0, TAU);
    CTX.setLineDash([4, 4]);
    CTX.lineDashOffset = -time * 10;
    CTX.strokeStyle = rgba(theme.warn, 0.9);
    CTX.lineWidth = 1.8;
    CTX.stroke();
    CTX.setLineDash([]);
    CTX.restore();

    /* the settled bead that owns the field, and two neighbours it has caught */
    var nb1 = { x: anchorX + step * 0.92, y: anchorY - step * 0.38 };
    var nb2 = { x: anchorX - step * 0.30, y: anchorY + step * 0.86 };
    drawBead(nb1.x, nb1.y, r, 1, { notch: true });
    drawBead(nb2.x, nb2.y, r, 2, { notch: true });
    drawBead(anchorX, anchorY, r, 0, { notch: false });

    /* the bead arriving into the field, mid-pull */
    var pulse = 1 + 0.08 * Math.sin(time * 5);
    var inX = anchorX + step * 1.35;
    var inY = anchorY + step * 0.62;
    drawBead(inX, inY, r * pulse, 3, { glow: theme.warn, notch: false });
    CTX.save();
    CTX.globalAlpha = 0.55 + 0.35 * Math.sin(time * 5);
    CTX.beginPath();
    CTX.moveTo(inX - r * 0.9, inY - r * 0.5);
    CTX.lineTo(nb1.x + r * 0.8, nb1.y + r * 0.5);
    CTX.strokeStyle = rgba(theme.warn, 0.95);
    CTX.lineWidth = 1.8;
    CTX.setLineDash([3, 3]);
    CTX.stroke();
    CTX.restore();
    drawSpark((inX + nb1.x) / 2, (inY + nb1.y) / 2, 7, theme.warn, 0.9);

    y += dh + 14;

    var sections = [
      [tr('rules.goal.h'), [tr('rules.goal.duel'), tr('rules.goal.solo')]],
      [tr('rules.snap.h'), [tr('rules.snap.b')]],
      [tr('rules.safe.h'), [tr('rules.safe.b')]],
      [tr('rules.end.h'), [tr('rules.end.b')]]
    ];
    var bodySize = 11.5;
    var maxW = W - 28;
    var avail = LAY.contentBottom - 62 - y;
    var total = 0;
    for (var i = 0; i < sections.length; i += 1) {
      var bodyH = 0;
      for (var pi = 0; pi < sections[i][1].length; pi += 1) {
        bodyH += paragraphHeight(sections[i][1][pi], maxW, bodySize, '500', 1.45);
      }
      total += 22 + bodyH + 8;
    }
    total += paragraphHeight(tr('rules.tip'), maxW, 11, '700', 1.45) + 16;
    /* Shrink rather than clip if the copy runs long in either language. */
    var scale = total > avail ? Math.max(0.72, avail / total) : 1;

    /* +22 leaves real breathing room under the last line: the descenders of a
       final glyph otherwise sit right on the card edge. */
    var cardH = total * scale + 22;
    drawCard(L, y, W, cardH, 16, { shadowBlur: 8 });
    var cursor = y + 8;
    for (var s = 0; s < sections.length; s += 1) {
      drawSpark(L + 15, cursor + 11, 5, theme.accent, 0.95);
      TXT(sections[s][0], L + 26, cursor + 11, { size: 13 * scale, align: 'left', color: theme.text, maxW: maxW });
      cursor += 22 * scale;
      for (var pj = 0; pj < sections[s][1].length; pj += 1) {
        cursor += paragraph(sections[s][1][pj], L + 14, cursor, maxW, {
          size: bodySize * scale, color: theme.muted, lineHeight: 1.45
        });
      }
      cursor += 8 * scale;
    }
    cursor += paragraph(tr('rules.tip'), L + 14, cursor, maxW, {
      size: 11 * scale, weight: '700', color: theme.accent, lineHeight: 1.45
    });
    y += cardH + 12;

    drawButton(L, Math.min(y, LAY.contentBottom - 46), W, 46, tr('rules.back'), isPressed('back'), { size: 17 });
    HIT('back', L, Math.min(y, LAY.contentBottom - 46), W, 46);
  },
  actions: { 'back': function () { APP.go('home'); } }
};

var ABOUT = {
  draw: function (dt, time) {
    var theme = T();
    var L = LAY.contentLeft;
    var R = LAY.contentRight;
    var W = R - L;
    var cx = (L + R) / 2;
    var y = drawHeader(tr('about.title'), 'back', time) + 24;

    /* app icon + store cover, both loaded through window.lib.getAsset */
    var ih = 66;
    var icon = assetImage('icon');
    var poster = assetImage('poster');
    var pw = poster ? ih * (9 / 16) : 0;
    var totalW = ih + (poster ? pw + 10 : 0);
    var ix = cx - totalW / 2;
    CTX.save();
    roundRectPath(ix, y, ih, ih, 15);
    CTX.clip();
    if (icon) {
      CTX.drawImage(icon, ix, y, ih, ih);
    } else {
      /* procedural stand-in keeps the layout identical when the asset is absent */
      CTX.fillStyle = vGrad(ix, y, ih, ih, theme.bg[0], theme.bg[1]);
      CTX.fillRect(ix, y, ih, ih);
      drawMark(ix + ih / 2, y + ih / 2, ih * 0.82, time);
    }
    CTX.restore();
    strokeRR(ix, y, ih, ih, 15, rgba(theme.boardEdge, 0.5), 1.6);
    if (poster) {
      var px = ix + ih + 10;
      CTX.save();
      roundRectPath(px, y, pw, ih, 10);
      CTX.clip();
      CTX.drawImage(poster, px, y, pw, ih);
      CTX.restore();
      strokeRR(px, y, pw, ih, 10, rgba(theme.boardEdge, 0.5), 1.4);
    }

    var tx = ix + totalW + 12;
    TXT(tr('game.title'), tx, y + 24, { size: 21, align: 'left', color: theme.text, maxW: R - tx });
    TXT(tr('game.subtitle'), tx, y + 44, { size: 12, align: 'left', color: theme.muted, maxW: R - tx });
    TXT(tr('about.version', { v: APP_VERSION }), tx, y + 60, {
      size: 11, align: 'left', color: theme.muted, maxW: R - tx
    });
    y += ih + 16;

    var blocks = [
      [tr('about.original.h'), tr('about.original.b')],
      [tr('about.offline.h'), tr('about.offline.b')],
      [tr('about.save.h'), tr('about.save.b')]
    ];
    var bodySize = 11.5;
    var maxW = W - 28;
    var avail = LAY.contentBottom - 68 - y;
    var total = 0;
    for (var i = 0; i < blocks.length; i += 1) {
      total += 22 + paragraphHeight(blocks[i][1], maxW, bodySize, '500', 1.45) + 8;
    }
    var scale = total > avail ? Math.max(0.70, avail / total) : 1;
    /* +22 leaves real breathing room under the last line: the descenders of a
       final glyph otherwise sit right on the card edge. */
    var cardH = total * scale + 22;
    drawCard(L, y, W, cardH, 16, { shadowBlur: 8 });
    var cursor = y + 8;
    for (var b = 0; b < blocks.length; b += 1) {
      drawSpark(L + 15, cursor + 11, 5, theme.accent, 0.95);
      TXT(blocks[b][0], L + 26, cursor + 11, { size: 13 * scale, align: 'left', color: theme.text, maxW: maxW });
      cursor += 22 * scale;
      cursor += paragraph(blocks[b][1], L + 14, cursor, maxW, {
        size: bodySize * scale, color: theme.muted, lineHeight: 1.45
      });
      cursor += 8 * scale;
    }
    y += cardH + 12;

    var wipeY = Math.min(y, LAY.contentBottom - 46 - 40);
    drawChip(L, wipeY, W, 34, tr('about.wipe'), isPressed('wipe'), { size: 13 });
    HIT('wipe', L, wipeY, W, 34);
    drawButton(L, wipeY + 40, W, 46, tr('about.back'), isPressed('back'), { size: 17 });
    HIT('back', L, wipeY + 40, W, 46);
  },
  actions: {
    'back': function () { APP.go('home'); },
    'wipe': function () {
      STORE.set('stats', null);
      STORE.set('lang', '');
      STORE.set('theme', '');
      _lang = null;
      _themeId = null;
      resetDeco();
      toast(tr('about.wiped'));
    }
  }
};

/* ── first-launch agreement (compliance: modal, explicit consent) ────────── */
function drawAgreement(dt, time) {
  var theme = T();
  var W = Math.min(312, LAY.contentRight - LAY.contentLeft);
  var body = [tr('agree.body1'), tr('agree.body2'), tr('agree.body3'), tr('agree.body4')];
  var maxW = W - 32;
  var size = 11.5;
  var total = 0;
  var i;
  for (i = 0; i < body.length; i += 1) total += paragraphHeight(body[i], maxW, size, '500', 1.5) + 8;
  var H = 74 + total + 62;
  var card = drawModalCard(W, H, APP.agreeT);
  var x = card.x;
  var y = card.y;

  TXT(tr('agree.title'), x + W / 2, y + 28, { size: 19, color: theme.text, maxW: W - 30 });
  var rule = CTX.createLinearGradient(x + 24, 0, x + W - 24, 0);
  rule.addColorStop(0, rgba(theme.accent, 0));
  rule.addColorStop(0.5, rgba(theme.accent, 0.85));
  rule.addColorStop(1, rgba(theme.accent, 0));
  CTX.fillStyle = rule;
  CTX.fillRect(x + 24, y + 44, W - 48, 1.6);

  var cursor = y + 54;
  for (i = 0; i < body.length; i += 1) {
    cursor += paragraph(body[i], x + 16, cursor, maxW, { size: size, color: theme.muted, lineHeight: 1.5 });
    cursor += 8;
  }
  var by = y + H - 54;
  drawButton(x + 20, by, W - 40, 44, tr('agree.ok'), isPressed('agree'), { size: 18, letterSpacing: '3px' });
  HIT('agree', x + 20, by, W - 40, 44);
}


/* ===== 15-app.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §15  APP — scenes, input routing, main loop, saved progress, boot
   ═══════════════════════════════════════════════════════════════════════════ */

var APP_VERSION = "1.0.0";

/* ── saved progress (only ever a handful of numbers) ─────────────────────── */
function readStats() {
  var s = STORE.get('stats', null);
  var out = {
    duelGames: 0, duelWins: 0, streak: 0, bestStreak: 0, soloBest: 0, soloGames: 0
  };
  if (isObj(s)) {
    for (var k in out) {
      if (Object.prototype.hasOwnProperty.call(s, k) && typeof s[k] === 'number' && isFinite(s[k])) {
        out[k] = s[k];
      }
    }
  }
  return out;
}
function writeStats(s) { return STORE.set('stats', s); }

/* ── app ────────────────────────────────────────────────────────────────── */
var SCENES = { home: HOME, board: BS, result: RS, rules: RULES, about: ABOUT };

var APP = {
  scene: 'home',
  settings: { mode: 'ai', players: 2, difficulty: 'normal' },
  current: null,
  agree: true,
  agreeT: 0,
  time: 0,
  resultDelay: -1,
  ready: false,

  init: function () {
    var agreed = STORE.get('agreed', false);
    APP.agree = agreed !== true;
    APP.agreeT = 0;
    APP.scene = 'home';
    APP.applyTitle();
  },

  applyTitle: function () {
    try { document.title = tr('game.title'); } catch (e) { /* no document */ }
  },

  go: function (name, opts) {
    var cur = SCENES[APP.scene];
    if (cur && cur.exit) cur.exit();
    APP.scene = name;
    APP.resultDelay = -1;
    if (name === 'board' && opts) {
      BS.enter(opts);
    } else if (name === 'result' && opts) {
      RS.enter(opts);
    }
  },

  /** Build a brand-new game. Every restart path goes through here, so no board,
   *  hand, counter, animation or seed can survive into the next round. */
  newGame: function () {
    var solo = APP.settings.mode === 'solo';
    var n = solo ? 1 : APP.settings.players;
    var types = [];
    for (var i = 0; i < n; i += 1) types.push(i === 0 ? 'human' : 'ai');
    var seed = (Date.now() ^ Math.floor(Math.random() * 0x7fffffff)) >>> 0;
    resetDeco();
    return {
      game: createGame(n, solo ? 'solo' : 'classic', seed, types),
      settings: { mode: APP.settings.mode, players: n, difficulty: APP.settings.difficulty }
    };
  },

  startGame: function () {
    resetDeco();
    var opts = APP.newGame();
    APP.current = opts;
    APP.go('board', opts);
  },

  restartGame: function () {
    /* A restart is a fresh game with a fresh seed, not a replay of the old one. */
    var cur = SCENES[APP.scene];
    if (cur && cur.exit) cur.exit();
    resetDeco();
    var opts = APP.newGame();
    APP.current = opts;
    APP.go('board', opts);
  },

  update: function (dt) {
    APP.time += dt;
    if (APP.agree) APP.agreeT += dt;
    var s = SCENES[APP.scene];
    if (s && s.update) s.update(dt);

    /* Board play is finished → show the result after the last animation lands.
       The final game object is read from the board scene, never from APP.current:
       every move replaces that object, so a cached reference would be stale. */
    if (APP.scene === 'board' && BS.over) {
      if (APP.resultDelay < 0) APP.resultDelay = 0.55;
      else {
        APP.resultDelay -= dt;
        if (APP.resultDelay <= 0) {
          APP.go('result', { game: BS.game, settings: BS.settings });
        }
      }
    }
  },

  draw: function (dt) {
    var s = SCENES[APP.scene];
    if (s && s.draw) s.draw(dt, APP.time);
    drawToast(dt);
    if (APP.agree) drawAgreement(dt, APP.time);
  },

  /* ── input ────────────────────────────────────────────────────────────── */
  down: function (x, y) {
    SFX.unlock();
    PRESS.x = x;
    PRESS.y = y;
    PRESS.moved = false;
    PRESS.id = pickHit(x, y);
    /* The agreement is modal: while it is open nothing else may receive input. */
    if (APP.agree) return;
    var s = SCENES[APP.scene];
    if (s && s.down) s.down(x, y);
  },

  move: function (x, y) {
    if (Math.abs(x - PRESS.x) > 6 || Math.abs(y - PRESS.y) > 6) PRESS.moved = true;
    var s = SCENES[APP.scene];
    if (s && s.move) s.move(x, y);
  },

  up: function (x, y) {
    if (APP.agree) {
      if (pickHit(x, y) === 'agree' && !PRESS.moved) {
        APP.agree = false;
        STORE.set('agreed', true);
      }
      PRESS.id = null;
      PRESS.moved = false;
      return;
    }
    var s = SCENES[APP.scene];
    if (s && s.up) {
      s.up(x, y);
    } else {
      var id = pickHit(x, y);
      if (id && id === PRESS.id && !PRESS.moved && s && s.actions && s.actions[id]) {
        s.actions[id]();
      } else if (id && handleHomePick(id)) {
        /* value-carrying chip in the home screen */
      }
    }
    PRESS.id = null;
    PRESS.moved = false;
  }
};

/* ── main loop ──────────────────────────────────────────────────────────── */
var _last = 0;

function frame(now) {
  var raw = _last ? now - _last : 1000 / 60;
  var dt = _last ? clamp(raw / 1000, 0, 0.05) : 1 / 60;
  _last = now;
  /* Feed the real elapsed time to the quality policy (dt above is clamped for
     simulation stability, which would hide a slow device from the sampler). */
  if (APP.ready) sampleFrame(raw);

  CTX.setTransform(VIEW.dpr, 0, 0, VIEW.dpr, 0, 0);
  drawBackground(T(), APP.time);

  resetHits();
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  APP.update(dt);
  APP.draw(dt);
  CTX.restore();

  requestAnimationFrame(frame);
}

/* ── boot ───────────────────────────────────────────────────────────────── */
function bindInput() {
  var canvas = document.getElementById('stage');

  function pt(e) {
    var rect = canvas.getBoundingClientRect();
    var src = e;
    if (e.touches && e.touches.length) src = e.touches[0];
    else if (e.changedTouches && e.changedTouches.length) src = e.changedTouches[0];
    return {
      x: ux((src.clientX || 0) - rect.left),
      y: uy((src.clientY || 0) - rect.top)
    };
  }

  if (window.PointerEvent) {
    canvas.addEventListener('pointerdown', function (e) { e.preventDefault(); var p = pt(e); APP.down(p.x, p.y); }, { passive: false });
    canvas.addEventListener('pointermove', function (e) { var p = pt(e); APP.move(p.x, p.y); }, { passive: true });
    canvas.addEventListener('pointerup', function (e) { var p = pt(e); APP.up(p.x, p.y); }, { passive: true });
    canvas.addEventListener('pointercancel', function () { APP.up(-1, -1); }, { passive: true });
  } else {
    canvas.addEventListener('touchstart', function (e) { e.preventDefault(); var p = pt(e); APP.down(p.x, p.y); }, { passive: false });
    canvas.addEventListener('touchmove', function (e) { e.preventDefault(); var p = pt(e); APP.move(p.x, p.y); }, { passive: false });
    canvas.addEventListener('touchend', function (e) {
      e.preventDefault();
      var t = e.changedTouches && e.changedTouches[0];
      var rect = canvas.getBoundingClientRect();
      APP.up(ux((t ? t.clientX : 0) - rect.left), uy((t ? t.clientY : 0) - rect.top));
    }, { passive: false });
    canvas.addEventListener('mousedown', function (e) { var p = pt(e); APP.down(p.x, p.y); });
    canvas.addEventListener('mousemove', function (e) { var p = pt(e); APP.move(p.x, p.y); });
    canvas.addEventListener('mouseup', function (e) { var p = pt(e); APP.up(p.x, p.y); });
  }
  /* Block the OS-level long-press menu and double-tap zoom inside the play area. */
  canvas.addEventListener('contextmenu', function (e) { e.preventDefault(); });
}

function boot() {
  refreshConfigFromSidecar();
  relayout();
  APP.init();
  loadAssets();
  bindInput();

  window.addEventListener('resize', function () { relayout(); resetDeco(); });
  window.addEventListener('orientationchange', function () {
    setTimeout(function () { relayout(); resetDeco(); }, 120);
  });

  requestAnimationFrame(frame);
  APP.ready = true;
}

/* Debug / automation handle. Read-only surface used by the test harness. */
window.__POLAR__ = {
  APP: APP, BS: BS, RS: RS, HOME: HOME,
  config: CONFIG,
  assets: ASSETS,
  layout: LAY,
  quality: QUALITY,
  hits: HITS,          /* live hit regions, rebuilt every frame (design units) */
  version: APP_VERSION,
  api: {
    createGame: createGame,
    placePiece: placePiece,
    chooseMove: chooseMove,
    countSafeCells: countSafeCells,
    hasSafeCell: hasSafeCell,
    isBoardFull: isBoardFull,
    stateSig: stateSig,
    simulateMagnet: simulateMagnet,
    computeRanking: computeRanking,
    playerRank: playerRank,
    snapRadius: snapRadius,
    isMineCell: isMineCell,
    readStats: readStats,
    writeStats: writeStats,
    getLang: getLang,
    setLang: setLang,
    tr: tr,
    dict: DICT,
    langs: LANGS,
    fallbackLang: FALLBACK_LANG,
    getThemeId: getThemeId,
    setThemeId: setThemeId,
    effectivePixelRatio: effectivePixelRatio,
    medianOf: medianOf,
    shouldDowngrade: shouldDowngrade,
    applyQualityStep: applyQualityStep,
    themeIds: themeIds,
    newGame: function () { return APP.newGame(); }
  }
};

if (document.readyState === 'loading') {
  document.addEventListener('DOMContentLoaded', boot);
} else {
  boot();
}

})();
</script>
