/* ═══════════════════════════════════════════════════════════════════════════

   ═══════════════════════════════════════════════════════════════════════════ */

/* Host contract (per platform spec §9):
     window.gameConfig  — get/set of all runtime parameters (game_config.json)
     window.lib.getAsset(assetId) — dynamic resource loading
     bridge.viewport.getSafeArea() — safe-area insets
     bridge.storage — cross-device key/value store

function isObj(v) { return v !== null && typeof v === 'object' && !Array.isArray(v); }

      out[k] = (isObj(out[k]) && isObj(over[k])) ? deepMerge(out[k], over[k]) : over[k];

  return out;

   build_h5_polar.py) — it is not authored here, so every business value lives in
   exactly one place and nothing is hardcoded in the game code. */

var HOST_CONFIG = isObj(window.gameConfig) ? window.gameConfig : null;
var CONFIG = deepMerge(BUILTIN_CONFIG, HOST_CONFIG);

/* get/set accessors so operational tuning can be driven through the documented
   window.gameConfig object (dotted path, e.g. gameConfig.get('physics.snapRadius')). */
function cfgGet(path, dflt) {
  var cur = CONFIG;
  var parts = String(path).split('.');
  for (var i = 0; i < parts.length; i += 1) {
    if (!isObj(cur) || !(parts[i] in cur)) return dflt;
    cur = cur[parts[i]];
  }
  return cur === undefined ? dflt : cur;
}

  var parts = String(path).split('.');
  var cur = CONFIG;
  for (var i = 0; i < parts.length - 1; i += 1) {
    if (!isObj(cur[parts[i]])) cur[parts[i]] = {};
    cur = cur[parts[i]];
  }
  cur[parts[parts.length - 1]] = value;
  return value;
}

/* Non-enumerable so a config dump stays clean for auditors. */

  Object.defineProperty(window.gameConfig, 'get', { value: cfgGet, enumerable: false });
  Object.defineProperty(window.gameConfig, 'set', { value: cfgSet, enumerable: false });
  Object.defineProperty(window.gameConfig, 'source', { value: 'game_config.json', enumerable: false });

   without a rebuild. Host-provided values keep priority. */

      .then(function (r) { return r.ok ? r.json() : null; })
      .then(function (j) {

function easeInCubic(t) { return t * t * t; }

function mulberry32(seed) {
  var a = seed >>> 0;
  return function () {
    a |= 0; a = (a + 0x6D2B79F5) | 0;
    var t = Math.imul(a ^ (a >>> 15), 1 | a);
    t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
    return ((t ^ (t >>> 14)) >>> 0) / 4294967296;

  if (vars) {

/* ── storage: bridge.storage when present, local fallback otherwise ─────── */

  var keys = cfgGet('storage.keys', {});
  var maxBytes = cfgGet('storage.maxValueBytes', 262144);
  var bridge = window.bridge;

  function fullKey(name) { return prefix + (keys[name] || name); }

  function bridgeGet(k) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.getItem === 'function') return bridge.storage.getItem(k);
      if (bridge && bridge.storage && typeof bridge.storage.get === 'function') return bridge.storage.get(k);
    } catch (e) { /* fall through */ }
    return undefined;
  }
  function bridgeSet(k, v) {
    try {
      if (bridge && bridge.storage && typeof bridge.storage.setItem === 'function') { bridge.storage.setItem(k, v); return true; }
      if (bridge && bridge.storage && typeof bridge.storage.set === 'function') { bridge.storage.set(k, v); return true; }
    } catch (e) { /* fall through */ }
    return false;
  }

  function get(name, dflt) {
    var k = fullKey(name);
    var raw = bridgeGet(k);
    if (raw === undefined || raw === null || raw === '') {
      try { raw = window.localStorage.getItem(k); } catch (e) { raw = null; }
    }

    try { return JSON.parse(raw); } catch (e) { return typeof raw === 'string' ? raw : dflt; }
  }

    var k = fullKey(name);
    var raw;
    try { raw = JSON.stringify(value); } catch (e) { return false; }

    if (bridgeSet(k, raw)) return true;
    try { window.localStorage.setItem(k, raw); return true; } catch (e) { return false; }
  }

/* ── viewport / safe area / stage layout ────────────────────────────────── */
function readSafeArea() {
  var out = { top: 0, right: 0, bottom: 0, left: 0, known: false };
  try {

    if (b && b.viewport && typeof b.viewport.getSafeArea === 'function') {

      if (isObj(sa)) {

        out.right = Number(sa.right) || 0;
        out.bottom = Number(sa.bottom) || 0;
        out.left = Number(sa.left) || 0;

  var out = { top: 0, right: 0, bottom: 0, left: 0 };
  try {
    var probe = document.createElement('div');
    probe.style.cssText = 'position:fixed;left:0;top:0;visibility:hidden;pointer-events:none;' +

    out.right = parseFloat(cs.paddingRight) || 0;
    out.bottom = parseFloat(cs.paddingBottom) || 0;
    out.left = parseFloat(cs.paddingLeft) || 0;
    document.body.removeChild(probe);
  } catch (e) { /* keep zeros */ }
  return out;

  DH: cfgGet('viewport.designHeight', 619),
  scale: 1, stageX: 0, stageY: 0, stageW: 402, stageH: 619,
  contentTop: 0, contentBottom: 0, contentLeft: 0, contentRight: 0,
  corner: cfgGet('viewport.cornerClearPx', 26),
  safe: { top: 0, right: 0, bottom: 0, left: 0 }

  var vh = Math.max(1, window.innerHeight || 1);
  var scale = Math.min(vw / LAY.DW, vh / LAY.DH);

  LAY.stageW = LAY.DW * scale;
  LAY.stageH = LAY.DH * scale;
  LAY.stageX = (vw - LAY.stageW) / 2;
  LAY.stageY = (vh - LAY.stageH) / 2;

  var cssSa = hostSa.known ? { top: 0, right: 0, bottom: 0, left: 0 } : cssEnvInsets();
  LAY.safe = {
    top: hostSa.top || cssSa.top,
    right: Math.max(hostSa.right || 0, cssSa.right),
    bottom: Math.max(hostSa.bottom || 0, cssSa.bottom),
    left: Math.max(hostSa.left || 0, cssSa.left)

  /* Insets are viewport-relative; only the part that eats into the stage counts. */
  function inside(px, origin, span) { return clamp((px - origin) / scale, 0, span); }
  var gTop = LAY.DH * cfgGet('viewport.guardTopPct', 0.05);
  var gBottom = LAY.DH * cfgGet('viewport.guardBottomPct', 0.05);
  var sTop = inside(LAY.safe.top, LAY.stageY, LAY.DH);
  var sBottom = inside(LAY.safe.bottom, LAY.stageY, LAY.DH);
  var sLeft = inside(LAY.safe.left, LAY.stageX, LAY.DW);
  var sRight = inside(LAY.safe.right, LAY.stageX, LAY.DW);

  canvas.height = Math.round(vh * dpr);

  canvas.style.height = vh + 'px';

  cap: cfgGet('viewport.maxPixelRatio', 3),
  step: 0,
  samples: [],

var FOLLOW_SYSTEM = cfgGet('locale.followSystem', false) === true;

function detectLang() {
  if (!FOLLOW_SYSTEM) return FALLBACK_LANG;
  var tag = '';
  try { tag = String((window.navigator && (window.navigator.language || window.navigator.userLanguage)) || ''); } catch (e) { tag = ''; }
  if (/^zh\b/i.test(tag)) return LANGS.indexOf('zh') >= 0 ? 'zh' : FALLBACK_LANG;

  return FALLBACK_LANG;
}

function getLang() {
  if (_lang && LANGS.indexOf(_lang) >= 0) return _lang;
  var saved = STORE.get('lang', '');

function setLang(lang) {
  if (LANGS.indexOf(lang) < 0) return false;

/* ===== 03-assets.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §3  ASSETS — window.lib.getAsset(assetId) pipeline with local fallbacks
   ═══════════════════════════════════════════════════════════════════════════ */

/* Mirrors asset_map.json (ids are the contract; the map file is the auditable copy).
   Binary payload shipped: the store icon, the store cover and one grain texture.
   Everything else the game shows is generated procedurally, so it has no url. */
var ASSET_IDS = {
  icon: { url: 'icon.png', type: 'image' },
  poster: { url: 'cover/poster.jpg', type: 'image' },
  grain: { url: 'assets/grain.png', type: 'image' },
  board_skin: { url: null, type: 'image' },
  bead_set: { url: null, type: 'image' },
  fx_snap: { url: null, type: 'animation' },
  sfx_drop: { url: null, type: 'audio' },
  sfx_snap: { url: null, type: 'audio' },
  sfx_win: { url: null, type: 'audio' }
};

var ASSETS = {
  images: {},          /* id -> HTMLImageElement (only when actually usable) */
  resolved: {},        /* id -> 'host' | 'local' | 'procedural' | 'missing' */
  requested: [],       /* every id the game asked for */
  calls: [],           /* ids handed to window.lib.getAsset (empty without the host API) */
  host: !!(window.lib && typeof window.lib.getAsset === 'function'),
  ready: null
};

/* The host API is deliberately unspecified beyond its name, so accept whatever
   shape it returns: a promise, a URL string, a descriptor or a live element. */
function hostGetAsset(id) {
  ASSETS.calls.push(id);
  try {
    if (!window.lib || typeof window.lib.getAsset !== 'function') return null;
    return window.lib.getAsset(id);
  } catch (e) {
    return null;
  }
}

function loadImageUrl(url) {
  return new Promise(function (resolve) {
    if (!url) { resolve(null); return; }
    var img = new Image();
    /* Only remote (cross-origin) sources need the anonymous flag; setting it on a
       relative url can break a plain file:// load, so it is conditional. */
    if (/^https?:/i.test(url)) img.crossOrigin = 'anonymous';
    img.onload = function () { resolve(img); };
    img.onerror = function () { resolve(null); };
    img.src = url;
  });
}

function imageFromValue(value) {
  return new Promise(function (resolve) {
    if (!value) { resolve(null); return; }
    if (typeof value === 'string') { loadImageUrl(value).then(resolve); return; }
    if (typeof value.then === 'function') {
      value.then(function (v) { imageFromValue(v).then(resolve); }, function () { resolve(null); });
      return;
    }
    if (typeof Image !== 'undefined' && value instanceof Image) { resolve(value); return; }
    if (value.image && typeof value.image === 'object') { imageFromValue(value.image).then(resolve); return; }
    if (typeof value.src === 'string') { loadImageUrl(value.src).then(resolve); return; }
    if (typeof value.url === 'string') { loadImageUrl(value.url).then(resolve); return; }
    if (typeof value.path === 'string') { loadImageUrl(value.path).then(resolve); return; }
    resolve(null);
  });
}

function requestAsset(id) {
  var spec = ASSET_IDS[id] || {};
  ASSETS.requested.push(id);
  var viaHost = null;
  if (ASSETS.host) {
    var raw = hostGetAsset(id);
    if (raw !== null && raw !== undefined) {
      viaHost = imageFromValue(raw).then(function (img) { return img ? { img: img, from: 'host' } : null; });
    }
  }
  var chain = viaHost || Promise.resolve(null);
  return chain.then(function (hit) {
    if (hit) return hit;
    return loadImageUrl(spec.url).then(function (img) { return img ? { img: img, from: 'local' } : null; });
  }).then(function (hit) {
    if (hit) {
      ASSETS.images[id] = hit.img;
      ASSETS.resolved[id] = hit.from;
    } else {
      ASSETS.resolved[id] = spec.url ? 'missing' : 'procedural';
    }
    return ASSETS.images[id] || null;
  });
}

/* Every declared asset is requested through the platform API at boot, so the
   documented call happens for the whole manifest — not just the files we ship. */
function loadAssets() {
  var ids = [];
  for (var k in ASSET_IDS) { if (Object.prototype.hasOwnProperty.call(ASSET_IDS, k)) ids.push(k); }
  ASSETS.ready = Promise.all(ids.map(requestAsset));
  return ASSETS.ready;
}

function assetImage(id) { return ASSETS.images[id] || null; }

/* ===== 05-audio.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §5  AUDIO — every sound is synthesised with Web Audio, so no wav/ogg ships
   ═══════════════════════════════════════════════════════════════════════════ */

var SFX = (function () {
  var ctx = null;
  var master = null;
  var enabled = cfgGet('audio.enabled', true);
  var volume = cfgGet('audio.masterVolume', 0.45);

  function ac() {
    if (!enabled) return null;
    try {
      if (!ctx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (!AC) return null;
        ctx = new AC();
        master = ctx.createGain();
        master.gain.value = volume;
        master.connect(ctx.destination);
      }
      /* WebViews may start the context suspended until the first interaction. */
      if (ctx.state === 'suspended' && ctx.resume) { try { ctx.resume(); } catch (e) { /* retried on next gesture */ } }
      return ctx;
    } catch (e) {
      return null;
    }
  }

  function tone(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.12;
      var osc = c.createOscillator();
      var gain = c.createGain();
      osc.type = opts.type || 'triangle';
      osc.frequency.setValueAtTime(opts.freq, t0);
      if (opts.to) osc.frequency.exponentialRampToValueAtTime(Math.max(20, opts.to), t0 + dur);
      gain.gain.setValueAtTime(0.0001, t0);
      gain.gain.exponentialRampToValueAtTime(Math.max(0.0002, opts.gain || 0.3), t0 + 0.008);
      gain.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
      var node = osc;
      if (opts.q) {
        var bp = c.createBiquadFilter();
        bp.type = 'bandpass';
        bp.frequency.value = opts.band || opts.freq;
        bp.Q.value = opts.q;
        osc.connect(bp);
        node = bp;
      }
      node.connect(gain);
      gain.connect(master);
      osc.start(t0);
      osc.stop(t0 + dur + 0.02);
    } catch (e) { /* audio is never allowed to break gameplay */ }
  }

  function noise(opts) {
    var c = ac();
    if (!c) return;
    try {
      var t0 = c.currentTime + (opts.delay || 0);
      var dur = opts.dur || 0.08;
      var len = Math.max(1, Math.floor(c.sampleRate * dur));
      var buf = c.createBuffer(1, len, c.sampleRate);
      var data = buf.getChannelData(0);
      for (var i = 0; i < len; i += 1) data[i] = (Math.random() * 2 - 1) * (1 - i / len);
      var src = c.createBufferSource();
      src.buffer = buf;
      var f = c.createBiquadFilter();
      f.type = opts.filter || 'highpass';
      f.frequency.value = opts.freq || 900;
      var g = c.createGain();
      g.gain.value = opts.gain || 0.12;
      src.connect(f); f.connect(g); g.connect(master);
      src.start(t0);
    } catch (e) { /* ignore */ }
  }

  return {
    /* wood click: bead meeting the board */
    drop: function () {
      tone({ type: 'triangle', freq: 620, to: 300, dur: 0.09, gain: 0.26 });
      noise({ dur: 0.05, freq: 1600, gain: 0.10 });
    },
    /* metal snap: one voice per bead pulled in */
    snap: function (index) {
      var d = (index || 0) * (cfgGet('anim.snapChainDelayMs', 80) / 1000);
      tone({ type: 'square', freq: 340 + (index || 0) * 26, to: 150, dur: 0.10, gain: 0.16, q: 6, band: 900, delay: d });
      noise({ dur: 0.05, freq: 2400, gain: 0.10, delay: d });
    },
    bump: function () { tone({ type: 'sine', freq: 180, to: 120, dur: 0.08, gain: 0.16 }); },
    win: function (perfect) {
      var notes = perfect ? [523, 659, 784, 1046] : [523, 659, 784];
      for (var i = 0; i < notes.length; i += 1) {
        tone({ type: 'triangle', freq: notes[i], dur: 0.24, gain: 0.22, delay: i * 0.10 });
      }
    },
    lose: function () {
      tone({ type: 'sine', freq: 392, to: 311, dur: 0.30, gain: 0.20 });
      tone({ type: 'sine', freq: 294, to: 233, dur: 0.34, gain: 0.16, delay: 0.14 });
    },
    /* Called from the first pointer event so the context can start. */
    unlock: function () { ac(); },
    setEnabled: function (v) { enabled = !!v; },
    isEnabled: function () { return enabled; }
  };
})();


/* ===== 06-magnet.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §6  MAGNET — pure physics. No DOM, no state: same input always same output,
       which is what lets the AI, the animation and the tests agree.

   Only the classic reclaim rule ships here (plus the solo survival variant that
   reuses it), matching the delivered ruleset.
   ═══════════════════════════════════════════════════════════════════════════ */

function snapRadius() { return cfgGet('physics.snapRadius', 1.65); }

function pdist(ax, ay, bx, by) {
  var dx = ax - bx, dy = ay - by;
  return Math.sqrt(dx * dx + dy * dy);
}

/* A cell is hot when any bead sits inside its field. */
function isMineCell(board, x, y, radius) {
  var r = radius === undefined ? snapRadius() : radius;
  for (var i = 0; i < board.length; i += 1) {
    if (pdist(board[i].x, board[i].y, x, y) < r) return true;
  }
  return false;
}

/* The whole connected group regardless of owner — magnetism ignores colour, which
   is exactly why a careless drop hands back a fistful of your own beads too. */
function clusterOfAll(pieces, seed, radius) {
  var group = [];
  var seen = {};
  seen[seed.id] = true;
  var stack = [seed];
  while (stack.length) {
    var cur = stack.pop();
    for (var i = 0; i < pieces.length; i += 1) {
      var p = pieces[i];
      if (seen[p.id]) continue;
      if (pdist(cur.x, cur.y, p.x, p.y) < radius) {
        seen[p.id] = true;
        group.push(p);
        stack.push(p);
      }
    }
  }
  return group;
}

/* Board bounds live in one place; every entry point re-applies them for its own
   board size so a stale bounds function can never reject a legal cell. */
var _bounds = makeBoardBounds(11, 13);

function makeBoardBounds(cols, rows) {
  return function (x, y) {
    return isFinite(x) && isFinite(y) && Math.floor(x) === x && Math.floor(y) === y &&
      x >= 0 && y >= 0 && x < cols && y < rows;
  };
}
function setBoardBounds(fn) { _bounds = fn; }
function setBoardBoundsFor(cols, rows) { _bounds = makeBoardBounds(cols, rows); }
function isValidCell(x, y) { return _bounds(x, y); }

var _idSeq = 0;
function newPieceId() { _idSeq += 1; return _idSeq; }
function resetIdSeq() { _idSeq = 0; }

function emptyBoardCopy(board) {
  var out = [];
  for (var i = 0; i < board.length; i += 1) {
    out.push({ x: board[i].x, y: board[i].y, owner: board[i].owner, id: board[i].id });
  }
  return out;
}

function occupied(board, x, y) {
  for (var i = 0; i < board.length; i += 1) {
    if (board[i].x === x && board[i].y === y) return true;
  }
  return false;
}

/**
 * Resolve one drop.
 * @returns {{landed:boolean, mine:boolean, board:Array, hitIds:Array}}
 *   mine=false → the bead settles and is appended to `board`.
 *   mine=true  → the bead never settles: it returns to the dropper's hand together
 *                with the connected group (`hitIds`), and `board` is the board with
 *                that whole group already removed.
 */
function simulateMagnet(board, piece, radius) {
  var r = radius === undefined ? snapRadius() : radius;
  var miss = { landed: false, mine: false, board: board, hitIds: [] };

  if (!isValidCell(piece.x, piece.y)) return miss;
  if (occupied(board, piece.x, piece.y)) return miss;

  var cluster = clusterOfAll(board, piece, r);
  if (cluster.length === 0) {
    var grown = emptyBoardCopy(board);
    grown.push({ x: piece.x, y: piece.y, owner: piece.owner, id: piece.id });
    return { landed: true, mine: false, board: grown, hitIds: [] };
  }

  var hitIds = [];
  var removed = {};
  for (var i = 0; i < cluster.length; i += 1) {
    hitIds.push(cluster[i].id);
    removed[cluster[i].id] = true;
  }
  var kept = [];
  for (var k = 0; k < board.length; k += 1) {
    if (!removed[board[k].id]) {
      kept.push({ x: board[k].x, y: board[k].y, owner: board[k].owner, id: board[k].id });
    }
  }
  return { landed: true, mine: true, hitIds: hitIds, board: kept };
}


/* ===== 07-rules.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §7  RULES — turn machine, reclaim settlement, end conditions, ranking.
        Pure logic: no rendering, no storage, no platform calls.
   ═══════════════════════════════════════════════════════════════════════════ */

/**
 * Create a fresh game. Called for the first game and for every restart, so it
 * must fully initialise every derived value from the seed — nothing carried over.
 * @param {number} playerCount 2-4 for classic; ignored for solo
 * @param {'classic'|'solo'} mode
 * @param {number} seed
 * @param {Array<'human'|'ai'>} playerTypes
 */
function createGame(playerCount, mode, seed, playerTypes) {
  var solo = mode === 'solo';
  var maxPlayers = cfgGet('rules.maxPlayers', 4);
  /* Normalise defensively: a bad caller must not be able to produce a board size
     or hand count that does not exist. */
  var wanted = Number(playerCount);
  var n = solo ? 1 : clamp(isFinite(wanted) ? wanted : 2, 2, maxPlayers);
  var idx = clamp(solo ? 0 : n - 2, 0, 2);
  var boardCfg = cfgGet('board.' + (solo ? 'solo' : 'classic'), null) || cfgGet('board.classic');
  var cols = boardCfg.cols[idx];
  var rows = boardCfg.rows[idx];
  var piecesEach = solo ? 0 : boardCfg.pieces[idx];

  resetIdSeq();
  setBoardBoundsFor(cols, rows);

  var obstacles = solo ? makeObstacles(cols, rows, boardCfg.obstacles[idx], mulberry32(seed), boardCfg) : [];

  var types = [];
  for (var i = 0; i < n; i += 1) {
    types.push(playerTypes && playerTypes.length === n ? playerTypes[i] : 'human');
  }

  var game = {
    mode: solo ? 'solo' : 'classic',
    playerCount: n,
    cols: cols,
    rows: rows,
    piecesEach: piecesEach,
    seed: seed,
    playerTypes: types,
    turn: 0,
    board: obstacles,
    obstacleCount: obstacles.length,   /* neutral beads, not owned by any seat */
    hands: [],
    totalPlaced: 0,
    over: false,
    endReason: null,
    winner: -1,
    ranking: [],
    stats: [],
    lastMove: null,
    boardMax: obstacles.length,
    stall: 0,
    moves: 0,
    score: 0,          /* solo: safe drops */
    sigs: []
  };
  for (var h = 0; h < n; h += 1) {
    game.hands.push(piecesEach);
    game.stats.push({ placed: 0, snaps: 0, pulledBack: 0 });
  }
  game.sigs.push(stateSig(game));
  return game;
}

function isAISeat(game, i) { return game.playerTypes[i] === 'ai'; }

/**
 * Drop the current player's bead at (x, y).
 * classic: landing inside a field is a legal move — the connected group plus the
 * new bead return to the dropper's hand and play passes on. Emptying your hand first wins.
 * solo:    landing inside a field ends the run immediately.
 */
function placePiece(game, x, y) {
  if (game.over) return { ok: false, error: 'over' };
  setBoardBoundsFor(game.cols, game.rows);

  var owner = game.turn;
  if (game.mode === 'classic' && game.hands[owner] <= 0) return { ok: false, error: 'empty-hand' };

  var piece = { x: x, y: y, owner: owner, id: newPieceId() };
  var res = simulateMagnet(game.board, piece);
  if (!res.landed) return { ok: false, error: 'illegal' };

  /* ── solo: the first snap ends the run ── */
  if (game.mode === 'solo') {
    if (res.mine) {
      var s2 = cloneGame(game);
      s2.over = true;
      s2.endReason = 'foul';
      s2.winner = 0;
      s2.ranking = [0];
      s2.stats[0].snaps += 1;
      s2.lastMove = { type: 'foul', x: x, y: y, owner: 0, hitIds: res.hitIds, count: res.hitIds.length };
      s2.moves += 1;
      return { ok: true, foul: true, game: s2, result: res };
    }
    var s1 = cloneGame(game);
    s1.board = res.board;
    s1.score += cfgGet('scoring.soloPointPerSafeDrop', 1);
    s1.stats[0].placed += 1;
    s1.moves += 1;
    s1.lastMove = { type: 'land', x: x, y: y, owner: 0, hitIds: [], count: 0 };
    return { ok: true, foul: false, game: settle(s1, game), result: res };
  }

  /* ── classic: a snap reclaims the whole connected group ── */
  if (res.mine) {
    var n = res.hitIds.length;                 /* beads pulled off the board */
    var g = cloneGame(game);
    g.board = res.board;
    /* hand: -1 (bead left it) +1 (bead comes back) + n (the group) = +n */
    g.hands[owner] += n;
    var before = boardByOwner(game.board);
    var after = boardByOwner(res.board);
    g.stats[owner].snaps += 1;
    for (var p = 0; p < g.playerCount; p += 1) {
      if (p !== owner) g.stats[p].pulledBack += Math.max(0, before[p] - after[p]);
    }
    g.lastMove = { type: 'foul', x: x, y: y, owner: owner, hitIds: res.hitIds, count: n };
    g.moves += 1;
    /* A snap always shrinks the board, so it can never refresh the high-water mark.
       The proxy stall counter only runs for odd player counts; even counts are
       provably safe without it (see resolveCycle, which covers every count). */
    g.stall = shouldCountStall(g) ? game.stall + 1 : 0;
    g.turn = nextTurn(g, owner);
    return { ok: true, foul: true, game: settle(g, game, owner), result: res };
  }

  var g2 = cloneGame(game);
  g2.board = res.board;
  g2.hands[owner] -= 1;
  g2.totalPlaced += 1;
  g2.stats[owner].placed += 1;
  g2.lastMove = { type: 'land', x: x, y: y, owner: owner, hitIds: [], count: 0 };
  g2.moves += 1;
  if (g2.board.length > (game.boardMax === undefined ? game.board.length : game.boardMax)) {
    g2.boardMax = g2.board.length;
    g2.stall = 0;
  } else if (shouldCountStall(g2)) {
    g2.stall = game.stall + 1;
  } else {
    g2.stall = 0;
  }
  g2.turn = nextTurn(g2, owner);
  return { ok: true, foul: false, game: settle(g2, game, owner), result: res };
}

function cloneGame(g) {
  var out = {};
  for (var k in g) { if (Object.prototype.hasOwnProperty.call(g, k)) out[k] = g[k]; }
  out.hands = g.hands.slice();
  out.stats = [];
  for (var i = 0; i < g.stats.length; i += 1) {
    out.stats.push({ placed: g.stats[i].placed, snaps: g.stats[i].snaps, pulledBack: g.stats[i].pulledBack });
  }
  out.ranking = g.ranking.slice();
  out.board = g.board;
  return out;
}

function boardByOwner(board) {
  var counts = [0, 0, 0, 0];
  for (var i = 0; i < board.length; i += 1) {
    if (board[i].owner >= 0) counts[board[i].owner] += 1;
  }
  return counts;
}

/* Next seat that still holds beads; -1 when every hand is empty. */
function nextTurn(g, from) {
  var t = (from + 1) % g.playerCount;
  for (var i = 0; i < g.playerCount; i += 1) {
    if (g.hands[t] > 0) return t;
    t = (t + 1) % g.playerCount;
  }
  return -1;
}

/* The proxy stall counter is only needed for odd counts: three-way play can
   oscillate hands around a fixed board state and never converge on its own. */
function shouldCountStall(g) {
  return g.mode === 'classic' && g.playerCount % 2 !== 0;
}

/**
 * Position fingerprint. In classic, (board ownership+coords, hands, side to move)
 * fully determines everything that follows — bead ids do not affect play. Two
 * accumulators keep collisions negligible; a collision could only end a game
 * early, and only inside the short detection window.
 */
function stateSig(g) {
  var parts = [];
  for (var i = 0; i < g.board.length; i += 1) {
    parts.push(g.board[i].owner + '@' + g.board[i].x + ',' + g.board[i].y);
  }
  parts.sort();
  var s = parts.join(';') + '|' + g.hands.join(',') + '|' + g.turn;
  var h1 = 0x811c9dc5;
  var h2 = 0x01000193;
  for (var j = 0; j < s.length; j += 1) {
    var c = s.charCodeAt(j);
    h1 = Math.imul(h1 ^ c, 16777619) >>> 0;
    h2 = Math.imul(h2 + c + j, 2246822519) >>> 0;
  }
  return h1.toString(36) + '.' + h2.toString(36);
}

/**
 * Finish a move: detect a genuine deadlock, then decide the outcome.
 *
 * Exact cycle detection: late in a game with no safe cell left, a side that always
 * picks the cheapest snap can hand the opponent a position that recreates itself —
 * both sides make zero progress forever and the trapped side's hand grows without
 * bound. If the current position repeats one seen in the last CLASSIC_CYCLE_WINDOW
 * moves, the game is declared a stalemate (fewest beads left wins). This is exact,
 * so it never truncates a healthy game, and it works at 2, 3 and 4 players.
 */
function settle(g, prev, owner) {
  var sig = stateSig(g);
  var repeated = false;
  var window_ = cfgGet('rules.classicCycleWindow', 16);
  var prevSigs = prev.sigs || [];
  /* Solo boards only ever grow, so the check is classic-only and costs nothing there. */
  if (g.mode === 'classic') {
    for (var i = 0; i < prevSigs.length; i += 1) {
      if (prevSigs[i] === sig) { repeated = true; break; }
    }
  }
  var sigs = prevSigs.slice(Math.max(0, prevSigs.length - window_ + 1));
  sigs.push(sig);
  g.sigs = sigs;

  var verdict = repeated ? { over: true, reason: 'stall', winner: fewestHands(g) } : judge(g, owner);
  if (verdict.over) {
    g.over = true;
    g.endReason = verdict.reason;
    g.winner = verdict.winner;
    g.ranking = computeRanking(g);
  }
  return g;
}

function judge(g, owner) {
  if (g.mode === 'solo') {
    if (isBoardFull(g)) return { over: true, reason: 'full', winner: 0 };
    if (!hasSafeCell(g)) return { over: true, reason: 'nomove', winner: 0 };
    return { over: false };
  }
  if (g.hands[owner] <= 0) return { over: true, reason: 'empty', winner: owner };
  if (g.stall >= cfgGet('rules.classicStall', 8) * g.playerCount) {
    return { over: true, reason: 'stall', winner: fewestHands(g) };
  }
  if (isBoardFull(g)) return { over: true, reason: 'full', winner: fewestHands(g) };
  return { over: false };
}

function fewestHands(g) {
  var best = 0;
  for (var i = 1; i < g.playerCount; i += 1) {
    if (g.hands[i] < g.hands[best]) best = i;
  }
  return best;
}

function isBoardFull(g) { return g.board.length >= g.cols * g.rows; }

function countSafeCells(g) {
  var occ = {};
  for (var i = 0; i < g.board.length; i += 1) occ[g.board[i].x + ',' + g.board[i].y] = true;
  var r = snapRadius();
  var c = 0;
  for (var x = 0; x < g.cols; x += 1) {
    for (var y = 0; y < g.rows; y += 1) {
      if (occ[x + ',' + y]) continue;
      if (!isMineCell(g.board, x, y, r)) c += 1;
    }
  }
  return c;
}

function hasSafeCell(g) {
  var occ = {};
  for (var i = 0; i < g.board.length; i += 1) occ[g.board[i].x + ',' + g.board[i].y] = true;
  var r = snapRadius();
  for (var x = 0; x < g.cols; x += 1) {
    for (var y = 0; y < g.rows; y += 1) {
      if (occ[x + ',' + y]) continue;
      if (!isMineCell(g.board, x, y, r)) return true;
    }
  }
  return false;
}

/* Standings, best first. classic ranks by beads left (an empty hand is 0 → first). */
function computeRanking(g) {
  var rows = [];
  for (var i = 0; i < g.playerCount; i += 1) rows.push({ i: i, key: g.hands[i] });
  rows.sort(function (a, b) { return a.key - b.key || a.i - b.i; });
  var out = [];
  for (var j = 0; j < rows.length; j += 1) out.push(rows[j].i);
  return out;
}

function playerRank(g, seat) {
  var ranking = g.ranking && g.ranking.length ? g.ranking : computeRanking(g);
  for (var i = 0; i < ranking.length; i += 1) {
    if (ranking[i] === seat) {
      /* ties share the better position */
      var key = g.hands[seat];
      var rank = 1;
      for (var j = 0; j < i; j += 1) { if (g.hands[ranking[j]] < key) rank += 1; }
      return rank;
    }
  }
  return ranking.length;
}

/* ── solo layout: scatter neutral obstacles, reject unplayable layouts ─────── */
function makeObstacles(cols, rows, count, rand, boardCfg) {
  var reachMin = boardCfg.reachMin === undefined ? 11 : boardCfg.reachMin;
  var reachMax = boardCfg.reachMax === undefined ? 16 : boardCfg.reachMax;
  var target = boardCfg.reachTarget === undefined ? 13.5 : boardCfg.reachTarget;
  var attempts = boardCfg.obstacleAttempts || 40;
  var best = null;

  for (var attempt = 0; attempt < attempts; attempt += 1) {
    var obs = [];
    var used = {};
    var guard = 0;
    while (obs.length < count && guard < 500) {
      guard += 1;
      var x = Math.floor(rand() * cols);
      var y = Math.floor(rand() * rows);
      var k = x + ',' + y;
      if (used[k]) continue;
      used[k] = true;
      obs.push({ x: x, y: y, owner: -1, id: newPieceId() });
    }
    var reach = greedyReachableScore(cols, rows, obs);
    if (reach >= reachMin && reach <= reachMax) return obs;
    if (!best || Math.abs(reach - target) < Math.abs(best.reach - target)) best = { obs: obs, reach: reach };
  }
  return best ? best.obs : [];
}

/* Greedy solo potential: how many safe drops a first-fit scan can still make.
   Used both to score a layout and to reject degenerate ones. */
function greedyReachableScore(cols, rows, startBoard) {
  var r = snapRadius();
  var board = [];
  var occ = {};
  for (var i = 0; i < startBoard.length; i += 1) {
    board.push({ x: startBoard[i].x, y: startBoard[i].y });
    occ[startBoard[i].x + ',' + startBoard[i].y] = true;
  }
  function safe(x, y) {
    for (var j = 0; j < board.length; j += 1) {
      if (pdist(board[j].x, board[j].y, x, y) < r) return false;
    }
    return true;
  }
  var score = 0;
  var guard = 0;
  while (guard < 400) {
    guard += 1;
    var pick = null;
    for (var x = 0; x < cols && !pick; x += 1) {
      for (var y = 0; y < rows && !pick; y += 1) {
        if (!occ[x + ',' + y] && safe(x, y)) pick = { x: x, y: y };
      }
    }
    if (!pick) break;
    board.push(pick);
    occ[pick.x + ',' + pick.y] = true;
    score += 1;
  }
  return score;
}


/* ===== 08-ai.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §8  AI — heuristic seat chooser. Pure: reads a game state, returns a cell.
   ═══════════════════════════════════════════════════════════════════════════ */

function emptyCells(board, cols, rows) {
  var occ = {};
  for (var i = 0; i < board.length; i += 1) occ[board[i].x + ',' + board[i].y] = true;
  var out = [];
  for (var x = 0; x < cols; x += 1) {
    for (var y = 0; y < rows; y += 1) {
      if (!occ[x + ',' + y]) out.push({ x: x, y: y });
    }
  }
  return out;
}

/* Safe cells left after committing to `cell` — the crowding metric. */
function safeCountAfter(board, cols, rows, cell) {
  var nb = board.slice();
  nb.push({ x: cell.x, y: cell.y, owner: -9, id: -9 });
  var r = snapRadius();
  var occ = {};
  for (var i = 0; i < nb.length; i += 1) occ[nb[i].x + ',' + nb[i].y] = true;
  var c = 0;
  for (var x = 0; x < cols; x += 1) {
    for (var y = 0; y < rows; y += 1) {
      if (occ[x + ',' + y]) continue;
      if (!isMineCell(nb, x, y, r)) c += 1;
    }
  }
  return c;
}

/**
 * Largest set of mutually non-adjacent safe drops (greedy). Dropping on one safe
 * cell closes every other safe cell inside its field, so this count is the strict
 * lower bound on "how many safe turns I still have". Two or more means one
 * opponent move cannot close them all.
 */
function safePacking(board, cols, rows) {
  var r = snapRadius();
  var cells = [];
  var occ = {};
  for (var i = 0; i < board.length; i += 1) occ[board[i].x + ',' + board[i].y] = true;
  for (var x = 0; x < cols; x += 1) {
    for (var y = 0; y < rows; y += 1) {
      if (occ[x + ',' + y]) continue;
      if (!isMineCell(board, x, y, r)) cells.push({ x: x, y: y });
    }
  }
  var used = [];
  var n = 0;
  for (var a = 0; a < cells.length; a += 1) {
    if (used[a]) continue;
    n += 1;
    for (var b = a; b < cells.length; b += 1) {
      if (!used[b] && pdist(cells[a].x, cells[a].y, cells[b].x, cells[b].y) < r) used[b] = true;
    }
  }
  return n;
}

function aiNoise(difficulty) {
  var table = cfgGet('ai.noise', { easy: 60, normal: 40, hard: 12 });
  return table[difficulty] === undefined ? table.normal : table[difficulty];
}
function aiRandomP(difficulty) {
  var table = cfgGet('ai.randomP', { easy: 0.3, normal: 0, hard: 0 });
  return table[difficulty] === undefined ? 0 : table[difficulty];
}

/**
 * @param {object} game
 * @param {'easy'|'normal'|'hard'} difficulty
 * @returns {{x:number,y:number}|null}
 */
function chooseMove(game, difficulty) {
  var cols = game.cols;
  var rows = game.rows;
  var board = game.board;
  setBoardBounds(makeBoardBounds(cols, rows));

  var empties = emptyCells(board, cols, rows);
  if (empties.length === 0) return null;

  var noise = aiNoise(difficulty);
  var randomP = aiRandomP(difficulty);

  /* easy plays like a beginner: sometimes any empty cell, including a bad one. */
  if (randomP > 0 && Math.random() < randomP) {
    return empties[Math.floor(Math.random() * empties.length)];
  }

  var r = snapRadius();
  var safe = [];
  for (var i = 0; i < empties.length; i += 1) {
    if (!isMineCell(board, empties[i].x, empties[i].y, r)) safe.push(empties[i]);
  }

  /* Forced to snap (no safe cell): picking the smallest pull closes only one hole
     and lets the opponent refill it, recreating the position — a zero-progress loop
     that starves this seat. Maximise the resulting non-adjacent safe packing
     instead, then minimise the beads paid, then break ties at random so the same
     cell is not chosen every time. */
  if (safe.length === 0) {
    var scored = [];
    for (var e = 0; e < empties.length; e += 1) {
      var sim = simulateMagnet(board, { x: empties[e].x, y: empties[e].y, owner: game.turn, id: -2 });
      scored.push({
        c: empties[e],
        k: sim.mine ? sim.hitIds.length : 0,
        pack: safePacking(sim.board, cols, rows)
      });
    }
    var bestPack = scored[0];
    for (var s = 1; s < scored.length; s += 1) {
      if (scored[s].pack > bestPack.pack || (scored[s].pack === bestPack.pack && scored[s].k < bestPack.k)) {
        bestPack = scored[s];
      }
    }
    var tied = [];
    for (var t = 0; t < scored.length; t += 1) {
      if (scored[t].pack === bestPack.pack && scored[t].k === bestPack.k) tied.push(scored[t]);
    }
    return tied[Math.floor(Math.random() * tied.length)].c;
  }

  /* Safe cells exist: crowd the opponent by leaving them the fewest safe cells. */
  var options = [];
  for (var o = 0; o < safe.length; o += 1) {
    options.push({ c: safe[o], remain: safeCountAfter(board, cols, rows, safe[o]) });
  }

  var deep = difficulty === 'hard' && game.mode !== 'solo';
  if (!deep) {
    var best = null;
    var bestScore = -Infinity;
    for (var q = 0; q < options.length; q += 1) {
      var sc = -options[q].remain * 10 + Math.random() * noise;
      if (sc > bestScore) { bestScore = sc; best = options[q].c; }
    }
    return best;
  }

  /* hard adds one ply: prefer an immediate kill, avoid handing one over. */
  options.sort(function (a, b) { return a.remain - b.remain; });
  var cands = options.slice(0, cfgGet('ai.hardLookahead', 10));
  var pick = null;
  var pickScore = -Infinity;
  for (var ci = 0; ci < cands.length; ci += 1) {
    var remain = cands[ci].remain;
    if (remain === 0) return cands[ci].c;   /* the opponent must snap next turn */
    var after = board.slice();
    after.push({ x: cands[ci].c.x, y: cands[ci].c.y, owner: game.turn, id: -2 });
    var oppSafe = emptyCells(after, cols, rows).filter(function (cell) {
      return !isMineCell(after, cell.x, cell.y, r);
    });
    var oppCanKill = false;
    for (var oi = 0; oi < oppSafe.length; oi += 1) {
      if (safeCountAfter(after, cols, rows, oppSafe[oi]) === 0) { oppCanKill = true; break; }
    }
    var v = -remain * 10 + (oppCanKill ? -300 : 0) + Math.random() * noise;
    if (v > pickScore) { pickScore = v; pick = cands[ci].c; }
  }
  return pick;
}

/* Solo has no opponent, so the AI helper is only used to sanity-check layouts. */
function soloPotential(g) {
  return greedyReachableScore(g.cols, g.rows, g.board);
}

/* ═══════════════════════════════════════════════════════════════════════════

var FONT_STACK = '"Arial Rounded MT Bold","Baloo 2","Nunito","Segoe UI",system-ui,-apple-system,' +
  '"PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif';

var _grainPattern = null;

function setFont(size, weight) {
  CTX.font = (weight || '700') + ' ' + Math.round(size * 10) / 10 + 'px ' + FONT_STACK;
}

function rgba(hex, a) {
  var h = String(hex).replace('#', '');
  if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
  var n = parseInt(h, 16);
  return 'rgba(' + ((n >> 16) & 255) + ',' + ((n >> 8) & 255) + ',' + (n & 255) + ',' + a + ')';
}

function roundRectPath(x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  CTX.beginPath();
  CTX.moveTo(x + rad, y);
  CTX.lineTo(x + w - rad, y);
  CTX.quadraticCurveTo(x + w, y, x + w, y + rad);
  CTX.lineTo(x + w, y + h - rad);
  CTX.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  CTX.lineTo(x + rad, y + h);
  CTX.quadraticCurveTo(x, y + h, x, y + h - rad);
  CTX.lineTo(x, y + rad);
  CTX.quadraticCurveTo(x, y, x + rad, y);
  CTX.closePath();
}

function fillRR(x, y, w, h, r, fill) {
  roundRectPath(x, y, w, h, r);
  CTX.fillStyle = fill;
  CTX.fill();
}

function strokeRR(x, y, w, h, r, color, width) {
  roundRectPath(x, y, w, h, r);
  CTX.strokeStyle = color;
  CTX.lineWidth = width;
  CTX.stroke();
}

function vGrad(x, y, w, h, top, bottom) {
  var g = CTX.createLinearGradient(x, y, x, y + h);
  g.addColorStop(0, top);
  g.addColorStop(1, bottom);
  return g;
}

function withShadow(color, blur, ox, oy, fn) {
  CTX.save();
  CTX.shadowColor = color;
  CTX.shadowBlur = blur;
  CTX.shadowOffsetX = ox || 0;
  CTX.shadowOffsetY = oy || 0;
  fn();
  CTX.restore();

/** Text with optional gradient fill, outline and shadow. Returns the width used. */
function TXT(str, x, y, o) {
  var opts = o || {};
  var size = opts.size || 16;
  var weight = opts.weight || '700';
  var maxW = opts.maxW || 0;
  setFont(size, weight);
  var text = String(str);
  if (maxW > 0) {
    var w = CTX.measureText(text).width;
    while (w > maxW && size > 7) {
      size -= 0.5;
      setFont(size, weight);
      w = CTX.measureText(text).width;
    }
  }
  CTX.save();
  CTX.textAlign = opts.align || 'center';
  CTX.textBaseline = opts.baseline || 'middle';
  if (opts.letterSpacing && 'letterSpacing' in CTX) CTX.letterSpacing = opts.letterSpacing;
  if (opts.alpha !== undefined) CTX.globalAlpha = opts.alpha;
  if (opts.shadow) {
    CTX.shadowColor = opts.shadow.color;
    CTX.shadowBlur = opts.shadow.blur || 0;
    CTX.shadowOffsetX = opts.shadow.ox || 0;
    CTX.shadowOffsetY = opts.shadow.oy || 0;
  }
  if (opts.outline) {
    CTX.lineJoin = 'round';
    CTX.lineCap = 'round';
    CTX.lineWidth = opts.outline.width || 4;
    CTX.strokeStyle = opts.outline.color;
    CTX.strokeText(text, x, y);
    CTX.shadowColor = 'rgba(0,0,0,0)';
  }
  if (opts.grad) {
    /* A gradient fill needs the text's bounding box, so the glyphs are drawn in
       left-aligned mode at a computed origin — re-using the current alignment
       here would centre the run a second time and shift it off the outline. */
    var tw = CTX.measureText(text).width;
    var left = CTX.textAlign === 'center' ? x - tw / 2 : (CTX.textAlign === 'right' ? x - tw : x);
    var g = CTX.createLinearGradient(0, y - size * 0.62, 0, y + size * 0.58);
    g.addColorStop(0, opts.grad[0]);
    g.addColorStop(1, opts.grad[1]);
    CTX.fillStyle = g;
    CTX.textAlign = 'left';
    CTX.fillText(text, left, y);
  } else {
    CTX.fillStyle = opts.color || '#000';
    CTX.fillText(text, x, y);
  }
  var used = CTX.measureText(text).width;
  CTX.restore();
  return used;
}

/** A glossy magnet bead. `notch` shape encodes the seat so colour is not the only cue.
 *  Beads are painted once into an offscreen sprite and blitted from then on — a busy
 *  board draws 40+ of them per frame, and gradients per bead per frame is the single
 *  most expensive thing this game could do. */
var _beadCache = {};
var _beadStamp = '';

function beadStamp() { return getThemeId() + ':' + Math.round(LAY.scale * VIEW.dpr * 100); }

function paintBead(g, x, y, r, seat, glowColor, notch, wantShadow) {
  var base = seat < 0 ? '#9E9E9E' : seatColor(seat);
  var dark = seat < 0 ? '#6D6D6D' : seatDark(seat);
  var light = seat < 0 ? '#C9C9C9' : seatLight(seat);

  if (glowColor) {
    var gl = g.createRadialGradient(x, y, r * 0.7, x, y, r * 1.75);
    gl.addColorStop(0, rgba(glowColor, 0.42));
    gl.addColorStop(1, rgba(glowColor, 0));
    g.beginPath();
    g.arc(x, y, r * 1.75, 0, TAU);
    g.fillStyle = gl;
    g.fill();
  }

  if (wantShadow) {
    g.shadowColor = 'rgba(40,26,16,0.34)';
    g.shadowBlur = r * 0.55;
    g.shadowOffsetY = r * 0.28;
  }
  var body = g.createRadialGradient(x - r * 0.34, y - r * 0.40, r * 0.10, x, y, r * 1.06);
  body.addColorStop(0, light);
  body.addColorStop(0.55, base);
  body.addColorStop(1, dark);
  g.beginPath();
  g.arc(x, y, r, 0, TAU);
  g.fillStyle = body;
  g.fill();
  g.shadowColor = 'rgba(0,0,0,0)';
  g.shadowBlur = 0;
  g.shadowOffsetY = 0;

  g.beginPath();
  g.arc(x, y, r * 0.97, 0, TAU);
  g.strokeStyle = rgba(dark, 0.75);
  g.lineWidth = Math.max(0.8, r * 0.07);
  g.stroke();

  g.beginPath();
  g.ellipse(x - r * 0.30, y - r * 0.36, r * 0.30, r * 0.20, -0.6, 0, TAU);
  g.fillStyle = 'rgba(255,255,255,0.82)';
  g.fill();

  if (notch && r >= 6) {
    var nr = r * 0.26;
    g.strokeStyle = 'rgba(255,255,255,0.9)';
    g.lineWidth = Math.max(1.1, r * 0.085);
    g.lineJoin = 'round';
    var shape = (seat < 0 ? 4 : seat) % 4;
    if (shape === 0) {
      g.beginPath(); g.arc(x, y, nr, 0, TAU); g.stroke();
    } else if (shape === 1) {
      var q = nr * 0.85;
      g.beginPath(); g.rect(x - q, y - q, q * 2, q * 2); g.stroke();
    } else if (shape === 2) {
      g.beginPath();
      g.moveTo(x, y - nr * 1.1); g.lineTo(x - nr, y + nr * 0.8); g.lineTo(x + nr, y + nr * 0.8);
      g.closePath(); g.stroke();
    } else {
      g.beginPath();
      g.moveTo(x, y - nr * 1.15); g.lineTo(x + nr * 1.15, y); g.lineTo(x, y + nr * 1.15); g.lineTo(x - nr * 1.15, y);
      g.closePath(); g.stroke();

function beadSprite(seat, r, glowColor, notch, wantShadow) {
  var stamp = beadStamp();
  if (stamp !== _beadStamp) { _beadCache = {}; _beadStamp = stamp; }
  var key = seat + '|' + Math.round(r * 2) + '|' + (glowColor || '-') + '|' + (notch ? 1 : 0) + '|' + (wantShadow ? 1 : 0);
  var hit = _beadCache[key];
  if (hit) return hit;
  var pad = r * 0.95 + 1.5;               /* room for the body shadow and any glow */
  var span = (r + pad) * 2;
  var s = LAY.scale * VIEW.dpr;
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(span * s));
  c.height = Math.max(2, Math.ceil(span * s));
  var g2 = c.getContext('2d');
  g2.setTransform(s, 0, 0, s, 0, 0);
  paintBead(g2, span / 2, span / 2, r, seat, glowColor, notch, wantShadow);
  hit = { canvas: c, span: span };
  _beadCache[key] = hit;
  return hit;
}

function drawBead(x, y, r, seat, o) {
  var opts = o || {};
  var alpha = opts.alpha === undefined ? 1 : opts.alpha;
  var scale = opts.scale === undefined ? 1 : opts.scale;
  if (r * scale <= 0.4 || alpha <= 0.01) return;
  var spr = beadSprite(seat, r, opts.glow || null, opts.notch !== false, opts.shadow !== false);
  var w = spr.span * scale;
  CTX.save();
  CTX.globalAlpha = alpha;
  CTX.drawImage(spr.canvas, x - w / 2, y - w / 2, w, w);
  CTX.restore();
}

/** Four-point spark, drawn as two tapered triangles. */
function drawSpark(x, y, size, color, alpha) {
  CTX.save();
  CTX.globalAlpha = alpha === undefined ? 1 : alpha;
  CTX.translate(x, y);
  CTX.fillStyle = color;
  CTX.beginPath();
  CTX.moveTo(0, -size);
  CTX.quadraticCurveTo(size * 0.16, -size * 0.16, size, 0);
  CTX.quadraticCurveTo(size * 0.16, size * 0.16, 0, size);
  CTX.quadraticCurveTo(-size * 0.16, size * 0.16, -size, 0);
  CTX.quadraticCurveTo(-size * 0.16, -size * 0.16, 0, -size);
  CTX.fill();
  CTX.beginPath();
  CTX.arc(0, 0, size * 0.34, 0, TAU);
  CTX.fillStyle = 'rgba(255,255,255,0.95)';
  CTX.fill();
  CTX.restore();
}

/** The game mark: two beads pulling together across a live spark. */
function drawMark(cx, cy, size, t) {
  var r = size * 0.30;
  var pulse = t ? 1 + Math.sin(t * 3.1) * 0.05 : 1;
  var gap = r * 0.92;
  drawBead(cx - gap, cy, r, 0, { shadow: false });
  drawBead(cx + gap, cy, r, 1, { shadow: false });
  var s = size * 0.24 * pulse;
  CTX.save();
  CTX.globalCompositeOperation = 'lighter';
  drawSpark(cx, cy, s, T().warn, 1);
  CTX.restore();
}

/* ── background ─────────────────────────────────────────────────────────── */
var _deco = [];
function ensureDeco() {
  if (_deco.length) return;
  var t = T();
  var rnd = mulberry32(99);
  var orbs = t.orbs && t.orbs.length ? t.orbs : [];
  for (var i = 0; i < 16; i += 1) {
    _deco.push({
      x: rnd() * LAY.DW,
      y: rnd() * LAY.DH,
      r: 6 + rnd() * 22,
      c: orbs.length ? orbs[Math.floor(rnd() * orbs.length)] : t.primary,
      sp: 0.10 + rnd() * 0.30,
      ph: rnd() * TAU,
      rot: rnd() * TAU
    });
  }
}
function resetDeco() {
  _deco = [];
  _beadCache = {};
  _beadStamp = '';
  _boardCache = null;
  _grainPattern = null;
}

function drawBackground(t, time) {
  var theme = T();
  var g = CTX.createLinearGradient(0, 0, 0, VIEW.vh);
  g.addColorStop(0, theme.bg[0]);
  g.addColorStop(1, theme.bg[1]);
  CTX.fillStyle = g;
  CTX.fillRect(0, 0, VIEW.vw, VIEW.vh);

  ensureDeco();
  CTX.save();
  CTX.translate(LAY.stageX, LAY.stageY);
  CTX.scale(LAY.scale, LAY.scale);
  if (theme.deco === 'kraft') {
    CTX.strokeStyle = rgba(theme.boardEdge, 0.10);
    CTX.lineWidth = 1;
    for (var k = -LAY.DH; k < LAY.DW + LAY.DH; k += 34) {
      CTX.beginPath();
      CTX.moveTo(k, 0);
      CTX.lineTo(k - LAY.DH * 0.35, LAY.DH);
      CTX.stroke();
    }
  } else {
    for (var i = 0; i < _deco.length; i += 1) {
      var d = _deco[i];
      var oy = time ? Math.sin(time * d.sp + d.ph) * 9 : 0;
      var ox = time ? Math.cos(time * d.sp * 0.7 + d.ph) * 6 : 0;
      if (theme.deco === 'particles') {
        CTX.globalAlpha = 0.20 + 0.14 * (Math.sin(time * d.sp * 2 + d.ph) * 0.5 + 0.5);
        CTX.fillStyle = d.c;
        CTX.beginPath();
        CTX.arc(d.x + ox, d.y + oy, d.r * 0.16, 0, TAU);
        CTX.fill();
      } else {
        CTX.globalAlpha = 0.13;
        CTX.fillStyle = d.c;
        CTX.beginPath();
        CTX.arc(d.x + ox, d.y + oy, d.r, 0, TAU);
        CTX.fill();
      }
    }
  }
  CTX.restore();
}

/** Paper grain, tiled from assets/grain.png — skipped entirely if unavailable. */
function drawGrain(x, y, w, h) {
  var img = assetImage('grain');
  if (!img) return;
  if (!_grainPattern) {
    try { _grainPattern = CTX.createPattern(img, 'repeat'); } catch (e) { _grainPattern = null; }
  }
  if (!_grainPattern) return;
  CTX.save();
  CTX.beginPath();
  CTX.rect(x, y, w, h);
  CTX.clip();
  CTX.globalAlpha = 0.5;
  CTX.fillStyle = _grainPattern;
  CTX.fillRect(x, y, w, h);
  CTX.restore();
}

/* ── board bitmap ───────────────────────────────────────────────────────── */
/* The table surface never changes while beads move on top of it, so cells, grid,
   grain and the panel bevel are painted once into an offscreen bitmap and blitted
   per frame. Also keeps the cell pattern a clean checkerboard instead of confetti. */
var _boardCache = null;
var _boardPattern = null;

function boardBitmap(cols, rows, cell) {
  var theme = T();
  var key = cols + 'x' + rows + '@' + Math.round(cell * 100) + ':' +
    getThemeId() + ':' + Math.round(LAY.scale * VIEW.dpr * 100);
  if (_boardCache && _boardCache.key === key) return _boardCache;

  var gw = cols * cell;
  var gh = rows * cell;
  var pad = 15;                       /* panel margin + its drop shadow */
  var spanW = gw + pad * 2;
  var spanH = gh + pad * 2;
  var s = LAY.scale * VIEW.dpr;
  var c = document.createElement('canvas');
  c.width = Math.max(2, Math.ceil(spanW * s));
  c.height = Math.max(2, Math.ceil(spanH * s));
  var g = c.getContext('2d');
  g.setTransform(s, 0, 0, s, 0, 0);

  var x0 = pad;
  var y0 = pad;

  /* panel with a soft drop shadow */
  g.save();
  g.shadowColor = 'rgba(40,24,10,0.26)';
  g.shadowBlur = 16;
  g.shadowOffsetY = 6;
  roundRectOn(g, x0 - 8, y0 - 8, gw + 16, gh + 16, 16);
  g.fillStyle = theme.boardBg;
  g.fill();
  g.restore();
  roundRectOn(g, x0 - 8, y0 - 8, gw + 16, gh + 16, 16);
  g.strokeStyle = rgba(theme.boardEdge, 0.55);
  g.lineWidth = 1.6;
  g.stroke();
  roundRectOn(g, x0 - 5, y0 - 5, gw + 10, gh + 10, 13);
  g.strokeStyle = 'rgba(255,255,255,0.30)';
  g.lineWidth = 1;
  g.stroke();

  /* checkerboard */
  var tints = theme.cellTints;
  for (var cx2 = 0; cx2 < cols; cx2 += 1) {
    for (var ry = 0; ry < rows; ry += 1) {
      g.fillStyle = (cx2 + ry) % 2 === 0 ? tints[0] : (tints[1] || tints[0]);
      g.fillRect(x0 + cx2 * cell, y0 + ry * cell, cell, cell);
    }
  }

  /* grid */
  g.strokeStyle = theme.cellLine;
  g.lineWidth = Math.max(0.5, cell * 0.02);
  g.beginPath();
  for (var i = 0; i <= cols; i += 1) {
    g.moveTo(x0 + i * cell, y0);
    g.lineTo(x0 + i * cell, y0 + gh);
  }
  for (var j = 0; j <= rows; j += 1) {
    g.moveTo(x0, y0 + j * cell);
    g.lineTo(x0 + gw, y0 + j * cell);
  }
  g.stroke();

  /* grain */
  var gi = assetImage('grain');
  if (gi) {
    try {
      if (!_boardPattern) _boardPattern = g.createPattern(gi, 'repeat');
      if (_boardPattern) {
        g.globalAlpha = 0.5;
        g.fillStyle = _boardPattern;
        g.fillRect(x0, y0, gw, gh);
        g.globalAlpha = 1;
      }
    } catch (e) { /* pattern unsupported: skip the texture */ }
  }

  /* soft top-light so the surface is not flat */
  var vg = g.createLinearGradient(0, y0, 0, y0 + gh);
  vg.addColorStop(0, 'rgba(255,255,255,0.22)');
  vg.addColorStop(0.45, 'rgba(255,255,255,0.02)');
  vg.addColorStop(1, 'rgba(0,0,0,0.07)');
  g.fillStyle = vg;
  g.fillRect(x0, y0, gw, gh);

  _boardCache = { key: key, canvas: c, spanW: spanW, spanH: spanH, pad: pad, gw: gw, gh: gh };
  return _boardCache;
}

function roundRectOn(g, x, y, w, h, r) {
  var rad = Math.min(r, Math.abs(w) / 2, Math.abs(h) / 2);
  g.beginPath();
  g.moveTo(x + rad, y);
  g.lineTo(x + w - rad, y);
  g.quadraticCurveTo(x + w, y, x + w, y + rad);
  g.lineTo(x + w, y + h - rad);
  g.quadraticCurveTo(x + w, y + h, x + w - rad, y + h);
  g.lineTo(x + rad, y + h);
  g.quadraticCurveTo(x, y + h, x, y + h - rad);
  g.lineTo(x, y + rad);
  g.quadraticCurveTo(x, y, x + rad, y);
  g.closePath();
}

/* ── composite widgets ──────────────────────────────────────────────────── */

/* Word wrap that also works for Chinese, which has no spaces: CJK codepoints and
   punctuation become their own tokens while Latin runs stay whole. */
var _tokRe = /[\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]|[^\s\u3000-\u303f\u3400-\u4dbf\u4e00-\u9fff\uf900-\ufaff\uff00-\uffef]+|\s+/g;

function wrapText(text, maxW, size, weight) {
  setFont(size, weight);
  var tokens = String(text).match(_tokRe) || [];
  var lines = [];
  var line = '';
  for (var i = 0; i < tokens.length; i += 1) {
    var tok = tokens[i];
    var candidate = line + tok;
    if (line !== '' && CTX.measureText(candidate).width > maxW) {
      lines.push(line.replace(/\s+$/, ''));
      line = /^\s+$/.test(tok) ? '' : tok;
    } else {
      line = candidate;
    }
  }
  if (line.trim() !== '') lines.push(line.replace(/\s+$/, ''));
  return lines;
}

/** Draw wrapped text; returns the height consumed. */
function paragraph(text, x, y, maxW, o) {
  var opts = o || {};
  var size = opts.size || 13;
  var lh = size * (opts.lineHeight || 1.5);
  var lines = wrapText(text, maxW, size, opts.weight);
  for (var i = 0; i < lines.length; i += 1) {
    TXT(lines[i], x, y + lh * (i + 0.5), {
      size: size, weight: opts.weight, align: opts.align || 'left',
      color: opts.color, baseline: 'middle'
    });
  }
  return lines.length * lh;
}

function paragraphHeight(text, maxW, size, weight, lineHeight) {
  return wrapText(text, maxW, size, weight).length * size * (lineHeight || 1.5);
}

function drawCard(x, y, w, h, r, o) {
  var theme = T();
  var opts = o || {};
  var bg = opts.bg || theme.cardBg;
  withShadow('rgba(46,28,14,0.16)', opts.shadowBlur === undefined ? 10 : opts.shadowBlur, 0, 4, function () {
    fillRR(x, y, w, h, r, bg);
  });
  /* top light edge gives the plastic-card read */
  roundRectPath(x + 1, y + 1, w - 2, h * 0.5, r * 0.9);
  CTX.strokeStyle = 'rgba(255,255,255,0.34)';
  CTX.lineWidth = 1.2;
  CTX.stroke();
}

function drawChip(x, y, w, h, label, active, o) {
  var theme = T();
  var opts = o || {};
  if (active) {
    withShadow('rgba(46,28,14,0.22)', 8, 0, 3, function () {
      fillRR(x, y, w, h, h / 2, vGrad(x, y, w, h, theme.btnGrad[0], theme.btnGrad[1]));
    });
    roundRectPath(x + 2, y + 2, w - 4, h * 0.44, h * 0.22);
    CTX.strokeStyle = 'rgba(255,255,255,0.42)';
    CTX.lineWidth = 1.1;
    CTX.stroke();
    TXT(label, x + w / 2, y + h / 2 + 0.5, {
      size: opts.size || 14, color: theme.btnText, maxW: w - 10,
      shadow: { color: 'rgba(0,0,0,0.20)', blur: 2, oy: 1 }
    });
  } else {
    fillRR(x, y, w, h, h / 2, opts.bg || (theme.dark ? 'rgba(255,255,255,0.10)' : 'rgba(255,255,255,0.62)'));
    TXT(label, x + w / 2, y + h / 2 + 0.5, { size: opts.size || 14, color: theme.muted, maxW: w - 10 });
  }
}

function drawButton(x, y, w, h, label, pressed, o) {
  var theme = T();
  var opts = o || {};
  var dy = pressed ? 1.5 : 0;
  var top = opts.grad ? opts.grad[0] : theme.btnGrad[0];
  var bot = opts.grad ? opts.grad[1] : theme.btnGrad[1];
  /* drop edge */
  fillRR(x, y + 3.5, w, h, h / 2, rgba(opts.edge || theme.boardEdge, 0.35));
  withShadow('rgba(46,28,14,0.28)', 12, 0, 5, function () {
    fillRR(x, y + dy, w, h, h / 2, vGrad(x, y + dy, w, h, top, bot));
  });
  roundRectPath(x + 3, y + dy + 2.5, w - 6, h * 0.42, h * 0.22);
  CTX.strokeStyle = 'rgba(255,255,255,0.46)';
  CTX.lineWidth = 1.4;
  CTX.stroke();
  TXT(label, x + w / 2, y + dy + h / 2 + 0.5, {
    size: opts.size || 20, color: opts.color || theme.btnText, maxW: w - 22,
    letterSpacing: opts.letterSpacing || '0px',
    shadow: { color: 'rgba(0,0,0,0.22)', blur: 3, oy: 1.5 }
  });
}

/* Magnetic field ring, used for the live drop preview. */
function drawFieldRing(x, y, radius, hot, time) {
  CTX.save();
  var pulse = 0.72 + 0.28 * Math.sin(time * 5.2);
  if (hot) {
    CTX.beginPath();
    CTX.arc(x, y, radius, 0, TAU);
    var gg = CTX.createRadialGradient(x, y, radius * 0.35, x, y, radius);
    gg.addColorStop(0, rgba(T().warn, 0.02));
    gg.addColorStop(0.72, rgba(T().warn, 0.16));
    gg.addColorStop(1, rgba(T().warn, 0.40 * pulse));
    CTX.fillStyle = gg;
    CTX.fill();
  }
  CTX.beginPath();
  CTX.arc(x, y, radius, 0, TAU);
  CTX.setLineDash([4, 4]);
  CTX.lineDashOffset = -time * 14;
  CTX.strokeStyle = hot ? rgba(T().warn, 0.95) : 'rgba(255,255,255,0.85)';
  CTX.lineWidth = 2;
  CTX.stroke();
  CTX.setLineDash([]);
  CTX.restore();
}


/* ===== 10-ui.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §10  UI — immediate-mode hit regions, press feedback, toast, modal
   ═══════════════════════════════════════════════════════════════════════════ */

/* Regions are registered while drawing (design units), then hit-tested on input.
   Later registrations sit on top, so the lookup walks backwards. */
var HITS = [];
var PRESS = { id: null, x: 0, y: 0, t: 0, moved: false };
var TOAST = { text: '', t: 0, life: 0 };

function resetHits() { HITS.length = 0; }

function HIT(id, x, y, w, h) {
  HITS.push({ id: id, x: x, y: y, w: w, h: h });
  return { id: id, x: x, y: y, w: w, h: h };
}

function pickHit(x, y) {
  for (var i = HITS.length - 1; i >= 0; i -= 1) {
    var r = HITS[i];
    if (x >= r.x && x <= r.x + r.w && y >= r.y && y <= r.y + r.h) return r.id;
  }
  return null;
}

function isPressed(id) { return PRESS.id === id; }

function toast(text) {
  TOAST.text = text;
  TOAST.t = 0;
  TOAST.life = 1.8;
}

function drawToast(dt) {
  if (TOAST.life <= 0) return;
  TOAST.life -= dt;
  TOAST.t += dt;
  var p = clamp(TOAST.t / 0.22, 0, 1);
  var out = clamp(TOAST.life / 0.4, 0, 1);
  var a = Math.min(p, out);
  var y = LAY.contentBottom - 46 - (1 - easeOutCubic(p)) * 16;
  CTX.save();
  CTX.globalAlpha = a;
  setFont(14, '700');
  var w = Math.min(LAY.contentRight - LAY.contentLeft - 20, CTX.measureText(TOAST.text).width + 34);
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  withShadow('rgba(20,10,0,0.30)', 14, 0, 5, function () {
    fillRR(x, y, w, 34, 17, rgba(T().boardEdge, 0.92));
  });
  TXT(TOAST.text, x + w / 2, y + 17.5, { size: 14, color: '#FFF6E6', maxW: w - 20 });
  CTX.restore();
}

/** Small round icon button (language switch, close, etc). */
function drawRoundButton(id, cx, cy, r, label, o) {
  var theme = T();
  var opts = o || {};
  var pressed = isPressed(id);
  var scale = pressed ? 0.93 : 1;
  CTX.save();
  CTX.translate(cx, cy);
  CTX.scale(scale, scale);
  withShadow('rgba(46,28,14,0.22)', 9, 0, 3, function () {
    CTX.beginPath();
    CTX.arc(0, 0, r, 0, TAU);
    CTX.fillStyle = opts.bg || (theme.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.78)');
    CTX.fill();
  });
  CTX.beginPath();
  CTX.arc(0, 0, r * 0.94, 0, TAU);
  CTX.strokeStyle = 'rgba(255,255,255,0.5)';
  CTX.lineWidth = 1.1;
  CTX.stroke();
  TXT(label, 0, 1, { size: opts.size || r * 0.86, color: opts.color || theme.text, weight: '800' });
  CTX.restore();
  HIT(id, cx - r, cy - r, r * 2, r * 2);
}

/** Screen header: back affordance on the left, centred title. */
function drawHeader(title, backId, time) {
  var cy = LAY.contentTop + 18;
  var theme = T();
  if (backId) {
    var r = 16;
    var cx = LAY.contentLeft + r;
    var pressed = isPressed(backId);
    CTX.save();
    CTX.translate(cx, cy);
    CTX.scale(pressed ? 0.93 : 1, pressed ? 0.93 : 1);
    withShadow('rgba(46,28,14,0.20)', 8, 0, 3, function () {
      CTX.beginPath();
      CTX.arc(0, 0, r, 0, TAU);
      CTX.fillStyle = theme.dark ? 'rgba(255,255,255,0.14)' : 'rgba(255,255,255,0.78)';
      CTX.fill();
    });
    CTX.beginPath();
    CTX.moveTo(4, -6); CTX.lineTo(-3, 0); CTX.lineTo(4, 6);
    CTX.strokeStyle = theme.text; CTX.lineWidth = 2.4; CTX.lineCap = 'round'; CTX.lineJoin = 'round';
    CTX.stroke();
    CTX.restore();
    HIT(backId, cx - r, cy - r, r * 2, r * 2);
  }
  TXT(title, (LAY.contentLeft + LAY.contentRight) / 2, cy, {
    size: 19, color: theme.text, maxW: LAY.contentRight - LAY.contentLeft - 80,
    shadow: { color: 'rgba(255,255,255,0.4)', blur: 3, oy: 1 }
  });
  return cy;
}

/** Modal card, centred. Returns the content rect. */
function drawModalCard(w, h, time) {
  var x = (LAY.contentLeft + LAY.contentRight) / 2 - w / 2;
  var y = (LAY.contentTop + LAY.contentBottom) / 2 - h / 2;
  CTX.fillStyle = 'rgba(20,12,6,0.42)';
  CTX.fillRect(-LAY.stageX / LAY.scale, -LAY.stageY / LAY.scale,
    VIEW.vw / LAY.scale, VIEW.vh / LAY.scale);
  var pop = time === undefined ? 1 : clamp(time / 0.22, 0, 1);
  CTX.save();
  CTX.translate(x + w / 2, y + h / 2);
  var s = 0.94 + 0.06 * easeOutBack(pop);
  CTX.scale(s, s);
  CTX.translate(-(x + w / 2), -(y + h / 2));
  drawCard(x, y, w, h, 20, { shadowBlur: 22 });
  CTX.restore();
  return { x: x, y: y, w: w, h: h };
}


/* ===== 11-scene-home.js ===== */
/* ═══════════════════════════════════════════════════════════════════════════
   §11  SCENE · HOME — mode, table size, AI level, theme, play

var HOME = {
  time: 0,

  draw: function (dt, time) {
    this.time += dt;
    var theme = T();
    var L = LAY.contentLeft;
